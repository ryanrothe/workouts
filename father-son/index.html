<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Father & Son" />
<meta name="theme-color" content="#4338ca" />
<link rel="manifest" href="../manifest.webmanifest" />
<link rel="apple-touch-icon" href="../icon-180.png" />
<link rel="icon" type="image/png" href="../favicon.png" />
<title>Father & Son Strength</title>
<link rel="stylesheet" href="../shared/styles.css" />
<style>
  /* Father & Son specific styles. Shared design tokens come from ../shared/styles.css. */

  .hero {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .hero-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .coach-badge {
    display: inline-block;
    background: var(--primary-soft);
    color: var(--primary);
    border: 1px solid var(--primary-line);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .hero-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 12px;
  }
  .stat {
    background: var(--card-2);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    padding: 8px 6px;
    text-align: center;
  }
  .stat-num { font-size: 17px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
  .stat-label { font-size: 9.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }

  /* Lifter toggle: who is this phone tracking right now */
  .lifter-bar {
    display: flex; gap: 6px; margin-top: 12px;
    background: var(--card-2);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    padding: 4px;
  }
  .lifter-btn {
    flex: 1;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    border-radius: 6px;
    padding: 10px 6px;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    min-height: var(--tap);
  }
  .lifter-btn.active { background: var(--primary); color: white; }
  .lifter-hint { font-size: 11px; color: var(--muted); margin-top: 6px; }

  /* Progress tracks: the pull-up step and the push-up level */
  .tracks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .track {
    background: var(--card-2);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    padding: 10px;
  }
  .track-kind { font-size: 9.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
  .track-step { font-size: 13px; font-weight: 700; color: var(--text); margin-top: 2px; line-height: 1.3; }
  .track-pos { font-size: 11px; color: var(--primary); font-weight: 700; margin-top: 2px; }
  .track-rule { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
  .track-btns { display: flex; gap: 6px; margin-top: 8px; }
  .track-btns .btn { flex: 1; justify-content: center; padding: 6px 4px; font-size: 12px; min-height: 36px; }
  .track.maxed .track-pos { color: var(--success); }
  @media (max-width: 420px) { .tracks { grid-template-columns: 1fr; } }

  /* Week pill bar */
  .week-bar {
    display: flex; gap: 5px;
    overflow-x: auto;
    margin-bottom: 10px;
    padding: 4px 2px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .week-bar::-webkit-scrollbar { display: none; }
  .week-pill {
    flex-shrink: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 7px 0;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    min-width: 46px;
    text-align: center;
    font-family: inherit;
    font-variant-numeric: tabular-nums;
  }
  .week-pill.active { background: var(--primary); border-color: var(--primary); color: white; }
  .week-pill.done { border-color: var(--success); background: var(--success-soft); color: var(--success); }
  .week-pill.done.active { background: var(--success); color: white; }
  .week-pill.bench { box-shadow: inset 0 -3px 0 var(--warning); }

  /* Phase card under the pills */
  .phase {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--primary);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
  }
  .phase-name { font-size: 13px; font-weight: 700; color: var(--text); }
  .phase-name span { color: var(--primary); }
  .phase-dates { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .phase-note { font-size: 12.5px; color: var(--text-body); line-height: 1.5; margin-top: 6px; }
  .phase-note strong { color: var(--primary); }

  .tab .due-dot[hidden] { display: none; }
  .tab .due-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--primary);
    margin-left: 5px;
    vertical-align: 1px;
  }
  .tab.active .due-dot { background: white; }

  /* Exercise tag color variants (extends .ex-tag from shared) */
  .ex-tag.power  { background: #ffe9e0; color: #c2410c; }
  .ex-tag.pull   { background: #e7f0fb; color: #1f63b8; }
  .ex-tag.push   { background: #fdf0f6; color: #be185d; }
  .ex-tag.legs   { background: var(--success-soft); color: var(--success); }
  .ex-tag.armor  { background: #f1eafd; color: #6b3ed0; }
  .ex-tag.core   { background: #f0f1f3; color: #6b7588; }
  .ex-tag.skill  { background: var(--accent-soft); color: var(--accent); }
  .ex-tag.test   { background: var(--warning-soft); color: var(--warning); }
  .ex-tag.arms   { background: #fdeaea; color: #b3261e; }

  /* "Last:" line, coach chip and set grid styles live in ../shared/styles.css (SetLog). */

  .ex-detail {
    margin: 6px 0 0;
    padding: 8px 10px;
    background: var(--card-2);
    border: 1px solid var(--border-soft);
    border-radius: 6px;
    font-size: 12px;
    color: var(--text-body);
    line-height: 1.6;
  }
  .ex-detail .dt-line { display: block; }
  .ex-cue { font-size: 11.5px; color: var(--accent); margin-top: 4px; line-height: 1.4; }
  .ex-cue strong { color: var(--accent); }

  /* Timer buttons */
  .btn-timer { font-variant-numeric: tabular-nums; min-width: 78px; justify-content: center; }
  .btn-timer.running { background: var(--primary); color: white; border-color: var(--primary); }
  .btn-timer.paused { background: var(--warning-soft); color: var(--warning); border-color: #edd9a6; }
  .btn-timer.done { background: var(--success); color: white; border-color: var(--success); animation: timer-flash 0.6s ease-out; }
  @keyframes timer-flash { 0% { transform: scale(1); } 30% { transform: scale(1.08); } 100% { transform: scale(1); } }
  .btn-timer-x { color: var(--danger); min-width: 0; }

  /* Warm-up checklist */
  .prep {
    margin: 8px 0;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    background: var(--card-2);
    overflow: hidden;
  }
  .prep-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 12px;
    cursor: pointer; user-select: none;
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted);
  }
  .prep-head .caret { font-size: 10px; }
  .prep.collapsed .prep-body { display: none; }
  .prep.collapsed .caret { transform: rotate(-90deg); }
  .prep-body { padding: 2px 12px 10px; }
  .prep-item {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 5px 0;
    font-size: 12.5px; color: var(--text-body);
    cursor: pointer;
  }
  .prep-check {
    width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px;
    border: 2px solid #c8cdd6; border-radius: 5px;
    background: white;
    display: flex; align-items: center; justify-content: center;
  }
  .prep-check svg { width: 10px; height: 10px; opacity: 0; }
  .prep-item.done .prep-check { background: var(--success); border-color: var(--success); }
  .prep-item.done .prep-check svg { opacity: 1; }
  .prep-item.done { color: var(--muted); text-decoration: line-through; }

  .block-note { font-size: 12px; color: var(--muted); line-height: 1.55; margin: 4px 0 2px; }
  .block-label {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--primary); margin: 12px 0 0;
  }
  .block-off {
    margin: 8px 0;
    padding: 9px 12px;
    background: var(--warning-soft);
    border: 1px solid #edd9a6;
    border-radius: var(--radius-sm);
    font-size: 12px; color: var(--warning); line-height: 1.5;
  }

  .day-toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
    font-size: 12px; color: var(--muted);
    flex-wrap: wrap; gap: 6px;
  }
  .reset-link {
    background: none; border: none; color: var(--muted);
    font-size: 11px; cursor: pointer; padding: 4px 8px; text-decoration: underline;
    font-family: inherit;
  }

  /* Readiness + short-Monday controls at the top of a day card */
  .ctl {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 9px 0 4px;
    flex-wrap: wrap;
  }
  .ctl-label { font-size: 12px; font-weight: 700; color: var(--text-body); }
  .ctl-sub { font-size: 11px; color: var(--muted); font-weight: 400; display: block; margin-top: 1px; }
  .ready-row { display: flex; gap: 5px; }
  .ready-btn {
    width: 38px; height: 38px;
    border: 1px solid var(--border);
    background: var(--card-2);
    color: var(--muted);
    border-radius: 8px;
    font-size: 14px; font-weight: 700; font-family: inherit;
    cursor: pointer;
  }
  .ready-btn.on { background: var(--primary); color: white; border-color: var(--primary); }
  .ready-btn.on.low { background: var(--warning); border-color: var(--warning); }
  .toggle-btn.on { background: var(--warning-soft); color: var(--warning); border-color: #edd9a6; }

  /* Finisher picker */
  .fin-menu { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .fin-opt {
    text-align: left;
    border: 1px solid var(--border);
    background: var(--card-2);
    border-radius: var(--radius-sm);
    padding: 9px 12px;
    font-family: inherit;
    cursor: pointer;
    color: var(--text-body);
  }
  .fin-opt.on { border-color: var(--primary); background: var(--primary-soft); }
  .fin-opt .fo-name { font-size: 13px; font-weight: 700; color: var(--text); }
  .fin-opt .fo-how { font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
  .fin-opt .fo-hc { font-size: 11px; color: var(--primary); margin-top: 2px; font-weight: 600; }
  .fin-opt.coop .fo-hc { color: var(--accent); }
  .fin-result { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .fin-result input { flex: 1; min-width: 0; }
  .fin-result .unit { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .pr-flag {
    display: inline-block; margin-left: 6px;
    background: var(--success-soft); color: var(--success);
    border-radius: 4px; padding: 1px 6px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
  }

  /* Benchmarks table */
  .bench-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.bench { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 460px; }
  table.bench th, table.bench td { padding: 7px 6px; border-bottom: 1px solid var(--border-soft); text-align: center; vertical-align: middle; }
  table.bench th { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
  table.bench td:first-child, table.bench th:first-child { text-align: left; }
  table.bench td:first-child { font-weight: 600; color: var(--text); white-space: nowrap; }
  table.bench td:first-child small { display: block; font-weight: 400; color: var(--muted); font-size: 10.5px; }
  table.bench input {
    width: 64px; text-align: center;
    border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 4px; font-size: 13px; font-family: inherit;
    font-variant-numeric: tabular-nums;
    background: var(--card);
  }
  table.bench .delta { display: block; font-size: 10px; margin-top: 2px; font-weight: 700; }
  table.bench .delta.up { color: var(--success); }
  table.bench .delta.down { color: var(--danger); }
  table.bench .delta.flat { color: var(--muted); }
  table.bench tr.computed td { color: var(--text-body); background: var(--card-2); }
  table.bench tr.computed td:first-child { color: var(--muted); }
  table.bench td.na { color: var(--border); }

  /* Records */
  .rec { padding: 10px 0; border-bottom: 1px solid var(--border-soft); }
  .rec:last-child { border-bottom: none; }
  .rec-name { font-size: 13px; font-weight: 700; color: var(--text); }
  .rec-best { font-size: 12.5px; color: var(--text-body); margin-top: 2px; }
  .rec-best strong { color: var(--primary); }
  .rec-hist { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.5; }

  .card h2 { margin: 0 0 8px; font-size: 16px; }
  .card h3 { margin: 14px 0 6px; font-size: 13.5px; }
  .card p, .card li { font-size: 13px; line-height: 1.55; color: var(--text-body); }
  .card ul { padding-left: 18px; margin: 4px 0 8px; }
  .src { font-size: 11px; color: var(--muted); line-height: 1.5; margin-top: 10px; }

  /* In-session board (Phase 2 step 5). The shared "In-session layout" rules in
     ../shared/styles.css draw the header and rows; these fill only the gaps:
     the two-lifter control row, clock states, the check, track moves, timers. */
  .fs-board .hs-sess-clock.running svg { color: var(--primary); }
  .fs-board .hs-sess-clock:not(.running):not(.fs-stopped) .fs-clock-t { color: var(--primary); }
  .fs-board .hs-sess-clock.fs-stopped .fs-clock-t { color: var(--muted); }
  .fs-board .hs-sess-progress.fs-complete span { color: var(--primary); font-weight: 800; }
  .fs-sess-ctl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 2px 10px; }
  .fs-seg { display: inline-flex; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 3px; }
  .fs-seg button {
    border: 0; background: transparent; color: var(--muted); font-family: inherit; font-size: 13px; font-weight: 700;
    min-height: 36px; min-width: 58px; padding: 0 12px; border-radius: 9px; cursor: pointer;
  }
  .fs-seg button.on { background: var(--primary); color: #fff; }
  .fs-pace { flex: 1; min-width: 0; font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .fs-sess-ctl .fs-clear { min-height: 36px; padding: 0 4px; }
  .fs-ctls { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 2px 14px 8px; margin: 0 0 10px; }
  .fs-ctls-short .ctl { flex-wrap: nowrap; }
  .fs-ctls-short .ctl-label { flex: 1; min-width: 0; }
  .fs-ctls-short .toggle-btn { flex-shrink: 0; }
  .fs-board .prep { background: var(--card); border-color: var(--border); margin: 0 0 4px; }
  .fs-board .block-note { margin: -4px 4px 8px; font-size: 12px; }
  .fs-board .block-off { margin: 10px 0; }
  .fs-board .hs-row.hs-now { scroll-margin-top: 84px; }
  .fs-board .hs-row-sum .hs-sum-r { flex-shrink: 1; min-width: 0; max-width: 46%; overflow: hidden; text-overflow: ellipsis; }
  .fs-sum-timer { font-size: 13px; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fs-sum-timer.paused { color: var(--warning); }
  .fs-board .hs-row.hs-now .ex-prescription { font-size: 13px; margin-top: 2px; }
  .fs-board .hs-row.hs-now .ex-prescription strong { font-weight: 600; color: var(--text-body); }
  .fs-rx-sub { color: var(--muted); }
  .fs-board .hs-row.hs-now .ex-cue { font-size: 12.5px; }
  .fs-track { display: flex; align-items: center; gap: 6px; margin: 8px 0 2px; font-size: 12px; font-weight: 700; color: var(--primary); }
  .fs-track span { flex: 1; min-width: 0; }
  .fs-track .btn { min-height: 36px; font-size: 12px; }
  .fs-board .hs-tools .btn { padding: 7px 8px; }
  .fs-board .hs-tools .btn svg { width: 17px; height: 17px; flex-shrink: 0; }
  .fs-board .hs-tools .btn-timer { min-width: 64px; }
  .fs-board .hs-tools .btn.fs-check { margin-left: auto; padding: 7px 14px; background: var(--primary); border-color: var(--primary); color: #fff; }
  .fs-board .hs-tools .btn.fs-check.on { background: var(--primary-soft); border-color: var(--primary-line); color: var(--primary); }

  @media (max-width: 420px) {
    .hero-stats { gap: 6px; }
    .stat { padding: 6px 4px; }
    .stat-num { font-size: 15px; }
    .stat-label { font-size: 8.5px; }
  }
</style>
</head>
<body data-program="father-son">

<header class="appbar">
  <div class="appbar-inner">
    <a class="appbar-back" href="../" aria-label="Back to Exercise Library">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="10 3 5 8 10 13"/></svg>
      Library
    </a>
    <div class="appbar-title">
      <div class="eyebrow">Program</div>
      <div class="name">Father &amp; Son Strength</div>
    </div>
  </div>
  <div class="appbar-accent"></div>
</header>

<div class="container">

  <!-- HERO -->
  <div class="hero">
    <div class="hero-top">
      <div>
        <span class="coach-badge">Garage · Two Lifters</span>
        <h1 style="margin-top:6px">Father &amp; Son Strength</h1>
        <div class="hero-sub">12-week base for a young athlete · Mon upper (meet day) · Wed lower · never to failure</div>
      </div>
      <button class="reset-link" id="reset-btn" title="Reset all tracking">Reset</button>
    </div>

    <div class="lifter-bar" id="lifter-bar">
      <button class="lifter-btn" data-lifter="son">Son</button>
      <button class="lifter-btn" data-lifter="ryan">Ryan</button>
    </div>
    <div class="lifter-hint" id="lifter-hint"></div>

    <div class="hero-stats">
      <div class="stat"><div class="stat-num" id="stat-week">W1</div><div class="stat-label">Current Week</div></div>
      <div class="stat"><div class="stat-num" id="stat-days">0</div><div class="stat-label">Sessions Done</div></div>
      <div class="stat"><div class="stat-num" id="stat-thisweek">0 / 2</div><div class="stat-label">This Week</div></div>
      <div class="stat"><div class="stat-num" id="stat-overall">0%</div><div class="stat-label">Overall</div></div>
    </div>

    <div class="tracks" id="tracks"></div>
  </div>

  <!-- WEEK PILLS -->
  <div class="week-bar" id="week-bar"></div>

  <!-- PHASE CARD -->
  <div class="phase" id="phase-card"></div>

  <!-- TABS -->
  <div class="tabs" id="tabs">
    <button class="tab" data-pane="mon">Mon<span class="due-dot" hidden></span></button>
    <button class="tab" data-pane="wed">Wed<span class="due-dot" hidden></span></button>
    <button class="tab" data-pane="bench">Benchmarks</button>
    <button class="tab" data-pane="records">Records</button>
    <button class="tab" data-pane="principles">Principles</button>
    <button class="tab" data-pane="notes">Notes</button>
  </div>

  <div id="panes">
    <div class="pane" id="pane-mon"><div id="container-mon"></div></div>
    <div class="pane" id="pane-wed"><div id="container-wed"></div></div>
    <div class="pane" id="pane-bench"><div class="card" id="bench-card"></div></div>
    <div class="pane" id="pane-records"><div class="card" id="records-card"></div></div>
    <div class="pane" id="pane-principles"><div class="card" id="principles-card"></div></div>
    <div class="pane" id="pane-notes"><div class="card" id="notes-card"></div></div>
  </div>

</div>

<script src="../shared/setlog.js"></script>
<script src="../shared/shell.js"></script>
<script>
/* Set logging, the coach and sync come from ../shared/setlog.js. */
const SL = window.SetLog;
const { normName, parseWeight, fmtWeight, fmtLoad } = SL;

/* ===========================================================================
   HELPERS. Every row carries TWO prescriptions (son / ryan). The active
   lifter decides which one renders and which history it reads.
   =========================================================================== */
const VIDEO_BASE = "https://www.youtube.com/results?search_query=";
function v(q) { return VIDEO_BASE + encodeURIComponent(q + " exercise form"); }

const LIFTERS = ["son", "ryan"];
const LIFTER_LABEL = { son: "Son", ryan: "Ryan" };

const BW_RE = /pull.?up|chin.?up|push.?up|\bdip\b|dips\b|hanging|hollow|plank|nordic|copenhagen|bodyweight|dead bug|lunge \(bw\)|calf raise \(bw\)/i;
const LOADED_RE = /^(kb|db|weighted|med ball|medicine ball|plate|kettlebell|dumbbell|goblet)|\b(kb|db)\b/i;
const LOWER_RE = /squat|deadlift|\brdl\b|lunge|step up|split|calf|swing|carry/i;

/* Strip parentheticals before number-hunting, then read "Name S x R". */
function parseLine(line) {
  let per = false;
  const notes = [];
  let core = line;
  core = core.replace(/\(([^)]*)\)/g, (_, inner) => {
    if (/each (side|leg|arm)|alternating|on each/i.test(inner)) per = true;
    else notes.push(inner.trim());
    return " ";
  }).replace(/\s+/g, " ").trim();

  const m = core.match(/^(.+?)\s+(\d+(?:-\d+)?)\s*x\s*(.+)$/i);
  if (!m) return { name: core, rx: notes.join(" · "), per, notes, repTop: null, repRange: null, isMax: false };

  const name = m[1].trim();
  const sets = m[2];
  let reps = m[3].trim();
  const isMax = /max/i.test(reps);
  const timed = /seconds?$/i.test(reps);
  const repsNum = reps.replace(/\s*seconds?$/i, "");
  let repTop = null, repRange = null;
  const rr = repsNum.match(/^(\d+)\s*-\s*(\d+)$/);
  const rf = repsNum.match(/^(\d+)$/);
  if (rr) { repRange = `${rr[1]}-${rr[2]}`; repTop = parseInt(rr[2], 10); }
  else if (rf) { repTop = parseInt(rf[1], 10); }

  let rx = `${sets} × ${timed ? repsNum + " s" : reps}`;
  if (per) rx += " · each side";
  if (notes.length) rx += " · " + notes.join(" · ");
  return { name, rx, sets: parseInt(String(sets).split("-").pop(), 10), per, notes, repTop, repRange, isMax, unit: timed ? "s" : "reps" };
}

function side(line, loaded) {
  const p = parseLine(line);
  const isLoaded = loaded != null ? loaded : LOADED_RE.test(p.name);
  return {
    name: p.name, rx: p.rx,
    bw: !isLoaded && BW_RE.test(p.name),
    loaded: isLoaded,
    lower: LOWER_RE.test(p.name),
    repTop: p.repTop, repRange: p.repRange, isMax: p.isMax,
    sets: p.sets || 1, unit: p.unit || "reps"
  };
}

/* duo("Goblet Squat 2 x 8 (3-second lower)", "KB Goblet Squat 2 x 8 (3-second lower)", 90, "legs", {cue: "..."}) */
function duo(sonLine, ryanLine, rest, tag, opts = {}) {
  const o = Object.assign({}, opts);
  const row = {
    kind: "duo",
    tag: tag || "legs",
    rest: rest || 90,
    track: o.track != null ? o.track : true,
    timer: o.timer || null,
    detail: o.detail || null,
    cue: o.cue || null,
    per: {
      son: side(sonLine, o.sonLoaded),
      ryan: side(ryanLine || sonLine, o.ryanLoaded)
    }
  };
  if (o.sonLoaded === false) row.per.son.loaded = false;
  if (o.ryanLoaded === false) row.per.ryan.loaded = false;
  return row;
}
/* A track row reads its name and prescription from the lifter's current step. */
function trackRow(kind, sets) {
  return { kind: "track", trackKind: kind, sets: sets || 3, tag: kind === "pullup" ? "pull" : "push", rest: 90, track: false, timer: null, detail: null };
}
/* Checkable, untracked effort piece (ladders, tests, circuits). */
function effort(name, rx, tag, opts = {}) {
  return { kind: "effort", tag: tag || "skill", rest: opts.rest || 60, track: false, timer: opts.timer || null, detail: opts.detail || null, cue: opts.cue || null,
    per: { son: { name, rx: opts.sonRx || rx, bw: true, loaded: false, lower: false, repTop: null, repRange: null, isMax: false },
           ryan: { name: opts.ryanName || name, rx: opts.ryanRx || rx, bw: true, loaded: false, lower: false, repTop: null, repRange: null, isMax: false } } };
}
function tDown(secs, label) { return { kind: "down", secs, label }; }
function tInterval(segs, rounds, label) { return { kind: "interval", segs, rounds, label }; }
function tWatch(label) { return { kind: "watch", label }; }

/* ---------------------------------------------------------------------------
   SYNC. The transport and the device token live in ../shared/setlog.js. This
   program supplies the payload: the raw state, a flat `entries` list every
   program shares (what Karl reads), and the legacy row-name `catalog`.
   --------------------------------------------------------------------------- */
function syncCatalog() {
  const cat = {};

    const m = k.match(/^w(\d+)_(\w+)$/); if (!m) return;
    const w = parseInt(m[1], 10), d = m[2];
    const day = PROGRAM.weeks[w] && PROGRAM.weeks[w][d]; if (!day) return;
    cat[k] = {};
    day.blocks.forEach((b, bi) => b.rows.forEach((row, ri) => {
      const key = `b${bi}r${ri}`;
      const logged = LIFTERS.some(l => state.days[k].per && state.days[k].per[l] && state.days[k].per[l].logs && state.days[k].per[l].logs[key]);
      if (!logged) return;
      const stepOf = l => { const lg = state.days[k].per[l] && state.days[k].per[l].logs[key]; return lg && lg.step != null ? lg.step : undefined; };
      cat[k][key] = { son: resolve(row, "son", stepOf("son")).name, ryan: resolve(row, "ryan", stepOf("ryan")).name };
    }));
  });

}
function syncEntries() {
  const out = [];
  for (let w = 0; w < NWEEKS; w++) PROGRAM.dayOrder.forEach(d => {
    if (!hasDay(w, d)) return;
    const ds = dayState(w, d, false); if (!ds) return;
    PROGRAM.weeks[w][d].blocks.forEach((b, bi) => b.rows.forEach((row, ri) => {
      const key = `b${bi}r${ri}`;
      LIFTERS.forEach(l => {
        const raw = ds.per && ds.per[l] && ds.per[l].logs && ds.per[l].logs[key];
        if (!raw) return;
        const p = resolve(row, l, raw.step);
        const log = SL.normLog(raw, loggable(row) ? p.sets : 0);
        if (!SL.hasData(log)) return;
        out.push({ date: ds.date, where: `W${w} ${PROGRAM.dayLabels[d]}`, week: w, day: d, lifter: l, exercise: p.name, rx: p.rx,
                   unit: p.unit || "reps", target: p.repTop, loaded: !!p.loaded, bw: !!p.bw,
                   sets: log.sets.filter(x => x.r != null || x.w != null).length ? log.sets : [], hit: loggable(row) ? SL.hit(log, specOf(row, p)) : null,
                   step: raw.step, notes: log.notes || "" });

    }));
  });

}
SL.sync.init({
  slug: PROGRAM.slug,
  storageKey: PROGRAM.storageKey,
  payload: () => ({ state, entries: syncEntries(), catalog: syncCatalog() }),
  hasData: () => Object.keys(state.days).length > 0
});

/* ---------------------------------------------------------------------------
   HEALTH-SYSTEM SUMMARY. The contract lives in ../shared/shell.js; Today and
   Library read summary.father-son, never this page's storage.
   Set days on the calendar: W0 runs Mon Sep 21 to Sun Sep 27 2026 (Day 1 is
   its Wednesday), week w starts 7w days later, Mon = upper, Wed = lower.
   A session counts once EITHER lifter has logged anything on it (a check, a
   set, a note, a finisher result). The page's own week pills and tabs are
   unchanged: they still follow completion, not the calendar.
   --------------------------------------------------------------------------- */
const CAL_W0 = [2026, 8, 21];                // local date of W0's Monday
const CAL_OFFSET = { mon: 0, wed: 2 };
function isoOf(x) { return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`; }
function calISO(w, d) { return isoOf(new Date(CAL_W0[0], CAL_W0[1], CAL_W0[2] + 7 * w + CAL_OFFSET[d])); }
function calWeekOf(iso) {
  const [y, m, dd] = iso.split("-").map(Number);
  return Math.floor(Math.round((new Date(y, m - 1, dd) - new Date(CAL_W0[0], CAL_W0[1], CAL_W0[2])) / 86400000) / 7);
}
function dayHasWork(ds) {
  if (!ds || !ds.per) return false;
  return LIFTERS.some(l => {
    const p = ds.per[l];
    if (!p) return false;
    if (Object.keys(p.completed || {}).some(k => p.completed[k])) return true;
    if (Object.keys(p.logs || {}).some(k => SL.hasData(SL.normLog(p.logs[k], 0)))) return true;
    return !!(p.fin && p.fin.result != null && p.fin.result !== "");
  });
}
function publishSummary() {
  try {
    if (!window.HS || typeof HS.summary !== "function") return;
    const today = todayISO();
    const cw = Math.max(0, Math.min(NWEEKS - 1, calWeekOf(today)));
    const slot = (w, d) => {
      const day = PROGRAM.weeks[w][d];
      return { id: sessionId(w, d), label: day.title, sub: `Week ${w} · ${PROGRAM.dayLabels[d]}`, date: calISO(w, d),
               minutes: Math.round(dayPlan(w, d).total / 60), listed: day.duration };
    };
    let next = null, todaySlot = null;
    for (let w = cw; w < NWEEKS && !next; w++) {
      for (const d of PROGRAM.dayOrder) {
        if (!hasDay(w, d)) continue;
        const iso = calISO(w, d);
        if (iso < today) continue;
        const worked = dayHasWork(dayState(w, d, false));
        if (iso === today) { const s = slot(w, d); todaySlot = { label: s.label, minutes: s.minutes, done: worked }; }
        if (!worked) { next = slot(w, d); break; }
      }
    }
    const wkDays = PROGRAM.dayOrder.filter(d => hasDay(cw, d));
    const sessions = [];
    for (let w = 0; w < NWEEKS; w++) PROGRAM.dayOrder.forEach(d => {
      if (!hasDay(w, d)) return;
      const ds = dayState(w, d, false);
      if (ds && ds.date && dayHasWork(ds)) sessions.push(ds.date);
    });
    HS.summary(PROGRAM.slug, {
      kind: "setdays", week: cw, weeks: 12, phase: cw === 0 ? "Day 1" : BLOCKS[blockOf(cw) - 1].name,
      days: ["Mon", "Wed"], next, today: todaySlot,
      thisWeek: { done: wkDays.filter(d => dayHasWork(dayState(cw, d, false))).length, planned: wkDays.length },
      sessions,
      extra: { tracks: sonTracks() }
    });
  } catch (e) {}
}
/* Son's current pull-up step and push-up level, exactly as the hero card shows them. */
function sonTracks() {
  const out = {};
  ["pullup", "pushup"].forEach(kind => {
    const steps = TRACKS[kind].son;
    const i = Math.min(state.tracks.son[kind], steps.length - 1);
    out[kind] = { name: steps[i].name, step: i + 1, of: steps.length };
  });
  return out;
}

/* ---------------------------------------------------------------------------
   CATALOG (Phase 2 contract in ../shared/shell.js). Every session, W0 to W12,
   in program order, id "w<week>-<mon|wed>". Rows are RYAN's version (his name
   and prescription): the catalog feeds Ryan's own coverage. Track rows read
   Ryan's current step. Minutes use the dayPlan time model with every block on
   (no short Monday, no readiness cut) and Ryan's prescriptions; warm-up items
   are 30 s each and the finisher is 3 min, as in dayPlan. Pure: no DOM, no saves.
   --------------------------------------------------------------------------- */
function sessionId(w, d) { return `w${w}-${d}`; }
window.HS_CATALOG = function () {
  const r1 = x => Math.round(x * 10) / 10;
  const KIND_BY_TAG = { power: "strength", pull: "strength", push: "strength", legs: "strength", arms: "strength", armor: "strength",
                        core: "core", test: "test", skill: "warmup" };
  const repsOf = rx => { const m = String(rx || "").match(/×\s*([^·]+?)\s*(?:·|$)/); return m ? m[1].trim() : null; };
  const setsOf = rx => { const m = String(rx || "").match(/^(\d+)(?:-(\d+))?\s*×/); return m ? parseInt(m[2] || m[1], 10) : 1; };
  const sessions = [];
  for (let w = 0; w < NWEEKS; w++) PROGRAM.dayOrder.forEach(d => {
    if (!hasDay(w, d)) return;
    const day = PROGRAM.weeks[w][d];
    const exercises = [];
    let t = 60;
    (day.warmup || []).forEach(item => {
      const m = item.match(/^(.*?)\s*×\s*(.+)$/);
      const scheme = m ? `× ${m[2]}` : null;
      exercises.push({ name: m ? m[1] : item, scheme, sets: 1, reps: m ? repsOf(scheme) : null, restSec: null, minutes: 0.5, kind: "warmup", tag: null });
      t += 30;
    });
    day.blocks.forEach((b, i) => {
      if (i > 0) t += 30;
      const paired = /superset|the two tracks/i.test(b.note || "") ? 0.5 : 1;
      b.rows.forEach(row => {
        const p = resolve(row, "ryan");
        const secs = rowSecs(row, p, paired);
        t += secs;
        exercises.push({
          name: p.name, scheme: p.rx,
          sets: row.kind === "effort" ? setsOf(p.rx) : (p.sets || 1),
          reps: repsOf(p.rx), restSec: row.rest || null, minutes: r1(secs / 60),
          kind: KIND_BY_TAG[row.tag] || "strength", tag: row.tag || null
        });
      });
    });
    const menu = w === 0 ? ["Plank high-fives"] : finMenu(w, d).map(f => f.name);
    exercises.push({ name: "Finisher", scheme: menu.length > 1 ? `Pick one: ${menu.join(" · ")}` : menu[0], sets: 1, reps: null, restSec: null,
                     minutes: 3, kind: "conditioning", tag: null });
    t += 180;
    sessions.push({ id: sessionId(w, d), week: w, day: PROGRAM.dayLabels[d], label: day.title, minutes: Math.round(t / 60), optional: false, exercises });
  });
  return { slug: PROGRAM.slug, kind: "setdays", sessions };
};
function L() { return state.lifter; }
function dayState(w, d, create) {
  const k = dayKey(w, d);
  if (!state.days[k] && create) {
    state.days[k] = { date: null, clockStart: null, clockStop: null, readiness: null, short: false, prep: {}, per: { son: emptyPer(), ryan: emptyPer() } };
  }
  const ds = state.days[k] || null;
  if (ds) { if (!ds.per) ds.per = { son: emptyPer(), ryan: emptyPer() }; if (!ds.prep) ds.prep = {}; LIFTERS.forEach(l => { if (!ds.per[l]) ds.per[l] = emptyPer(); }); }
  return ds;
}
function emptyPer() { return { completed: {}, logs: {}, fin: { pick: null, result: null, notes: "" } }; }
function perState(w, d, create, lifter) {
  const ds = dayState(w, d, create);
  return ds ? ds.per[lifter || L()] : null;
}
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function shortDate(iso) {
  if (!iso) return "—";
  const [, m, d] = iso.split("-");
  return `${parseInt(m, 10)}/${parseInt(d, 10)}`;
}
function stampDate(ds) { if (!ds.date) ds.date = todayISO(); }

/* Blocks that are ON for this day given readiness and the short toggle. */
function activeBlocks(w, d) {
  const day = PROGRAM.weeks[w][d];
  if (!day) return [];
  const ds = dayState(w, d, false);
  const low = ds && ds.readiness != null && ds.readiness <= 2;
  const short = ds && ds.short;
  return day.blocks.map((b, bi) => ({ b, bi })).filter(({ b }) => {
    if (short && d === "mon" && !b.essential) return false;
    if (low && b.plyo) return false;
    return true;
  });
}
/* Rows with STABLE keys (block index + row index) so a hidden block never shifts a log. */
function mainRows(w, d) {
  const out = [];
  activeBlocks(w, d).forEach(({ b, bi }) => b.rows.forEach((row, ri) => out.push({ row, bi, ri, key: `b${bi}r${ri}` })));
  return out;
}
function isDayComplete(w, d, lifter) {
  const day = PROGRAM.weeks[w][d];
  if (!day) return true;   // no session that day (week 1 Monday)
  const ps = perState(w, d, false, lifter);
  if (!ps) return false;
  const rows = mainRows(w, d);
  return rows.length > 0 && rows.every(r => ps.completed[r.key]);
}
function hasDay(w, d) { return !!PROGRAM.weeks[w][d]; }
function isWeekComplete(w, lifter) { return PROGRAM.dayOrder.every(d => isDayComplete(w, d, lifter)); }
function currentWeek() {
  for (let w = 0; w < NWEEKS; w++) if (!isWeekComplete(w, L())) return w;
  return NWEEKS - 1;
}
function dueDay(w) {
  for (const d of PROGRAM.dayOrder) if (hasDay(w, d) && !isDayComplete(w, d, L())) return d;
  return hasDay(w, "mon") ? "mon" : "wed";
}

/* ===========================================================================
   TIME PLAN. A planning model for the session clock, not a promise.
   =========================================================================== */
function setsFromRx(rx) {
  const m = String(rx).match(/^(\d+)(?:-(\d+))?\s*×/);
  if (!m) return 3;
  return m[2] ? parseInt(m[2], 10) : parseInt(m[1], 10);
}
function rowWorkSecs(row, p) {
  if (row.timer) {
    const t = row.timer;
    if (t.kind === "down") return t.secs + 20;
    if (t.kind === "interval") return t.rounds * t.segs.reduce((n, s) => n + s[1], 0) + 20;
    if (t.kind === "watch") return 120;
  }
  if (row.kind === "effort") return row.detail ? 150 : 60;
  const secMatch = String(p.rx).match(/(\d+)\s*seconds/i);
  if (secMatch) return parseInt(secMatch[1], 10) + 15;
  let work = p.isMax ? 40 : p.repTop ? Math.min(90, Math.max(25, p.repTop * 4)) : 40;
  if (/each side/i.test(p.rx)) work = Math.round(work * 1.8);
  return work;
}
function rowSecs(row, p, restFactor) {
  const rest = Math.round(row.rest * (restFactor || 1));   // supersets share one rest per pair
  if (row.kind === "track") return row.sets * (45 + rest);
  if (row.kind === "effort") return rowWorkSecs(row, p) + rest;
  return setsFromRx(p.rx) * (rowWorkSecs(row, p) + rest);
}
function dayPlan(w, d) {
  const day = PROGRAM.weeks[w][d];
  const offsets = {};
  let t = 60;
  if (day.warmup) t += day.warmup.length * 30;
  activeBlocks(w, d).forEach(({ b, bi }, i) => {
    if (i > 0) t += 30;
    const paired = /superset|the two tracks/i.test(b.note || "") ? 0.5 : 1;
    b.rows.forEach((row, ri) => {
      offsets[`b${bi}r${ri}`] = t;
      t += rowSecs(row, resolve(row), paired);
    });
  });
  t += 180; // finisher
  return { total: t, offsets };
}
function fmtMins(secs) { return `~${Math.round(secs / 60)} min`; }

/* The active lifter's view of a row. */
function resolve(row, lifter, pinnedStep) {
  const l = lifter || L();
  if (row.kind === "track") {
    const steps = TRACKS[row.trackKind][l];
    const i = Math.min(pinnedStep != null ? pinnedStep : state.tracks[l][row.trackKind], steps.length - 1);
    const st = steps[i];
    return { name: st.name, rx: `${st.sets} sets · ${st.rx}`, bw: !st.loaded, loaded: !!st.loaded, lower: false, repTop: st.t, repRange: null, isMax: false,
             sets: st.sets, unit: st.u, goal: st.goal || null, step: i, steps: steps.length, promote: st.promote, next: steps[i + 1] ? steps[i + 1].name : null };
  }
  return row.per[l];
}
/* Rows that take a set grid: everything except effort pieces. */
function loggable(row) { return row.kind !== "effort"; }
/* The spec SetLog reads: the resolved prescription plus how many sets are required. */
function specOf(row, p) {
  return Object.assign({}, p, { minSets: p.sets, promote: row.kind === "track", next: p.next || null });
}

/* ===========================================================================
   HISTORY + PROGRESSION COACH, per lifter, by exercise name. The rules live in
   SetLog.suggest. Son: +5 lb flat. Ryan: +5 upper / +10 lower. Miss holds.
   3 misses at one weight: plateau, drop 10%, add 2 reps. No log, no suggestion.
   =========================================================================== */
function priorEntries(name, beforeW, beforeD, lifter) {
  const key = normName(name);
  const l = lifter || L();
  const beforeDayIdx = PROGRAM.dayOrder.indexOf(beforeD);
  const out = [];
  for (let w = 0; w < NWEEKS; w++) {
    for (const d of PROGRAM.dayOrder) {
      if (!hasDay(w, d)) continue;
      const afterCurrent = w > beforeW || (w === beforeW && PROGRAM.dayOrder.indexOf(d) >= beforeDayIdx);
      if (afterCurrent) continue;
      const ds = dayState(w, d, false);
      if (!ds) continue;
      const ps = ds.per[l];
      const day = PROGRAM.weeks[w][d];
      day.blocks.forEach((b, bi) => b.rows.forEach((row, ri) => {
        if (!loggable(row)) return;
        const raw = ps.logs[`b${bi}r${ri}`];
        if (!raw) return;
        const pr = resolve(row, l, raw.step);
        if (normName(pr.name) !== key) return;
        const log = SL.normLog(raw, pr.sets);
        if (!SL.hasSets(log) && typeof log.legacyHit !== "boolean") return;
        out.push(SL.entry(log, specOf(row, pr), { date: ds.date, week: w, day: d }));
      }));
    }
  }
  return out.reverse();
}
function suggestNext(row, p, w, d) {
  if (!loggable(row)) return null;
  return SL.suggest(priorEntries(p.name, w, d), specOf(row, p), { inc: L() === "son" ? 5 : undefined });
}

      <div class="track-step">${st.name}</div>
      <div class="track-pos">${kind === "pullup" ? "Step" : "Level"} ${i + 1} of ${steps.length}${maxed ? " · top" : ""}</div>
      <div class="track-rule">${st.promote}</div>
      <div class="track-btns">
        <button class="btn" data-dir="-1" ${i === 0 ? "disabled" : ""}>▼ Back</button>
        <button class="btn btn-primary" data-dir="1" ${maxed ? "disabled" : ""}>▲ Promote</button>
      </div>`;
    card.querySelectorAll("[data-dir]").forEach(b => b.onclick = () => {
      const n = i + parseInt(b.dataset.dir, 10);
      if (n < 0 || n >= steps.length) return;
      if (b.dataset.dir === "1" && !confirm(`Promote ${LIFTER_LABEL[L()]} to ${kind === "pullup" ? "step" : "level"} ${n + 1}: ${steps[n].name}?`)) return;
      state.tracks[L()][kind] = n; saveState(); render();
    });
    el.appendChild(card);
  });
}
function renderWeekBar() {
  const bar = document.getElementById("week-bar");
  bar.innerHTML = "";
  for (let w = 0; w < NWEEKS; w++) {
    const b = document.createElement("button");
    b.className = "week-pill" + (w === uiWeek ? " active" : "") + (isWeekComplete(w, L()) ? " done" : "") + (BENCH_WEEKS.includes(w) ? " bench" : "");
    b.textContent = "W" + w;
    b.title = w === 0 ? "Day 1" : BENCH_WEEKS.includes(w) ? "Benchmark week" : "";
    b.onclick = () => { uiWeek = w; render(); };
    bar.appendChild(b);
  }
}
function renderPhase() {
  const w = uiWeek;
  const blk = BLOCKS[blockOf(w) - 1];
  document.getElementById("phase-card").innerHTML = `
    <div class="phase-name">${w === 0 ? "Week 0 · <span>Day 1</span>" : `Block ${blockOf(w)} · <span>${blk.name}</span> · Week ${w}`}</div>
    <div class="phase-dates">${w === 0 ? "Sep 21 to Sep 27 · records on Wednesday" : blk.weeks}</div>
    <div class="phase-note">${WEEK_NOTES[w]}</div>
    <div class="phase-note" style="color:var(--muted);font-size:11.5px">${blk.theme}</div>`;
}

/* ===========================================================================
   DAY RENDER: the in-session board (Phase 2 step 5, 2026-09-25). The classes
   are the contract in ../shared/styles.css, "In-session layout". Every row
   after the warm-up, the finisher included, is one .hs-row in exactly one
   state FOR THE ACTIVE LIFTER:
     done  its check is on (the finisher: a result is logged; on Monday Son
           judges, so Ryan's result closes Son's finisher)
     now   the row tapped last, else the first row not done. Full card, grid open.
     next  everything else. One-line summary; a tap makes it Now.
   The tapped row lives in memory only, never in state. It clears when that
   row is completed, when the lifter changes, or when the day is cleared.
   Rendering only: checks, logs, saves, promotions and sync are unchanged.
   =========================================================================== */
const DAY_NAME = { mon: "Monday", wed: "Wednesday" };
const FIN_KEY = "fin";
const nowPick = {};          // dayKey -> row key tapped to be Now (for pickLifter)
let pickLifter = null;       // the lifter those picks belong to; a change clears them all
const prepOpen = {};         // dayKey -> { open, auto }: warm-up opened or closed by hand, while auto still reads the same
let scrollToNow = false;     // set by a tap that moves Now; the next renderDay brings it into view
const ICON = {
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 12.5l4.2 4.2L18.5 8"/></svg>`,
  clock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.5 1.5"/><path d="M9.5 2.5h5"/></svg>`,
  video: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="6" width="12" height="12" rx="2.5"/><path d="M15.5 10.5l5-3v9l-5-3z"/></svg>`,
  note: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h9l4 4v13H6z"/><path d="M9 12h7"/><path d="M9 16h5"/></svg>`
};

function finDone(w, d, lifter) {
  const ds = dayState(w, d, false);
  if (!ds) return false;
  const logged = l => { const f = ds.per[l] && ds.per[l].fin; return !!(f && f.result != null && f.result !== ""); };
  return d === "mon" && lifter === "son" ? logged("ryan") : logged(lifter);
}
/* The board for the active lifter: every row in order with its state, n (1-based) and the counts. */
function boardOf(w, d) {
  const l = L(), dk = dayKey(w, d);
  if (pickLifter !== l) { Object.keys(nowPick).forEach(k => delete nowPick[k]); pickLifter = l; }
  const ds = dayState(w, d, false);
  const ps = ds ? ds.per[l] : null;
  const rows = mainRows(w, d).map(r => Object.assign({}, r, { done: !!(ps && ps.completed[r.key]) }));
  if (!(ds && ds.short)) rows.push({ key: FIN_KEY, fin: true, done: finDone(w, d, l) });
  if (nowPick[dk] && !rows.some(r => r.key === nowPick[dk])) delete nowPick[dk];
  const first = rows.find(r => !r.done);
  const nowKey = nowPick[dk] || (first ? first.key : null);
  const done = rows.filter(r => r.done).length;
  rows.forEach((r, i) => { r.n = i + 1; r.st = r.key === nowKey ? "now" : r.done ? "done" : "next"; });
  return { rows, done, total: rows.length, complete: rows.length > 0 && done === rows.length };
}
function pickNow(w, d, key) { nowPick[dayKey(w, d)] = key; pickLifter = L(); scrollToNow = true; renderDay(d); }
function dropPick(w, d, key) { const dk = dayKey(w, d); if (nowPick[dk] === key) delete nowPick[dk]; }
/* Scheme lines. A track row's rx reads "3 sets · 3 × 3-5 · ..."; the summary drops the "3 sets". */
function schemeOf(row, p) { return row.kind === "track" ? String(p.rx).replace(/^\d+ sets · /, "") : p.rx; }
function shortRx(row, p) { return schemeOf(row, p).split(" · ")[0]; }
function sumHtml(st, name, sub, right, timer) {
  return `<button type="button" class="hs-row-sum">
      <span class="hs-mark">${st === "done" ? ICON.check : ""}</span>
      <span class="hs-sum-t"><b>${name}</b>${sub ? `<small>${sub}</small>` : ""}</span>
      ${timer ? `<span class="fs-sum-timer" data-default=""></span>` : ""}
      ${right ? `<span class="hs-sum-r">${right}</span>` : ""}
    </button>`;
}

function renderDay(d) {
  const w = uiWeek;
  const day = PROGRAM.weeks[w][d];
  const container = document.getElementById("container-" + d);
  container.innerHTML = "";
  container.className = "fs-board";
  if (!day) {
    container.innerHTML = `<div class="card"><h2>No Monday in Week 0</h2><p>Day 1 is Wednesday September 23. The first full Monday upper session is September 28, Week 1.</p></div>`;
    return;
  }
  const ds = dayState(w, d, false);
  const plan = dayPlan(w, d);
  const dk = dayKey(w, d);
  const bd = boardOf(w, d);
  const byKey = {};
  bd.rows.forEach(r => { byKey[r.key] = r; });
  const who = LIFTER_LABEL[L()];

  /* Session header: eyebrow, title, clock, and progress for the active lifter. */
  const head = document.createElement("header");
  head.className = "hs-sess-head";
  const pct = bd.total ? Math.round(100 * bd.done / bd.total) : 0;
  head.innerHTML = `
    <div class="hs-sess-eyebrow">Father &amp; Son · Week ${w} · ${DAY_NAME[d]}</div>
    <div class="hs-sess-top">
      <h2 class="hs-sess-title">${day.title}</h2>
      <button type="button" class="hs-sess-clock">${ICON.clock}<span class="fs-clock-t">Start</span></button>
    </div>
    <div class="hs-sess-progress${bd.complete ? " fs-complete" : ""}">
      <div class="hs-bar"><i style="width:${pct}%"></i></div>
      <span>${bd.complete ? `Day complete · ${who} · ${bd.done} of ${bd.total}` : `${bd.done} of ${bd.total} done · ${who} · planned ${fmtMins(plan.total)}`}</span>
    </div>`;
  container.appendChild(head);

  /* Compact row under the header: who is lifting, pace against the plan, clear this lifter's day. */
  const ctl = document.createElement("div");
  ctl.className = "fs-sess-ctl";
  ctl.innerHTML = `
    <div class="fs-seg" role="group" aria-label="Who is lifting">${LIFTERS.map(l => `<button type="button" class="${l === L() ? "on" : ""}" data-lifter="${l}" aria-pressed="${l === L()}">${LIFTER_LABEL[l]}</button>`).join("")}</div>
    <span class="fs-pace"></span>
    <button type="button" class="reset-link fs-clear">Clear ${who}'s day</button>`;
  ctl.querySelectorAll("[data-lifter]").forEach(b => b.onclick = () => {
    if (b.dataset.lifter === L()) return;
    state.lifter = b.dataset.lifter; saveState(); render();   // same week: they train together
  });
  ctl.querySelector(".fs-clear").onclick = () => {
    if (!ds) return;
    if (confirm(`Clear Week ${w} ${PROGRAM.dayLabels[d]} for ${who}? Checks, logs and the finisher result go. The other lifter's day stays.`)) {
      ds.per[L()] = emptyPer();
      delete nowPick[dk];
      saveState(); render();
    }
  };
  container.appendChild(ctl);
  wireClock(d, w, plan, head.querySelector(".hs-sess-clock"), ctl.querySelector(".fs-pace"));

  // Readiness (Wednesday) or short-Monday toggle
  if ((d === "wed" && w > 0) || d === "mon") {
    const box = document.createElement("div");
    box.className = "fs-ctls" + (d === "mon" ? " fs-ctls-short" : "");
    box.appendChild(d === "mon" ? renderShortToggle(w, d) : renderReadiness(w, d));
    container.appendChild(box);
  }

  if (day.warmup) container.appendChild(renderPrep(w, d, "Warm-up", "wu", day.warmup, bd.done > 0));

  const on = new Set(activeBlocks(w, d).map(x => x.bi));
  const low = ds && ds.readiness != null && ds.readiness <= 2;
  let upNext = false;
  const label = text => {
    const el = document.createElement("div");
    el.className = "hs-section-label";
    el.textContent = text;
    container.appendChild(el);
  };
  const offNote = text => {
    const off = document.createElement("div");
    off.className = "block-off";
    off.textContent = text;
    container.appendChild(off);
  };
  day.blocks.forEach((b, bi) => {
    if (!on.has(bi)) {
      offNote(b.plyo && low ? `${b.label} is off today: readiness ${ds.readiness}. Run one fewer set on the strength pairs too.` : `${b.label} skipped: short Monday.`);
      return;
    }
    const items = b.rows.map((row, ri) => byKey[`b${bi}r${ri}`]);
    let text = b.label || "";
    if (items[0].st === "next" && !upNext) { text = text ? `Up next · ${text}` : "Up next"; upNext = true; }
    if (text) label(text);
    if (b.note && items.some(r => !r.done)) {
      const note = document.createElement("div");
      note.className = "block-note";
      note.textContent = b.note;
      container.appendChild(note);
    }
    items.forEach((r, i) => {
      if (i > 0 && r.st === "next" && !upNext) { label("Up next"); upNext = true; }
      container.appendChild(renderRow(w, d, r.row, r.key, plan, r, bd.total));
    });
  });

  if (!(ds && ds.short)) {
    const r = byKey[FIN_KEY];
    const text = `Finisher · ${w === 0 ? "Day 1, cooperative" : "Block " + blockOf(w)}`;
    label(r.st === "next" && !upNext ? `Up next · ${text}` : text);
    container.appendChild(renderFinisherRow(w, d, day, r, bd.total));
  } else offNote("Finisher skipped: short Monday.");

  if (scrollToNow && container.offsetParent) {
    scrollToNow = false;
    const nowEl = container.querySelector(".hs-row.hs-now");
    if (nowEl) {
      const top = nowEl.getBoundingClientRect().top;
      if (top < 80 || top > window.innerHeight * 0.5) nowEl.scrollIntoView({ block: "start", behavior: "smooth" });
    }
  }
}

function renderReadiness(w, d) {
  const ds = dayState(w, d, false);
  const val = ds ? ds.readiness : null;
  const el = document.createElement("div");
  el.className = "ctl";
  el.innerHTML = `
    <div class="ctl-label">Legs today, 1 to 5?<span class="ctl-sub">1 or 2 turns the jump block off and drops a set.</span></div>
    <div class="ready-row">${[1, 2, 3, 4, 5].map(n => `<button class="ready-btn ${val === n ? "on" : ""} ${n <= 2 ? "low" : ""}" data-n="${n}">${n}</button>`).join("")}</div>`;
  el.querySelectorAll(".ready-btn").forEach(b => b.onclick = () => {
    const cur = dayState(w, d, true);
    const n = parseInt(b.dataset.n, 10);
    cur.readiness = cur.readiness === n ? null : n;
    stampDate(cur);
    saveState(); render();
  });
  return el;
}
function renderShortToggle(w, d) {
  const ds = dayState(w, d, false);
  const on = !!(ds && ds.short);
  const el = document.createElement("div");
  el.className = "ctl";
  el.innerHTML = `
    <div class="ctl-label">Short Monday<span class="ctl-sub">Late night, championship week, or a 1 or 2 on the legs: just the two tracks, 15 minutes.</span></div>
    <button class="btn toggle-btn ${on ? "on" : ""}">${on ? "ON · tracks only" : "off"}</button>`;
  el.querySelector("button").onclick = () => { const cur = dayState(w, d, true); cur.short = !cur.short; saveState(); render(); };
  return el;
}
/* The warm-up checklist. It folds itself away once every item is ticked or a main row is done
   for the active lifter; a tap on its head overrides that until the automatic answer changes. */
function renderPrep(w, d, title, prefix, items, started) {
  const ds = dayState(w, d, false);
  const dk = dayKey(w, d);
  const doneCount = items.filter((_, i) => ds && ds.prep[prefix + i]).length;
  const auto = (doneCount === items.length && doneCount > 0) || !!started;
  const hand = prepOpen[dk] && prepOpen[dk].auto === auto ? prepOpen[dk] : null;
  const el = document.createElement("div");
  el.className = "prep" + ((hand ? !hand.open : auto) ? " collapsed" : "");
  el.innerHTML = `
    <div class="prep-head"><span>${title} · ${doneCount}/${items.length}</span><span class="caret">▼</span></div>
    <div class="prep-body"></div>`;
  el.querySelector(".prep-head").onclick = () => {
    el.classList.toggle("collapsed");
    prepOpen[dk] = { open: !el.classList.contains("collapsed"), auto };
  };
  const bodyEl = el.querySelector(".prep-body");
  items.forEach((it, i) => {
    const k = prefix + i;
    const isDone = !!(ds && ds.prep[k]);
    const item = document.createElement("div");
    item.className = "prep-item" + (isDone ? " done" : "");
    item.innerHTML = `<span class="prep-check"><svg viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 8 7 12 13 4"/></svg></span><span>${it}</span>`;
    item.onclick = () => { const cur = dayState(w, d, true); cur.prep[k] = !isDone; saveState(); renderDay(d); };
    bodyEl.appendChild(item);
  });
  return el;
}

function tagLabel(t) {
  return ({ power: "Power", pull: "Pull", push: "Push", legs: "Legs", armor: "Armor", core: "Core", skill: "Skill", test: "Test", arms: "Arms" }[t]) || t;
}
function escapeHtml(s) { return String(s || "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

/* One main row. r carries st ("done" | "now" | "next") and n from boardOf. */
function renderRow(w, d, row, key, plan, r, total) {
  const st = r.st;
  const ps = perState(w, d, false);
  const rawLog = ps && ps.logs[key];
  const p = resolve(row, null, rawLog && rawLog.step != null ? rawLog.step : undefined);
  const isDone = !!(ps && ps.completed[key]);
  const canLog = loggable(row);
  const spec = specOf(row, p);
  const log = SL.normLog(ps && ps.logs[key], canLog ? p.sets : 0);
  const hasLog = SL.hasSets(log);
  const tKey = `${dayKey(w, d)}_${L()}_${key}`;

  const el = document.createElement("div");
  el.className = `hs-row hs-${st}`;
  el.dataset.key = key;
  const right = st === "done" ? (canLog && hasLog ? SL.lastText(SL.entry(log, spec), spec) : shortRx(row, p)) : "";
  const liveTimer = st !== "now" && !!activeTimers[tKey];   // a rest still running after the row folded
  el.innerHTML = sumHtml(st, p.name, st === "next" ? schemeOf(row, p) : "", right, liveTimer);
  el.querySelector(".hs-row-sum").onclick = () => pickNow(w, d, key);
  if (liveTimer) reattachTimer(tKey, el.querySelector(".fs-sum-timer"));
  if (st !== "now") return el;

  let lastHtml = "";
  let sugg = null;
  if (canLog) {
    const hist = priorEntries(p.name, w, d);
    if (hist.length) {
      const Lst = hist[0];
      lastHtml = SL.lastHtml(Lst, spec, `W${Lst.week} ${PROGRAM.dayLabels[Lst.day]}${Lst.date ? " · " + shortDate(Lst.date) : ""}`);
    }
    sugg = suggestNext(row, p, w, d);
  }
  const suggHtml = SL.suggestHtml(sugg);
  const detailHtml = row.detail ? `<div class="ex-detail">${row.detail.map(m => `<span class="dt-line">• ${m}</span>`).join("")}</div>` : "";
  const cueHtml = row.cue ? `<div class="ex-cue">${row.cue}</div>` : (row.kind === "track" ? `<div class="ex-cue"><strong>Promote when:</strong> ${p.promote}</div>` : "");
  const startAt = plan.offsets[key] != null ? Math.round(plan.offsets[key] / 60) : null;
  const subHtml = (canLog ? ` · rest ${fmtClock(row.rest)}` : "") + (startAt !== null ? ` · start ~${startAt} min in` : "");

  let timerLabel, timerMode;
  if (row.timer) { timerLabel = row.timer.label || "⏱"; timerMode = "special"; }
  else { timerLabel = row.rest >= 120 ? `⏱ ${Math.round(row.rest / 60)}m` : `⏱ ${row.rest}s`; timerMode = "rest"; }

  let trackHtml = "";
  if (row.kind === "track") {
    const steps = TRACKS[row.trackKind][L()];
    const ti = Math.min(state.tracks[L()][row.trackKind], steps.length - 1);
    const top = ti === steps.length - 1;
    trackHtml = `<div class="fs-track"><span>${TRACKS[row.trackKind].label} ${row.trackKind === "pullup" ? "step" : "level"} ${ti + 1} of ${steps.length}${top ? " · top" : ""}</span>
      <button type="button" class="btn" data-dir="-1" ${ti === 0 ? "disabled" : ""}>▼ Back</button>
      <button type="button" class="btn" data-dir="1" ${top ? "disabled" : ""}>▲ Promote</button></div>`;
  }

  const full = document.createElement("div");
  full.className = "hs-row-full";
  full.innerHTML = `
    <div class="hs-now-eyebrow">Now · ${r.n} of ${total}</div>
    <div class="ex-name">${p.name}</div>
    <div class="ex-prescription"><strong>${p.rx}</strong><span class="fs-rx-sub">${subHtml}</span></div>
    ${detailHtml}
    ${cueHtml}
    ${lastHtml || suggHtml ? `<div class="hs-lastbox">${lastHtml}${suggHtml}</div>` : ""}
    ${trackHtml}
    ${canLog ? `<div class="ex-log open fs-grid">${SL.gridHtml(log, spec, sugg)}</div>` : ""}
    <div class="ex-log fs-notes${log.notes ? " open" : ""}">
      <textarea class="log-notes" placeholder="${canLog ? "Notes: form, tempo, how it felt..." : "Notes..."}">${escapeHtml(log.notes)}</textarea>
    </div>
    <div class="hs-tools">
      <a class="btn" href="${v(p.name)}" target="_blank" rel="noopener">${ICON.video}Video</a>
      <button type="button" class="btn fs-note-btn">${ICON.note}Note</button>
      <button type="button" class="btn btn-timer row-timer" data-default="${timerLabel}">${timerLabel}</button>
      <button type="button" class="btn fs-check${isDone ? " on" : ""}" aria-pressed="${isDone}">${ICON.check}${isDone ? "Undo" : "Done"}</button>
    </div>`;
  el.appendChild(full);

  full.querySelector(".fs-check").onclick = () => {
    const cur = dayState(w, d, true);
    cur.per[L()].completed[key] = !isDone;
    if (!isDone) { stampDate(cur); dropPick(w, d, key); scrollToNow = true; }
    saveState(); renderDay(d); renderWeekBar();
  };
  function ensureLog() {
    const cur = dayState(w, d, true);
    const pp = cur.per[L()];
    const keepStep = pp.logs[key] && pp.logs[key].step != null ? pp.logs[key].step : (row.kind === "track" ? p.step : undefined);
    pp.logs[key] = SL.normLog(pp.logs[key], canLog ? p.sets : 0);
    if (keepStep != null) pp.logs[key].step = keepStep;   // a track log stays with the step it was done at
    stampDate(cur);
    return pp.logs[key];
  }
  full.querySelector(".fs-note-btn").onclick = () => {
    const box = full.querySelector(".fs-notes");
    box.classList.toggle("open");
    if (box.classList.contains("open")) box.querySelector("textarea").focus();
  };

  SL.wireGrid(el, {
    spec, sugg,
    getLog: ensureLog,
    save: saveState,
    rerender: () => renderDay(d),
    onPromote: () => {
      const kind = row.trackKind, steps = TRACKS[kind][L()], i = state.tracks[L()][kind];
      if (i + 1 < steps.length && confirm(`Promote ${LIFTER_LABEL[L()]} to ${steps[i + 1].name}?`)) { state.tracks[L()][kind] = i + 1; saveState(); render(); }
    }
  });
  full.querySelector(".log-notes").addEventListener("input", e => { ensureLog().notes = e.target.value; saveState(); });

  /* Back / Promote on a track row: the same move as the hero card's buttons. */
  full.querySelectorAll(".fs-track [data-dir]").forEach(b => b.onclick = () => {
    const kind = row.trackKind, steps = TRACKS[kind][L()];
    const i = Math.min(state.tracks[L()][kind], steps.length - 1);
    const n = i + parseInt(b.dataset.dir, 10);
    if (n < 0 || n >= steps.length) return;
    if (b.dataset.dir === "1" && !confirm(`Promote ${LIFTER_LABEL[L()]} to ${kind === "pullup" ? "step" : "level"} ${n + 1}: ${steps[n].name}?`)) return;
    state.tracks[L()][kind] = n; saveState(); render();
  });

  const tBtn = full.querySelector(".row-timer");
  reattachTimer(tKey, tBtn);
  tBtn.onclick = () => {
    if (activeTimers[tKey]) tapActiveTimer(tKey);
    else if (timerMode === "special") startSpecialTimer(tKey, tBtn, row.timer);
    else startCountdown(tKey, tBtn, row.rest, "rest");
  };
  return el;
}

/* The finisher as the board's last row. Its full card holds the pick-and-log block below. */
function renderFinisherRow(w, d, day, r, total) {
  const st = r.st;
  const ps = perState(w, d, false);
  const fin = (ps && ps.fin) || { pick: null, result: null, notes: "" };
  const judge = d === "mon" && L() === "son";
  const menuN = w === 0 ? 1 : finMenu(w, d).length;
  let right = "", sub = "";
  if (st === "done") {
    const f = judge ? perState(w, d, false, "ryan").fin : fin;

  const el = document.createElement("div");
  el.className = `hs-row hs-${st}`;
  el.dataset.key = FIN_KEY;
  el.innerHTML = sumHtml(st, fin.pick || "Finisher", sub, right, false);
  el.querySelector(".hs-row-sum").onclick = () => pickNow(w, d, FIN_KEY);

    <div class="hs-now-eyebrow">Now · ${r.n} of ${total}</div>

}

/* ===========================================================================
   FINISHER: pick from the block's menu, log a result, flag a PR.
   =========================================================================== */
function finEntries(name, lifter) {
  const out = [];
  for (let w = 0; w < NWEEKS; w++) for (const d of PROGRAM.dayOrder) {
    const ds = dayState(w, d, false);
    if (!ds) continue;
    const f = ds.per[lifter].fin;
    if (f && f.pick === name && f.result != null && f.result !== "") out.push({ week: w, day: d, date: ds.date, result: parseFloat(f.result), notes: f.notes });
  }
  return out;
}
function finUnit(name) {
  for (const d of ["mon", "wed"]) for (const b of [1, 2, 3]) for (const f of FIN[d][b]) if (f.name === name) return f.unit;
  return "";
}
function lowerIsBetter(name) { return /time trial|shuttle/i.test(name); }
/* inBoard: drawn inside the board's finisher card, which already carries the label and the note. */
function renderFinisher(w, d, day, inBoard) {
  const ds = dayState(w, d, false);
  const ps = perState(w, d, false);
  const fin = (ps && ps.fin) || { pick: null, result: null, notes: "" };
  const menu = w === 0 ? [{ name: "Plank high-fives", how: "Face to face in a plank, alternate hand slaps to 20.", hc: "Cooperative", unit: "slaps", coop: true }] : finMenu(w, d);
  const wrap = document.createElement("div");
  const judge = d === "mon" && L() === "son";
  if (!inBoard) wrap.innerHTML = `<div class="block-label">Finisher · ${w === 0 ? "Day 1, cooperative" : "Block " + blockOf(w)}</div><div class="block-note">${day.finNote}</div>`;
  const menuEl = document.createElement("div");
  menuEl.className = "fin-menu";
  menu.forEach(f => {
    const b = document.createElement("button");
    b.className = "fin-opt" + (fin.pick === f.name ? " on" : "") + (f.coop ? " coop" : "");
    b.innerHTML = `<div class="fo-name">${f.name}</div><div class="fo-how">${f.how}</div><div class="fo-hc">${f.hc}</div>`;
    b.onclick = () => {
      const cur = dayState(w, d, true);
      LIFTERS.forEach(l => { if (!cur.per[l].fin.pick || cur.per[l].fin.pick !== f.name) { if (l === L() || !cur.per[l].fin.result) cur.per[l].fin.pick = f.name; } });
      stampDate(cur);
      saveState(); renderDay(d);
    };
    menuEl.appendChild(b);
  });
  wrap.appendChild(menuEl);
  if (fin.pick) {
    const unit = finUnit(fin.pick) || "";
    const hist = finEntries(fin.pick, L()).filter(e => !(e.week === w && e.day === d));
    const cur = fin.result != null && fin.result !== "" ? parseFloat(fin.result) : null;
    let isPR = false;
    if (cur != null && hist.length) {
      const best = lowerIsBetter(fin.pick) ? Math.min(...hist.map(e => e.result)) : Math.max(...hist.map(e => e.result));
      isPR = lowerIsBetter(fin.pick) ? cur < best : cur > best;
    } else if (cur != null && !hist.length) isPR = true;
    const res = document.createElement("div");
    if (judge) {
      res.className = "block-note";
      res.innerHTML = `<strong>Son judges today.</strong> Count Dad's reps, call the no-reps, run the clock. Switch to Ryan to log his result.`;
    } else {
      res.className = "fin-result";
      res.innerHTML = `<span class="unit">${LIFTER_LABEL[L()]}'s result</span><input type="number" inputmode="decimal" step="0.1" placeholder="${unit}" value="${fin.result == null ? "" : fin.result}"><span class="unit">${unit}${isPR ? '<span class="pr-flag">PR</span>' : ""}</span>`;
      res.querySelector("input").addEventListener("change", e => {
        const c = dayState(w, d, true);
        c.per[L()].fin.result = e.target.value === "" ? null : e.target.value;
        if (c.per[L()].fin.result != null) dropPick(w, d, FIN_KEY);   // logged: the board moves on
        stampDate(c); saveState(); renderDay(d);
      });
    }
    wrap.appendChild(res);
    if (hist.length) {
      const best = lowerIsBetter(fin.pick) ? Math.min(...hist.map(e => e.result)) : Math.max(...hist.map(e => e.result));
      const bn = document.createElement("div"); bn.className = "ex-last"; bn.style.marginTop = "6px";
      bn.innerHTML = `${LIFTER_LABEL[L()]}'s best so far: <strong>${fmtWeight(best)} ${unit}</strong> · ${hist.length} logged`;
      wrap.appendChild(bn);
    }
  }
  return wrap;
}

const BENCH_METRICS = [

  { k: "hopL", label: "SL hop left", unit: "in" },
  { k: "hopR", label: "SL hop right", unit: "in" },
  { k: "height", label: "Height", unit: "in", sub: "wall mark" },
  { k: "shuttle", label: "5-10-5", unit: "s", cols: [8, 12], lower: true }
];
function benchVal(l, wk, k) { const b = state.bench[l][String(wk)]; return b && b[k] != null && b[k] !== "" ? parseFloat(b[k]) : null; }
function renderBench() {
  const l = L();
  const card = document.getElementById("bench-card");
  const cols = BENCH_WEEKS;
  const colLabel = wk => wk === 0 ? "Day 1" : `W${wk}`;
  let html = `<h2>Benchmarks · ${LIFTER_LABEL[l]}</h2><p>Four numbers with no maxes, taken on Day 1 and in weeks 4, 8 and 12. The small figure under each cell is the change from Day 1.</p><div class="bench-wrap"><table class="bench"><tr><th>Test</th>${cols.map(c => `<th>${colLabel(c)}</th>`).join("")}</tr>`;
  BENCH_METRICS.forEach(m => {

    });

  });

  html += `<tr class="computed"><td>L / R symmetry<small>smaller ÷ larger hop</small></td>`;
  cols.forEach(wk => {

function renderRecords() {
  const card = document.getElementById("records-card");
  const names = new Set();
  ["mon", "wed"].forEach(d => [1, 2, 3].forEach(b => FIN[d][b].forEach(f => names.add(f.name))));
  names.add("Plank high-fives");

function buildPrinciples() {
  document.getElementById("principles-card").innerHTML = `
    <h2>Why the program looks like this</h2>
    <h3>Strength training is safe and useful for a 13-year-old, done this way</h3>
    <p>The NSCA position statement and the 2014 international consensus on youth resistance training both say the same thing: supervised, technique-first strength work is safe for adolescents and improves performance and injury resistance. The risk sits in unsupervised maxing and poor form, not in the training itself. So: never to failure, two reps in the tank, one cue per set.</p>
    <h3>Gains at this age are mostly neural</h3>
    <p>Before and during puberty the body gets stronger by learning to recruit what it already has, more than by adding muscle. Clean reps in the 6 to 12 range build that. Heavy low-rep sets add little right now and cost technique. The barbell waits for Cycle 2.</p>
    <h3>The growth spurt changes the rules</h3>
    <p>Boys typically hit peak height velocity around 13.5 to 14. Limbs lengthen before control catches up, so coordination dips and a swing that looked clean in week 3 can look clumsy in week 7. That is growth, not regression. Tell him in advance. Bones outgrow muscles, so quads, hip flexors and calves tighten: the couch and calf stretches stay in every warm-up. If the height mark moves about half an inch a month, hold jump volume flat.</p>
    <h3>Growth-plate pain rule</h3>
    <p>Runners and jumpers his age are the classic profile for Osgood-Schlatter (pain on the bump below the kneecap) and Sever's (heel pain). If either spot hurts, jumps come out that day, no pushing through. If it lingers past a week or two, it goes to his doctor.</p>
    <h3>He already runs thousands of ground contacts a week</h3>
    <p>Cross-country and club soccer supply the conditioning and most of the impact. The garage adds what they do not: strength, landing mechanics and armor. Jumps are capped (20 to 30 contacts in season, 40 in Block 3), landings are stuck and silent, and the ladder is footwork, not speed. Fast-twitch work comes from jumps, swings and med ball throws.</p>
    <h3>Armor is the highest-value block</h3>
    <p>Nordic hamstring lowers and Copenhagen planks are the best-evidenced exercises for cutting hamstring and groin injuries in field-sport athletes. They start tiny (2 × 3) because they cause real soreness in beginners and he has practice that afternoon.</p>
    <h3>Sleep is part of the program</h3>
    <p>A 6:00 a.m. session on a race day costs sleep unless bedtime moves up. A teen athlete needs 8 to 10 hours. Sunday lights out by 9:00, or Monday becomes the short version.</p>
    <h3>Monday is upper only, and it is fine</h3>
    <p>A submax pull and push session twelve hours before a race costs the legs nothing. The guardrails are intensity and sleep, not minutes. Stop at the first slow rep. Championship weeks run the short version.</p>
    <h3>Ryan's column</h3>
    <p>Same movements, harder progressions, and a rebuild target of his own: the Achilles is healed, the explosion is not fully back. Tendon stiffness returns through heavy, slow calf work (the 3 × 8 with a 3-second lower). Reactive ability returns through short ground contacts (pogos, depth drops). The single-leg hop, left against right, is the honest measure.</p>
    <h3>The success metric</h3>
    <p>He asked for this. The number that matters is whether he wants to come back next week. He picks the finisher and the music. Handicaps let him win. One cue per set, not five.</p>
    <div class="src">Sources: Faigenbaum et al., NSCA position statement on youth resistance training (2009); Lloyd et al., international consensus on youth resistance training (2014); Balyi, Long-Term Athlete Development; van der Horst et al. on Nordic hamstring exercise in amateur soccer (2015); Harøy et al. on the Copenhagen adduction programme (2019); American Academy of Sleep Medicine consensus on adolescent sleep (2016).</div>`;
}
