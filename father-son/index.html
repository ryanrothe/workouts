/* ===========================================================================
   SESSION CLOCK
   =========================================================================== */
const sessionClocks = {};
/* btn is the header's .hs-sess-clock (tap: start, stop, reset, as before); stat is the pace line under it. */
function wireClock(d, w, plan, btn, stat) {
  const key = dayKey(w, d);
  const txt = btn.querySelector(".fs-clock-t");
  function paint() {
    const cur = dayState(w, d, false);
    if (!cur || !cur.clockStart) {
      txt.textContent = "Start"; btn.classList.remove("running", "fs-stopped");
      btn.setAttribute("aria-label", "Start the session clock"); stat.textContent = ""; return;
    }
    const elapsed = Math.round(((cur.clockStop || Date.now()) - cur.clockStart) / 1000);
    txt.textContent = fmtClock(elapsed);
    btn.classList.toggle("running", !cur.clockStop);
    btn.classList.toggle("fs-stopped", !!cur.clockStop);
    btn.setAttribute("aria-label", cur.clockStop ? `Session clock stopped at ${fmtClock(elapsed)}. Tap to reset.` : `Session clock ${fmtClock(elapsed)}. Tap to stop.`);
    const rows = mainRows(w, d);
    const ps = cur.per[L()];
    const next = rows.find(x => !ps.completed[x.key]);
    let msg = cur.clockStop ? "clock stopped" : `target ${fmtMins(plan.total)}`;
    if (next && rows.indexOf(next) > 0) {
      const planned = plan.offsets[next.key] != null ? plan.offsets[next.key] : plan.total;
      const delta = Math.round((planned - elapsed) / 60);
      msg = (delta >= 1 ? `${delta} min ahead` : delta <= -1 ? `${-delta} min behind` : "on pace") + (cur.clockStop ? " · clock stopped" : ` · target ${fmtMins(plan.total)}`);
    } else if (!next && rows.length) msg = `done in ${fmtClock(elapsed)}`;
    stat.textContent = msg;
  }
  function syncInterval() {
    if (sessionClocks[key]) { clearInterval(sessionClocks[key]); delete sessionClocks[key]; }
    const cur = dayState(w, d, false);
    if (cur && cur.clockStart && !cur.clockStop) sessionClocks[key] = setInterval(paint, 1000);
  }
  btn.onclick = () => {
    const cur = dayState(w, d, true);
    if (!cur.clockStart) { cur.clockStart = Date.now(); cur.clockStop = null; stampDate(cur); }
    else if (!cur.clockStop) { cur.clockStop = Date.now(); }
    else { cur.clockStart = null; cur.clockStop = null; }
    saveState(); syncInterval(); paint();
  };
  syncInterval();
  paint();
}
function fmtClock(s) { const m = Math.floor(s / 60), sec = s % 60; return `${m}:${String(sec).padStart(2, "0")}`; }

/* ===========================================================================
   TIMERS: countdown, interval, stopwatch. One engine, one map.
   =========================================================================== */
const activeTimers = {};
let audioCtx = null;
function ensureAudio() {
  if (audioCtx) return audioCtx;
  try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); } catch (e) {}
  return audioCtx;
}
function tone(offsets, freqs) {
  const ctx = ensureAudio();
  if (ctx) {
    const now = ctx.currentTime;
    offsets.forEach((off, i) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = "sine"; osc.frequency.value = freqs[i] || 880;
      gain.gain.setValueAtTime(0, now + off);
      gain.gain.linearRampToValueAtTime(0.25, now + off + 0.01);
      gain.gain.linearRampToValueAtTime(0, now + off + 0.14);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + off); osc.stop(now + off + 0.16);
    });
  }
  if (navigator.vibrate) { try { navigator.vibrate(120); } catch (e) {} }
}
function beepDone() { tone([0, 0.18, 0.36], [880, 880, 1100]); if (navigator.vibrate) { try { navigator.vibrate([120, 80, 120, 80, 200]); } catch (e) {} } }
function beepPhase() { tone([0], [990]); }
function paintRunning(btn, text) { if (!btn) return; btn.classList.add("running"); btn.classList.remove("done", "paused"); btn.textContent = text; }
function paintPaused(btn, text) { if (!btn) return; btn.classList.remove("running", "done"); btn.classList.add("paused"); btn.textContent = text; }
function paintDone(btn) {
  if (!btn || !btn.isConnected) return;
  btn.classList.remove("running", "paused"); btn.classList.add("done");
  btn.textContent = "Done!";
  setTimeout(() => { if (btn && btn.isConnected) { btn.classList.remove("done"); btn.textContent = btn.dataset.default || "⏱"; } }, 1800);
}
function paintReset(btn) {
  if (!btn || !btn.isConnected) return;
  btn.classList.remove("running", "done", "paused");
  btn.textContent = btn.dataset.default || "⏱";
}
function startCountdown(key, btn, secs) {
  ensureAudio(); if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  const endsAt = Date.now() + secs * 1000;
  paintRunning(btn, fmtClock(secs));
  const iv = setInterval(() => {
    const t = activeTimers[key]; if (!t) return;
    const remaining = Math.round((t.endsAt - Date.now()) / 1000);
    if (remaining <= 0) { clearInterval(t.iv); const b = t.btn; delete activeTimers[key]; paintDone(b); beepDone(); }
    else paintRunning(t.btn, fmtClock(remaining));
  }, 250);
  activeTimers[key] = { mode: "down", endsAt, iv, btn };
}
function startSpecialTimer(key, btn, spec) {
  ensureAudio(); if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  if (spec.kind === "down") return startCountdown(key, btn, spec.secs);
  if (spec.kind === "interval") {
    const sched = [];
    for (let r = 0; r < spec.rounds; r++) spec.segs.forEach(([label, secs]) => sched.push({ label, secs, round: r + 1 }));
    const t = { mode: "interval", btn, sched, si: 0, phaseEnds: Date.now() + sched[0].secs * 1000, rounds: spec.rounds };
    paintRunning(btn, phaseText(t, sched[0].secs));
    t.iv = setInterval(() => {
      const cur = activeTimers[key]; if (!cur) return;
      let remaining = Math.round((cur.phaseEnds - Date.now()) / 1000);
      if (remaining <= 0) {
        cur.si++;
        if (cur.si >= cur.sched.length) { clearInterval(cur.iv); const b = cur.btn; delete activeTimers[key]; paintDone(b); beepDone(); return; }
        beepPhase();
        cur.phaseEnds = Date.now() + cur.sched[cur.si].secs * 1000;
        remaining = cur.sched[cur.si].secs;
      }
      paintRunning(cur.btn, phaseText(cur, remaining));
    }, 250);
    activeTimers[key] = t;
    return;
  }
  if (spec.kind === "watch") {
    const t = { mode: "watch", btn, startedAt: Date.now(), stopped: null };
    paintRunning(btn, "0:00");
    t.iv = setInterval(() => {
      const cur = activeTimers[key]; if (!cur || cur.stopped != null) return;
      paintRunning(cur.btn, fmtClock(Math.round((Date.now() - cur.startedAt) / 1000)));
    }, 250);
    activeTimers[key] = t;
  }
}
function phaseText(t, remaining) { const seg = t.sched[t.si]; return `${seg.label.slice(0, 4)} ${fmtClock(remaining)} · ${seg.round}/${t.rounds}`; }
function tapActiveTimer(key) {
  const t = activeTimers[key];
  if (!t) return;
  if (t.mode === "watch") {
    if (t.stopped == null) { t.stopped = Date.now(); paintPaused(t.btn, "■ " + fmtClock(Math.round((t.stopped - t.startedAt) / 1000))); }
    else { clearInterval(t.iv); delete activeTimers[key]; paintReset(t.btn); }
    return;
  }
  clearInterval(t.iv);
  const btn = t.btn;
  delete activeTimers[key];
  paintReset(btn);
}
function reattachTimer(key, btn) {
  const t = activeTimers[key];
  if (!btn || !t) return;
  t.btn = btn;
  if (t.mode === "down") { const remaining = Math.round((t.endsAt - Date.now()) / 1000); if (remaining > 0) paintRunning(btn, fmtClock(remaining)); }
  else if (t.mode === "interval") paintRunning(btn, phaseText(t, Math.max(0, Math.round((t.phaseEnds - Date.now()) / 1000))));
  else if (t.mode === "watch") {
    if (t.stopped == null) paintRunning(btn, fmtClock(Math.round((Date.now() - t.startedAt) / 1000)));
    else paintPaused(btn, "■ " + fmtClock(Math.round((t.stopped - t.startedAt) / 1000)));
  }
}

/* ===========================================================================
   WIRING
   =========================================================================== */
document.getElementById("reset-btn").onclick = () => {
  if (confirm("Reset ALL tracking for both lifters? Every check, log, track, benchmark and record will be cleared.")) {
    state = emptyState(); saveState(); uiWeek = 0; render();
  }
};

/* Deep link "#s=w3-mon" (shell.js catalog contract): open that week and day instead of the default. The hash is left alone. */
const DEEP = (function () {
  let h = ""; try { h = decodeURIComponent(location.hash || ""); } catch (e) {}
  const m = h.match(/^#s=w(\d+)-(mon|wed)$/i);
  if (!m) return null;
  const w = parseInt(m[1], 10), d = m[2].toLowerCase();
  return w < NWEEKS && hasDay(w, d) ? { w, d } : null;
})();

buildShell();
uiWeek = DEEP ? DEEP.w : currentWeek();
render();
SL.sync.wireNotes();
(function openDueTab() {
  const tab = document.querySelector(`.tab[data-pane="${DEEP ? DEEP.d : dueDay(uiWeek)}"]`);
  if (tab) tab.click();
})();
publishSummary();
</script>
