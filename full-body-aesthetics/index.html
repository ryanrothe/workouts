<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="FBA" />
<meta name="theme-color" content="#7c3aed" />
<link rel="manifest" href="../manifest.webmanifest" />
<link rel="apple-touch-icon" href="../icon-180.png" />
<link rel="icon" type="image/png" href="../favicon.png" />
<title>Full Body Aesthetics — Chalk</title>
<link rel="stylesheet" href="../shared/styles.css" />
<style>
  /* FBA-specific styles. Shared design tokens, the appbar, cards, tabs, the SetLog grid and the
     in-session .hs-* contract come from ../shared/styles.css. */
  .hero { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .hero-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .coach-badge { display: inline-block; background: var(--primary-soft); color: var(--primary); border: 1px solid var(--primary-line); border-radius: 999px; padding: 3px 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
  .hero-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .stat { background: var(--card-2); border: 1px solid var(--border-soft); border-radius: var(--radius-sm); padding: 8px 6px; text-align: center; }
  .stat-num { font-size: 17px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
  .stat-label { font-size: 9.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
  .reset-link { background: none; border: none; color: var(--muted); font-size: 11px; cursor: pointer; padding: 4px 8px; text-decoration: underline; font-family: inherit; }

  .cycle-bar, .week-bar { display: flex; gap: 5px; overflow-x: auto; margin-bottom: 10px; padding: 4px 2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .cycle-bar::-webkit-scrollbar, .week-bar::-webkit-scrollbar { display: none; }
  .week-pill { flex-shrink: 0; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 0; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; min-width: 46px; text-align: center; font-family: inherit; font-variant-numeric: tabular-nums; }
  .week-pill.active { background: var(--primary); border-color: var(--primary); color: white; }
  .week-pill.done { border-color: var(--success); background: var(--success-soft); color: var(--success); }
  .week-pill.done.active { background: var(--success); color: white; }
  .week-pill.empty { opacity: 0.55; border-style: dashed; }
  .cycle-bar .week-pill { min-width: 0; padding: 7px 12px; }

  .rules { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 10px; font-size: 12.5px; color: var(--text-body); line-height: 1.55; }
  .rules b { color: var(--text); }
  .rules .rules-k { font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--primary); margin-right: 6px; }
  .rules-row { display: flex; flex-wrap: wrap; gap: 4px 14px; }

  .tab .due-dot[hidden] { display: none; }
  .tab .due-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); margin-left: 5px; vertical-align: 1px; }
  .tab.active .due-dot { background: white; }
  .tab .tab-sub { display: block; font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: 0; text-transform: none; line-height: 1; margin-top: 2px; }

  /* Warm-up checklist (collapsed by default) */
  .prep { margin: 8px 0; border: 1px solid var(--border-soft); border-radius: var(--radius-sm); background: var(--card-2); overflow: hidden; }
  .prep-head { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; cursor: pointer; user-select: none; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); min-height: 40px; }
  .prep-head .caret { font-size: 10px; }
  .prep.collapsed .prep-body { display: none; }
  .prep.collapsed .caret { transform: rotate(-90deg); }
  .prep-body { padding: 2px 12px 10px; }
  .prep-item { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; font-size: 12.5px; color: var(--text-body); cursor: pointer; }
  .prep-check { width: 20px; height: 20px; flex-shrink: 0; margin-top: 0; border: 2px solid #c8cdd6; border-radius: 6px; background: white; display: flex; align-items: center; justify-content: center; }
  .prep-check svg { width: 11px; height: 11px; opacity: 0; }
  .prep-item.done .prep-check { background: var(--success); border-color: var(--success); }
  .prep-item.done .prep-check svg { opacity: 1; }
  .prep-item.done { color: var(--muted); text-decoration: line-through; }

  .block-note { font-size: 12px; color: var(--muted); line-height: 1.55; margin: 4px 0 2px; }
  .ex-instruction { margin: 6px 0 0; font-size: 13px; color: var(--text-body); line-height: 1.5; white-space: pre-line; }
  .ex-alt { margin-top: 5px; font-size: 12px; color: var(--muted); }
  .prep-text { white-space: pre-line; font-size: 12.5px; color: var(--text-body); line-height: 1.55; padding: 2px 0 6px; }
  .cond-text { white-space: pre-line; font-size: 13.5px; color: var(--text-body); line-height: 1.55; margin: 8px 0 0; }
  .rest-card p { white-space: pre-line; }
  .cycle-bar .week-pill { text-transform: none; letter-spacing: 0; }
  .cycle-bar .week-pill small { display: block; font-size: 10px; font-weight: 600; opacity: 0.8; }
  .ex-unsure { margin-top: 5px; font-size: 11.5px; color: var(--muted); font-style: italic; }
  .ex-side { color: var(--muted); font-weight: 500; }

  /* Score box: the per-slot result (rep-max load, last minute, meters) */
  .score-box { margin: 10px 0 4px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--card-2); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  .score-box label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--text); }
  .score-box input[type=number] { width: 88px; min-height: 40px; border: 1px solid var(--border); border-radius: 8px; padding: 0 8px; font: inherit; font-size: 15px; font-variant-numeric: tabular-nums; background: white; color: var(--text); }
  .score-box input[type=text] { flex: 1 1 160px; min-height: 40px; border: 1px solid var(--border); border-radius: 8px; padding: 0 8px; font: inherit; font-size: 13px; background: white; color: var(--text); }
  .score-box input:focus { outline: none; border-color: var(--primary); }
  .score-box .unit { font-size: 12px; color: var(--muted); font-weight: 600; }
  .score-hist { width: 100%; font-size: 12px; color: var(--muted); }
  .score-hist b { color: var(--text-body); font-weight: 700; }

  /* Timer buttons (rest countdown, Death By clock) */
  .btn-timer { font-variant-numeric: tabular-nums; min-width: 78px; justify-content: center; }
  .btn-timer.running { background: var(--primary); color: white; border-color: var(--primary); }
  .btn-timer.paused { background: var(--warning-soft); color: var(--warning); border-color: #edd9a6; }
  .btn-timer.done { background: var(--success); color: white; border-color: var(--success); animation: timer-flash 0.6s ease-out; }
  @keyframes timer-flash { 0% { transform: scale(1); } 30% { transform: scale(1.08); } 100% { transform: scale(1); } }
  .btn-timer-x { color: var(--danger); min-width: 0; }

  /* Conditioning clock */
  .cond-card { background: var(--card); border: 2px solid var(--primary); border-radius: 20px; padding: 14px; margin-bottom: 10px; }
  .cond-card.finished { border-color: var(--success); }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
  .seg button { min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card-2); font: inherit; font-size: 13px; font-weight: 600; color: var(--text-body); cursor: pointer; }
  .seg button.on { background: var(--primary); border-color: var(--primary); color: white; }
  .clock-wrap { text-align: center; padding: 12px 0 4px; }
  .clock-big { font-family: var(--disp); font-stretch: 80%; font-weight: 800; font-size: 64px; line-height: 1; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
  .clock-big.running { color: var(--primary); }
  .clock-big.zero { color: var(--success); }
  .clock-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .clock-bar { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; margin: 12px 0; }
  .clock-bar > i { display: block; height: 100%; background: var(--primary); border-radius: 3px; width: 0; }
  .clock-ctl { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .clock-ctl .btn-primary { background: var(--primary); color: white; border-color: var(--primary); min-width: 120px; }
  .cond-instruction { font-size: 13.5px; color: var(--text-body); line-height: 1.55; margin: 6px 0 0; }
  .cond-hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .rest-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .rest-card p { font-size: 14px; line-height: 1.6; color: var(--text-body); margin: 8px 0 0; }
  .empty-card { background: var(--card); border: 1px dashed var(--border); border-radius: var(--radius); padding: 18px; text-align: center; color: var(--muted); font-size: 13.5px; }

  /* In-session day pane: fill the gaps the shared .hs-* contract leaves. */
  .hs-sess-title.long { font-size: 27px; }
  .hs-sess-clock .hs-clock-t { font-variant-numeric: tabular-nums; }
  .hs-sess-clock:not(.running):not(.stopped) .hs-clock-t { color: var(--primary); font-size: 18px; }
  .hs-sess-clock.stopped .hs-clock-t { color: var(--muted); }
  .hs-sess-progress { flex-wrap: wrap; row-gap: 6px; }
  .hs-sess-progress .hs-bar { flex: 1 1 90px; }
  .hs-sess-progress span { white-space: normal; }
  .hs-sess-ctl { display: flex; align-items: center; gap: 6px; margin: 0 2px 10px; }
  .hs-sess-pace { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); }
  .hs-mini { min-height: 32px; padding: 0 10px; font-size: 12px; }
  .hs-row-sum .hs-sum-r { max-width: 50%; overflow: hidden; text-overflow: ellipsis; }
  .hs-row-sum .row-timer { min-height: 34px; padding: 0 10px; }
  .hs-row-sum .hs-sum-t small .ex-tag { margin-right: 6px; }
  .hs-row.hs-now .ex-prescription { margin-top: 2px; font-size: 13px; color: var(--muted); }
  .hs-row.hs-now .ex-log { margin-top: 12px; }
  .hs-tools .btn { padding: 0 8px; gap: 5px; }
  .hs-tools .btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .hs-tools .btn-timer-x { color: var(--danger); }
  .hs-tools .hs-done-btn { margin-left: auto; color: var(--primary); font-weight: 800; }
  .hs-tools .hs-done-btn.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn-danger { color: var(--danger); border-color: #f3c8c4; }

  .notes-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: var(--text); color: white; padding: 10px 16px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* iPad board: shared/cockpit.js + the .ck-* block in ../shared/styles.css. FBA-only touches below. */
  .ck-rail-clock:not(.running):not(.stopped) .hs-clock-t { color: #d9c7fb; }
  .ck-rail .cond-card { margin: 0; flex: none; }
  .ck-rail .clock-big { font-size: 52px; }

  @media (max-width: 420px) {
    .hero-stats { gap: 6px; }
    .stat { padding: 6px 4px; }
    .stat-num { font-size: 15px; }
    .stat-label { font-size: 8.5px; }
    .clock-big { font-size: 56px; }
  }
</style>
</head>
<body data-program="full-body-aesthetics">

<header class="appbar">
  <div class="appbar-inner">
    <a class="appbar-back" href="../" aria-label="Back to Exercise Library">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="10 3 5 8 10 13"/></svg>
      Library
    </a>
    <div class="appbar-title">
      <div class="eyebrow">Program</div>
      <div class="name" id="appbar-name">Full Body Aesthetics</div>
    </div>
  </div>
  <div class="appbar-accent"></div>
</header>

<div class="container">

  <!-- HERO -->
  <div class="hero">
    <div class="hero-top">
      <div>
        <span class="coach-badge" id="hero-badge">Chalk · Ryan Fischer</span>
        <h1 style="margin-top:6px" id="hero-title">Full Body Aesthetics</h1>
        <div class="hero-sub" id="hero-sub">Loading the current cycle…</div>
      </div>
      <button class="reset-link" id="reset-btn" title="Reset all tracking">Reset</button>
    </div>
    <div class="hero-stats">
      <div class="stat"><div class="stat-num" id="stat-week">W1</div><div class="stat-label">Week</div></div>
      <div class="stat"><div class="stat-num" id="stat-days">0</div><div class="stat-label">Lifts Done</div></div>
      <div class="stat"><div class="stat-num" id="stat-thisweek">0 / 0</div><div class="stat-label">This Week</div></div>
      <div class="stat"><div class="stat-num" id="stat-overall">0%</div><div class="stat-label">Cycle</div></div>
    </div>
  </div>

  <!-- CYCLE + WEEK PILLS -->
  <div class="cycle-bar" id="cycle-bar" hidden></div>

  <!-- BLOCK RULES FOR THE WEEK -->

  <!-- TABS: day tabs are injected before the Notes tab -->
  <div class="tabs" id="tabs">
    <button class="tab" data-pane="notes">Notes</button>
  </div>

  <!-- PANES: day panes are injected before the Notes pane -->
  <div id="panes">
    <div class="pane" id="pane-notes">
      <div class="card" id="notes-card"></div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="../shared/setlog.js"></script>
<script src="../shared/cockpit.js"></script>
<script src="../shared/shell.js"></script>
<script>
"use strict";
const SL = window.SetLog;
const CK = window.Cockpit;
const { normName, fmtWeight, fmtLoad } = SL;

/* ===========================================================================
   FULL BODY AESTHETICS (Chalk Performance Training, coach Ryan Fischer).
   Data-driven from ./data.json (schema 2): cycle → week → day. Day types:
     strength      one SetLog set grid per exercise (reps + lb per set, inferred
                   hits, the progression coach), slots main / body part / closer
                   with a per-slot score (rep-max load, Death By minute, free)
     conditioning  a modality chooser, warm-up, a countdown of work.durationSec
                   and a distance score in meters
     rest          the coach's note
   `lastLoadLb` on an exercise is the load Chalk showed beside it (Ryan's last
   logged load there). It seeds SetLog's history so the coach can suggest from
   day one. It is never shown as a prescription.
   Storage key fba_v2; sync slug full-body-aesthetics (shared/setlog.js).
   Design brief: KARL_DATA/outputs/personal/workout-trackers/full-body-aesthetics/DESIGN-BRIEF-2026-10-24.md
   =========================================================================== */
const PROGRAM = {
  slug: "full-body-aesthetics",
  storageKey: "fba_v2",
  appbarName: "Full Body Aesthetics",
  shortName: "FBA"
};
const STORAGE_KEY = PROGRAM.storageKey;
const VIDEO_BASE = "https://www.youtube.com/results?search_query=";
const v = q => VIDEO_BASE + encodeURIComponent(q + " exercise form");

const DOW_FULL = { Sun: "Sunday", Mon: "Monday", Tue: "Tuesday", Wed: "Wednesday", Thu: "Thursday", Fri: "Friday", Sat: "Saturday" };
const SLOT = { main: "Main lift", chest: "Chest", back: "Back", legs: "Legs", shoulders: "Shoulders", biceps: "Biceps", triceps: "Triceps", abs: "Abs", closer: "Closer" };
/* Score types the ingest writes. fromGrid: the day's heaviest logged set is the score unless typed.
   kind "text" takes a free string (a time like 4:32). prefix shapes the Last line and the done summary. */
const SCORE = {
  "repmax-load":    { label: "Rep max today", unit: "lb", kind: "number", fromGrid: true },
  "load":           { label: "Top load today", unit: "lb", kind: "number", fromGrid: true, prefix: "top " },
  "deathby-minute": { label: "Minutes completed", unit: "min", kind: "number", prefix: "minute " },
  "ladder-reps":    { label: "Total reps", unit: "reps", kind: "number", gridOnly: true },
  "for-time":       { label: "Time", unit: "", kind: "text", placeholder: "m:ss" },
  "amrap-reps":     { label: "Total reps", unit: "reps", kind: "number", gridOnly: true },
  "closer-unknown": { label: "Score", unit: "", kind: "number" },
  "distance":       { label: "Distance", unit: "m", kind: "number" },
  "calories":       { label: "Calories", unit: "cal", kind: "number" },
  "time":           { label: "Time", unit: "", kind: "text", placeholder: "m:ss" },
  "unknown":        { label: "Score", unit: "", kind: "number" }
};
const scoreDef = t => SCORE[t] || { label: "Score", unit: "", kind: "number" };
const isGridScore = ex => !!ex.score && !!scoreDef(ex.score.type).fromGrid;
/* Every row logs on the SetLog grid. A closer's total reps and load ARE its grid row (1 × max); the score
   box adds only what the grid cannot hold: the Death By minute, the for-time clock, an unknown format. */
const hasScoreBox = ex => !!ex.score && !scoreDef(ex.score.type).gridOnly;
/* "-1" and "max reps" both mean max; everything else is passed to SetLog.parseReps as written ("5-6", "12"). */
function repsStr(ex) { const r = String(ex.reps == null ? "" : ex.reps).trim(); return r === "-1" || /^max/i.test(r) ? "max" : r; }
/* The coach's text, without the "Intensity: 9/10" line the ingest already lifted into ex.intensity. */
function instructionText(ex) {
  let t = String(ex.instruction || "");
  if (ex.intensity) t = t.replace(/\n?\s*Intensity:\s*\d+\s*\/\s*10\.?\s*/gi, "\n");
  return t.replace(/\n{3,}/g, "\n\n").trim();
}
function monthLabel(iso) { return new Date(iso + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" }); }

/* Loaded / bodyweight / lower-body rules for the spec SetLog reads. */
const BW_LOADED_RE = /chin.?ups?|pull.?ups?|\bdips?\b/i;                             // bodyweight, added weight tracked
const BW_RE = /push.?ups?|hanging|leg raises?|knee raises?|plank|hollow|sit.?ups?|v.?ups?|burpee|dead hang|toes? to bar/i;
const LOWER_RE = /squat|deadlift|hip thrust|leg press|lunge|\brdl\b|romanian|good morning|hack|step.?up|calf raise|leg extension|leg curl|nordic/i;

/* ---------------------------------------------------------------------------
   DATA + STATE
   --------------------------------------------------------------------------- */
let DATA = null;          // data.json
let CYC = null;           // the cycle on screen
let ALL = [];             // every day of every cycle, ascending by date, each with .cycle
let state = loadState();
let uiCycle = 0;
let uiWeek = 1;

function emptyState() { return { v: 2, days: {} }; }
function normState(p) {
  const s = emptyState();
  if (p && typeof p === "object" && p.days && typeof p.days === "object") s.days = p.days;
  return s;
}
function loadState() {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return normState(JSON.parse(raw)); } catch (e) {}
  return emptyState();
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  updateStats();
  SL.sync.schedule();
  publishSummary();
}
/* One record per calendar day of the program, keyed by the day's date in data.json. */
function dayState(date, create) {
  if (!state.days[date] && create) {
    state.days[date] = { trained: null, clockStart: null, clockStop: null, completed: {}, logs: {}, scores: {}, wu: {}, cond: {} };
  }
  const ds = state.days[date] || null;
  if (ds) { ds.completed = ds.completed || {}; ds.logs = ds.logs || {}; ds.scores = ds.scores || {}; ds.wu = ds.wu || {}; ds.cond = ds.cond || {}; }
  return ds;
}
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function shortDate(iso) { if (!iso) return "—"; const [, m, d] = iso.split("-"); return `${parseInt(m, 10)}/${parseInt(d, 10)}`; }
function stampDate(ds) { if (!ds.trained) ds.trained = todayISO(); }
function escapeHtml(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function fmtClock(s) { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60), sec = s % 60; return `${m}:${String(sec).padStart(2, "0")}`; }
function fmtMins(secs) { return `~${Math.round(secs / 60)} min`; }
function fmtNum(n) { return n == null || n === "" ? "" : Number(n).toLocaleString("en-US"); }

/* ---------------------------------------------------------------------------
   PROGRAM SHAPE HELPERS
   --------------------------------------------------------------------------- */
/* A day's week: the ingest writes it; a rest day before the first lift derives it from the cycle start. */
function dayWeek(day) {
  if (day.week) return day.week;
  const c = day.cycle || CYC;
  const diff = Math.floor((Date.parse(day.date + "T12:00:00") - Date.parse(c.startDate + "T12:00:00")) / 864e5);
  return Math.max(1, Math.floor(diff / 7) + 1);
}
function weekDays(w, cyc) { return (cyc || CYC).days.filter(d => dayWeek(d) === w); }
function dayById(id) { return ALL.find(d => d.date === id) || null; }
function whereOf(day) { return `W${dayWeek(day)} ${day.dow}`; }
function isRequired(day) { return day.type !== "rest" && !day.optional; }
function rulesFor(cyc, w) {
  const st = cyc.structure || {};
  const rm = Array.isArray(st.mainLiftRepMaxByWeek) ? st.mainLiftRepMaxByWeek[w - 1] : null;
  const acc = Array.isArray(st.accessoryRepsByWeek) ? st.accessoryRepsByWeek[w - 1] : null;
  return { rm: rm || null, acc: acc || null, closer: st.closer || null };
}

/* The spec SetLog reads for a strength row. */
function specOf(ex) {
  const p = SL.parseReps(repsStr(ex));
  const hasFields = Array.isArray(ex.fields) && ex.fields.length > 0;
  const bwMove = BW_LOADED_RE.test(ex.name) || BW_RE.test(ex.name);
  const addWeight = /add (some )?weight|weighted|add load/i.test(ex.instruction || "");
  let loaded = hasFields ? ex.fields.includes("weight") : !BW_RE.test(ex.name);
  if (!loaded && bwMove && addWeight) loaded = true;          // "over 10 reps add weight": give the row an added-lb column
  const bw = !loaded || (loaded && bwMove);                      // the weight, if any, is ADDED to bodyweight
  const sets = ex.sets || 3;
  const rest = ex.restSec != null && ex.restSec > 0 ? ex.restSec : null;   // 0 or null = no rest bar
  return { name: ex.name, sets, minSets: sets, repTop: p.repTop, repRange: p.repRange, isMax: p.isMax, unit: p.unit,
           loaded, bw: loaded && bw, lower: ex.slot === "legs" || LOWER_RE.test(ex.name), rest };
}
/* Closers log a score, not a set grid: a Death By is a last minute, an unknown closer a free number. */
function rxText(ex, spec) {
  const reps = spec.isMax ? "max" : repsStr(ex);
  const side = ex.perSide ? ` <span class="ex-side">(per side)</span>` : "";
  const restTxt = spec.rest ? ` · rest ${fmtClock(spec.rest)}` : "";
  const inten = ex.intensity ? ` · intensity ${escapeHtml(ex.intensity)}` : "";
  return `${spec.sets} × ${reps}${side}${restTxt}${inten}`;
}
function shortRx(ex, spec) { return `${spec.sets} × ${spec.isMax ? "max" : repsStr(ex)}${ex.perSide ? " (per side)" : ""}`; }

/* Planning model for the session clock and the catalog: seconds per row. */
function rowSecs(ex, spec) {
  if (ex.closer) return 8 * 60;
  const per = spec.unit === "s" ? (spec.repTop || 30) : (spec.repTop || 12) * 3;
  const ramp = ex.slot === "main" ? 150 : 0;
  return ramp + spec.sets * per + (spec.sets - 1) * (spec.rest || 60) + 45;
}
function daySecs(day) {
  if (day.type === "strength") return 6 * 60 + day.exercises.reduce((a, ex) => a + rowSecs(ex, specOf(ex)), 0);
  if (day.type === "conditioning") return day.work && day.work.durationSec ? 6 * 60 + day.work.durationSec : null;
  return null;
}
function dayMinutes(day) { const s = daySecs(day); return s == null ? null : Math.round(s / 60); }

/* ---------------------------------------------------------------------------
   COMPLETION
   --------------------------------------------------------------------------- */
function isDayComplete(day) {
  const ds = dayState(day.date, false);
  if (!ds || day.type === "rest") return false;
  if (day.type === "conditioning") return !!ds.completed.cond;
  return day.exercises.length > 0 && day.exercises.every((_, i) => ds.completed["m" + i]);
}
function isWeekComplete(w, cyc) {
  const req = weekDays(w, cyc).filter(isRequired);
  return req.length > 0 && req.every(isDayComplete);
}
function dayHasActivity(day) {
  const ds = dayState(day.date, false);
  if (!ds) return false;
  if (ds.clockStart || ds.trained) return true;
  if (Object.keys(ds.completed).some(k => ds.completed[k])) return true;
  if (Object.keys(ds.scores).some(i => ds.scores[i] && (ds.scores[i].val != null && ds.scores[i].val !== ""))) return true;
  if (ds.cond && (ds.cond.score != null && ds.cond.score !== "")) return true;
  return Object.keys(ds.logs).some(i => SL.hasData(SL.normLog(ds.logs[i], 0)));
}
/* Next = the first required day not yet complete, in program order (phased programs move by completion). */
function currentCycleIndex() {
  const td = todayISO();
  let idx = DATA.cycles.findIndex(c => c.days.some(d => d.date === td));
  if (idx < 0) for (let i = DATA.cycles.length - 1; i >= 0; i--) if (DATA.cycles[i].startDate <= td) { idx = i; break; }
  return idx < 0 ? 0 : idx;
}
/* Next = the first required day from today on, in the current cycle, not yet complete; then the following
   cycle's first open day. Earlier cycles were logged in Chalk, not here, so they never count as "next". */
function nextDay() {
  const td = todayISO();
  const ci = currentCycleIndex();
  for (let i = ci; i < DATA.cycles.length; i++) {
    const d = DATA.cycles[i].days.find(x => isRequired(x) && !isDayComplete(x) && (i > ci || x.date >= td));
    if (d) return d;
  }
  return null;
}
/* The week the hero and the summary call "this week": today's week in the current cycle, else the next day's. */
function currentWeekRef() {
  const td = todayISO();
  const cyc = DATA.cycles[currentCycleIndex()];
  const today = cyc.days.find(d => d.date === td);
  if (today) return { cyc, w: dayWeek(today) };
  const nx = nextDay();
  if (nx) return { cyc: nx.cycle, w: dayWeek(nx) };
  return { cyc, w: cyc.weeks };
}
function dueDayInWeek(w) {
  const days = weekDays(w);
  const nx = nextDay();
  if (nx && days.includes(nx)) return nx;
  return days.find(d => isRequired(d) && !isDayComplete(d)) || days.find(d => d.type !== "rest" && !isDayComplete(d)) || days[0] || null;
}

/* ---------------------------------------------------------------------------
   HISTORY + PROGRESSION COACH
   Exercises recur by name across days and cycles. Real logs come first,
   newest first; the Chalk-shown load (lastLoadLb) is the oldest entry, so it
   only speaks when nothing has been logged here yet.
   --------------------------------------------------------------------------- */
function priorEntries(name, beforeDate, ex) {
  const key = normName(name);
  const out = [];
  ALL.forEach(day => {
    if (day.type !== "strength" || day.date >= beforeDate) return;
    const ds = dayState(day.date, false);
    if (!ds) return;
    day.exercises.forEach((x, i) => {
      if (normName(x.name) !== key) return;
      const spec = specOf(x);
      const log = SL.normLog(ds.logs[i], spec.sets);
      if (!SL.hasSets(log)) return;
      out.push(SL.entry(log, spec, { date: ds.trained || day.date, where: whereOf(day), day }));
    });
  });
  out.reverse();
  if (ex && ex.lastLoadLb != null) {
    const spec = specOf(ex);
    out.push({ sets: [{ r: null, w: ex.lastLoadLb }], weight: ex.lastLoadLb, hit: null, unit: spec.unit, target: null, seed: true, where: "from Chalk" });
  }
  return out;
}
function suggestNext(ex, day, spec) {
  return SL.suggest(priorEntries(ex.name, day.date, ex), spec || specOf(ex));
}
/* Prior scores for a slot (rep-max loads, Death By minutes), newest first. */
function priorScores(name, beforeDate) {
  const key = normName(name);
  const out = [];
  ALL.forEach(day => {
    if (day.type !== "strength" || day.date >= beforeDate) return;
    const ds = dayState(day.date, false);
    if (!ds) return;
    day.exercises.forEach((x, i) => {
      if (normName(x.name) !== key || !x.score) return;
      const sc = scoreOf(ds, i, x);
      if (sc.val == null || sc.val === "") return;
      out.push({ date: ds.trained || day.date, where: whereOf(day), type: x.score.type, val: sc.val, note: sc.note || "", rm: repsStr(x) });
    });
  });
  return out.reverse();
}
/* Every rep-max score logged for a main lift so far: "10RM 185 · 8RM 205". */
function repMaxLine(name, beforeDate) {
  const xs = priorScores(name, beforeDate).filter(s => scoreDef(s.type).fromGrid).reverse();
  if (!xs.length) return "";
  return xs.map(s => `${s.type === "repmax-load" ? s.rm + "RM" : "top"} <b>${fmtWeight(s.val)} lb</b> <span style="opacity:.7">(${s.where})</span>`).join(" · ");
}
function priorCond(title, beforeDate) {
  const key = normName(title);
  const out = [];
  ALL.forEach(day => {
    if (day.type !== "conditioning" || day.date >= beforeDate || normName(day.title) !== key) return;
    const ds = dayState(day.date, false);
    if (!ds || ds.cond.score == null || ds.cond.score === "") return;
    out.push({ date: ds.trained || day.date, where: whereOf(day), val: ds.cond.score, modality: ds.cond.modality || "", note: ds.cond.note || "" });
  });
  return out.reverse();
}
/* The score of a row: typed, else (rep-max) the heaviest weight in the grid. */
function scoreOf(ds, idx, ex) {
  const raw = (ds && ds.scores && ds.scores[idx]) || {};
  const typed = raw.val != null && raw.val !== "";
  const out = { val: typed ? raw.val : null, note: raw.note || "", typed, reps: null };
  if (out.val == null && isGridScore(ex) && ds) {
    const spec = specOf(ex);
    const log = SL.normLog(ds.logs[idx], 0);
    // The rep max of the day: the heaviest set that reached the target reps (any set when no target).
    const ok = log.sets.filter(x => x.w != null && (spec.repTop == null || (x.r != null && x.r >= spec.repTop)));
    if (ok.length) { const best = ok.reduce((a, b) => (b.w > a.w ? b : a)); out.val = best.w; out.reps = best.r; }
  }
  return out;
}
function scoreText(ex, sc) {
  if (!ex.score || sc.val == null || sc.val === "") return "";
  const d = scoreDef(ex.score.type);
  if (d.fromGrid) return ex.score.type === "repmax-load" ? `${repsStr(ex)}RM ${fmtWeight(sc.val)} lb` : `top ${fmtWeight(sc.val)} lb`;
  const unit = d.unit && d.unit !== "lb" ? ` ${d.unit}` : "";
  return `${d.prefix || ""}${escapeHtml(sc.val)}${unit}`;
}
/* Week-over-week on a countdown cycle: this week's target beside last time's top set at its own target. */
function weekOverHtml(L, spec, day) {
  if (!L || spec.repTop == null) return "";
  if (L.seed) return `<div class="ex-last">This week: <strong>${spec.sets} × ${spec.repTop}</strong> · Chalk showed ${fmtLoad(L.weight, spec.bw)} the last time you logged it there</div>`;
  if (L.target == null || L.target === spec.repTop) return "";
  const top = L.weight != null ? ` @ ${fmtLoad(L.weight, spec.bw)}` : "";
  return `<div class="ex-last">This week: <strong>${spec.sets} × ${spec.repTop}</strong> · last time <strong>${L.target} reps${top}</strong> (${L.where})</div>`;
}

/* ---------------------------------------------------------------------------
   SYNC. Transport and the device token live in ../shared/setlog.js. The flat
   `entries` list is what Karl reads: one row per logged exercise or score.
   --------------------------------------------------------------------------- */
function syncEntries() {
  const out = [];
  ALL.forEach(day => {
    const ds = dayState(day.date, false);
    if (!ds) return;
    const base = { date: ds.trained || day.date, planned: day.date, where: whereOf(day), week: dayWeek(day), day: day.dow, cycle: day.cycle.id };
    if (day.type === "strength") {
      day.exercises.forEach((ex, i) => {
        const spec = specOf(ex);
        const log = SL.normLog(ds.logs[i], spec.sets);
        const sc = scoreOf(ds, i, ex);
        if (!SL.hasData(log) && sc.val == null && !sc.note) return;
        const row = Object.assign({}, base, { exercise: ex.name, slot: ex.slot, rx: shortRx(ex, spec), unit: spec.unit, target: spec.repTop,
          loaded: spec.loaded, bw: spec.bw, sets: SL.hasSets(log) ? log.sets : [], hit: SL.hit(log, spec), notes: log.notes || "" });
        if (ex.score) row.score = { type: ex.score.type, val: sc.val, note: sc.note || "", unit: scoreDef(ex.score.type).unit };
        out.push(row);
      });
    } else if (day.type === "conditioning") {
      const c = ds.cond || {};
      if ((c.score == null || c.score === "") && !c.note && !ds.completed.cond) return;
      const dur = day.work && day.work.durationSec;
      const sdef = scoreDef((day.score || {}).type);
      out.push(Object.assign({}, base, { exercise: day.title, slot: "conditioning", modality: c.modality || "", rx: dur ? `${fmtClock(dur)} nonstop` : "see text",
        unit: (day.score && day.score.unit) || sdef.unit, target: null, sets: [], hit: null, notes: c.note || "",
        score: { type: (day.score || {}).type || "unknown", val: c.score != null && c.score !== "" ? c.score : null, note: c.note || "", unit: (day.score && day.score.unit) || sdef.unit }, durationSec: dur || null }));
    }
  });
  return out;
}

/* ---------------------------------------------------------------------------
   SHELL: hero, cycle + week pills, rules, tabs
   --------------------------------------------------------------------------- */
function buildShell() {
  document.getElementById("appbar-name").textContent = PROGRAM.appbarName;
  document.getElementById("hero-badge").textContent = `${DATA.app || "Chalk"} · ${DATA.coach || ""}`.replace(/ · $/, "");
  document.getElementById("hero-title").textContent = DATA.name || PROGRAM.appbarName;
  renderCycleBar();
  buildNotes();
  wireTabs();
}
function wireTabs() {
  document.querySelectorAll(".tab").forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".pane").forEach(p => p.classList.remove("active"));
      tab.classList.add("active");
      const pane = document.getElementById("pane-" + tab.dataset.pane);
      if (pane) pane.classList.add("active");
      if (boardMode() && tab.dataset.day && tab.dataset.day !== "empty") CK.scrollIntoView("container-" + tab.dataset.day);   // the board fills the screen below the tabs
    };
  });
}
function renderCycleBar() {
  document.getElementById("hero-sub").textContent = `${CYC.label} · starts ${shortDate(CYC.startDate)} · lift ${(CYC.schedule.lift || []).join(" ")}${CYC.schedule.optionalConditioning && CYC.schedule.optionalConditioning.length ? ` · optional conditioning ${CYC.schedule.optionalConditioning.join(" ")}` : ""}`;
  const bar = document.getElementById("cycle-bar");
  if (DATA.cycles.length < 2) { bar.hidden = true; return; }
  bar.hidden = false;
  // Newest first; the pill carries the start month, the title the full label.
  const order = DATA.cycles.map((c, i) => i).reverse();
  bar.innerHTML = order.map(i => { const c = DATA.cycles[i]; return `<button class="week-pill${i === uiCycle ? " active" : ""}" data-c="${i}" title="${escapeHtml(c.label)}">${monthLabel(c.startDate)}<small>${c.startDate.slice(0, 4)} · ${c.days.length} day${c.days.length === 1 ? "" : "s"}</small></button>`; }).join("");
  bar.querySelectorAll(".week-pill").forEach(b => b.onclick = () => {
    uiCycle = +b.dataset.c; CYC = DATA.cycles[uiCycle];
    const nx = nextDay();
    let w = nx && nx.cycle === CYC ? dayWeek(nx) : 1;
    while (w < CYC.weeks && !weekDays(w, CYC).some(d => d.type !== "rest")) w++;   // a tail-only cycle opens on its first ingested training week
    uiWeek = w;
    buildNotes(); render(); openTab(dueDayInWeek(uiWeek));
  });
}
function renderWeekBar() {
  const bar = document.getElementById("week-bar");
  bar.innerHTML = "";
  for (let w = 1; w <= CYC.weeks; w++) {
    const b = document.createElement("button");
    const has = weekDays(w).length > 0;
    b.className = "week-pill" + (w === uiWeek ? " active" : "") + (isWeekComplete(w) ? " done" : "") + (has ? "" : " empty");
    b.textContent = "W" + w;
    b.title = has ? `Week ${w}` : `Week ${w}: not ingested yet`;
    b.onclick = () => { uiWeek = w; render(); openTab(dueDayInWeek(uiWeek)); };
    bar.appendChild(b);
  }
  const r = rulesFor(CYC, uiWeek);
  const rules = document.getElementById("rules");
  rules.innerHTML = `
    <div class="rules-row">
      <span><span class="rules-k">Week ${uiWeek} of ${CYC.weeks}</span>${r.rm ? `Main lift: build to a <b>${r.rm}-rep max</b>` : `<b>${escapeHtml(CYC.label)}</b>`}</span>
      ${r.acc ? `<span>Accessories: <b>3 × ${r.acc}</b></span>` : ""}
      ${r.closer ? `<span>Closer: <b>${escapeHtml(r.closer)}</b></span>` : ""}
    </div>`;
  if (CYC.intro) rules.appendChild(collapsible("About this block", CYC.intro, `intro_${CYC.id}`));
}
/* Day tabs and panes for the week on screen. The Notes tab stays. */
function buildWeek() {
  const tabsEl = document.getElementById("tabs");
  const panesEl = document.getElementById("panes");
  tabsEl.querySelectorAll(".tab[data-day]").forEach(t => t.remove());
  panesEl.querySelectorAll(".pane[data-day]").forEach(p => p.remove());
  const days = weekDays(uiWeek);
  const notesTab = tabsEl.querySelector('.tab[data-pane="notes"]');
  const notesPane = document.getElementById("pane-notes");
  if (!days.length) {
    const pane = document.createElement("div");
    pane.className = "pane"; pane.id = "pane-empty"; pane.dataset.day = "empty";
    pane.innerHTML = `<div class="empty-card">Week ${uiWeek} of this cycle is not in the tracker yet. Karl ingests it from the Chalk portal as it is published.</div>`;
    panesEl.insertBefore(pane, notesPane);
    const tab = document.createElement("button");
    tab.className = "tab"; tab.dataset.pane = "empty"; tab.dataset.day = "empty"; tab.textContent = `Week ${uiWeek}`;
    tabsEl.insertBefore(tab, notesTab);
  }
  days.forEach(day => {
    const tab = document.createElement("button");
    tab.className = "tab"; tab.dataset.pane = day.date; tab.dataset.day = day.date;
    tab.innerHTML = `${day.dow}<span class="due-dot" hidden></span>`;
    tabsEl.insertBefore(tab, notesTab);
    const pane = document.createElement("div");
    pane.className = "pane"; pane.id = "pane-" + day.date; pane.dataset.day = day.date;
    pane.innerHTML = `<div id="container-${day.date}"></div>`;
    panesEl.insertBefore(pane, notesPane);
    renderDay(day);
  });
  wireTabs();
}
function openTab(day) {
  const id = day ? day.date : "empty";
  const tab = document.querySelector(`.tab[data-pane="${id}"]`) || document.querySelector(".tab[data-day]");
  if (tab) tab.click();
}

/* ---------------------------------------------------------------------------
   DAY RENDERING
   --------------------------------------------------------------------------- */
const tappedNow = {};   // date → row idx the user tapped
const prepOpen = {};    // `${date}_wu` → open, once the user toggles the warm-up
const ICON = {
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 12.5l4.2 4.2L18.5 8"/></svg>`,

  video: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="6" width="12" height="12" rx="2.5"/><path d="M15.5 10.5l5-3v9l-5-3z"/></svg>`,
  note: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h9l4 4v13H6z"/><path d="M9 12h7"/><path d="M9 16h5"/></svg>`
};

function renderDay(day) {
  const container = document.getElementById("container-" + day.date);
  if (!container) return;
  if (boardMode() && day.type !== "rest") return CK.render(day, container);   // iPad: lane + rail (shared/cockpit.js)
  container.innerHTML = "";
  container.className = "";
  if (day.type === "rest") return renderRest(day, container);
  if (day.type === "conditioning") return renderConditioning(day, container);

}

function sessHead(day, title, done, total, extra) {
  const ds = dayState(day.date, false);
  const w = dayWeek(day);
  const complete = total > 0 && done === total;
  const trained = ds && ds.trained && ds.trained !== day.date ? ` · trained ${shortDate(ds.trained)}` : "";
  const planned = daySecs(day);
  const progress = complete ? `Day complete · ${done} of ${total}${trained}` : `${done} of ${total} done${planned != null ? ` · planned ${fmtMins(planned)}` : ""}${trained}`;
  const head = document.createElement("div");
  head.className = "hs-sess-head";
  head.innerHTML = `
    <div class="hs-sess-eyebrow">${PROGRAM.shortName} · Week ${w} · ${DOW_FULL[day.dow] || day.dow} · ${shortDate(day.date)}${day.optional ? " · Optional" : ""}${extra || ""}</div>
    <div class="hs-sess-top">
      <h2 class="hs-sess-title${title.length > 16 ? " long" : ""}">${escapeHtml(title)}</h2>
      <button type="button" class="hs-sess-clock" id="clock-${day.date}">${ICON.clock}<span class="hs-clock-t">Start</span></button>
    </div>
    <div class="hs-sess-progress"><div class="hs-bar"><i style="width:${total ? Math.round(100 * done / total) : 0}%"></i></div><span>${progress}</span></div>`;
  return head;
}
function sessCtl(day) {
  const ctl = document.createElement("div");
  ctl.className = "hs-sess-ctl";
  ctl.innerHTML = `
    <span class="hs-sess-pace" id="clockstat-${day.date}"></span>
    <button type="button" class="btn hs-mini btn-danger" data-action="clear">Clear day</button>`;
  ctl.querySelector("[data-action=clear]").onclick = () => {
    if (!dayState(day.date, false)) return;
    if (confirm(`Clear ${DOW_FULL[day.dow]} ${shortDate(day.date)}? Checks, sets and scores for this day will be gone.`)) {
