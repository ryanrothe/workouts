<script>
"use strict";
const SL = window.SetLog;
const { normName, fmtWeight, fmtLoad } = SL;

/* ===========================================================================
   FULL BODY AESTHETICS (Chalk Performance Training, coach Ryan Fischer).
   Data-driven from ./data.json (schema 2): cycle → week → day. Day types:
     strength      one SetLog set grid per exercise (reps + lb per set, inferred
                   hits, the progression coach), slots main / body part / closer
                   with a per-slot score (rep-max load, Death By minute, free)
     conditioning  a modality chooser, warm-up, a countdown of work.durationSec
                   and a distance score in meters
     rest          the coach's note
   `lastLoadLb` on an exercise is the load Chalk showed beside it (Ryan's last
   logged load there). It seeds SetLog's history so the coach can suggest from
   day one. It is never shown as a prescription.
   Storage key fba_v2; sync slug full-body-aesthetics (shared/setlog.js).
   Design brief: KARL_DATA/outputs/personal/workout-trackers/full-body-aesthetics/DESIGN-BRIEF-2026-10-24.md
   =========================================================================== */
const PROGRAM = {
  slug: "full-body-aesthetics",
  storageKey: "fba_v2",
  appbarName: "Full Body Aesthetics",
  shortName: "FBA"
};
const STORAGE_KEY = PROGRAM.storageKey;
const VIDEO_BASE = "https://www.youtube.com/results?search_query=";
const v = q => VIDEO_BASE + encodeURIComponent(q + " exercise form");

const DOW_FULL = { Sun: "Sunday", Mon: "Monday", Tue: "Tuesday", Wed: "Wednesday", Thu: "Thursday", Fri: "Friday", Sat: "Saturday" };
const SLOT = { main: "Main lift", chest: "Chest", back: "Back", legs: "Legs", shoulders: "Shoulders", biceps: "Biceps", triceps: "Triceps", abs: "Abs", closer: "Closer" };
/* Score types the ingest writes. fromGrid: the day's heaviest logged set is the score unless typed.
   kind "text" takes a free string (a time like 4:32). prefix shapes the Last line and the done summary. */
const SCORE = {
  "repmax-load":    { label: "Rep max today", unit: "lb", kind: "number", fromGrid: true },
  "load":           { label: "Top load today", unit: "lb", kind: "number", fromGrid: true, prefix: "top " },
  "deathby-minute": { label: "Minutes completed", unit: "min", kind: "number", prefix: "minute " },
  "ladder-reps":    { label: "Total reps", unit: "reps", kind: "number", gridOnly: true },
  "for-time":       { label: "Time", unit: "", kind: "text", placeholder: "m:ss" },
  "amrap-reps":     { label: "Total reps", unit: "reps", kind: "number", gridOnly: true },
  "closer-unknown": { label: "Score", unit: "", kind: "number" },
  "distance":       { label: "Distance", unit: "m", kind: "number" },
  "calories":       { label: "Calories", unit: "cal", kind: "number" },
  "time":           { label: "Time", unit: "", kind: "text", placeholder: "m:ss" },
  "unknown":        { label: "Score", unit: "", kind: "number" }
};
const scoreDef = t => SCORE[t] || { label: "Score", unit: "", kind: "number" };
const isGridScore = ex => !!ex.score && !!scoreDef(ex.score.type).fromGrid;
/* Every row logs on the SetLog grid. A closer's total reps and load ARE its grid row (1 × max); the score
   box adds only what the grid cannot hold: the Death By minute, the for-time clock, an unknown format. */
const hasScoreBox = ex => !!ex.score && !scoreDef(ex.score.type).gridOnly;
/* "-1" and "max reps" both mean max; everything else is passed to SetLog.parseReps as written ("5-6", "12"). */
function repsStr(ex) { const r = String(ex.reps == null ? "" : ex.reps).trim(); return r === "-1" || /^max/i.test(r) ? "max" : r; }
/* The coach's text, without the "Intensity: 9/10" line the ingest already lifted into ex.intensity. */
function instructionText(ex) {
  let t = String(ex.instruction || "");
  if (ex.intensity) t = t.replace(/\n?\s*Intensity:\s*\d+\s*\/\s*10\.?\s*/gi, "\n");
  return t.replace(/\n{3,}/g, "\n\n").trim();
}
function monthLabel(iso) { return new Date(iso + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" }); }

/* Loaded / bodyweight / lower-body rules for the spec SetLog reads. */
const BW_LOADED_RE = /chin.?ups?|pull.?ups?|\bdips?\b/i;                             // bodyweight, added weight tracked
const BW_RE = /push.?ups?|hanging|leg raises?|knee raises?|plank|hollow|sit.?ups?|v.?ups?|burpee|dead hang|toes? to bar/i;
const LOWER_RE = /squat|deadlift|hip thrust|leg press|lunge|\brdl\b|romanian|good morning|hack|step.?up|calf raise|leg extension|leg curl|nordic/i;

/* ---------------------------------------------------------------------------
   DATA + STATE
   --------------------------------------------------------------------------- */
let DATA = null;          // data.json
let CYC = null;           // the cycle on screen
let ALL = [];             // every day of every cycle, ascending by date, each with .cycle
let state = loadState();
let uiCycle = 0;
let uiWeek = 1;

function emptyState() { return { v: 2, days: {} }; }
function normState(p) {
  const s = emptyState();
  if (p && typeof p === "object" && p.days && typeof p.days === "object") s.days = p.days;
  return s;
}
function loadState() {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return normState(JSON.parse(raw)); } catch (e) {}
  return emptyState();
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  updateStats();
  SL.sync.schedule();
  publishSummary();
}
/* One record per calendar day of the program, keyed by the day's date in data.json. */
function dayState(date, create) {
  if (!state.days[date] && create) {
    state.days[date] = { trained: null, clockStart: null, clockStop: null, completed: {}, logs: {}, scores: {}, wu: {}, cond: {} };
  }
  const ds = state.days[date] || null;
  if (ds) { ds.completed = ds.completed || {}; ds.logs = ds.logs || {}; ds.scores = ds.scores || {}; ds.wu = ds.wu || {}; ds.cond = ds.cond || {}; }
  return ds;
}
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function shortDate(iso) { if (!iso) return "—"; const [, m, d] = iso.split("-"); return `${parseInt(m, 10)}/${parseInt(d, 10)}`; }
function stampDate(ds) { if (!ds.trained) ds.trained = todayISO(); }
function escapeHtml(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function fmtClock(s) { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60), sec = s % 60; return `${m}:${String(sec).padStart(2, "0")}`; }
function fmtMins(secs) { return `~${Math.round(secs / 60)} min`; }
function fmtNum(n) { return n == null || n === "" ? "" : Number(n).toLocaleString("en-US"); }

/* ---------------------------------------------------------------------------
   PROGRAM SHAPE HELPERS
   --------------------------------------------------------------------------- */
/* A day's week: the ingest writes it; a rest day before the first lift derives it from the cycle start. */
function dayWeek(day) {
  if (day.week) return day.week;
  const c = day.cycle || CYC;
  const diff = Math.floor((Date.parse(day.date + "T12:00:00") - Date.parse(c.startDate + "T12:00:00")) / 864e5);
  return Math.max(1, Math.floor(diff / 7) + 1);
}
function weekDays(w, cyc) { return (cyc || CYC).days.filter(d => dayWeek(d) === w); }
function dayById(id) { return ALL.find(d => d.date === id) || null; }
function whereOf(day) { return `W${dayWeek(day)} ${day.dow}`; }
function isRequired(day) { return day.type !== "rest" && !day.optional; }
function rulesFor(cyc, w) {
  const st = cyc.structure || {};
  const rm = Array.isArray(st.mainLiftRepMaxByWeek) ? st.mainLiftRepMaxByWeek[w - 1] : null;
  const acc = Array.isArray(st.accessoryRepsByWeek) ? st.accessoryRepsByWeek[w - 1] : null;
  return { rm: rm || null, acc: acc || null, closer: st.closer || null };
}

/* The spec SetLog reads for a strength row. */
function specOf(ex) {
  const p = SL.parseReps(repsStr(ex));
  const hasFields = Array.isArray(ex.fields) && ex.fields.length > 0;
  const bwMove = BW_LOADED_RE.test(ex.name) || BW_RE.test(ex.name);
  const addWeight = /add (some )?weight|weighted|add load/i.test(ex.instruction || "");
  let loaded = hasFields ? ex.fields.includes("weight") : !BW_RE.test(ex.name);
  if (!loaded && bwMove && addWeight) loaded = true;          // "over 10 reps add weight": give the row an added-lb column
  const bw = !loaded || (loaded && bwMove);                      // the weight, if any, is ADDED to bodyweight
  const sets = ex.sets || 3;
  const rest = ex.restSec != null && ex.restSec > 0 ? ex.restSec : null;   // 0 or null = no rest bar
  return { name: ex.name, sets, minSets: sets, repTop: p.repTop, repRange: p.repRange, isMax: p.isMax, unit: p.unit,
           loaded, bw: loaded && bw, lower: ex.slot === "legs" || LOWER_RE.test(ex.name), rest };
}
/* Closers log a score, not a set grid: a Death By is a last minute, an unknown closer a free number. */
function rxText(ex, spec) {
  const reps = spec.isMax ? "max" : repsStr(ex);
  const side = ex.perSide ? ` <span class="ex-side">(per side)</span>` : "";
  const restTxt = spec.rest ? ` · rest ${fmtClock(spec.rest)}` : "";
  const inten = ex.intensity ? ` · intensity ${escapeHtml(ex.intensity)}` : "";
  return `${spec.sets} × ${reps}${side}${restTxt}${inten}`;
}
function shortRx(ex, spec) { return `${spec.sets} × ${spec.isMax ? "max" : repsStr(ex)}${ex.perSide ? " (per side)" : ""}`; }

/* Planning model for the session clock and the catalog: seconds per row. */
function rowSecs(ex, spec) {
  if (ex.closer) return 8 * 60;
  const per = spec.unit === "s" ? (spec.repTop || 30) : (spec.repTop || 12) * 3;
  const ramp = ex.slot === "main" ? 150 : 0;
  return ramp + spec.sets * per + (spec.sets - 1) * (spec.rest || 60) + 45;
}
function daySecs(day) {
  if (day.type === "strength") return 6 * 60 + day.exercises.reduce((a, ex) => a + rowSecs(ex, specOf(ex)), 0);
  if (day.type === "conditioning") return day.work && day.work.durationSec ? 6 * 60 + day.work.durationSec : null;
  return null;
}
function dayMinutes(day) { const s = daySecs(day); return s == null ? null : Math.round(s / 60); }

/* ---------------------------------------------------------------------------
   COMPLETION
   --------------------------------------------------------------------------- */
function isDayComplete(day) {
  const ds = dayState(day.date, false);
  if (!ds || day.type === "rest") return false;
  if (day.type === "conditioning") return !!ds.completed.cond;
  return day.exercises.length > 0 && day.exercises.every((_, i) => ds.completed["m" + i]);
}
function isWeekComplete(w, cyc) {
  const req = weekDays(w, cyc).filter(isRequired);
  return req.length > 0 && req.every(isDayComplete);
}
function dayHasActivity(day) {
  const ds = dayState(day.date, false);
  if (!ds) return false;
  if (ds.clockStart || ds.trained) return true;
  if (Object.keys(ds.completed).some(k => ds.completed[k])) return true;
  if (Object.keys(ds.scores).some(i => ds.scores[i] && (ds.scores[i].val != null && ds.scores[i].val !== ""))) return true;
  if (ds.cond && (ds.cond.score != null && ds.cond.score !== "")) return true;
  return Object.keys(ds.logs).some(i => SL.hasData(SL.normLog(ds.logs[i], 0)));
}
/* Next = the first required day not yet complete, in program order (phased programs move by completion). */
function currentCycleIndex() {
  const td = todayISO();
  let idx = DATA.cycles.findIndex(c => c.days.some(d => d.date === td));
  if (idx < 0) for (let i = DATA.cycles.length - 1; i >= 0; i--) if (DATA.cycles[i].startDate <= td) { idx = i; break; }
  return idx < 0 ? 0 : idx;
}
/* Next = the first required day from today on, in the current cycle, not yet complete; then the following
   cycle's first open day. Earlier cycles were logged in Chalk, not here, so they never count as "next". */
function nextDay() {
  const td = todayISO();
  const ci = currentCycleIndex();
  for (let i = ci; i < DATA.cycles.length; i++) {
    const d = DATA.cycles[i].days.find(x => isRequired(x) && !isDayComplete(x) && (i > ci || x.date >= td));
    if (d) return d;
  }
  return null;
}
/* The week the hero and the summary call "this week": today's week in the current cycle, else the next day's. */
function currentWeekRef() {
  const td = todayISO();
  const cyc = DATA.cycles[currentCycleIndex()];
  const today = cyc.days.find(d => d.date === td);
  if (today) return { cyc, w: dayWeek(today) };
  const nx = nextDay();
  if (nx) return { cyc: nx.cycle, w: dayWeek(nx) };
  return { cyc, w: cyc.weeks };
}
function dueDayInWeek(w) {
  const days = weekDays(w);
  const nx = nextDay();
  if (nx && days.includes(nx)) return nx;
  return days.find(d => isRequired(d) && !isDayComplete(d)) || days.find(d => d.type !== "rest" && !isDayComplete(d)) || days[0] || null;
}

/* ---------------------------------------------------------------------------
   HISTORY + PROGRESSION COACH
   Exercises recur by name across days and cycles. Real logs come first,
   newest first; the Chalk-shown load (lastLoadLb) is the oldest entry, so it
   only speaks when nothing has been logged here yet.
   --------------------------------------------------------------------------- */
function priorEntries(name, beforeDate, ex) {
  const key = normName(name);
  const out = [];
  ALL.forEach(day => {
    if (day.type !== "strength" || day.date >= beforeDate) return;
    const ds = dayState(day.date, false);
    if (!ds) return;
    day.exercises.forEach((x, i) => {
      if (normName(x.name) !== key) return;
      const spec = specOf(x);
      const log = SL.normLog(ds.logs[i], spec.sets);
      if (!SL.hasSets(log)) return;
      out.push(SL.entry(log, spec, { date: ds.trained || day.date, where: whereOf(day), day }));
    });
  });
  out.reverse();
  if (ex && ex.lastLoadLb != null) {
    const spec = specOf(ex);
    out.push({ sets: [{ r: null, w: ex.lastLoadLb }], weight: ex.lastLoadLb, hit: null, unit: spec.unit, target: null, seed: true, where: "from Chalk" });
  }
  return out;
}
function suggestNext(ex, day, spec) {
  return SL.suggest(priorEntries(ex.name, day.date, ex), spec || specOf(ex));
}
/* Prior scores for a slot (rep-max loads, Death By minutes), newest first. */
function priorScores(name, beforeDate) {
  const key = normName(name);
  const out = [];
  ALL.forEach(day => {
    if (day.type !== "strength" || day.date >= beforeDate) return;
    const ds = dayState(day.date, false);
    if (!ds) return;
    day.exercises.forEach((x, i) => {
      if (normName(x.name) !== key || !x.score) return;
      const sc = scoreOf(ds, i, x);
      if (sc.val == null || sc.val === "") return;
      out.push({ date: ds.trained || day.date, where: whereOf(day), type: x.score.type, val: sc.val, note: sc.note || "", rm: repsStr(x) });
    });
  });
  return out.reverse();
}
/* Every rep-max score logged for a main lift so far: "10RM 185 · 8RM 205". */
function repMaxLine(name, beforeDate) {
  const xs = priorScores(name, beforeDate).filter(s => scoreDef(s.type).fromGrid).reverse();
  if (!xs.length) return "";
  return xs.map(s => `${s.type === "repmax-load" ? s.rm + "RM" : "top"} <b>${fmtWeight(s.val)} lb</b> <span style="opacity:.7">(${s.where})</span>`).join(" · ");
}
function priorCond(title, beforeDate) {
  const key = normName(title);
  const out = [];
  ALL.forEach(day => {
    if (day.type !== "conditioning" || day.date >= beforeDate || normName(day.title) !== key) return;
    const ds = dayState(day.date, false);
    if (!ds || ds.cond.score == null || ds.cond.score === "") return;
    out.push({ date: ds.trained || day.date, where: whereOf(day), val: ds.cond.score, modality: ds.cond.modality || "", note: ds.cond.note || "" });
  });
  return out.reverse();
}
/* The score of a row: typed, else (rep-max) the heaviest weight in the grid. */
function scoreOf(ds, idx, ex) {
  const raw = (ds && ds.scores && ds.scores[idx]) || {};
  const typed = raw.val != null && raw.val !== "";
  const out = { val: typed ? raw.val : null, note: raw.note || "", typed, reps: null };
  if (out.val == null && isGridScore(ex) && ds) {
    const spec = specOf(ex);
    const log = SL.normLog(ds.logs[idx], 0);
    // The rep max of the day: the heaviest set that reached the target reps (any set when no target).
    const ok = log.sets.filter(x => x.w != null && (spec.repTop == null || (x.r != null && x.r >= spec.repTop)));
    if (ok.length) { const best = ok.reduce((a, b) => (b.w > a.w ? b : a)); out.val = best.w; out.reps = best.r; }
  }
  return out;
}
function scoreText(ex, sc) {
  if (!ex.score || sc.val == null || sc.val === "") return "";
  const d = scoreDef(ex.score.type);
  if (d.fromGrid) return ex.score.type === "repmax-load" ? `${repsStr(ex)}RM ${fmtWeight(sc.val)} lb` : `top ${fmtWeight(sc.val)} lb`;
  const unit = d.unit && d.unit !== "lb" ? ` ${d.unit}` : "";
  return `${d.prefix || ""}${escapeHtml(sc.val)}${unit}`;
}
/* Week-over-week on a countdown cycle: this week's target beside last time's top set at its own target. */
function weekOverHtml(L, spec, day) {
  if (!L || spec.repTop == null) return "";
  if (L.seed) return `<div class="ex-last">This week: <strong>${spec.sets} × ${spec.repTop}</strong> · Chalk showed ${fmtLoad(L.weight, spec.bw)} the last time you logged it there</div>`;
  if (L.target == null || L.target === spec.repTop) return "";
  const top = L.weight != null ? ` @ ${fmtLoad(L.weight, spec.bw)}` : "";
  return `<div class="ex-last">This week: <strong>${spec.sets} × ${spec.repTop}</strong> · last time <strong>${L.target} reps${top}</strong> (${L.where})</div>`;
}

/* ---------------------------------------------------------------------------
   SYNC. Transport and the device token live in ../shared/setlog.js. The flat
   `entries` list is what Karl reads: one row per logged exercise or score.
   --------------------------------------------------------------------------- */
function syncEntries() {
  const out = [];
  ALL.forEach(day => {
    const ds = dayState(day.date, false);
    if (!ds) return;
    const base = { date: ds.trained || day.date, planned: day.date, where: whereOf(day), week: dayWeek(day), day: day.dow, cycle: day.cycle.id };
    if (day.type === "strength") {
      day.exercises.forEach((ex, i) => {
        const spec = specOf(ex);
        const log = SL.normLog(ds.logs[i], spec.sets);
        const sc = scoreOf(ds, i, ex);
        if (!SL.hasData(log) && sc.val == null && !sc.note) return;
        const row = Object.assign({}, base, { exercise: ex.name, slot: ex.slot, rx: shortRx(ex, spec), unit: spec.unit, target: spec.repTop,
          loaded: spec.loaded, bw: spec.bw, sets: SL.hasSets(log) ? log.sets : [], hit: SL.hit(log, spec), notes: log.notes || "" });
        if (ex.score) row.score = { type: ex.score.type, val: sc.val, note: sc.note || "", unit: scoreDef(ex.score.type).unit };
        out.push(row);
      });
    } else if (day.type === "conditioning") {
      const c = ds.cond || {};
      if ((c.score == null || c.score === "") && !c.note && !ds.completed.cond) return;
      const dur = day.work && day.work.durationSec;
      const sdef = scoreDef((day.score || {}).type);
      out.push(Object.assign({}, base, { exercise: day.title, slot: "conditioning", modality: c.modality || "", rx: dur ? `${fmtClock(dur)} nonstop` : "see text",
        unit: (day.score && day.score.unit) || sdef.unit, target: null, sets: [], hit: null, notes: c.note || "",
        score: { type: (day.score || {}).type || "unknown", val: c.score != null && c.score !== "" ? c.score : null, note: c.note || "", unit: (day.score && day.score.unit) || sdef.unit }, durationSec: dur || null }));
    }
  });
  return out;
}

/* ---------------------------------------------------------------------------
   SHELL: hero, cycle + week pills, rules, tabs
   --------------------------------------------------------------------------- */
function buildShell() {
  document.getElementById("appbar-name").textContent = PROGRAM.appbarName;
  document.getElementById("hero-badge").textContent = `${DATA.app || "Chalk"} · ${DATA.coach || ""}`.replace(/ · $/, "");
  document.getElementById("hero-title").textContent = DATA.name || PROGRAM.appbarName;
  renderCycleBar();
  buildNotes();
  wireTabs();
}
function wireTabs() {
  document.querySelectorAll(".tab").forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".pane").forEach(p => p.classList.remove("active"));
      tab.classList.add("active");
      const pane = document.getElementById("pane-" + tab.dataset.pane);
      if (pane) pane.classList.add("active");
      if (boardMode() && tab.dataset.day && tab.dataset.day !== "empty") scrollBoardIntoView(tab.dataset.day);   // the board fills the screen below the tabs
    };
  });
}
function renderCycleBar() {
  document.getElementById("hero-sub").textContent = `${CYC.label} · starts ${shortDate(CYC.startDate)} · lift ${(CYC.schedule.lift || []).join(" ")}${CYC.schedule.optionalConditioning && CYC.schedule.optionalConditioning.length ? ` · optional conditioning ${CYC.schedule.optionalConditioning.join(" ")}` : ""}`;
  const bar = document.getElementById("cycle-bar");
  if (DATA.cycles.length < 2) { bar.hidden = true; return; }
  bar.hidden = false;
  // Newest first; the pill carries the start month, the title the full label.
  const order = DATA.cycles.map((c, i) => i).reverse();
  bar.innerHTML = order.map(i => { const c = DATA.cycles[i]; return `<button class="week-pill${i === uiCycle ? " active" : ""}" data-c="${i}" title="${escapeHtml(c.label)}">${monthLabel(c.startDate)}<small>${c.startDate.slice(0, 4)} · ${c.days.length} day${c.days.length === 1 ? "" : "s"}</small></button>`; }).join("");
  bar.querySelectorAll(".week-pill").forEach(b => b.onclick = () => {
    uiCycle = +b.dataset.c; CYC = DATA.cycles[uiCycle];
    const nx = nextDay();
    let w = nx && nx.cycle === CYC ? dayWeek(nx) : 1;
    while (w < CYC.weeks && !weekDays(w, CYC).some(d => d.type !== "rest")) w++;   // a tail-only cycle opens on its first ingested training week
    uiWeek = w;
    buildNotes(); render(); openTab(dueDayInWeek(uiWeek));
  });
}
function renderWeekBar() {
  const bar = document.getElementById("week-bar");
  bar.innerHTML = "";
  for (let w = 1; w <= CYC.weeks; w++) {
    const b = document.createElement("button");
    const has = weekDays(w).length > 0;
    b.className = "week-pill" + (w === uiWeek ? " active" : "") + (isWeekComplete(w) ? " done" : "") + (has ? "" : " empty");
    b.textContent = "W" + w;
    b.title = has ? `Week ${w}` : `Week ${w}: not ingested yet`;
    b.onclick = () => { uiWeek = w; render(); openTab(dueDayInWeek(uiWeek)); };
    bar.appendChild(b);
  }
  const r = rulesFor(CYC, uiWeek);
  const rules = document.getElementById("rules");
  rules.innerHTML = `
    <div class="rules-row">
      <span><span class="rules-k">Week ${uiWeek} of ${CYC.weeks}</span>${r.rm ? `Main lift: build to a <b>${r.rm}-rep max</b>` : `<b>${escapeHtml(CYC.label)}</b>`}</span>
      ${r.acc ? `<span>Accessories: <b>3 × ${r.acc}</b></span>` : ""}
      ${r.closer ? `<span>Closer: <b>${escapeHtml(r.closer)}</b></span>` : ""}
    </div>`;
  if (CYC.intro) rules.appendChild(collapsible("About this block", CYC.intro, `intro_${CYC.id}`));
}
/* Day tabs and panes for the week on screen. The Notes tab stays. */
function buildWeek() {
  const tabsEl = document.getElementById("tabs");
  const panesEl = document.getElementById("panes");
  tabsEl.querySelectorAll(".tab[data-day]").forEach(t => t.remove());
  panesEl.querySelectorAll(".pane[data-day]").forEach(p => p.remove());
  const days = weekDays(uiWeek);
  const notesTab = tabsEl.querySelector('.tab[data-pane="notes"]');
  const notesPane = document.getElementById("pane-notes");
  if (!days.length) {
    const pane = document.createElement("div");
    pane.className = "pane"; pane.id = "pane-empty"; pane.dataset.day = "empty";
    pane.innerHTML = `<div class="empty-card">Week ${uiWeek} of this cycle is not in the tracker yet. Karl ingests it from the Chalk portal as it is published.</div>`;
    panesEl.insertBefore(pane, notesPane);
    const tab = document.createElement("button");
    tab.className = "tab"; tab.dataset.pane = "empty"; tab.dataset.day = "empty"; tab.textContent = `Week ${uiWeek}`;
    tabsEl.insertBefore(tab, notesTab);
  }
  days.forEach(day => {
    const tab = document.createElement("button");
    tab.className = "tab"; tab.dataset.pane = day.date; tab.dataset.day = day.date;
    tab.innerHTML = `${day.dow}<span class="due-dot" hidden></span>`;
    tabsEl.insertBefore(tab, notesTab);
    const pane = document.createElement("div");
    pane.className = "pane"; pane.id = "pane-" + day.date; pane.dataset.day = day.date;
    pane.innerHTML = `<div id="container-${day.date}"></div>`;
    panesEl.insertBefore(pane, notesPane);
    renderDay(day);
  });
  wireTabs();
}
function openTab(day) {
  const id = day ? day.date : "empty";
  const tab = document.querySelector(`.tab[data-pane="${id}"]`) || document.querySelector(".tab[data-day]");
  if (tab) tab.click();
}

/* ---------------------------------------------------------------------------
   DAY RENDERING
   --------------------------------------------------------------------------- */
const tappedNow = {};   // date → row idx the user tapped
const prepOpen = {};    // `${date}_wu` → open, once the user toggles the warm-up
const ICON = {
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 12.5l4.2 4.2L18.5 8"/></svg>`,
  clock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.5 1.5"/><path d="M9.5 2.5h5"/></svg>`,
  video: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="6" width="12" height="12" rx="2.5"/><path d="M15.5 10.5l5-3v9l-5-3z"/></svg>`,
  note: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h9l4 4v13H6z"/><path d="M9 12h7"/><path d="M9 16h5"/></svg>`
};

function renderDay(day) {
  const container = document.getElementById("container-" + day.date);
  if (!container) return;
  if (boardMode() && day.type !== "rest") return renderBoard(day, container);   // iPad: lane + rail
  container.innerHTML = "";
  container.className = "";
  if (day.type === "rest") return renderRest(day, container);
  if (day.type === "conditioning") return renderConditioning(day, container);
  renderStrength(day, container);
}

function sessHead(day, title, done, total, extra) {
  const ds = dayState(day.date, false);
  const w = dayWeek(day);
  const complete = total > 0 && done === total;
  const trained = ds && ds.trained && ds.trained !== day.date ? ` · trained ${shortDate(ds.trained)}` : "";
  const planned = daySecs(day);
  const progress = complete ? `Day complete · ${done} of ${total}${trained}` : `${done} of ${total} done${planned != null ? ` · planned ${fmtMins(planned)}` : ""}${trained}`;
  const head = document.createElement("div");
  head.className = "hs-sess-head";
  head.innerHTML = `
    <div class="hs-sess-eyebrow">${PROGRAM.shortName} · Week ${w} · ${DOW_FULL[day.dow] || day.dow} · ${shortDate(day.date)}${day.optional ? " · Optional" : ""}${extra || ""}</div>
    <div class="hs-sess-top">
      <h2 class="hs-sess-title${title.length > 16 ? " long" : ""}">${escapeHtml(title)}</h2>
      <button type="button" class="hs-sess-clock" id="clock-${day.date}">${ICON.clock}<span class="hs-clock-t">Start</span></button>
    </div>
    <div class="hs-sess-progress"><div class="hs-bar"><i style="width:${total ? Math.round(100 * done / total) : 0}%"></i></div><span>${progress}</span></div>`;
  return head;
}
function sessCtl(day) {
  const ctl = document.createElement("div");
  ctl.className = "hs-sess-ctl";
  ctl.innerHTML = `
    <span class="hs-sess-pace" id="clockstat-${day.date}"></span>
    <button type="button" class="btn hs-mini btn-danger" data-action="clear">Clear day</button>`;
  ctl.querySelector("[data-action=clear]").onclick = () => {
    if (!dayState(day.date, false)) return;
    if (confirm(`Clear ${DOW_FULL[day.dow]} ${shortDate(day.date)}? Checks, sets and scores for this day will be gone.`)) {
      delete state.days[day.date];
      delete tappedNow[day.date];
      saveState(); render();
    }
  };
  return ctl;
}

function renderRest(day, container) {
  const w = dayWeek(day);
  container.innerHTML = `
    <div class="hs-sess-head">
      <div class="hs-sess-eyebrow">${PROGRAM.shortName} · Week ${w} · ${DOW_FULL[day.dow] || day.dow} · ${shortDate(day.date)}</div>
      <div class="hs-sess-top"><h2 class="hs-sess-title">Rest</h2></div>
    </div>
    <div class="rest-card"><div class="eyebrow">Coach's note</div><p>${escapeHtml(day.note || "Rest day.")}</p></div>`;
}

function renderStrength(day, container) {
  const ds = dayState(day.date, false);
  const rows = day.exercises;
  const k = day.date;
  const isDoneAt = i => !!(ds && ds.completed["m" + i]);
  const done = rows.filter((_, i) => isDoneAt(i)).length;
  const main = rows.find(x => x.slot === "main");
  const title = day.title || (main ? main.name : "Lift");
  const r = rulesFor(CYC, dayWeek(day));

  const nowIdx = nowIndex(day);
  const nextIdxs = rows.map((_, i) => i).filter(i => i !== nowIdx && !isDoneAt(i));
  const afterNow = nextIdxs.find(i => i > nowIdx);
  const upNextAt = afterNow != null ? afterNow : nextIdxs[0];

  const head = sessHead(day, title, done, rows.length);
  const ctl = sessCtl(day);
  container.appendChild(head);
  container.appendChild(ctl);
  if (!boardMode()) wireClock(day, head.querySelector(".hs-sess-clock"), ctl.querySelector(".hs-sess-pace"));   // the board wires its rail clock instead

  if (day.note) container.appendChild(collapsible("Coach's note for today", day.note, `note_${day.date}`));
  const wu = (Array.isArray(day.warmup) && day.warmup.length ? day.warmup : day.cycle.warmup) || [];
  if (wu.length) container.appendChild(renderPrep(day, "Warm-up", "wu", wu));

  let seenAcc = false;
  rows.forEach((ex, idx) => {
    const st = idx === nowIdx ? "now" : isDoneAt(idx) ? "done" : "next";
    let label = "";
    if (ex.slot === "main") label = r.rm ? `Main · build to a ${r.rm}-rep max` : isGridScore(ex) && ex.score.type === "repmax-load" ? `Main · build to a ${repsStr(ex)}-rep max` : "Main lift";
    else if (ex.closer) label = "Closer · scored";
    else if (!seenAcc) { seenAcc = true; label = r.acc ? `Accessories · 3 × ${r.acc}` : "Accessories"; }
    if (idx === upNextAt) label = label ? `Up next · ${label}` : "Up next";
    if (label) {
      const lab = document.createElement("div");
      lab.className = "hs-section-label";
      lab.textContent = label;
      container.appendChild(lab);
    }
    container.appendChild(renderRow(day, ex, idx, st, rows.length));
  });
}

function renderPrep(day, title, prefix, items) {
  if (typeof items === "string") items = items.split(/\n{2,}/);
  if (!Array.isArray(items)) items = [];
  const ds = dayState(day.date, false);
  const openKey = `${day.date}_${prefix}`;
  const checks = (ds && ds[prefix]) || {};
  const doneN = items.filter((_, i) => checks[i]).length;
  const open = prepOpen[openKey] === true;   // collapsed by default (Ryan knows the warm-up)
  const el = document.createElement("div");
  el.className = "prep" + (open ? "" : " collapsed");
  el.innerHTML = `
    <div class="prep-head" role="button" tabindex="0"><span>${title} · ${doneN}/${items.length}</span><span class="caret">▼</span></div>
    <div class="prep-body">${items.map((t, i) => `
      <div class="prep-item${checks[i] ? " done" : ""}" data-i="${i}">
        <span class="prep-check"><svg viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 8 7 12 13 4"/></svg></span>
        <span>${escapeHtml(t)}</span>
      </div>`).join("")}</div>`;
  el.querySelector(".prep-head").onclick = () => { prepOpen[openKey] = el.classList.contains("collapsed"); el.classList.toggle("collapsed"); };
  el.querySelectorAll(".prep-item").forEach(it => it.onclick = () => {
    const d = dayState(day.date, true);
    d[prefix] = d[prefix] || {};
    const i = it.dataset.i;
    d[prefix][i] = !d[prefix][i];
    if (d[prefix][i]) stampDate(d);
    saveState();
    prepOpen[openKey] = true;
    renderDay(day);
  });
  return el;
}

/* A folded block of coach text (a day note, the cycle intro). Collapsed until tapped; the choice is kept per key. */
function collapsible(title, text, key) {
  const open = prepOpen[key] === true;
  const el = document.createElement("div");
  el.className = "prep" + (open ? "" : " collapsed");
  el.style.marginTop = "8px";
  el.innerHTML = `<div class="prep-head" role="button" tabindex="0"><span>${escapeHtml(title)}</span><span class="caret">▼</span></div><div class="prep-body"><div class="prep-text">${escapeHtml(text)}</div></div>`;
  el.querySelector(".prep-head").onclick = () => { prepOpen[key] = el.classList.contains("collapsed"); el.classList.toggle("collapsed"); };
  return el;
}

function scoreBoxHtml(ex, sc, day) {
  if (!hasScoreBox(ex)) return "";
  const t = ex.score.type, def = scoreDef(t);
  const side = ex.perSide && def.fromGrid ? " (each side)" : "";
  const hist = def.fromGrid ? repMaxLine(ex.name, day.date) : "";
  const prior = def.fromGrid ? [] : priorScores(ex.name, day.date);
  const last = prior.length ? prior[0] : null;
  const derived = def.fromGrid && !sc.typed && sc.val != null;
  const placeholder = derived ? fmtWeight(sc.val) : last ? String(last.val) : (def.placeholder || "");
  const input = def.kind === "text"
    ? `<input type="text" class="score-val" inputmode="numeric" placeholder="${escapeHtml(placeholder)}" value="${sc.typed ? escapeHtml(sc.val) : ""}" style="flex:0 1 110px">`
    : `<input type="number" class="score-val" inputmode="decimal" min="0" step="${def.fromGrid ? "0.5" : "1"}" placeholder="${escapeHtml(placeholder)}" value="${sc.typed ? escapeHtml(sc.val) : ""}">`;
  return `
    <div class="score-box">
      <label>${def.label}${side} ${input}${def.unit ? ` <span class="unit">${def.unit}</span>` : ""}</label>
      ${derived ? `<div class="score-hist">Heaviest set that hit the target: <b>${fmtWeight(sc.val)} lb${sc.reps != null ? ` × ${sc.reps}` : ""}</b>. Type a load only to override it.</div>` : def.fromGrid ? `<div class="score-hist">Fills itself from the heaviest set at or above ${repsStr(ex)} reps.</div>` : ""}
      ${def.fromGrid ? "" : `<input type="text" class="score-note" placeholder="${t === "deathby-minute" ? "Reps in the last minute, how it went" : "How it went"}" value="${escapeHtml(sc.note)}">`}
      ${hist ? `<div class="score-hist">Logged so far: ${hist}</div>` : ""}
      ${last ? `<div class="score-hist">Last (${last.where}${last.date ? " · " + shortDate(last.date) : ""}): <b>${def.prefix || ""}${escapeHtml(last.val)}${def.unit && def.unit !== "lb" ? " " + def.unit : ""}</b>${last.note ? ` · ${escapeHtml(last.note)}` : ""} · beat it</div>` : ""}
    </div>`;
}

function renderRow(day, ex, idx, st, total) {
  const ds = dayState(day.date, false);
  const k = day.date;
  const ck = "m" + idx;
  const isDone = !!(ds && ds.completed[ck]);
  const spec = specOf(ex);
  const scoreOnly = false;   // every row logs on the grid
  const log = SL.normLog(ds && ds.logs[idx], scoreOnly ? 0 : spec.sets);
  const sc = scoreOf(ds, idx, ex);
  const slotName = SLOT[ex.slot] || ex.slot || "";

  // Timer button: a rest countdown on lifts, a running clock with a beep every minute on a Death By.
  const tKey = `${k}_${idx}`;
  const deathBy = ex.score && ex.score.type === "deathby-minute";
  const hasTimer = deathBy || !!spec.rest;
  const timerLabel = deathBy ? "⏱ Clock" : !spec.rest ? "" : spec.rest >= 120 ? `⏱ ${fmtClock(spec.rest)}` : `⏱ ${spec.rest}s`;
  function tapTimer(btn) {
    if (activeTimers[tKey]) tapActiveTimer(tKey);
    else if (deathBy) startWatch(tKey, btn, 60);
    else startCountdown(tKey, btn, spec.rest);
  }

  const el = document.createElement("div");
  el.className = "hs-row hs-" + st;
  el.dataset.idx = idx;
  el.dataset.key = tKey;

  if (st !== "now") {
    const live = !!activeTimers[tKey];
    const doneTxt = [isGridScore(ex) ? scoreText(ex, sc) : [scoreText(ex, sc), loggedRx(ex, spec, log)].filter(Boolean).join(" · ")].filter(Boolean)[0] || loggedRx(ex, spec, log) || shortRx(ex, spec);
    const right = live ? `<button type="button" class="btn btn-timer row-timer" data-default="${timerLabel}">${timerLabel}</button>`
      : st === "done" ? escapeHtml(doneTxt) : "";
    const ltNext = st === "next" ? lastTimeText(ex, day, spec) : "";
    el.innerHTML = `
      <div class="hs-row-sum" role="button" tabindex="0">
        <span class="hs-mark">${st === "done" ? ICON.check : ""}</span>
        <span class="hs-sum-t"><b>${escapeHtml(ex.name)}</b><small><span class="ex-tag">${slotName}</span>${st === "next" ? escapeHtml(shortRx(ex, spec)) : ""}${ltNext ? `<span class="fba-sum-last">Last · ${escapeHtml(ltNext)}</span>` : ""}</small></span>
        ${right ? `<span class="hs-sum-r">${right}</span>` : ""}
      </div>`;
    const sum = el.querySelector(".hs-row-sum");
    const pick = () => { tappedNow[k] = idx; renderDay(day); revealNow(day); };
    sum.addEventListener("click", e => { if (!e.target.closest(".btn")) pick(); });
    sum.addEventListener("keydown", e => { if (e.target === sum && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pick(); } });
    if (live) { const tb = el.querySelector(".row-timer"); reattachTimer(tKey, tb); tb.onclick = () => tapTimer(tb); }
    return el;
  }

  // Last line (real history first, else the Chalk-shown load) and the coach
  let lastHtml = "", weekHtml = "", sugg = null;
  if (!scoreOnly) {
    const hist = priorEntries(ex.name, day.date, ex);
    if (hist.length) {
      const L = hist[0];
      lastHtml = lastTimeHtml(ex, day, spec, hist);
      weekHtml = L.seed ? "" : weekOverHtml(L, spec, day);   // the seed line already says it came from Chalk
    }
    sugg = suggestNext(ex, day, spec);
  }
  const suggHtml = SL.suggestHtml(sugg);
  const hasNotes = !!(log.notes && log.notes.trim());
  const unsureHtml = ex.unsure ? `<div class="ex-unsure">${ex.instruction ? "Not fully captured" : "Instruction not captured"} · ${escapeHtml(ex.unsure)}</div>` : "";

  el.innerHTML = `
    <div class="hs-row-full">
      <div class="hs-now-eyebrow">Now · ${idx + 1} of ${total} · ${slotName}</div>
      <div class="ex-name">${escapeHtml(ex.name)}</div>
      <div class="ex-prescription">${rxText(ex, spec)}</div>
      ${instructionText(ex) ? `<div class="ex-instruction">${escapeHtml(instructionText(ex))}</div>` : ""}
      ${Array.isArray(ex.alternates) && ex.alternates.length ? `<div class="ex-alt">Alternate: ${ex.alternates.map(escapeHtml).join(", ")}</div>` : ""}
      ${unsureHtml}
      ${lastHtml || suggHtml ? `<div class="hs-lastbox">${lastHtml}${weekHtml}${suggHtml}</div>` : ""}
      ${scoreOnly ? "" : `
      <div class="ex-log open">
        ${SL.gridHtml(log, spec, sugg)}
        <textarea class="log-notes" placeholder="Notes: form, tempo, RPE, how it felt..."${hasNotes ? "" : " hidden"}>${escapeHtml(log.notes)}</textarea>
      </div>`}
      ${scoreBoxHtml(ex, sc, day)}
      <div class="hs-tools">
        <a class="btn" href="${ex.videoUrl ? escapeHtml(ex.videoUrl) : v(ex.name)}" target="_blank" rel="noopener">${ICON.video}${ex.videoUrl ? "▶ Video" : "Video"}</a>
        ${scoreOnly ? "" : `<button type="button" class="btn hs-note-btn">${ICON.note}Note</button>`}
        ${hasTimer ? `<button type="button" class="btn btn-timer row-timer" data-default="${timerLabel}">${timerLabel}</button>` : ""}
        <button type="button" class="btn hs-done-btn${isDone ? " on" : ""}" aria-pressed="${isDone}">${ICON.check}Done</button>
      </div>
    </div>`;

  el.querySelector(".hs-done-btn").onclick = () => {
    const d = dayState(day.date, true);
    d.completed[ck] = !isDone;
    if (!isDone) { stampDate(d); if (tappedNow[k] === idx) delete tappedNow[k]; }
    saveState(); renderDay(day); renderWeekBar();
    if (!isDone) revealNow(day);
  };

  function ensureLog() {
    const d = dayState(day.date, true);
    d.logs[idx] = SL.normLog(d.logs[idx], spec.sets);
    stampDate(d);
    return d.logs[idx];
  }
  function ensureScore() {
    const d = dayState(day.date, true);
    d.scores[idx] = d.scores[idx] || {};
    stampDate(d);
    return d.scores[idx];
  }

  if (!scoreOnly) {
    // A Death By runs on its own clock and a row with no restSec gets no rest bar (SetLog would default to 90 s).
    SL.wireGrid(el, { spec, sugg, getLog: ensureLog, save: saveState, rerender: () => renderDay(day), noRest: () => deathBy || !spec.rest });
    const notes = el.querySelector(".log-notes");
    notes.addEventListener("input", e => { ensureLog().notes = e.target.value; saveState(); });
    el.querySelector(".hs-note-btn").onclick = () => { notes.hidden = !notes.hidden; if (!notes.hidden) notes.focus(); };
  }
  const sv = el.querySelector(".score-val");
  if (sv) sv.addEventListener("input", e => { const raw = e.target.value.trim(); ensureScore().val = raw === "" ? null : sv.type === "text" ? raw : parseFloat(raw); saveState(); });
  const sn = el.querySelector(".score-note");
  if (sn) sn.addEventListener("input", e => { ensureScore().note = e.target.value; saveState(); });

  const tBtn = el.querySelector(".row-timer");
  if (tBtn) { reattachTimer(tKey, tBtn); tBtn.onclick = () => tapTimer(tBtn); }
  return el;
}

/* What was logged, compact: "3 × 12 @ 104 lb" when every set matches, else SetLog's own text. */
function loggedRx(ex, spec, log) {
  if (!SL.hasSets(log)) return null;
  const sets = log.sets.filter(x => x.r != null || x.w != null);
  const same = sets.length > 1 && sets.every(x => x.r === sets[0].r && x.w === sets[0].w);
  if (same && sets[0].r != null) return `${sets.length} × ${sets[0].r}${spec.unit === "s" ? " s" : ""}${sets[0].w != null ? " @ " + fmtLoad(sets[0].w, spec.bw) : ""}`;
  return SL.lastText(SL.entry(log, spec), spec);
}
function revealNow(day) {
  const el = document.querySelector(`#container-${day.date} .hs-now`);
  if (!el || !el.offsetParent) return;
  const sc = el.closest(".fba-lane-scroll");
  if (sc) {   // board: the lane scrolls, not the window
    const y = el.getBoundingClientRect().top - sc.getBoundingClientRect().top;
    if (y < 0 || y > sc.clientHeight * 0.6) sc.scrollTo({ top: Math.max(0, sc.scrollTop + y - 6), behavior: "smooth" });
    return;
  }
  const bar = document.querySelector(".appbar");
  const top = el.getBoundingClientRect().top - (bar ? bar.getBoundingClientRect().bottom : 0) - 8;
  if (top < 0 || top > window.innerHeight * 0.6) window.scrollBy({ top, behavior: "smooth" });
}

/* ---------------------------------------------------------------------------
   CONDITIONING DAY: modality, warm-up, the countdown, a distance score.
   The clock's truth is in state (endsAt while running, left while paused), so
   a reload or a re-render keeps counting.
   --------------------------------------------------------------------------- */
const condIvs = {};
/* cardSlot: where the countdown card goes; the board passes its rail, the phone leaves it in the pane. */
function renderConditioning(day, container, cardSlot) {
  const ds = dayState(day.date, false);
  const c = (ds && ds.cond) || {};
  const done = ds && ds.completed.cond ? 1 : 0;
  const dur = (day.work && day.work.durationSec) || 0;
  const head = sessHead(day, day.title || "Conditioning", done, 1);
  const ctl = sessCtl(day);
  container.appendChild(head);
  container.appendChild(ctl);
  if (!boardMode()) wireClock(day, head.querySelector(".hs-sess-clock"), ctl.querySelector(".hs-sess-pace"));
  if (day.warmup && day.warmup.length) container.appendChild(renderPrep(day, "Warm-up", "wu", day.warmup));

  if (day.note) container.appendChild(collapsible("Coach's note for today", day.note, `note_${day.date}`));
  const prior = priorCond(day.title, day.date);
  const last = prior.length ? prior[0] : null;
  const sdef = scoreDef((day.score || {}).type);
  const unit = (day.score && day.score.unit) || sdef.unit || "";
  const hasClock = dur > 0;
  const card = document.createElement("div");
  card.className = "cond-card" + (c.finished ? " finished" : "");
  // On the board the coach's text reads in the lane; the rail card keeps the chooser, the clock and the score.
  const textHtml = day.text ? `<div class="cond-text">${escapeHtml(day.text)}</div>` : "";
  if (cardSlot && textHtml) { const tx = document.createElement("div"); tx.className = "rest-card"; tx.innerHTML = `<div class="eyebrow">The workout</div>${textHtml}`; container.appendChild(tx); }
  card.innerHTML = `
    <div class="hs-now-eyebrow">Work${hasClock ? ` · ${fmtClock(dur)} nonstop` : ""}</div>
    <div class="ex-name" style="font-size:20px;font-weight:700">${escapeHtml(day.title || "Conditioning")}</div>
    ${cardSlot ? "" : textHtml}
    ${day.work && day.work.instruction ? `<div class="cond-instruction">${escapeHtml(day.work.instruction)}</div>` : ""}
    ${day.modalities && day.modalities.length ? `<div class="hs-section-label" style="margin:12px 0 2px">Modality</div>
    <div class="seg">${day.modalities.map(m => `<button type="button" data-m="${escapeHtml(m)}" class="${c.modality === m ? "on" : ""}">${escapeHtml(m)}</button>`).join("")}</div>` : ""}
    ${hasClock ? `
    <div class="clock-wrap">
      <div class="clock-big" id="cond-clock-${day.date}">${fmtClock(dur)}</div>
      <div class="clock-sub" id="cond-sub-${day.date}">Tap Start when the warm-up is done</div>
    </div>
    <div class="clock-bar"><i id="cond-bar-${day.date}"></i></div>
    <div class="clock-ctl">
      <button type="button" class="btn btn-primary" data-act="toggle">Start</button>
      <button type="button" class="btn" data-act="reset">Reset</button>
    </div>` : ""}
    <div class="score-box" style="margin-top:14px">
      <label>${sdef.label} ${sdef.kind === "text"
        ? `<input type="text" class="score-val" inputmode="numeric" placeholder="${last ? escapeHtml(last.val) : escapeHtml(sdef.placeholder || "")}" value="${c.score != null ? escapeHtml(c.score) : ""}" style="flex:0 1 110px">`
        : `<input type="number" class="score-val" inputmode="numeric" min="0" step="1" placeholder="${last ? escapeHtml(last.val) : escapeHtml(unit || "score")}" value="${c.score != null ? escapeHtml(c.score) : ""}">`}${unit ? ` <span class="unit">${escapeHtml(unit)}</span>` : ""}</label>
      <input type="text" class="score-note" placeholder="Pace, how it felt" value="${escapeHtml(c.note || "")}">
      ${last ? `<div class="score-hist">Last (${last.where}${last.date ? " · " + shortDate(last.date) : ""}${last.modality ? " · " + escapeHtml(last.modality) : ""}): <b>${typeof last.val === "number" ? fmtNum(last.val) : escapeHtml(last.val)}${unit ? " " + escapeHtml(unit) : ""}</b> · beat it</div>` : ""}
      ${day.score && day.score.note ? `<div class="cond-hint">${escapeHtml(day.score.note)}</div>` : ""}
    </div>
    <div class="hs-tools">
      <button type="button" class="btn hs-done-btn${done ? " on" : ""}" aria-pressed="${!!done}">${ICON.check}Done</button>
    </div>`;
  (cardSlot || container).appendChild(card);

  const ensure = () => { const d = dayState(day.date, true); d.cond = d.cond || {}; stampDate(d); return d.cond; };
  card.querySelectorAll(".seg button").forEach(b => b.onclick = () => { const cc = ensure(); cc.modality = cc.modality === b.dataset.m ? null : b.dataset.m; saveState(); renderDay(day); });
  const scoreInp = card.querySelector(".score-val");
  scoreInp.addEventListener("input", e => { const raw = e.target.value.trim(); ensure().score = raw === "" ? null : scoreInp.type === "text" ? raw : parseInt(raw, 10); saveState(); });
  card.querySelector(".score-note").addEventListener("input", e => { ensure().note = e.target.value; saveState(); });
  card.querySelector(".hs-done-btn").onclick = () => {
    const d = dayState(day.date, true);
    d.completed.cond = !done;
    if (!done) stampDate(d);
    saveState(); renderDay(day); renderWeekBar();
  };

  // The countdown (only when the piece has a fixed length)
  if (!hasClock) return;
  const big = card.querySelector(`#cond-clock-${day.date}`);
  const sub = card.querySelector(`#cond-sub-${day.date}`);
  const bar = card.querySelector(`#cond-bar-${day.date}`);
  const toggle = card.querySelector("[data-act=toggle]");
  const resetBtn = card.querySelector("[data-act=reset]");
  function left() {
    const cc = (dayState(day.date, false) || {}).cond || {};
    if (cc.endsAt) return Math.max(0, Math.round((cc.endsAt - Date.now()) / 1000));
    if (cc.left != null) return cc.left;
    return dur;
  }
  function paint() {
    const cc = (dayState(day.date, false) || {}).cond || {};
    const l = left();
    const running = !!cc.endsAt && l > 0;
    big.textContent = fmtClock(l);
    big.classList.toggle("running", running);
    big.classList.toggle("zero", l === 0 && (!!cc.finished || !!cc.endsAt));
    bar.style.width = dur ? `${Math.min(100, (1 - l / dur) * 100).toFixed(1)}%` : "0%";
    toggle.textContent = running ? "Pause" : cc.left != null && cc.left > 0 && cc.left < dur ? "Resume" : l === 0 ? "Done" : "Start";
    sub.textContent = running ? `${fmtClock(dur - l)} in · hold the pace` : cc.finished || (cc.endsAt && l === 0) ? "Time. Log the distance." : cc.left != null && cc.left < dur ? "Paused" : "Tap Start when the warm-up is done";
    if (cc.endsAt && l === 0 && !cc.finished) {
      const d = dayState(day.date, true); d.cond.finished = true; d.cond.endsAt = null; d.cond.left = 0; saveState();
      beepDone(); card.classList.add("finished");
    }
  }
  function syncIv() {
    if (condIvs[day.date]) { clearInterval(condIvs[day.date]); delete condIvs[day.date]; }
    const cc = (dayState(day.date, false) || {}).cond || {};
    if (cc.endsAt) condIvs[day.date] = setInterval(paint, 250);
  }
  toggle.onclick = () => {
    ensureAudio(); if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    const cc = ensure();
    if (cc.endsAt) { cc.left = left(); cc.endsAt = null; }            // pause
    else if (left() > 0) { cc.endsAt = Date.now() + left() * 1000; cc.finished = false; if (!cc.startedAt) cc.startedAt = Date.now(); }   // start / resume
    saveState(); syncIv(); paint();
  };
  resetBtn.onclick = () => {
    const cc = ensure();
    if ((cc.endsAt || (cc.left != null && cc.left < dur)) && !confirm("Reset the clock?")) return;
    cc.endsAt = null; cc.left = null; cc.finished = false; cc.startedAt = null;
    saveState(); syncIv(); paint(); card.classList.remove("finished");
  };
  syncIv(); paint();
}

/* ---------------------------------------------------------------------------
   LAST-TIME REFERENCE (2026-10-24, Ryan's addition to the iPad register). The
   most useful prior session of an exercise, matched by SL.normName across
   every cycle: the most recent logged session before this day. It reads
   "last week" when that session was within the past 7 days (so last week's
   session wins whenever it exists), else "W2 · Aug 3 cycle". The Chalk seed
   (lastLoadLb) shows only when nothing is logged here, labelled as such.
   priorEntries() already orders real logs newest first with the seed last, so
   the coach's fill (sugg.weight) prefills from the same session.
   --------------------------------------------------------------------------- */
function lastTimeOf(ex, day, hist) {
  hist = hist || priorEntries(ex.name, day.date, ex);
  if (!hist.length) return null;
  const L = hist[0];
  if (L.seed) return { seed: true, weight: L.weight, entry: L };
  const diff = Math.round((Date.parse(day.date + "T12:00:00") - Date.parse(L.date + "T12:00:00")) / 864e5);
  const lastWeek = diff >= 0 && diff <= 7;
  const ctx = lastWeek ? "last week" : `W${dayWeek(L.day)} · ${monthLabel(L.day.cycle.startDate)} cycle`;
  return { seed: false, entry: L, date: L.date, lastWeek, ctx };
}
/* One line for the tracker row and the Up next summary: "last wk · 12, 12, 12 @ 104 lb". */
function lastTimeText(ex, day, spec) {
  const lt = lastTimeOf(ex, day);
  if (!lt) return "";
  if (lt.seed) return `Chalk ${fmtLoad(lt.weight, spec.bw)} · not logged here`;
  return `${lt.lastWeek ? "last wk" : lt.ctx.replace(" cycle", "")} · ${SL.lastText(lt.entry, spec)}`;
}
/* The prominent block in the Now card. A newer stack set still wins, through SL.lastHtml, as everywhere in the library. */
function lastTimeHtml(ex, day, spec, hist) {
  const lt = lastTimeOf(ex, day, hist);
  if (!lt) return "";
  if (SL.stackNewer(ex.name, lt.seed ? null : lt.date)) return SL.lastHtml(lt.entry, spec, "");
  if (lt.seed) return `<div class="fba-last seed"><span class="k">Last · from Chalk, not logged here</span><span class="v">Chalk showed ${fmtLoad(lt.weight, spec.bw)} the last time you logged it there</span></div>`;
  const e = lt.entry;
  const flag = spec.isMax ? "" : e.hit === true ? ` <span class="ex-hit-flag yes">hit</span>` : e.hit === false ? ` <span class="ex-hit-flag no">short</span>` : "";
  return `<div class="fba-last"><span class="k">Last time · ${escapeHtml(lt.ctx)} · ${monthLabel(e.date)}</span><span class="v">${escapeHtml(SL.lastText(e, spec))}${flag}</span></div>`;
}

/* ---------------------------------------------------------------------------
   iPad BOARD (2026-10-24). At Father & Son's breakpoint a strength or
   conditioning day renders as a board: the lane on the left is the page as
   the phone draws it, in its own scroller; the rail on the right stacks the
   session clock with the planned-time timeline, the rest ring and the
   workout tracker (the countdown card on a conditioning day). Rendering only:
   state, payloads and the phone layout do not change. Register:
   KARL_DATA/outputs/personal/workout-trackers/full-body-aesthetics/DESIGN-BRIEF-2026-10-24.md
   --------------------------------------------------------------------------- */
const LANE_MQ = window.matchMedia("(min-width: 740px) and (min-height: 600px)");
function boardMode() { return LANE_MQ.matches; }
const laneScroll = {};      // date → the lane's scrollTop, kept across re-renders
let jumpIdx = null;         // set by a tap on the timeline or tracker: the next render scrolls the lane there
let railMoreOpen = false;   // portrait: the tracker drawer
const SLOT_SHORT = { main: "Main", chest: "Chest", back: "Back", legs: "Legs", shoulders: "Shldr", biceps: "Bi", triceps: "Tri", abs: "Abs", closer: "Closer" };
const SCORE_TITLE = { "deathby-minute": "Death By", "amrap-reps": "Max reps", "ladder-reps": "Ladder", "for-time": "For time", "load": "Top load", "repmax-load": "Rep max" };

function setBoardTop() {
  const bar = document.querySelector(".appbar");
  document.documentElement.style.setProperty("--fba-top", `${bar ? bar.getBoundingClientRect().height : 60}px`);
}
function scrollBoardIntoView(date) {
  if (!boardMode()) return;
  const el = document.getElementById("container-" + date);
  if (!el || !el.offsetParent || !el.classList.contains("fba-wide-board")) return;
  setBoardTop();
  const bar = document.querySelector(".appbar");
  const top = el.getBoundingClientRect().top + window.scrollY - (bar ? bar.getBoundingClientRect().height : 0);
  window.scrollTo({ top: Math.max(0, top), behavior: "auto" });
}
/* The row the Now card shows: the tapped one, else the first not marked Done (same rule as the phone). */
function nowIndex(day) {
  if (day.type !== "strength") return -1;
  const ds = dayState(day.date, false), k = day.date, rows = day.exercises;
  return tappedNow[k] != null && tappedNow[k] < rows.length ? tappedNow[k] : rows.findIndex((_, i) => !(ds && ds.completed["m" + i]));
}
/* One state per prescribed set: done (checked, or the row's Done button is on), part (a number typed), "" (empty). */
function setStates(ds, idx, spec) {
  const done = !!(ds && ds.completed["m" + idx]);
  const log = SL.normLog(ds && ds.logs[idx], spec.sets);
  return log.sets.slice(0, spec.sets).map(x => done || x.d ? "done" : (x.r != null || x.w != null) ? "part" : "");
}
function rowFinished(ds, idx, spec) { const st = setStates(ds, idx, spec); return st.length > 0 && st.every(s => s === "done"); }
function dotsHtml(states) { return `<span class="fba-dots">${states.map(s => `<i class="fba-dot ${s}"></i>`).join("")}</span>`; }

/* Planned seconds from the page's own model (rowSecs: ramp + sets × set time + rests + 45 s; closer 8 min;
   warm-up 6 min), as the catalog and the session header already use it. Sets carry no timestamps yet, so
   the estimate does not learn from logged data; see the build report. */
function dayPlan(day) {
  const segs = [{ kind: "wu", label: "WU", name: "Warm-up", secs: 6 * 60 }];
  let at = 6 * 60;
  const offsets = [];
  if (day.type === "strength") {
    day.exercises.forEach((ex, i) => {
      const s = rowSecs(ex, specOf(ex));
      offsets[i] = at;
      segs.push({ kind: "ex", idx: i, label: ex.closer ? "Closer" : SLOT_SHORT[ex.slot] || ex.slot || "", name: ex.name, secs: s });
      at += s;
    });
    return { segs, offsets, total: at };
  }
  const d = (day.work && day.work.durationSec) || 0;
  segs.push({ kind: "cond", label: day.title || "Work", name: day.title || "Conditioning", secs: d || 20 * 60 });
  return { segs, offsets, total: d ? at + d : null };
}
/* Ahead or behind: elapsed against the planned offset of the first unfinished row, plus the share of its sets done. */
function paceText(day, elapsed, cur) {
  if (isDayComplete(day)) return `done in ${fmtClock(elapsed)}`;
  if (cur.clockStop) return "clock stopped";
  const plan = dayPlan(day);
  if (plan.total == null) return "";
  const target = `planned ${fmtMins(plan.total).replace("~", "")}`;
  if (day.type !== "strength") return `${Math.round(elapsed / 60)} of ${fmtMins(plan.total).replace("~", "")} in`;
  const ds = dayState(day.date, false);
  const rows = day.exercises;
  const next = rows.findIndex((ex, i) => !rowFinished(ds, i, specOf(ex)));
  if (next < 0) return target;
  const spec = specOf(rows[next]);
  const st = setStates(ds, next, spec);
  const frac = st.length ? st.filter(s => s === "done").length / st.length : 0;
  if (next === 0 && frac === 0) return target;
  const delta = Math.round((plan.offsets[next] + frac * rowSecs(rows[next], spec) - elapsed) / 60);
  return `${delta >= 1 ? `${delta} min ahead` : delta <= -1 ? `${-delta} min behind` : "on pace"} · ${target}`;
}

function renderBoard(day, container) {
  const was = container.querySelector(".fba-lane-scroll");
  if (was) laneScroll[day.date] = was.scrollTop;
  container.innerHTML = "";
  container.className = "fba-board fba-wide-board";
  setBoardTop();
  const cols = document.createElement("div"); cols.className = "fba-cols";
  const lane = document.createElement("section"); lane.className = "fba-lane";
  const sc = document.createElement("div"); sc.className = "fba-lane-scroll";
  lane.appendChild(sc);
  const rail = document.createElement("aside");
  rail.className = "fba-rail" + (railMoreOpen ? " more-open" : "") + (day.type === "conditioning" ? " fba-cond" : "");
  const main = document.createElement("div"); main.className = "fba-rail-main";
  const more = document.createElement("div"); more.className = "fba-rail-more";
  rail.appendChild(main); rail.appendChild(more);
  cols.appendChild(lane); cols.appendChild(rail);
  container.appendChild(cols);

  main.appendChild(renderClockCard(day));
  if (day.type === "strength") {
    renderStrength(day, sc);
    main.appendChild(renderRestCard(day));
    main.appendChild(renderTracker(day));
    main.appendChild(renderStrip(day));
    if (railMoreOpen) more.appendChild(renderTracker(day));
  } else {
    renderConditioning(day, sc, main);   // the countdown and modality chooser take the tracker's place
  }
  wireClock(day, main.querySelector(".fba-rail-clock"), main.querySelector(".fba-rail-pace"), () => paintTimeline(day));

  // Scroll: a timeline or tracker tap wins, else where the lane was.
  const prev = laneScroll[day.date];
  if (prev != null) sc.scrollTop = prev;
  if (jumpIdx != null) {
    const target = jumpIdx === "wu" ? sc.querySelector(".prep") : sc.querySelector(`.hs-row[data-idx="${jumpIdx}"]`);
    if (target) sc.scrollTop = Math.max(0, target.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 6);
    jumpIdx = null;
  }
  laneScroll[day.date] = sc.scrollTop;
  paintTimeline(day);
  paintRestRing();
}

/* The dark clock card: session clock, planned total and pace, the timeline (one segment per slot, sized by
   planned minutes, playhead at elapsed, tap to jump). */
function renderClockCard(day) {
  const plan = dayPlan(day);
  const el = document.createElement("div");
  el.className = "fba-clock-card";
  const title = day.type === "conditioning" ? (day.title || "Conditioning") : (day.title || (day.exercises.find(x => x.slot === "main") || {}).name || "Lift");
  el.innerHTML = `
    <button type="button" class="fba-rail-top" aria-label="Show the week and tabs">Week ${dayWeek(day)} · ${DOW_FULL[day.dow] || day.dow} · ${shortDate(day.date)} ↑</button>
    <div class="fba-clock-title">${escapeHtml(title)}</div>
    <button type="button" class="fba-rail-clock" data-ck="rail"><span class="hs-clock-t">Start</span></button>
    <span class="fba-rail-pace"></span>
    <div class="fba-tl" role="group" aria-label="Planned session timeline">
      ${plan.segs.map(s => `<button type="button" class="fba-seg${s.kind === "wu" ? " wu" : ""}${plan.total && s.secs / plan.total < 0.14 ? " tight" : ""}" data-seg="${s.kind === "ex" ? s.idx : s.kind}" style="flex-grow:${s.secs}" title="${escapeHtml(s.name)} · ${Math.round(s.secs / 60)} min"><b>${escapeHtml(s.label)}</b>${s.kind === "wu" ? "" : `<span>${Math.round(s.secs / 60)} min</span>`}</button>`).join("")}
      <i class="fba-head" hidden></i>
    </div>
    <div class="fba-axis"><span>0:00</span><span class="fba-axis-mid"></span><span>${plan.total != null ? fmtClock(plan.total) : "open"}</span></div>`;
  el.querySelector(".fba-rail-top").onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
  el.querySelectorAll(".fba-seg").forEach(b => b.onclick = () => jumpTo(day, b.dataset.seg));
  return el;
}
function paintTimeline(day) {
  const root = document.getElementById("container-" + day.date);
  const tl = root && root.querySelector(".fba-tl");
  if (!tl) return;
  const ds = dayState(day.date, false);
  const plan = dayPlan(day);
  const elapsed = ds && ds.clockStart ? Math.round(((ds.clockStop || Date.now()) - ds.clockStart) / 1000) : null;
  const head = tl.querySelector(".fba-head");
  if (elapsed == null || plan.total == null) head.hidden = true;
  else { head.hidden = false; head.style.left = `${Math.min(100, 100 * elapsed / plan.total).toFixed(2)}%`; }
  const mid = root.querySelector(".fba-axis-mid");
  if (mid) mid.textContent = elapsed == null ? "" : `${fmtClock(elapsed)} now`;
  if (day.type !== "strength") return;
  const nowIdx = nowIndex(day);
  tl.querySelectorAll(".fba-seg[data-seg]").forEach(b => {
    const i = parseInt(b.dataset.seg, 10);
    if (isNaN(i)) return;
    b.classList.toggle("done", rowFinished(ds, i, specOf(day.exercises[i])));
    b.classList.toggle("now", i === nowIdx);
  });
}
function jumpTo(day, seg) {
  if (seg === "wu") { prepOpen[`${day.date}_wu`] = true; jumpIdx = "wu"; renderDay(day); return; }
  const idx = parseInt(seg, 10);
  if (isNaN(idx)) return;
  tappedNow[day.date] = idx; jumpIdx = idx;
  renderDay(day);
}

/* The rest ring: SetLog's rest (started by a set check) drawn as a ring. At zero it focuses the next
   undone set's reps input in the resting exercise's grid and does nothing else; the module beeps. */
function renderRestCard(day) {
  const el = document.createElement("button");
  el.type = "button"; el.className = "fba-rest-card"; el.dataset.date = day.date;
  el.setAttribute("aria-label", "Rest: tap to skip");
  const C = (2 * Math.PI * 26).toFixed(1);
  el.innerHTML = `
    <svg class="fba-ring" viewBox="0 0 60 60" aria-hidden="true"><circle class="bg" cx="30" cy="30" r="26" fill="none" stroke-width="6"/><circle class="fg" cx="30" cy="30" r="26" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 30 30)"/></svg>
    <span class="fba-rc-body"><span class="fba-rc-k">Rest</span><span class="fba-rc-t">Ready</span><span class="fba-rc-n"></span></span>`;
  el.onclick = () => SL.rest.stop();
  return el;
}
/* The resting row and its next undone set, from the rest key SetLog builds: "<name>|<date>_<idx>". */
function restTarget(day, key) {
  if (!key || day.type !== "strength") return null;
  const m = String(key).match(/\|(\d{4}-\d{2}-\d{2})_(\d+)$/);
  if (!m || m[1] !== day.date) return null;
  const idx = +m[2], ex = day.exercises[idx];
  if (!ex) return null;
  const spec = specOf(ex);
  const ds = dayState(day.date, false);
  const log = SL.normLog(ds && ds.logs[idx], spec.sets);
  const s = log.sets.findIndex(x => !x.d);
  return { idx, name: ex.name, set: s >= 0 && s < spec.sets ? s + 1 : null };
}
let ringArmed = null;   // the rest key whose zero already armed a set
function armNextSet(day, key) {
  const info = restTarget(day, key);
  if (!info || info.set == null) return;

/* ---------------------------------------------------------------------------

const sessionClocks = {};
/* btn: the clock button (its .hs-clock-t carries the time); stat: the pace line under it.
   onPaint: the board's extra painter (timeline playhead, ahead/behind line); when set, the pace
   line reads ahead/behind against the planned offsets instead of "12 of 46 min in". */
function wireClock(day, btn, stat, onPaint) {
  if (!btn) return;
  const key = `${day.date}|${btn.dataset.ck || "head"}`;
  const txt = btn.querySelector(".hs-clock-t") || btn;
  const planned = daySecs(day);
  function paint() {
    const cur = dayState(day.date, false);
    if (!cur || !cur.clockStart) {
      txt.textContent = "Start"; btn.classList.remove("running", "stopped");
      btn.setAttribute("aria-label", "Start the session clock");
      if (stat) stat.textContent = onPaint && planned != null ? `planned ${fmtMins(planned).replace("~", "")} · tap the clock to start` : "";
      if (onPaint) onPaint(null);
      return;
    }
    const elapsed = Math.round(((cur.clockStop || Date.now()) - cur.clockStart) / 1000);
    txt.textContent = fmtClock(elapsed);
    btn.classList.toggle("running", !cur.clockStop);
    btn.classList.toggle("stopped", !!cur.clockStop);
    btn.setAttribute("aria-label", cur.clockStop ? `Session clock stopped at ${fmtClock(elapsed)}, tap to reset` : `Session clock ${fmtClock(elapsed)}, tap to stop`);
    if (stat) stat.textContent = onPaint ? paceText(day, elapsed, cur) : isDayComplete(day) ? `done in ${fmtClock(elapsed)}` : cur.clockStop ? "clock stopped" : planned != null ? `${Math.round(elapsed / 60)} of ${fmtMins(planned).replace("~", "")} in` : "";
    if (onPaint) onPaint(elapsed);
  }
  function syncInterval() {
    if (sessionClocks[key]) { clearInterval(sessionClocks[key]); delete sessionClocks[key]; }
    const cur = dayState(day.date, false);
    if (cur && cur.clockStart && !cur.clockStop) sessionClocks[key] = setInterval(paint, 1000);
  }
  btn.onclick = () => {
    const cur = dayState(day.date, true);
    if (!cur.clockStart) { cur.clockStart = Date.now(); cur.clockStop = null; stampDate(cur); }
    else if (!cur.clockStop) cur.clockStop = Date.now();
    else { cur.clockStart = null; cur.clockStop = null; }
    saveState(); syncInterval(); paint();
  };
  syncInterval(); paint();
}

/* ---------------------------------------------------------------------------
   TIMERS: rest countdown and the Death By clock (a stopwatch that beeps each minute).
   --------------------------------------------------------------------------- */
const activeTimers = {};
let audioCtx = null;
function ensureAudio() {
  if (audioCtx) return audioCtx;
  try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); } catch (e) {}
  return audioCtx;
}
function tone(offsets, freqs) {
  const ctx = ensureAudio();
  if (ctx) {
    const now = ctx.currentTime;
    offsets.forEach((off, i) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = "sine"; osc.frequency.value = freqs[i] || 880;
      gain.gain.setValueAtTime(0, now + off);
      gain.gain.linearRampToValueAtTime(0.25, now + off + 0.01);
      gain.gain.linearRampToValueAtTime(0, now + off + 0.14);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + off); osc.stop(now + off + 0.16);
    });
  }
  if (navigator.vibrate) { try { navigator.vibrate(120); } catch (e) {} }
}
function beepDone() { tone([0, 0.18, 0.36], [880, 880, 1100]); if (navigator.vibrate) { try { navigator.vibrate([120, 80, 120, 80, 200]); } catch (e) {} } }
function beepPhase() { tone([0], [990]); }

function paintRunning(btn, text) { if (!btn) return; btn.classList.add("running"); btn.classList.remove("done", "paused"); btn.textContent = text; }
function paintPaused(btn, text) { if (!btn) return; btn.classList.remove("running", "done"); btn.classList.add("paused"); btn.textContent = text; }
function paintDone(btn) {
  if (!btn || !btn.isConnected) return;
  btn.classList.remove("running", "paused"); btn.classList.add("done");
  btn.textContent = "Done!";
  setTimeout(() => { if (btn && btn.isConnected) { btn.classList.remove("done"); btn.textContent = btn.dataset.default || "⏱"; } }, 1800);
}
function paintReset(btn) {
  if (!btn || !btn.isConnected) return;
  btn.classList.remove("running", "done", "paused");
  btn.textContent = btn.dataset.default || "⏱";
}
function startCountdown(key, btn, secs) {
  ensureAudio(); if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  const endsAt = Date.now() + secs * 1000;
  paintRunning(btn, fmtClock(secs));
  const iv = setInterval(() => {
    const t = activeTimers[key]; if (!t) return;
    const remaining = Math.round((t.endsAt - Date.now()) / 1000);
    if (remaining <= 0) { clearInterval(t.iv); const b = t.btn; delete activeTimers[key]; paintDone(b); beepDone(); }
    else paintRunning(t.btn, fmtClock(remaining));
  }, 250);
  activeTimers[key] = { mode: "down", endsAt, iv, btn };
}
/* Stopwatch with a beep every `every` seconds (a Death By needs the minute marks). */
function startWatch(key, btn, every) {
  ensureAudio(); if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  const t = { mode: "watch", startedAt: Date.now(), stopped: null, btn, every: every || 60, lastMark: 0 };
  paintRunning(btn, "0:00");
  t.iv = setInterval(() => {
    const cur = activeTimers[key]; if (!cur || cur.stopped != null) return;
    const el = Math.floor((Date.now() - cur.startedAt) / 1000);
    const mark = Math.floor(el / cur.every);
    if (mark > cur.lastMark) { cur.lastMark = mark; beepPhase(); }
    paintRunning(cur.btn, `${fmtClock(el)} · min ${mark + 1}`);
  }, 250);
  activeTimers[key] = t;
}
function tapActiveTimer(key) {
  const t = activeTimers[key]; if (!t) return;
  if (t.mode === "down") { clearInterval(t.iv); delete activeTimers[key]; paintReset(t.btn); return; }
  if (t.mode === "watch") {
    if (t.stopped == null) { t.stopped = Date.now(); paintPaused(t.btn, "■ " + fmtClock(Math.round((t.stopped - t.startedAt) / 1000))); }
    else { clearInterval(t.iv); delete activeTimers[key]; paintReset(t.btn); }
  }
}
function reattachTimer(key, btn) {
  const t = activeTimers[key];
  if (!btn || !t) return;
  t.btn = btn;
  if (t.mode === "down") { const remaining = Math.round((t.endsAt - Date.now()) / 1000); if (remaining > 0) paintRunning(btn, fmtClock(remaining)); }
  else if (t.mode === "watch") {
    if (t.stopped == null) { const el = Math.floor((Date.now() - t.startedAt) / 1000); paintRunning(btn, `${fmtClock(el)} · min ${Math.floor(el / t.every) + 1}`); }
    else paintPaused(btn, "■ " + fmtClock(Math.round((t.stopped - t.startedAt) / 1000)));
  }
}

    storageKey: PROGRAM.storageKey,
    payload: () => ({ state, entries: syncEntries() }),
    hasData: () => Object.keys(state.days).length > 0,
    apply: merged => { const open = currentOpenDay(); state = normState(merged); render(); openTab(open); }
  });

  buildShell();
  render();
  SL.sync.wireNotes();
  openTab(start);
  publishSummary();
}
function currentOpenDay() {
  const t = document.querySelector(".tab.active[data-day]");
  return t ? dayById(t.dataset.day) : dueDayInWeek(uiWeek);
}
boot();
</script>
</body>
</html>
