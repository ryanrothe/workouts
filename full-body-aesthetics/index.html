function renderRest(day, container) {
  const w = dayWeek(day);
  container.innerHTML = `
    <div class="hs-sess-head">
      <div class="hs-sess-eyebrow">${PROGRAM.shortName} · Week ${w} · ${DOW_FULL[day.dow] || day.dow} · ${shortDate(day.date)}</div>
      <div class="hs-sess-top"><h2 class="hs-sess-title">Rest</h2></div>
    </div>
    <div class="rest-card"><div class="eyebrow">Coach's note</div><p>${escapeHtml(day.note || "Rest day.")}</p></div>`;
}

function renderStrength(day, container) {
  const ds = dayState(day.date, false);
  const rows = day.exercises;
  const k = day.date;
  const isDoneAt = i => !!(ds && ds.completed["m" + i]);
  const done = rows.filter((_, i) => isDoneAt(i)).length;
  const main = rows.find(x => x.slot === "main");
  const title = day.title || (main ? main.name : "Lift");
  const r = rulesFor(CYC, dayWeek(day));

  const nowIdx = nowIndex(day);
  const nextIdxs = rows.map((_, i) => i).filter(i => i !== nowIdx && !isDoneAt(i));
  const afterNow = nextIdxs.find(i => i > nowIdx);
  const upNextAt = afterNow != null ? afterNow : nextIdxs[0];

  const head = sessHead(day, title, done, rows.length);
  const ctl = sessCtl(day);
  container.appendChild(head);
  container.appendChild(ctl);
  if (!boardMode()) wireClock(day, head.querySelector(".hs-sess-clock"), ctl.querySelector(".hs-sess-pace"));   // the board wires its rail clock instead

  if (day.note) container.appendChild(collapsible("Coach's note for today", day.note, `note_${day.date}`));
  const wu = (Array.isArray(day.warmup) && day.warmup.length ? day.warmup : day.cycle.warmup) || [];
  if (wu.length) container.appendChild(renderPrep(day, "Warm-up", "wu", wu));

  let seenAcc = false;
  rows.forEach((ex, idx) => {
    const st = idx === nowIdx ? "now" : isDoneAt(idx) ? "done" : "next";
    let label = "";
    if (ex.slot === "main") label = r.rm ? `Main · build to a ${r.rm}-rep max` : isGridScore(ex) && ex.score.type === "repmax-load" ? `Main · build to a ${repsStr(ex)}-rep max` : "Main lift";
    else if (ex.closer) label = "Closer · scored";
    else if (!seenAcc) { seenAcc = true; label = r.acc ? `Accessories · 3 × ${r.acc}` : "Accessories"; }
    if (idx === upNextAt) label = label ? `Up next · ${label}` : "Up next";
    if (label) {
      const lab = document.createElement("div");
      lab.className = "hs-section-label";
      lab.textContent = label;
      container.appendChild(lab);
    }
    container.appendChild(renderRow(day, ex, idx, st, rows.length));
  });
}

function renderPrep(day, title, prefix, items) {
  if (typeof items === "string") items = items.split(/\n{2,}/);
  if (!Array.isArray(items)) items = [];
  const ds = dayState(day.date, false);
  const openKey = `${day.date}_${prefix}`;
  const checks = (ds && ds[prefix]) || {};
  const doneN = items.filter((_, i) => checks[i]).length;
  const open = prepOpen[openKey] === true;   // collapsed by default (Ryan knows the warm-up)
  const el = document.createElement("div");
  el.className = "prep" + (open ? "" : " collapsed");
  el.innerHTML = `
    <div class="prep-head" role="button" tabindex="0"><span>${title} · ${doneN}/${items.length}</span><span class="caret">▼</span></div>
    <div class="prep-body">${items.map((t, i) => `
      <div class="prep-item${checks[i] ? " done" : ""}" data-i="${i}">
        <span class="prep-check"><svg viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 8 7 12 13 4"/></svg></span>
        <span>${escapeHtml(t)}</span>
      </div>`).join("")}</div>`;
  el.querySelector(".prep-head").onclick = () => { prepOpen[openKey] = el.classList.contains("collapsed"); el.classList.toggle("collapsed"); };
  el.querySelectorAll(".prep-item").forEach(it => it.onclick = () => {
    const d = dayState(day.date, true);
    d[prefix] = d[prefix] || {};
    const i = it.dataset.i;
    d[prefix][i] = !d[prefix][i];
    if (d[prefix][i]) stampDate(d);
    saveState();
    prepOpen[openKey] = true;
    renderDay(day);
  });
  return el;
}

/* A folded block of coach text (a day note, the cycle intro). Collapsed until tapped; the choice is kept per key. */
function collapsible(title, text, key) {
  const open = prepOpen[key] === true;
  const el = document.createElement("div");
  el.className = "prep" + (open ? "" : " collapsed");
  el.style.marginTop = "8px";
  el.innerHTML = `<div class="prep-head" role="button" tabindex="0"><span>${escapeHtml(title)}</span><span class="caret">▼</span></div><div class="prep-body"><div class="prep-text">${escapeHtml(text)}</div></div>`;
  el.querySelector(".prep-head").onclick = () => { prepOpen[key] = el.classList.contains("collapsed"); el.classList.toggle("collapsed"); };
  return el;
}

function scoreBoxHtml(ex, sc, day) {
  if (!hasScoreBox(ex)) return "";
  const t = ex.score.type, def = scoreDef(t);
  const side = ex.perSide && def.fromGrid ? " (each side)" : "";
  const hist = def.fromGrid ? repMaxLine(ex.name, day.date) : "";
  const prior = def.fromGrid ? [] : priorScores(ex.name, day.date);
  const last = prior.length ? prior[0] : null;
  const derived = def.fromGrid && !sc.typed && sc.val != null;
  const placeholder = derived ? fmtWeight(sc.val) : last ? String(last.val) : (def.placeholder || "");
  const input = def.kind === "text"
    ? `<input type="text" class="score-val" inputmode="numeric" placeholder="${escapeHtml(placeholder)}" value="${sc.typed ? escapeHtml(sc.val) : ""}" style="flex:0 1 110px">`
    : `<input type="number" class="score-val" inputmode="decimal" min="0" step="${def.fromGrid ? "0.5" : "1"}" placeholder="${escapeHtml(placeholder)}" value="${sc.typed ? escapeHtml(sc.val) : ""}">`;
  return `
    <div class="score-box">
      <label>${def.label}${side} ${input}${def.unit ? ` <span class="unit">${def.unit}</span>` : ""}</label>
      ${derived ? `<div class="score-hist">Heaviest set that hit the target: <b>${fmtWeight(sc.val)} lb${sc.reps != null ? ` × ${sc.reps}` : ""}</b>. Type a load only to override it.</div>` : def.fromGrid ? `<div class="score-hist">Fills itself from the heaviest set at or above ${repsStr(ex)} reps.</div>` : ""}
      ${def.fromGrid ? "" : `<input type="text" class="score-note" placeholder="${t === "deathby-minute" ? "Reps in the last minute, how it went" : "How it went"}" value="${escapeHtml(sc.note)}">`}
      ${hist ? `<div class="score-hist">Logged so far: ${hist}</div>` : ""}
      ${last ? `<div class="score-hist">Last (${last.where}${last.date ? " · " + shortDate(last.date) : ""}): <b>${def.prefix || ""}${escapeHtml(last.val)}${def.unit && def.unit !== "lb" ? " " + def.unit : ""}</b>${last.note ? ` · ${escapeHtml(last.note)}` : ""} · beat it</div>` : ""}
    </div>`;
}

function renderRow(day, ex, idx, st, total) {
  const ds = dayState(day.date, false);
  const k = day.date;
  const ck = "m" + idx;
  const isDone = !!(ds && ds.completed[ck]);
  const spec = specOf(ex);
  const scoreOnly = false;   // every row logs on the grid
  const log = SL.normLog(ds && ds.logs[idx], scoreOnly ? 0 : spec.sets);
  const sc = scoreOf(ds, idx, ex);
  const slotName = SLOT[ex.slot] || ex.slot || "";

  // Timer button: a rest countdown on lifts, a running clock with a beep every minute on a Death By.
  const tKey = `${k}_${idx}`;
  const deathBy = ex.score && ex.score.type === "deathby-minute";
  const hasTimer = deathBy || !!spec.rest;
  const timerLabel = deathBy ? "⏱ Clock" : !spec.rest ? "" : spec.rest >= 120 ? `⏱ ${fmtClock(spec.rest)}` : `⏱ ${spec.rest}s`;
  function tapTimer(btn) {
    if (activeTimers[tKey]) tapActiveTimer(tKey);
    else if (deathBy) startWatch(tKey, btn, 60);
    else startCountdown(tKey, btn, spec.rest);
  }

  const el = document.createElement("div");
  el.className = "hs-row hs-" + st;
  el.dataset.idx = idx;
  el.dataset.key = tKey;

  if (st !== "now") {
    const live = !!activeTimers[tKey];
    const doneTxt = [isGridScore(ex) ? scoreText(ex, sc) : [scoreText(ex, sc), loggedRx(ex, spec, log)].filter(Boolean).join(" · ")].filter(Boolean)[0] || loggedRx(ex, spec, log) || shortRx(ex, spec);
    const right = live ? `<button type="button" class="btn btn-timer row-timer" data-default="${timerLabel}">${timerLabel}</button>`
      : st === "done" ? escapeHtml(doneTxt) : "";
    const ltNext = st === "next" ? lastTimeText(ex, day, spec) : "";
    el.innerHTML = `
      <div class="hs-row-sum" role="button" tabindex="0">
        <span class="hs-mark">${st === "done" ? ICON.check : ""}</span>
        <span class="hs-sum-t"><b>${escapeHtml(ex.name)}</b><small><span class="ex-tag">${slotName}</span>${st === "next" ? escapeHtml(shortRx(ex, spec)) : ""}${ltNext ? `<span class="ck-sum-last">Last · ${escapeHtml(ltNext)}</span>` : ""}</small></span>
        ${right ? `<span class="hs-sum-r">${right}</span>` : ""}
      </div>`;
    const sum = el.querySelector(".hs-row-sum");
    const pick = () => { tappedNow[k] = idx; renderDay(day); revealNow(day); };
    sum.addEventListener("click", e => { if (!e.target.closest(".btn")) pick(); });
    sum.addEventListener("keydown", e => { if (e.target === sum && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pick(); } });
    if (live) { const tb = el.querySelector(".row-timer"); reattachTimer(tKey, tb); tb.onclick = () => tapTimer(tb); }
    return el;
  }

  // Last line (real history first, else the Chalk-shown load) and the coach
  let lastHtml = "", weekHtml = "", sugg = null;
  if (!scoreOnly) {
    const hist = priorEntries(ex.name, day.date, ex);
    if (hist.length) {
      const L = hist[0];
      lastHtml = lastTimeHtml(ex, day, spec, hist);
      weekHtml = L.seed ? "" : weekOverHtml(L, spec, day);   // the seed line already says it came from Chalk
    }
    sugg = suggestNext(ex, day, spec);
  }
  const suggHtml = SL.suggestHtml(sugg);
  const hasNotes = !!(log.notes && log.notes.trim());
  const unsureHtml = ex.unsure ? `<div class="ex-unsure">${ex.instruction ? "Not fully captured" : "Instruction not captured"} · ${escapeHtml(ex.unsure)}</div>` : "";

  el.innerHTML = `
    <div class="hs-row-full">
      <div class="hs-now-eyebrow">Now · ${idx + 1} of ${total} · ${slotName}</div>
      <div class="ex-name">${escapeHtml(ex.name)}</div>
      <div class="ex-prescription">${rxText(ex, spec)}</div>
      ${instructionText(ex) ? `<div class="ex-instruction">${escapeHtml(instructionText(ex))}</div>` : ""}
      ${Array.isArray(ex.alternates) && ex.alternates.length ? `<div class="ex-alt">Alternate: ${ex.alternates.map(escapeHtml).join(", ")}</div>` : ""}
      ${unsureHtml}
      ${lastHtml || suggHtml ? `<div class="hs-lastbox">${lastHtml}${weekHtml}${suggHtml}</div>` : ""}
      ${scoreOnly ? "" : `
      <div class="ex-log open">
        ${SL.gridHtml(log, spec, sugg)}
        <textarea class="log-notes" placeholder="Notes: form, tempo, RPE, how it felt..."${hasNotes ? "" : " hidden"}>${escapeHtml(log.notes)}</textarea>
      </div>`}
      ${scoreBoxHtml(ex, sc, day)}
      <div class="hs-tools">
        <a class="btn" href="${ex.videoUrl ? escapeHtml(ex.videoUrl) : v(ex.name)}" target="_blank" rel="noopener">${ICON.video}${ex.videoUrl ? "▶ Video" : "Video"}</a>
        ${scoreOnly ? "" : `<button type="button" class="btn hs-note-btn">${ICON.note}Note</button>`}
        ${hasTimer ? `<button type="button" class="btn btn-timer row-timer" data-default="${timerLabel}">${timerLabel}</button>` : ""}
        <button type="button" class="btn hs-done-btn${isDone ? " on" : ""}" aria-pressed="${isDone}">${ICON.check}Done</button>
      </div>
    </div>`;

  el.querySelector(".hs-done-btn").onclick = () => {
    const d = dayState(day.date, true);
    d.completed[ck] = !isDone;
    if (!isDone) { stampDate(d); if (tappedNow[k] === idx) delete tappedNow[k]; }
    saveState(); renderDay(day); renderWeekBar();
    if (!isDone) revealNow(day);
  };

  function ensureLog() {
    const d = dayState(day.date, true);
    d.logs[idx] = SL.normLog(d.logs[idx], spec.sets);
    stampDate(d);
    return d.logs[idx];
  }
  function ensureScore() {
    const d = dayState(day.date, true);
    d.scores[idx] = d.scores[idx] || {};
    stampDate(d);
    return d.scores[idx];
  }

  if (!scoreOnly) {
    // A Death By runs on its own clock and a row with no restSec gets no rest bar (SetLog would default to 90 s).
    SL.wireGrid(el, { spec, sugg, getLog: ensureLog, save: saveState, rerender: () => renderDay(day), noRest: () => deathBy || !spec.rest });
    const notes = el.querySelector(".log-notes");
    notes.addEventListener("input", e => { ensureLog().notes = e.target.value; saveState(); });
    el.querySelector(".hs-note-btn").onclick = () => { notes.hidden = !notes.hidden; if (!notes.hidden) notes.focus(); };
  }
  const sv = el.querySelector(".score-val");
  if (sv) sv.addEventListener("input", e => { const raw = e.target.value.trim(); ensureScore().val = raw === "" ? null : sv.type === "text" ? raw : parseFloat(raw); saveState(); });
  const sn = el.querySelector(".score-note");
  if (sn) sn.addEventListener("input", e => { ensureScore().note = e.target.value; saveState(); });

  const tBtn = el.querySelector(".row-timer");
  if (tBtn) { reattachTimer(tKey, tBtn); tBtn.onclick = () => tapTimer(tBtn); }
  return el;
}

/* What was logged, compact: "3 × 12 @ 104 lb" when every set matches, else SetLog's own text. */
function loggedRx(ex, spec, log) {
  if (!SL.hasSets(log)) return null;
  const sets = log.sets.filter(x => x.r != null || x.w != null);
  const same = sets.length > 1 && sets.every(x => x.r === sets[0].r && x.w === sets[0].w);
  if (same && sets[0].r != null) return `${sets.length} × ${sets[0].r}${spec.unit === "s" ? " s" : ""}${sets[0].w != null ? " @ " + fmtLoad(sets[0].w, spec.bw) : ""}`;
  return SL.lastText(SL.entry(log, spec), spec);
}
function revealNow(day) {
  const el = document.querySelector(`#container-${day.date} .hs-now`);
  if (!el || !el.offsetParent) return;
  if (CK.revealNow(el)) return;   // board: the lane scrolls, not the window
  const bar = document.querySelector(".appbar");
  const top = el.getBoundingClientRect().top - (bar ? bar.getBoundingClientRect().bottom : 0) - 8;
  if (top < 0 || top > window.innerHeight * 0.6) window.scrollBy({ top, behavior: "smooth" });
}

/* ---------------------------------------------------------------------------
   CONDITIONING DAY: modality, warm-up, the countdown, a distance score.
   The clock's truth is in state (endsAt while running, left while paused), so
   a reload or a re-render keeps counting.
   --------------------------------------------------------------------------- */
const condIvs = {};
/* cardSlot: where the countdown card goes; the board passes its rail, the phone leaves it in the pane. */
function renderConditioning(day, container, cardSlot) {
  const ds = dayState(day.date, false);
  const c = (ds && ds.cond) || {};
  const done = ds && ds.completed.cond ? 1 : 0;
  const dur = (day.work && day.work.durationSec) || 0;
  const head = sessHead(day, day.title || "Conditioning", done, 1);
  const ctl = sessCtl(day);
  container.appendChild(head);
  container.appendChild(ctl);
  if (!boardMode()) wireClock(day, head.querySelector(".hs-sess-clock"), ctl.querySelector(".hs-sess-pace"));
  if (day.warmup && day.warmup.length) container.appendChild(renderPrep(day, "Warm-up", "wu", day.warmup));

  if (day.note) container.appendChild(collapsible("Coach's note for today", day.note, `note_${day.date}`));
  const prior = priorCond(day.title, day.date);
  const last = prior.length ? prior[0] : null;
  const sdef = scoreDef((day.score || {}).type);
  const unit = (day.score && day.score.unit) || sdef.unit || "";
  const hasClock = dur > 0;
  const card = document.createElement("div");
  card.className = "cond-card" + (c.finished ? " finished" : "");
  // On the board the coach's text reads in the lane; the rail card keeps the chooser, the clock and the score.
  const textHtml = day.text ? `<div class="cond-text">${escapeHtml(day.text)}</div>` : "";
  if (cardSlot && textHtml) { const tx = document.createElement("div"); tx.className = "rest-card"; tx.innerHTML = `<div class="eyebrow">The workout</div>${textHtml}`; container.appendChild(tx); }
  card.innerHTML = `
    <div class="hs-now-eyebrow">Work${hasClock ? ` · ${fmtClock(dur)} nonstop` : ""}</div>
    <div class="ex-name" style="font-size:20px;font-weight:700">${escapeHtml(day.title || "Conditioning")}</div>
    ${cardSlot ? "" : textHtml}
    ${day.work && day.work.instruction ? `<div class="cond-instruction">${escapeHtml(day.work.instruction)}</div>` : ""}
    ${day.modalities && day.modalities.length ? `<div class="hs-section-label" style="margin:12px 0 2px">Modality</div>
    <div class="seg">${day.modalities.map(m => `<button type="button" data-m="${escapeHtml(m)}" class="${c.modality === m ? "on" : ""}">${escapeHtml(m)}</button>`).join("")}</div>` : ""}
    ${hasClock ? `
    <div class="clock-wrap">
      <div class="clock-big" id="cond-clock-${day.date}">${fmtClock(dur)}</div>
      <div class="clock-sub" id="cond-sub-${day.date}">Tap Start when the warm-up is done</div>
    </div>
    <div class="clock-bar"><i id="cond-bar-${day.date}"></i></div>
    <div class="clock-ctl">
      <button type="button" class="btn btn-primary" data-act="toggle">Start</button>
      <button type="button" class="btn" data-act="reset">Reset</button>
    </div>` : ""}
    <div class="score-box" style="margin-top:14px">
      <label>${sdef.label} ${sdef.kind === "text"
        ? `<input type="text" class="score-val" inputmode="numeric" placeholder="${last ? escapeHtml(last.val) : escapeHtml(sdef.placeholder || "")}" value="${c.score != null ? escapeHtml(c.score) : ""}" style="flex:0 1 110px">`
        : `<input type="number" class="score-val" inputmode="numeric" min="0" step="1" placeholder="${last ? escapeHtml(last.val) : escapeHtml(unit || "score")}" value="${c.score != null ? escapeHtml(c.score) : ""}">`}${unit ? ` <span class="unit">${escapeHtml(unit)}</span>` : ""}</label>
      <input type="text" class="score-note" placeholder="Pace, how it felt" value="${escapeHtml(c.note || "")}">
      ${last ? `<div class="score-hist">Last (${last.where}${last.date ? " · " + shortDate(last.date) : ""}${last.modality ? " · " + escapeHtml(last.modality) : ""}): <b>${typeof last.val === "number" ? fmtNum(last.val) : escapeHtml(last.val)}${unit ? " " + escapeHtml(unit) : ""}</b> · beat it</div>` : ""}
      ${day.score && day.score.note ? `<div class="cond-hint">${escapeHtml(day.score.note)}</div>` : ""}
    </div>
    <div class="hs-tools">
      <button type="button" class="btn hs-done-btn${done ? " on" : ""}" aria-pressed="${!!done}">${ICON.check}Done</button>
    </div>`;
  (cardSlot || container).appendChild(card);

  const ensure = () => { const d = dayState(day.date, true); d.cond = d.cond || {}; stampDate(d); return d.cond; };
  card.querySelectorAll(".seg button").forEach(b => b.onclick = () => { const cc = ensure(); cc.modality = cc.modality === b.dataset.m ? null : b.dataset.m; saveState(); renderDay(day); });
  const scoreInp = card.querySelector(".score-val");
  scoreInp.addEventListener("input", e => { const raw = e.target.value.trim(); ensure().score = raw === "" ? null : scoreInp.type === "text" ? raw : parseInt(raw, 10); saveState(); });
  card.querySelector(".score-note").addEventListener("input", e => { ensure().note = e.target.value; saveState(); });
  card.querySelector(".hs-done-btn").onclick = () => {
    const d = dayState(day.date, true);
    d.completed.cond = !done;
    if (!done) stampDate(d);
    saveState(); renderDay(day); renderWeekBar();
  };

  // The countdown (only when the piece has a fixed length)
  if (!hasClock) return;
  const big = card.querySelector(`#cond-clock-${day.date}`);
  const sub = card.querySelector(`#cond-sub-${day.date}`);
  const bar = card.querySelector(`#cond-bar-${day.date}`);
  const toggle = card.querySelector("[data-act=toggle]");
  const resetBtn = card.querySelector("[data-act=reset]");
  function left() {
    const cc = (dayState(day.date, false) || {}).cond || {};
    if (cc.endsAt) return Math.max(0, Math.round((cc.endsAt - Date.now()) / 1000));
    if (cc.left != null) return cc.left;
    return dur;
  }
  function paint() {
    const cc = (dayState(day.date, false) || {}).cond || {};
    const l = left();
    const running = !!cc.endsAt && l > 0;
    big.textContent = fmtClock(l);
    big.classList.toggle("running", running);
    big.classList.toggle("zero", l === 0 && (!!cc.finished || !!cc.endsAt));
    bar.style.width = dur ? `${Math.min(100, (1 - l / dur) * 100).toFixed(1)}%` : "0%";
    toggle.textContent = running ? "Pause" : cc.left != null && cc.left > 0 && cc.left < dur ? "Resume" : l === 0 ? "Done" : "Start";
    sub.textContent = running ? `${fmtClock(dur - l)} in · hold the pace` : cc.finished || (cc.endsAt && l === 0) ? "Time. Log the distance." : cc.left != null && cc.left < dur ? "Paused" : "Tap Start when the warm-up is done";
    if (cc.endsAt && l === 0 && !cc.finished) {
      const d = dayState(day.date, true); d.cond.finished = true; d.cond.endsAt = null; d.cond.left = 0; saveState();
      beepDone(); card.classList.add("finished");
    }
  }
  function syncIv() {
    if (condIvs[day.date]) { clearInterval(condIvs[day.date]); delete condIvs[day.date]; }
    const cc = (dayState(day.date, false) || {}).cond || {};
    if (cc.endsAt) condIvs[day.date] = setInterval(paint, 250);
  }
  toggle.onclick = () => {
    ensureAudio(); if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    const cc = ensure();
    if (cc.endsAt) { cc.left = left(); cc.endsAt = null; }            // pause
    else if (left() > 0) { cc.endsAt = Date.now() + left() * 1000; cc.finished = false; if (!cc.startedAt) cc.startedAt = Date.now(); }   // start / resume
    saveState(); syncIv(); paint();
  };
  resetBtn.onclick = () => {
    const cc = ensure();
    if ((cc.endsAt || (cc.left != null && cc.left < dur)) && !confirm("Reset the clock?")) return;
    cc.endsAt = null; cc.left = null; cc.finished = false; cc.startedAt = null;
    saveState(); syncIv(); paint(); card.classList.remove("finished");
  };
  syncIv(); paint();
}

/* ---------------------------------------------------------------------------
   LAST-TIME REFERENCE (2026-10-24, Ryan's addition to the iPad register). The
   most useful prior session of an exercise, matched by SL.normName across
   every cycle: the most recent logged session before this day. It reads
   "last week" when that session was within the past 7 days (so last week's
   session wins whenever it exists), else "W2 · Aug 3 cycle". The Chalk seed
   (lastLoadLb) shows only when nothing is logged here, labelled as such.
   priorEntries() already orders real logs newest first with the seed last, so
   the coach's fill (sugg.weight) prefills from the same session.
   --------------------------------------------------------------------------- */
function lastTimeOf(ex, day, hist) {
  hist = hist || priorEntries(ex.name, day.date, ex);
  if (!hist.length) return null;
  const L = hist[0];
  if (L.seed) return { seed: true, weight: L.weight, entry: L };
  const diff = Math.round((Date.parse(day.date + "T12:00:00") - Date.parse(L.date + "T12:00:00")) / 864e5);
  const lastWeek = diff >= 0 && diff <= 7;
  const ctx = lastWeek ? "last week" : `W${dayWeek(L.day)} · ${monthLabel(L.day.cycle.startDate)} cycle`;
  return { seed: false, entry: L, date: L.date, lastWeek, ctx };
}
/* One line for the tracker row and the Up next summary: "last wk · 12, 12, 12 @ 104 lb". */
function lastTimeText(ex, day, spec) {
  const lt = lastTimeOf(ex, day);
  if (!lt) return "";
  if (lt.seed) return `Chalk ${fmtLoad(lt.weight, spec.bw)} · not logged here`;
  return `${lt.lastWeek ? "last wk" : lt.ctx.replace(" cycle", "")} · ${SL.lastText(lt.entry, spec)}`;
}
/* The prominent block in the Now card. A newer stack set still wins, through SL.lastHtml, as everywhere in the library. */
function lastTimeHtml(ex, day, spec, hist) {
  const lt = lastTimeOf(ex, day, hist);
  if (!lt) return "";
  if (SL.stackNewer(ex.name, lt.seed ? null : lt.date)) return SL.lastHtml(lt.entry, spec, "");
  if (lt.seed) return CK.lastSeed("Last · from Chalk, not logged here", `Chalk showed ${fmtLoad(lt.weight, spec.bw)} the last time you logged it there`);
  const e = lt.entry;
  const flag = spec.isMax ? "" : e.hit === true ? ` <span class="ex-hit-flag yes">hit</span>` : e.hit === false ? ` <span class="ex-hit-flag no">short</span>` : "";
  return CK.lastBlock(`${lt.ctx} · ${monthLabel(e.date)}`, SL.lastText(e, spec), flag);
}

/* ---------------------------------------------------------------------------
   iPad BOARD (2026-10-24). At Father & Son's breakpoint a strength or
   conditioning day renders as a board: lane left, rail right (session clock
   with the planned-time timeline, the rest ring, the workout tracker; the
   countdown card on a conditioning day). The board itself is shared
   (../shared/cockpit.js, the .ck-* CSS); this page fills in the adapter below.
   Rendering only: state, payloads and the phone layout do not change. Register:
   KARL_DATA/outputs/personal/workout-trackers/full-body-aesthetics/DESIGN-BRIEF-2026-10-24.md
   --------------------------------------------------------------------------- */
function boardMode() { return CK.active(); }
const SLOT_SHORT = { main: "Main", chest: "Chest", back: "Back", legs: "Legs", shoulders: "Shldr", biceps: "Bi", triceps: "Tri", abs: "Abs", closer: "Closer" };
const SCORE_TITLE = { "deathby-minute": "Death By", "amrap-reps": "Max reps", "ladder-reps": "Ladder", "for-time": "For time", "load": "Top load", "repmax-load": "Rep max" };

/* The row the Now card shows: the tapped one, else the first not marked Done (same rule as the phone). */
function nowIndex(day) {
  if (day.type !== "strength") return -1;
  const ds = dayState(day.date, false), k = day.date, rows = day.exercises;
  return tappedNow[k] != null && tappedNow[k] < rows.length ? tappedNow[k] : rows.findIndex((_, i) => !(ds && ds.completed["m" + i]));
}
/* One state per prescribed set: done (checked, or the row's Done button is on), part (a number typed), "" (empty). */
function setStates(ds, idx, spec) {
  const done = !!(ds && ds.completed["m" + idx]);
  const log = SL.normLog(ds && ds.logs[idx], spec.sets);
  return log.sets.slice(0, spec.sets).map(x => done || x.d ? "done" : (x.r != null || x.w != null) ? "part" : "");
}
function scoreBeatText(s) {
  const def = scoreDef(s.type);
  if (s.type === "deathby-minute") return `${s.val} min`;
  if (def.fromGrid) return `${fmtWeight(s.val)} lb`;
  return `${s.val}${def.unit ? " " + def.unit : ""}`;
}
/* Planned seconds come from the page's own model (rowSecs: ramp + sets × set time + rests + 45 s; closer 8 min;
   warm-up 6 min), as the catalog and the session header use it; the cockpit prefers the median of logged
   durations for the exercise once three sessions carry set timestamps. */
CK.init({
  id: day => day.date,
  kind: day => day.type === "conditioning" ? "conditioning" : "strength",
  eyebrow: day => `Week ${dayWeek(day)} · ${DOW_FULL[day.dow] || day.dow} · ${shortDate(day.date)}`,
  title: day => day.type === "conditioning" ? (day.title || "Conditioning") : (day.title || (day.exercises.find(x => x.slot === "main") || {}).name || "Lift"),
  warmupSecs: () => 6 * 60,
  condSecs: day => (day.work && day.work.durationSec) || null,
  slots: day => day.type !== "strength" ? [] : day.exercises.map((ex, i) => {
    const spec = specOf(ex);
    let beat = "";
    if (ex.closer && ex.score) {
      const prior = priorScores(ex.name, day.date);
      const ttl = SCORE_TITLE[ex.score.type] || "Closer";
      beat = prior.length ? `${ttl} · beat ${scoreBeatText(prior[0])}` : `${ttl} · first score`;
    }
    return { idx: i, name: ex.name, label: ex.closer ? "Closer" : SLOT_SHORT[ex.slot] || ex.slot || "", slotName: SLOT[ex.slot] || ex.slot || "",
             secs: rowSecs(ex, spec), rest: spec.rest, closer: !!ex.closer, beat };
  }),
  nowIndex,
  setStates: (day, i) => setStates(dayState(day.date, false), i, specOf(day.exercises[i])),
  lastText: (day, i) => lastTimeText(day.exercises[i], day, specOf(day.exercises[i])),
  restKey: (day, i) => `${day.exercises[i].name}|${day.date}_${i}`,
  clock: day => { const ds = dayState(day.date, false); return ds ? { start: ds.clockStart, stop: ds.clockStop } : null; },
  toggleClock: day => {
    const cur = dayState(day.date, true);
    if (!cur.clockStart) { cur.clockStart = Date.now(); cur.clockStop = null; stampDate(cur); }
    else if (!cur.clockStop) cur.clockStop = Date.now();
    else { cur.clockStart = null; cur.clockStop = null; }
    saveState();
  },
  isComplete: isDayComplete,
  renderLane: (day, lane, rail) => day.type === "strength" ? renderStrength(day, lane) : renderConditioning(day, lane, rail),   // the countdown and modality chooser take the tracker's place
  jump: (day, target) => {
    if (target === "wu") prepOpen[`${day.date}_wu`] = true;
    else if (target != null) tappedNow[day.date] = target;
    renderDay(day);
  },
  /* Every strength day with a record, rows in order, each set's check timestamp: the cockpit learns pace from these. */
  sessions: () => ALL.map(d => {
    if (d.type !== "strength") return null;
    const ds = dayState(d.date, false);
    if (!ds) return null;
    return { start: ds.clockStart || null, rows: d.exercises.map((ex, i) => ({ name: ex.name, t: SL.normLog(ds.logs[i], 0).sets.map(x => x.t).filter(Boolean) })) };
  }).filter(Boolean),
  onModeChange: () => { if (!DATA) return; const open = currentOpenDay(); render(); openTab(open); }
});

/* ---------------------------------------------------------------------------
   NOTES PANE: how it works, the block rules, sync, backup
   --------------------------------------------------------------------------- */
function buildNotes() {
  const st = CYC.structure || {};
  document.getElementById("notes-card").innerHTML = `
    <h2>How this tracker works</h2>
    <p><strong>${escapeHtml(DATA.name)}</strong> is coach ${escapeHtml(DATA.coach || "")}'s program in the ${escapeHtml(DATA.app || "Chalk")} app. Karl ingests each cycle from the Chalk portal into this tracker; pick the week with the pills and the day with the tabs.</p>
    <h3>This cycle: ${escapeHtml(CYC.label)}</h3>
    ${CYC.intro ? `<p style="white-space:pre-line">${escapeHtml(CYC.intro)}</p>` : ""}
    <ul>
      ${Array.isArray(st.mainLiftRepMaxByWeek) ? `<li><strong>Main lift:</strong> build to a rep max for the day, by week ${st.mainLiftRepMaxByWeek.map((n, i) => `W${i + 1} ${n}RM`).join(" · ")}. Log every working set in the grid; the heaviest set is the day's score unless you type a different load.</li>` : `<li><strong>Main lift:</strong> the first row of each lift day; log every working set and the heaviest is the day's score.</li>`}
      ${Array.isArray(st.accessoryRepsByWeek) ? `<li><strong>Accessories:</strong> one per body part, 3 sets of ${st.accessoryRepsByWeek.map((n, i) => `${n} (W${i + 1})`).join(", ")}. Most run one set every 60 seconds.</li>` : `<li><strong>Accessories:</strong> one per body part, as prescribed on the row.</li>`}
      <li><strong>Closer:</strong> ${escapeHtml(st.closer || "scored every session")}. A Death By logs the last minute you finished (the clock button beeps every minute); a ladder logs the rung; for-time closers log the time.</li>
      ${CYC.schedule.optionalConditioning && CYC.schedule.optionalConditioning.length ? `<li><strong>Conditioning</strong> (${CYC.schedule.optionalConditioning.join(" and ")}, optional): pick the modality, run the clock when the piece has a fixed length, log the score and beat it next time.</li>` : ""}
    </ul>
    <h3>Logging sets and the coach</h3>
    <p>Each set takes reps and weight. The <strong>= 3 × 12</strong> button fills the targets; type over what differed. A hit is inferred: every set at or above the target. The chip under a lift says what to do next: green adds weight after a hit (5 lb, 10 on lower-body lifts), grey holds the weight after a miss, amber cuts after three misses at one weight. Max-rep rows say "beat last".</p>
    <p>A <strong>Last (Chalk log)</strong> line is the load Chalk showed beside that exercise from your earlier logging there. It seeds the coach; it is not a prescription.</p>
    <p>Where the ingest could not read an instruction, the row says <em>Instruction not captured</em> rather than guessing.</p>
    ${SL.sync.notesHtml()}
    <h3>Backup</h3>
    <div class="notes-actions">
      <button class="btn" id="btn-export">Export backup</button>
      <button class="btn" id="btn-import">Import backup</button>
    </div>
    <div class="note-box" style="margin-top:12px">Source: ${escapeHtml(DATA.app || "Chalk Performance Training")}, coach ${escapeHtml(DATA.coach || "")}. ${DATA.cycles.length} cycle${DATA.cycles.length === 1 ? "" : "s"} ingested by ${escapeHtml(DATA.generatedBy || "the ingest")}; the cycle on screen is ${escapeHtml(CYC.id)}. Anything the ingest could not read is marked on the row.</div>`;
  document.getElementById("btn-export").onclick = doExport;
  document.getElementById("btn-import").onclick = doImport;
}
function doExport() {
  const payload = { app: "fba", version: 2, exportedAt: new Date().toISOString(), state };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `fba-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast("Backup downloaded");
}
function doImport() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const obj = JSON.parse(r.result);
        if (obj && obj.state && obj.state.days) {
          if (!confirm("Replace current data with this backup?")) return;
          state = normState(obj.state); saveState(); render(); toast("Import complete");
        } else alert("Doesn't look like a Full Body Aesthetics v2 backup.");
      } catch (e) { alert("Could not read file: " + e.message); }
    };
    r.readAsText(f);
  };
  inp.click();
}
let toastTimeout = null;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  if (toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => el.classList.remove("show"), 2200);
}

/* ---------------------------------------------------------------------------
   STATS + HERO
   --------------------------------------------------------------------------- */
function updateStats() {
  if (!CYC) return;
  const ref = currentWeekRef();
  document.getElementById("stat-week").textContent = "W" + ref.w;
  const lifts = ALL.filter(d => d.type === "strength" && isDayComplete(d)).length;
  document.getElementById("stat-days").textContent = lifts;
  const wk = weekDays(ref.w, ref.cyc).filter(d => d.type === "strength");
  document.getElementById("stat-thisweek").textContent = `${wk.filter(isDayComplete).length} / ${wk.length}`;
  const req = CYC.days.filter(isRequired);
  document.getElementById("stat-overall").textContent = req.length ? Math.round(100 * req.filter(isDayComplete).length / req.length) + "%" : "0%";
  const nx = nextDay();
  document.querySelectorAll(".tab").forEach(tab => {
    const dot = tab.querySelector(".due-dot");
    if (dot) dot.hidden = !nx || tab.dataset.pane !== nx.date;
  });
}
function render() {
  renderCycleBar();
  renderWeekBar();
  buildWeek();
  updateStats();
}

/* ---------------------------------------------------------------------------
   HEALTH-SYSTEM SUMMARY (contract in ../shared/shell.js). Set-day program:
   every session has a calendar date. today = the program day dated today;
   next = the first required day not yet complete, in program order.
   --------------------------------------------------------------------------- */
function sessionLabel(day) {
  if (day.type === "conditioning") return day.title || "Conditioning";
  if (day.title) return day.title;
  const main = day.exercises.find(x => x.slot === "main");
  return main ? main.name : "Lift";
}
function publishSummary() {
  try {
    if (!window.HS || typeof HS.summary !== "function" || !CYC) return;
    const td = todayISO();
    const nx = nextDay();
    const todayDay = ALL.find(d => d.date === td && d.type !== "rest") || null;
    const sessions = [];
    ALL.forEach(d => { if (dayHasActivity(d)) { const ds = dayState(d.date, false); sessions.push(ds.trained || d.date); } });
    sessions.sort();
    const ref = currentWeekRef();
    const planned = weekDays(ref.w, ref.cyc).filter(isRequired);
    HS.summary(PROGRAM.slug, {
      kind: "setdays", week: ref.w, weeks: ref.cyc.weeks, phase: ref.cyc.label,
      next: nx ? { id: nx.date, label: sessionLabel(nx), sub: `Week ${dayWeek(nx)} · ${nx.dow}${nx.cycle !== ref.cyc ? " · next block" : ""}`, date: nx.date, minutes: dayMinutes(nx), listed: null } : null,
      today: todayDay ? { label: sessionLabel(todayDay), minutes: dayMinutes(todayDay), done: isDayComplete(todayDay) } : null,
      thisWeek: { done: planned.filter(isDayComplete).length, planned: planned.length },
      days: ref.cyc.schedule.lift || null,
      sessions, lastDate: sessions.length ? sessions[sessions.length - 1] : null
    });
  } catch (e) {}
}
function sessionFromHash() {
  const m = (location.hash || "").match(/#s=([0-9-]+)/);
  return m ? dayById(m[1]) : null;
}

/* ---------------------------------------------------------------------------
   CATALOG (Phase 2 contract in ../shared/shell.js): every non-rest day of
   every cycle, each row with its slot as the tag so Gaps can pattern-tag it.
   --------------------------------------------------------------------------- */
window.HS_CATALOG = function () {
  const sessions = [];
  ALL.forEach(day => {
    if (day.type === "rest") return;
    const exercises = [];
    const wu = day.type === "strength" ? ((day.warmup && day.warmup.length ? day.warmup : day.cycle.warmup) || []) : (day.warmup || []);
    wu.forEach(t => exercises.push({ name: t, scheme: null, sets: 1, reps: null, restSec: null, minutes: 2, kind: "warmup", tag: "warmup" }));
    if (day.type === "strength") {
      day.exercises.forEach(ex => {
        const spec = specOf(ex);
        exercises.push({ name: ex.name, scheme: shortRx(ex, spec), sets: spec.sets, reps: repsStr(ex) || null, restSec: spec.rest,
                         minutes: Math.round(rowSecs(ex, spec) / 6) / 10, kind: ex.slot === "abs" ? "core" : ex.closer ? "conditioning" : "strength", tag: ex.slot || null });
      });
    } else {
      const dur = day.work && day.work.durationSec;
      exercises.push({ name: day.title, scheme: dur ? `${fmtClock(dur)} nonstop` : (day.score && day.score.type ? `for ${day.score.type}` : null), sets: 1, reps: null, restSec: null,
                       minutes: dur ? Math.round(dur / 60) : null, kind: "conditioning", tag: "conditioning" });
    }
    sessions.push({ id: day.date, week: dayWeek(day), day: day.dow, label: sessionLabel(day), minutes: dayMinutes(day), optional: !!day.optional, exercises });
  });
  return { slug: PROGRAM.slug, kind: "setdays", sessions };
};

/* ---------------------------------------------------------------------------
   SESSION CLOCK: elapsed against the planning model.
   --------------------------------------------------------------------------- */
const sessionClocks = {};
/* btn: the clock button (its .hs-clock-t carries the time); stat: the pace line under it.
   On the board the cockpit wires its own rail clock instead (see the adapter's toggleClock). */
function wireClock(day, btn, stat) {
  if (!btn) return;
  const key = `${day.date}|${btn.dataset.ck || "head"}`;
  const txt = btn.querySelector(".hs-clock-t") || btn;
  const planned = daySecs(day);
  function paint() {
    const cur = dayState(day.date, false);
    if (!cur || !cur.clockStart) {
      txt.textContent = "Start"; btn.classList.remove("running", "stopped");
      btn.setAttribute("aria-label", "Start the session clock");
      if (stat) stat.textContent = "";
      return;
    }
    const elapsed = Math.round(((cur.clockStop || Date.now()) - cur.clockStart) / 1000);
    txt.textContent = fmtClock(elapsed);
    btn.classList.toggle("running", !cur.clockStop);
    btn.classList.toggle("stopped", !!cur.clockStop);
    btn.setAttribute("aria-label", cur.clockStop ? `Session clock stopped at ${fmtClock(elapsed)}, tap to reset` : `Session clock ${fmtClock(elapsed)}, tap to stop`);
    if (stat) stat.textContent = isDayComplete(day) ? `done in ${fmtClock(elapsed)}` : cur.clockStop ? "clock stopped" : planned != null ? `${Math.round(elapsed / 60)} of ${fmtMins(planned).replace("~", "")} in` : "";
  }
  function syncInterval() {
    if (sessionClocks[key]) { clearInterval(sessionClocks[key]); delete sessionClocks[key]; }
    const cur = dayState(day.date, false);
    if (cur && cur.clockStart && !cur.clockStop) sessionClocks[key] = setInterval(paint, 1000);
  }
  btn.onclick = () => {
    const cur = dayState(day.date, true);
    if (!cur.clockStart) { cur.clockStart = Date.now(); cur.clockStop = null; stampDate(cur); }
    else if (!cur.clockStop) cur.clockStop = Date.now();
    else { cur.clockStart = null; cur.clockStop = null; }
    saveState(); syncInterval(); paint();
  };
  syncInterval(); paint();
}

/* ---------------------------------------------------------------------------
   TIMERS: rest countdown and the Death By clock (a stopwatch that beeps each minute).
   --------------------------------------------------------------------------- */
const activeTimers = {};
let audioCtx = null;
function ensureAudio() {
  if (audioCtx) return audioCtx;
  try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); } catch (e) {}
  return audioCtx;
}
function tone(offsets, freqs) {
  const ctx = ensureAudio();
  if (ctx) {
    const now = ctx.currentTime;
    offsets.forEach((off, i) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = "sine"; osc.frequency.value = freqs[i] || 880;
      gain.gain.setValueAtTime(0, now + off);
      gain.gain.linearRampToValueAtTime(0.25, now + off + 0.01);
      gain.gain.linearRampToValueAtTime(0, now + off + 0.14);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + off); osc.stop(now + off + 0.16);
    });
  }
  if (navigator.vibrate) { try { navigator.vibrate(120); } catch (e) {} }
}
function beepDone() { tone([0, 0.18, 0.36], [880, 880, 1100]); if (navigator.vibrate) { try { navigator.vibrate([120, 80, 120, 80, 200]); } catch (e) {} } }
function beepPhase() { tone([0], [990]); }

function paintRunning(btn, text) { if (!btn) return; btn.classList.add("running"); btn.classList.remove("done", "paused"); btn.textContent = text; }
function paintPaused(btn, text) { if (!btn) return; btn.classList.remove("running", "done"); btn.classList.add("paused"); btn.textContent = text; }
function paintDone(btn) {
  if (!btn || !btn.isConnected) return;
  btn.classList.remove("running", "paused"); btn.classList.add("done");
  btn.textContent = "Done!";
  setTimeout(() => { if (btn && btn.isConnected) { btn.classList.remove("done"); btn.textContent = btn.dataset.default || "⏱"; } }, 1800);
}
function paintReset(btn) {
  if (!btn || !btn.isConnected) return;
  btn.classList.remove("running", "done", "paused");
  btn.textContent = btn.dataset.default || "⏱";
}
function startCountdown(key, btn, secs) {
  ensureAudio(); if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  const endsAt = Date.now() + secs * 1000;
  paintRunning(btn, fmtClock(secs));
  const iv = setInterval(() => {
    const t = activeTimers[key]; if (!t) return;
    const remaining = Math.round((t.endsAt - Date.now()) / 1000);
    if (remaining <= 0) { clearInterval(t.iv); const b = t.btn; delete activeTimers[key]; paintDone(b); beepDone(); }
    else paintRunning(t.btn, fmtClock(remaining));
  }, 250);
  activeTimers[key] = { mode: "down", endsAt, iv, btn };
}
/* Stopwatch with a beep every `every` seconds (a Death By needs the minute marks). */
function startWatch(key, btn, every) {
  ensureAudio(); if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  const t = { mode: "watch", startedAt: Date.now(), stopped: null, btn, every: every || 60, lastMark: 0 };
  paintRunning(btn, "0:00");
  t.iv = setInterval(() => {
    const cur = activeTimers[key]; if (!cur || cur.stopped != null) return;
    const el = Math.floor((Date.now() - cur.startedAt) / 1000);
    const mark = Math.floor(el / cur.every);
    if (mark > cur.lastMark) { cur.lastMark = mark; beepPhase(); }
    paintRunning(cur.btn, `${fmtClock(el)} · min ${mark + 1}`);
  }, 250);
  activeTimers[key] = t;
}
function tapActiveTimer(key) {
  const t = activeTimers[key]; if (!t) return;
  if (t.mode === "down") { clearInterval(t.iv); delete activeTimers[key]; paintReset(t.btn); return; }
  if (t.mode === "watch") {
    if (t.stopped == null) { t.stopped = Date.now(); paintPaused(t.btn, "■ " + fmtClock(Math.round((t.stopped - t.startedAt) / 1000))); }
    else { clearInterval(t.iv); delete activeTimers[key]; paintReset(t.btn); }
  }
}
function reattachTimer(key, btn) {
  const t = activeTimers[key];
  if (!btn || !t) return;
  t.btn = btn;
  if (t.mode === "down") { const remaining = Math.round((t.endsAt - Date.now()) / 1000); if (remaining > 0) paintRunning(btn, fmtClock(remaining)); }
  else if (t.mode === "watch") {
    if (t.stopped == null) { const el = Math.floor((Date.now() - t.startedAt) / 1000); paintRunning(btn, `${fmtClock(el)} · min ${Math.floor(el / t.every) + 1}`); }
    else paintPaused(btn, "■ " + fmtClock(Math.round((t.stopped - t.startedAt) / 1000)));
  }
}

/* ---------------------------------------------------------------------------
   BOOT: fetch data.json (no-store so a new ingest lands on the next open),
   pick the day, wire sync.
   --------------------------------------------------------------------------- */
document.getElementById("reset-btn").onclick = () => {
  if (confirm("Reset ALL tracking for this program? Every check, set, score and clock across every cycle will be cleared.")) {
    state = emptyState(); saveState(); render();
  }
};

async function boot() {
  const notes = document.getElementById("notes-card");
  try {
    const r = await fetch("data.json", { cache: "no-store" });
    if (!r.ok) throw new Error(`data.json ${r.status}`);
    DATA = await r.json();
  } catch (e) {
    document.getElementById("hero-sub").textContent = "Could not load data.json.";
    notes.innerHTML = `<h2>Program data did not load</h2><p>${escapeHtml(e.message)}. Pull to refresh on wifi; if it persists, the program file is missing from the deploy.</p>`;
    document.querySelector('.tab[data-pane="notes"]').click();
    return;
  }
  if (!DATA || !Array.isArray(DATA.cycles) || !DATA.cycles.length) {
    notes.innerHTML = `<h2>No cycles in data.json</h2><p>The tracker expects schema 2 with at least one cycle.</p>`;
    document.querySelector('.tab[data-pane="notes"]').click();
    return;
  }
  DATA.cycles.forEach(c => { c.days = (c.days || []).slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0); c.days.forEach(d => { d.cycle = c; }); });
  ALL = DATA.cycles.flatMap(c => c.days).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);

  // Open on the deep link, else today's program day, else the first incomplete day, else the last cycle's first day.
  const td = todayISO();
  const lastCyc = DATA.cycles[DATA.cycles.length - 1];
  const start = sessionFromHash() || ALL.find(d => d.date === td) || nextDay() || lastCyc.days.find(d => d.type !== "rest") || lastCyc.days[0];
  uiCycle = Math.max(0, DATA.cycles.indexOf(start.cycle));
  CYC = DATA.cycles[uiCycle];
  uiWeek = dayWeek(start);

  SL.sync.init({
    slug: PROGRAM.slug,
    storageKey: PROGRAM.storageKey,
    payload: () => ({ state, entries: syncEntries() }),
    hasData: () => Object.keys(state.days).length > 0,
    apply: merged => { const open = currentOpenDay(); state = normState(merged); render(); openTab(open); }
  });

  buildShell();
  render();
  SL.sync.wireNotes();
  openTab(start);
  publishSummary();
}
function currentOpenDay() {
  const t = document.querySelector(".tab.active[data-day]");
  return t ? dayById(t.dataset.day) : dueDayInWeek(uiWeek);
}
boot();
</script>
