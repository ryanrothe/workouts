}
function nextLiftWord(day) {
  const nx = ALL.find(d => d.date > day.date && d.type !== "rest");
  return nx ? `${DOW_FULL[nx.dow] || nx.dow} (${nx.title})` : "not posted yet";
}

/* The phone content of a training day into any element (the pane, or the board's lane). */
function renderDayInto(day, container) {
  const ds = dayState(day.date, false);
  const groups = day.groups;
  const counted = groups.map((g, gi) => gi).filter(gi => !isWU(groups[gi]));
  const done = counted.filter(gi => isGroupDone(ds, groups[gi], gi)).length;
  const nowIdx = nowIndex(day);
  const nextIdxs = counted.filter(i => i !== nowIdx && !isGroupDone(ds, groups[i], i));
  const afterNow = nextIdxs.find(i => i > nowIdx);
  const upNextAt = afterNow != null ? afterNow : nextIdxs[0];

  const head = sessHead(day, day.title, done, counted.length);
  const ctl = sessCtl(day);
  container.appendChild(head);
  container.appendChild(ctl);
  if (!boardMode()) wireClock(day, head.querySelector(".hs-sess-clock"), ctl.querySelector(".hs-sess-pace"));   // the board wires its rail clock instead
  if (day.note) container.appendChild(collapsible("Coach's note for today", day.note, `note_${day.date}`));

  let labelled = false;
  groups.forEach((g, gi) => {
    if (isWU(g)) { container.appendChild(renderPrepGroup(day, g, gi)); return; }
    if (g.type === "note") { container.appendChild(collapsible(g.name || "Coach's note", g.text || g.note || "", `gnote_${day.date}_${gi}`)); return; }
    const st = gi === nowIdx ? "now" : isGroupDone(ds, g, gi) ? "done" : "next";
    let label = "";
    if (isSprint(g)) label = `Sprint block${g.optional ? " · optional" : ""}`;
    else if (!labelled) { labelled = true; label = day.deload ? "Lifts · deload, 2 to 3 reps in the tank" : "Lifts"; }
    if (gi === upNextAt) label = label ? `Up next · ${label}` : "Up next";
    if (label) { const lab = document.createElement("div"); lab.className = "hs-section-label"; lab.textContent = label; container.appendChild(lab); }
    container.appendChild(renderGroupRow(day, g, gi, st, counted.length, counted.indexOf(gi) + 1));
  });
}

/* ---------------------------------------------------------------------------
   WARM-UP PREP GROUP: collapsed by default (Ryan knows the warm-up). Rounds in
   the head, a check per movement, a lb field where Chalk tracks a weight.
   --------------------------------------------------------------------------- */
function renderPrepGroup(day, g, gi) {
  const ds = dayState(day.date, false);
  const openKey = `${day.date}_wu${gi}`;
  const items = g.exercises;
  const doneN = items.filter((_, ei) => ds && ds.completed[exKey(gi, ei)]).length;
  const open = prepOpen[openKey] === true;
  const wrap = document.createElement("div");
  wrap.className = "hs-row hs-wu" + (open ? " hs-open" : "");
  wrap.dataset.idx = gi;
  const el = document.createElement("div");
  el.className = "prep" + (open ? "" : " collapsed");
  el.innerHTML = `
    <div class="prep-head" role="button" tabindex="0"><span>${escapeHtml(groupName(day, g, gi))}${g.rounds ? ` · ${g.rounds} round${g.rounds === 1 ? "" : "s"}` : ""} · ${doneN}/${items.length}</span><span class="caret">▼</span></div>
    <div class="prep-body">
      ${g.note ? `<div class="prep-note">${escapeHtml(g.note)}</div>` : ""}
      ${items.map((ex, ei) => {
        const spec = specOf(ex);
        const checked = !!(ds && ds.completed[exKey(gi, ei)]);
        const log = logOf(ds && ds.logs[exKey(gi, ei)], spec);
        const w = spec.loaded ? (log.sets[0] && log.sets[0].w) : null;
        const lt = spec.loaded ? lastTimeOf(ex, day) : null;
        const rx = spec.kind === "time" ? `${spec.repTop || timeSecs(ex) || ""} s hold` : spec.kind === "check" ? "" : rxCore(ex, spec).replace(/^\d+ × /, `${g.rounds || spec.sets} × `);
        return `
        <div class="prep-item${checked ? " done" : ""}" data-i="${ei}">
          <span class="prep-check">${ICON.ok.replace('stroke="currentColor"', 'stroke="white"')}</span>
          <span class="prep-t">${escapeHtml(ex.name)}${rx ? ` <span class="ex-side">· ${escapeHtml(rx)}${ex.perSide ? " per side" : ""}</span>` : ""}${instructionText(ex) ? `<small>${escapeHtml(instructionText(ex).split("\n")[0].replace(/^-\s*/, ""))}</small>` : ""}${lt && lt.entry.weight != null ? `<small class="prep-last">last ${fmtWeight(lt.entry.weight)} lb · ${lt.lastWeek ? "last wk" : lt.ctx.replace(" block", "")}</small>` : ""}</span>
          ${spec.loaded ? `<input type="number" class="prep-w" inputmode="decimal" min="0" step="0.5" placeholder="${lt && lt.entry.weight != null ? fmtWeight(lt.entry.weight) : "lb"}" value="${w == null ? "" : w}" aria-label="${escapeHtml(ex.name)} weight">` : ""}
        </div>`;
      }).join("")}
    </div>`;
  wrap.appendChild(el);
  el.querySelector(".prep-head").onclick = () => { prepOpen[openKey] = el.classList.contains("collapsed"); el.classList.toggle("collapsed"); wrap.classList.toggle("hs-open", !el.classList.contains("collapsed")); };
  el.querySelectorAll(".prep-item").forEach(it => {
    it.addEventListener("click", e => {
      if (e.target.closest("input")) return;
      const d = dayState(day.date, true);
      const k = exKey(gi, it.dataset.i);
      d.completed[k] = !d.completed[k];
      if (d.completed[k]) { stampDate(d); const lg = d.logs[k] = SL.normLog(d.logs[k], 1); lg.sets[0].d = true; lg.sets[0].t = Date.now(); }
      else if (d.logs[k]) { const lg = SL.normLog(d.logs[k], 1); delete lg.sets[0].d; delete lg.sets[0].t; d.logs[k] = lg; }
      saveState(); prepOpen[openKey] = true; renderDay(day);
    });
    const inp = it.querySelector(".prep-w");
    if (inp) inp.addEventListener("input", e => {
      const d = dayState(day.date, true);
      const k = exKey(gi, it.dataset.i);
      const lg = d.logs[k] = SL.normLog(d.logs[k], 1);
      const raw = e.target.value.trim();
      lg.sets[0].w = raw === "" ? null : parseFloat(raw);
      stampDate(d); saveState();
    });
  });
  return wrap;
}

/* A folded block of coach text (a day note, the program details). Collapsed until tapped; the choice is kept per key. */
function collapsible(title, text, key) {
  const open = prepOpen[key] === true;
  const el = document.createElement("div");
  el.className = "prep" + (open ? "" : " collapsed");
  el.style.marginTop = "8px";
  el.innerHTML = `<div class="prep-head" role="button" tabindex="0"><span>${escapeHtml(title)}</span><span class="caret">▼</span></div><div class="prep-body"><div class="prep-text">${escapeHtml(text)}</div></div>`;
  el.querySelector(".prep-head").onclick = () => { prepOpen[key] = el.classList.contains("collapsed"); el.classList.toggle("collapsed"); };
  return el;
}

/* ---------------------------------------------------------------------------
   THE DISTANCE GRID: yards per set, reps and lb when Chalk asks. Same classes as
   SetLog's grid (so the board's ring and the shared CSS treat it as one), own
   wiring. A check fills the plan's yards and starts the row's rest.
   --------------------------------------------------------------------------- */
function distGridHtml(log, spec) {
  const cols = 1 + (spec.hasReps ? 1 : 0) + (spec.loaded ? 1 : 0);
  const head = `<div class="sl-head"><span>Set</span><span>yards</span>${spec.hasReps ? `<span>reps${spec.repTop != null ? ` · target ${spec.repTop}` : ""}</span>` : ""}${spec.loaded ? `<span>lb</span>` : ""}<span></span></div>`;
  const rows = log.sets.map((x, i) => `
    <div class="sl-row${x.d ? " sl-done" : ""}">
      <span class="sl-n">${i + 1}</span>
      <input type="number" class="sl-r pj-y" inputmode="decimal" min="0" step="1" data-i="${i}" placeholder="${spec.yards[i] != null ? spec.yards[i] : "yd"}" value="${x.y == null ? "" : x.y}" aria-label="Set ${i + 1} yards">
      ${spec.hasReps ? `<input type="number" class="pj-rp" inputmode="numeric" pattern="[0-9]*" min="0" step="1" data-i="${i}" placeholder="${spec.repTop != null ? spec.repTop : "–"}" value="${x.r == null ? "" : x.r}" aria-label="Set ${i + 1} reps">` : ""}
      ${spec.loaded ? `<input type="number" class="sl-w" inputmode="decimal" min="0" step="0.5" data-i="${i}" placeholder="lb" value="${x.w == null ? "" : x.w}" aria-label="Set ${i + 1} weight">` : ""}
      <button type="button" class="sl-ok${x.d ? " on" : ""}" data-i="${i}" aria-pressed="${x.d ? "true" : "false"}" aria-label="Set ${i + 1} done">${ICON.ok}</button>
    </div>`).join("");
  const rest = `<div class="sl-rest" hidden role="timer" aria-live="off"><span class="sl-rest-l">Rest</span><b class="sl-rest-t">0:00</b><span class="sl-rest-bar"><i></i></span><button type="button" class="sl-rest-skip">Skip</button></div>`;
  return `
    <div class="sl-grid sl-k sl-c${cols}">
      ${head}${rows}${rest}
      <div class="sl-tools">
        ${spec.yards.length ? `<button type="button" class="btn sl-fill">= plan${spec.hasReps && spec.repTop != null ? ` · ${spec.repTop} rep${spec.repTop === 1 ? "" : "s"}` : ""}</button>` : ""}
        <button type="button" class="btn sl-clear">Clear</button>
      </div>
    </div>`;
}
/* cfg: { spec, getLog, save, rerender, restKey, restSecs (null = no rest bar) } */
function wireDistGrid(root, cfg) {
  const spec = cfg.spec;
  const gridEl = root.querySelector(".sl-grid") || root;
  gridEl.dataset.slKey = cfg.restKey;
  const fill = root.querySelector(".sl-fill");
  if (fill) fill.onclick = () => {
    const lg = cfg.getLog();
    lg.sets.forEach((x, i) => { if (x.y == null && spec.yards[i] != null) x.y = spec.yards[i]; if (spec.hasReps && x.r == null && spec.repTop != null) x.r = spec.repTop; });
    cfg.save(); cfg.rerender();
  };
  root.querySelectorAll(".sl-ok").forEach(b => b.onclick = () => {
    const i = parseInt(b.dataset.i, 10), lg = cfg.getLog(), x = lg.sets[i];
    if (!x) return;
    if (x.d) { delete x.d; delete x.t; cfg.save(); cfg.rerender(); SL.rest.paintAll(); return; }
    x.d = true; x.t = Date.now();
    if (x.y == null && spec.yards[i] != null) x.y = spec.yards[i];
    if (spec.hasReps && x.r == null && spec.repTop != null) x.r = spec.repTop;
    if (spec.loaded && x.w == null) { const prev = lg.sets.slice(0, i).reverse().find(y => y.w != null); if (prev) x.w = prev.w; }
    SL.rest.unlock();
    cfg.save(); cfg.rerender();
    if (cfg.restSecs > 0) SL.rest.start(cfg.restKey, cfg.restSecs);
  });
  const clear = root.querySelector(".sl-clear");
  if (clear) clear.onclick = () => { cfg.getLog().sets.forEach(x => { x.y = null; x.r = null; x.w = null; delete x.d; delete x.t; }); cfg.save(); cfg.rerender(); };
  const skip = root.querySelector(".sl-rest-skip");
  if (skip) skip.onclick = () => SL.rest.stop();
  SL.rest.paintAll();
  const bind = (sel, field, parse) => root.querySelectorAll(sel).forEach(inp => inp.addEventListener("input", e => {
    const i = parseInt(e.target.dataset.i, 10), raw = e.target.value.trim();
    cfg.getLog().sets[i][field] = raw === "" ? null : parse(raw); cfg.save();
  }));
  bind(".pj-y", "y", parseFloat); bind(".pj-rp", "r", x => parseInt(x, 10)); bind(".sl-w", "w", parseFloat);
}

/* ---------------------------------------------------------------------------
   ONE ROW = ONE GROUP. A straight set is a group of one; a superset stacks its
   members A1 / A2 with one rest bar after the last; a sprint block stacks its
   rows with the work / rest watch in its tools.
   --------------------------------------------------------------------------- */
function restKeyOf(day, gi, ei, name) { return `${name}|${day.date}_${gi}_${ei}`; }
function renderGroupRow(day, g, gi, st, total, nth) {
  const ds = dayState(day.date, false);
  const grouped = isSuper(g), sprint = isSprint(g);
  const isDone = isGroupDone(ds, g, gi);
  const members = g.exercises.map((ex, ei) => {
    const spec = specOf(ex);
    const hist = st === "now" ? priorEntries(ex.name, day.date) : [];
    return { ex, ei, spec, log: logOf(ds && ds.logs[exKey(gi, ei)], spec), hist, sugg: st === "now" ? suggestNext(ex, day, spec, hist) : null };
  });
  const restSecs = sprint ? null : groupRest(g);          // a sprint row rests on its own rest; the block has the watch
  const restLabel = restSecs ? `⏱ ${restText(restSecs)}` : "";
  const tKey = `${day.date}_${gi}`;
  const lastTag = grouped ? tagOf(day, g, gi, members.length - 1) : "";
  const slotWords = groupSlotWords(g);
  const title = sprint ? groupName(day, g, gi) : null;

  const el = document.createElement("div");
  el.className = "hs-row hs-" + st + (grouped ? " hs-grp" : "") + (sprint ? " hs-sprint" : "");
  el.dataset.idx = gi;
  el.dataset.key = tKey;

  if (st !== "now") {
    const live = !!activeTimers[tKey];
    const names = sprint ? escapeHtml(title) : members.map(m => `${grouped ? `<span class="grp-sum-tags">${tagOf(day, g, gi, m.ei)}</span>` : ""}${escapeHtml(m.ex.name)}`).join(" + ");
    const doneTxt = members.map(m => loggedRx(m.ex, m.spec, m.log)).filter(Boolean).join(" · ") || members.map(m => shortRx(m.ex, m.spec)).join(" · ");
    const rxLine = sprint ? members.map(m => `${m.ex.name} ${shortRx(m.ex, m.spec)}`).join(" · ")
      : grouped ? `${members.map(m => shortRx(m.ex, m.spec)).join(" · ")}${restSecs ? ` · rest ${fmtClock(restSecs)} after ${lastTag}` : ""}` : rxText(members[0].ex, members[0].spec, true, restSecs);
    const right = live ? `<button type="button" class="btn btn-timer row-timer" data-default="${restLabel}">${restLabel}</button>` : st === "done" ? escapeHtml(doneTxt) : "";
    const ltNext = st === "next" ? lastTimeText(members[0].ex, day, members[0].spec) : "";
    el.innerHTML = `
      <div class="hs-row-sum" role="button" tabindex="0">
        <span class="hs-mark">${st === "done" ? ICON.check : ""}</span>
        <span class="hs-sum-t"><b>${names}${sprint && g.optional ? `<span class="pj-chip">Optional</span>` : ""}</b><small><span class="ex-tag">${sprint ? "Sprint block" : grouped ? (g.name ? escapeHtml(cleanTitle(g.name)) : "Superset") : escapeHtml(slotWords)}</span>${st === "next" ? rxLine : ""}${ltNext ? `<span class="ck-sum-last">Last${grouped ? ` ${tagOf(day, g, gi, 0)}` : sprint ? ` · ${escapeHtml(members[0].ex.name)}` : ""} · ${escapeHtml(ltNext)}</span>` : ""}</small></span>
        ${right ? `<span class="hs-sum-r">${right}</span>` : ""}
      </div>`;
    const sum = el.querySelector(".hs-row-sum");
    const pick = () => { tappedNow[day.date] = gi; renderDay(day); revealNow(day); };
    sum.addEventListener("click", e => { if (!e.target.closest(".btn")) pick(); });
    sum.addEventListener("keydown", e => { if (e.target === sum && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pick(); } });
    if (live) { const tb = el.querySelector(".row-timer"); reattachTimer(tKey, tb); tb.onclick = () => tapTimer(tKey, tb, restSecs); }
    return el;
  }

  const memberHtml = m => {
    const { ex, ei, spec, log, hist, sugg } = m;
    const lastHtml = hist.length ? lastTimeHtml(ex, day, spec, hist) : "";
    const weekHtml = hist.length ? weekOverHtml(hist[0], spec) : "";
    const suggHtml = SL.suggestHtml(sugg);
    const hasNotes = !!(log.notes && log.notes.trim());
    const ownRest = sprint && spec.rest ? spec.rest : null;
    const grid = isDist(spec) ? distGridHtml(log, spec) : SL.gridHtml(log, spec, sugg);
    const tag = grouped ? `${tagOf(day, g, gi, ei)} · ${SLOT[ex.slot] || ex.slot || ""}` : sprint ? `${ei + 1} · ${SLOT[ex.slot] || ex.slot || ""}` : "";
    return `
      <div class="grp-ex" data-ek="${exKey(gi, ei)}">
        ${tag ? `<div class="grp-tag">${escapeHtml(tag)}</div>` : ""}
        <div class="ex-name">${escapeHtml(ex.name)}</div>
        <div class="ex-prescription">${rxText(ex, spec, !grouped, sprint ? ownRest : restSecs)}${isDist(spec) && spec.yards.length ? `<div class="pj-plan">Log the yards you ran per set; the plan's figures sit in the boxes.</div>` : ""}</div>
        ${instructionText(ex) ? `<div class="ex-instruction">${escapeHtml(instructionText(ex))}</div>` : ""}
        ${Array.isArray(ex.alternates) && ex.alternates.length ? `<div class="ex-alt">Alternate: ${ex.alternates.map(a => escapeHtml(typeof a === "string" ? a : a.name || "")).join(", ")}</div>` : ""}
        ${lastHtml || weekHtml || suggHtml ? `<div class="hs-lastbox">${lastHtml}${weekHtml}${suggHtml}</div>` : ""}
        <div class="ex-log open">
          ${grid}
          <textarea class="log-notes" placeholder="Notes: form, tempo, RPE, how it felt..."${hasNotes ? "" : " hidden"}>${escapeHtml(log.notes)}</textarea>
        </div>
        <div class="grp-ex-tools">
          <a class="btn" href="${ex.videoUrl ? escapeHtml(ex.videoUrl) : v(ex.name)}" target="_blank" rel="noopener">${ICON.video}${ex.videoUrl ? "▶ Video" : "Video"}</a>
          <button type="button" class="btn hs-note-btn">${ICON.note}Note</button>
          ${ownRest ? `<button type="button" class="btn btn-timer row-timer" data-default="⏱ ${restText(ownRest)}">⏱ ${restText(ownRest)}</button>` : ""}
        </div>
      </div>`;
  };

  const watch = sprint ? watchOf(ds, gi) : null;
  el.innerHTML = `
    <div class="hs-row-full">
      <div class="hs-now-eyebrow">Now · ${nth} of ${total} · ${sprint ? "Sprint block" : grouped ? `${g.name ? escapeHtml(cleanTitle(g.name)) : "Superset"} ${groupLabel(day, g, gi)}` : escapeHtml(slotWords)}</div>
      ${sprint ? `<div class="ex-name">${escapeHtml(title)}${g.optional ? `<span class="pj-chip">Optional</span>` : ""}</div>` : ""}
      ${grouped ? `<div class="grp-head"><span class="grp-type">${g.name ? escapeHtml(cleanTitle(g.name)) : "Superset"}</span><span>${members.length} moves back to back${g.rounds ? ` · ${g.rounds} rounds` : ""}${restSecs ? ` · rest ${fmtClock(restSecs)} after ${lastTag}` : ""}</span></div>` : ""}
      ${sprint ? `<div class="grp-head"><span class="grp-type">Work / rest watch</span><span>tap Work at the line, Rest as you cross it; each rep's time is kept${g.restSec ? ` · rest ${fmtClock(g.restSec)}+ between sprints` : ""}</span></div>` : ""}
      ${g.note ? `<div class="grp-note">${escapeHtml(g.note)}</div>` : ""}
      ${sprint ? `<div class="hs-tools" style="border-top:0;padding-top:0;margin-top:4px">${watchButtonsHtml(day, gi, watch)}</div>` : ""}
      ${members.map(memberHtml).join("")}
      <div class="hs-tools">
        ${restSecs ? `<button type="button" class="btn btn-timer row-timer" data-default="${restLabel}">${restLabel}</button>` : ""}
        <button type="button" class="btn hs-done-btn${isDone ? " on" : ""}" aria-pressed="${isDone}">${ICON.check}Done${grouped ? ` ${groupLabel(day, g, gi)}` : sprint ? " sprints" : ""}</button>
      </div>
    </div>`;

  el.querySelector(".hs-done-btn").onclick = () => {
    const cur = dayState(day.date, true);
    cur.completed["g" + gi] = !isDone;
    if (!isDone) {
      stampDate(cur);
      if (tappedNow[day.date] === gi) delete tappedNow[day.date];
      if (sprint) watchStop(day, gi, true);
    }
    saveState(); renderDay(day); renderWeekBar();
    if (!isDone) revealNow(day);
  };

  members.forEach((m, mi) => {
    const { ex, ei, spec, sugg } = m;
    const root = el.querySelector(`.grp-ex[data-ek="${exKey(gi, ei)}"]`);
    const isLast = mi === members.length - 1;
    const ensureLog = () => {
      const cur = dayState(day.date, true);
      cur.logs[exKey(gi, ei)] = logOf(cur.logs[exKey(gi, ei)], spec);
      stampDate(cur);
      return cur.logs[exKey(gi, ei)];
    };
    const key = restKeyOf(day, gi, ei, ex.name);
    if (isDist(spec)) wireDistGrid(root, { spec, getLog: ensureLog, save: saveState, rerender: () => renderDay(day), restKey: key, restSecs: sprint ? spec.rest : (isLast ? restSecs : null) });
    else SL.wireGrid(root, { spec, sugg, getLog: ensureLog, save: saveState, rerender: () => renderDay(day), restKey: key,
      // A member before the last starts no rest (the group rests once); a row without a rest gets no bar (SetLog would default to 90 s).
      noRest: () => sprint ? !spec.rest : (!isLast || !restSecs) });
    const notes = root.querySelector(".log-notes");
    notes.addEventListener("input", e => { ensureLog().notes = e.target.value; saveState(); });
    root.querySelector(".hs-note-btn").onclick = () => { notes.hidden = !notes.hidden; if (!notes.hidden) notes.focus(); };
    const rt = root.querySelector(".row-timer");
    if (rt) { const k = `${tKey}_${ei}`; reattachTimer(k, rt); rt.onclick = () => tapTimer(k, rt, spec.rest); }
  });

  const tBtn = el.querySelector(".hs-row-full > .hs-tools .row-timer");
  if (tBtn) { reattachTimer(tKey, tBtn); tBtn.onclick = () => tapTimer(tKey, tBtn, restSecs); }
  if (sprint) wireWatchButtons(el, day, gi);
  return el;
}
function tapTimer(key, btn, secs) { if (activeTimers[key]) tapActiveTimer(key); else startCountdown(key, btn, secs); }
function revealNow(day) {
  const el = document.querySelector(`#container-${day.date} .hs-now`);
  if (!el || !el.offsetParent) return;
  if (CK.revealNow(el)) return;   // board: the lane scrolls, not the window
  const bar = document.querySelector(".appbar");
  const top = el.getBoundingClientRect().top - (bar ? bar.getBoundingClientRect().bottom : 0) - 8;
  if (top < 0 || top > window.innerHeight * 0.6) window.scrollBy({ top, behavior: "smooth" });
}

/* ---------------------------------------------------------------------------
   WORK / REST WATCH. One per sprint block, in state so a reload keeps counting:
   { phase: "work" | "rest" | null, since: ms, laps: [{ w: s, r: s }] }. Tap
   Work at the line, Rest as you cross it, Work again for the next rep; Stop
   closes the phase and keeps the laps. The button on the card and the rail
   card on a pure sprint day paint from the same record.
   --------------------------------------------------------------------------- */
function watchOf(ds, gi) { const w = ds && ds.sprint && ds.sprint[gi]; return w ? { phase: w.phase || null, since: w.since || null, laps: Array.isArray(w.laps) ? w.laps : [] } : { phase: null, since: null, laps: [] }; }
function ensureWatch(day, gi) { const d = dayState(day.date, true); d.sprint[gi] = d.sprint[gi] || { phase: null, since: null, laps: [] }; d.sprint[gi].laps = d.sprint[gi].laps || []; stampDate(d); return d.sprint[gi]; }
function watchTap(day, gi) {
  ensureAudio(); if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  const w = ensureWatch(day, gi), now = Date.now();
  if (!w.phase) { w.phase = "work"; w.since = now; w.laps.push({ w: null, r: null }); }
  else if (w.phase === "work") { const lap = w.laps[w.laps.length - 1]; lap.w = Math.round((now - w.since) / 100) / 10; w.phase = "rest"; w.since = now; beepPhase(); }
  else { const lap = w.laps[w.laps.length - 1]; lap.r = Math.round((now - w.since) / 1000); w.phase = "work"; w.since = now; w.laps.push({ w: null, r: null }); beepPhase(); }
  saveState(); syncWatchIv(); paintWatches();
}
function watchStop(day, gi, quiet) {
  const ds = dayState(day.date, false);
  const cur = watchOf(ds, gi);
  if (!cur.phase) return;
  const w = ensureWatch(day, gi), now = Date.now();
  const lap = w.laps[w.laps.length - 1];
  if (w.phase === "work" && lap) lap.w = Math.round((now - w.since) / 100) / 10;
  if (w.phase === "rest" && lap) lap.r = Math.round((now - w.since) / 1000);
  w.phase = null; w.since = null;
  if (!quiet) { saveState(); syncWatchIv(); paintWatches(); }
}
function watchReset(day, gi) {
  const ds = dayState(day.date, false);
  if (!watchOf(ds, gi).laps.length && !watchOf(ds, gi).phase) return;
  if (!confirm("Clear the sprint times for this block?")) return;
  const d = dayState(day.date, true); delete d.sprint[gi];
  saveState(); syncWatchIv(); renderDay(day);
}
function watchElapsed(w) { return w.since ? (Date.now() - w.since) / 1000 : 0; }
function watchButtonsHtml(day, gi, w) {
  const k = `${day.date}_${gi}`;
  return `<button type="button" class="btn pj-watch" data-watch="${k}" data-act="tap">⏱ Work / Rest</button>
          <button type="button" class="btn pj-watch-x" data-watch="${k}" data-act="stop" title="Stop the watch, keep the times"${w && w.phase ? "" : " hidden"}>■ Stop</button>
          <button type="button" class="btn pj-watch-x" data-watch="${k}" data-act="reset" title="Clear the times"${w && (w.laps.length || w.phase) ? "" : " hidden"}>✕</button>
          <span class="pj-laps" data-watch-laps="${k}" style="margin:0 0 0 auto;align-self:center"></span>`;
}
function wireWatchButtons(root, day, gi) {
  root.querySelectorAll(`[data-watch="${day.date}_${gi}"]`).forEach(b => {
    b.onclick = () => { if (b.dataset.act === "tap") watchTap(day, gi); else if (b.dataset.act === "stop") watchStop(day, gi); else watchReset(day, gi); };
  });
  paintWatches();
}
function lapsText(w, short) {
  const done = w.laps.filter(l => l.w != null);
  if (!done.length) return "";
  if (short) { const last = done[done.length - 1]; return `rep ${done.length} · ${fmtSecs1(last.w)}${last.r != null ? ` · rest ${fmtClock(last.r)}` : ""}`; }
  return done.map((l, i) => `<span>${i + 1} · <b>${fmtSecs1(l.w)}</b>${l.r != null ? ` · rest ${fmtClock(l.r)}` : ""}</span>`).join("<br>");
}
function paintWatches() {
  document.querySelectorAll("[data-watch]").forEach(b => {
    const [date, gi] = b.dataset.watch.split("_");
    const w = watchOf(dayState(date, false), gi);
    const el = watchElapsed(w);
    if (b.dataset.act === "tap") {
      b.classList.toggle("work", w.phase === "work"); b.classList.toggle("rest", w.phase === "rest");
      b.textContent = w.phase === "work" ? `▶ Work ${fmtSecs1(el)}` : w.phase === "rest" ? `Rest ${fmtClock(el)} · next: Work` : w.laps.length ? "▶ Work (next rep)" : "⏱ Work / Rest";
    } else if (b.dataset.act === "stop") b.hidden = !w.phase;
    else if (b.dataset.act === "reset") b.hidden = !(w.laps.length || w.phase);
  });
  document.querySelectorAll("[data-watch-laps]").forEach(s => { const [date, gi] = s.dataset.watchLaps.split("_"); s.textContent = lapsText(watchOf(dayState(date, false), gi), true); });
  document.querySelectorAll("[data-watch-card]").forEach(card => {
    const [date, gi] = card.dataset.watchCard.split("_");
    const w = watchOf(dayState(date, false), gi);
    const el = watchElapsed(w);
    card.classList.toggle("work", w.phase === "work");
    const big = card.querySelector(".clock-big"), sub = card.querySelector(".clock-sub"), laps = card.querySelector(".pj-laps"), tog = card.querySelector("[data-act=tap]");
    big.className = "clock-big" + (w.phase ? " " + w.phase : "");
    big.textContent = w.phase === "work" ? (Math.round(el * 10) / 10).toFixed(1) : w.phase === "rest" ? fmtClock(el) : w.laps.length ? fmtSecs1(w.laps[w.laps.length - 1].w || 0) : "0.0";
    sub.textContent = w.phase === "work" ? `Rep ${w.laps.length} · working` : w.phase === "rest" ? `Resting after rep ${w.laps.length} · ${fmtSecs1(w.laps[w.laps.length - 1].w || 0)}` : w.laps.length ? `${w.laps.filter(l => l.w != null).length} reps timed` : "Tap Work at the line";
    tog.textContent = w.phase === "work" ? "Rest" : w.phase === "rest" ? "Work" : w.laps.length ? "Work (next rep)" : "Work";
    tog.className = "btn " + (w.phase === "work" ? "btn-rest" : "btn-primary");
    laps.innerHTML = lapsText(w, false);
    card.querySelector("[data-act=stop]").hidden = !w.phase;
  });
}
let watchIv = null;
function syncWatchIv() {
  const running = Object.keys(state.days).some(d => Object.keys(state.days[d].sprint || {}).some(k => state.days[d].sprint[k] && state.days[d].sprint[k].phase));
  if (running && !watchIv) watchIv = setInterval(paintWatches, 100);
  if (!running && watchIv) { clearInterval(watchIv); watchIv = null; }
}
/* The rail card on a pure sprint day: the same watch, big. */
function watchCard(day, gi) {
  const card = document.createElement("div");
  card.className = "cond-card";
  card.dataset.watchCard = `${day.date}_${gi}`;
  const g = day.groups[gi];
  card.innerHTML = `
    <div class="hs-now-eyebrow" style="color:var(--warning)">Sprint watch · ${escapeHtml(groupName(day, g, gi))}</div>
    <div class="clock-wrap"><div class="clock-big">0.0</div><div class="clock-sub">Tap Work at the line</div></div>
    <div class="clock-ctl">
      <button type="button" class="btn btn-primary" data-act="tap">Work</button>
      <button type="button" class="btn" data-act="stop" hidden>■ Stop</button>
      <button type="button" class="btn" data-act="reset">✕ Clear</button>
    </div>
    <div class="pj-laps"></div>`;
  card.querySelectorAll("[data-act]").forEach(b => b.onclick = () => { if (b.dataset.act === "tap") watchTap(day, gi); else if (b.dataset.act === "stop") watchStop(day, gi); else watchReset(day, gi); });
  return card;
}

/* ---------------------------------------------------------------------------
   iPad BOARD (shared/cockpit.js). A slot is one group: a warm-up is a 6-minute
   "WU" segment with a dot per movement, a superset one segment labelled A1+A2
   with every member's sets as dots, a sprint block a 12-minute "Sprints"
   segment. A pure sprint day is a conditioning board: the lane holds the sprint
   card, the rail the session clock and the big work / rest watch.
   --------------------------------------------------------------------------- */
/* The row the Now card shows: the tapped group, else the first group not done, warm-ups skipped (Ryan knows the warm-up). */
function nowIndex(day) {
  if (day.type === "rest") return -1;
  const ds = dayState(day.date, false), k = day.date, groups = day.groups;
  if (tappedNow[k] != null && tappedNow[k] < groups.length && !isWU(groups[tappedNow[k]])) return tappedNow[k];
  return groups.findIndex((g, gi) => !isWU(g) && g.type !== "note" && !isGroupDone(ds, g, gi));
}
/* One state per prescribed set, members concatenated; a warm-up gives one per movement. */
function setStates(day, gi) {
  const ds = dayState(day.date, false), g = day.groups[gi];
  if (isWU(g)) return g.exercises.map((_, ei) => (ds && ds.completed[exKey(gi, ei)]) ? "done" : "");
  const done = isGroupDone(ds, g, gi);
  const out = [];
  g.exercises.forEach((ex, ei) => {
    const spec = specOf(ex);
    logOf(ds && ds.logs[exKey(gi, ei)], spec).sets.slice(0, spec.sets).forEach(x => out.push(done || x.d ? "done" : (x.r != null || x.w != null || x.y != null) ? "part" : ""));
  });
  return out;
}
CK.init({
  id: day => day.date,
  kind: day => day.type === "sprint" ? "conditioning" : "strength",
  eyebrow: day => `Week ${dayWeek(day)} · ${DOW_FULL[day.dow] || day.dow} · ${shortDate(day.date)}${day.deload ? " · Deload" : ""}`,
  title: day => day.title,
  warmupSecs: () => 0,   // the warm-up is a slot of its own here
  condSecs: day => day.type === "sprint" ? daySecs(day) : null,
  slots: day => day.groups.map((g, gi) => ({ idx: gi, name: groupName(day, g, gi), label: groupLabel(day, g, gi), slotName: groupSlotName(day, g, gi),
                                              secs: groupSecs(g), rest: isSprint(g) ? null : groupRest(g), closer: false, beat: "" })).filter(s => day.groups[s.idx].type !== "note"),
  nowIndex,
  setStates,
  lastText: (day, gi) => { const g = day.groups[gi]; if (isWU(g)) return ""; const ex = g.exercises[0]; return ex ? lastTimeText(ex, day, specOf(ex)) : ""; },
  restKey: (day, gi) => day.groups[gi].exercises.map((ex, ei) => restKeyOf(day, gi, ei, ex.name)),
  clock: day => { const ds = dayState(day.date, false); return ds ? { start: ds.clockStart, stop: ds.clockStop } : null; },
  toggleClock: day => {
    const cur = dayState(day.date, true);
    if (!cur.clockStart) { cur.clockStart = Date.now(); cur.clockStop = null; stampDate(cur); }
    else if (!cur.clockStop) cur.clockStop = Date.now();
    else { cur.clockStart = null; cur.clockStop = null; }
    saveState();
  },
  isComplete: isDayComplete,
  renderLane: (day, lane, rail) => {
    renderDayInto(day, lane);
    if (day.type === "sprint") day.groups.forEach((g, gi) => { if (isSprint(g)) rail.appendChild(watchCard(day, gi)); });
    paintWatches();
  },
  jump: (day, target) => {
    if (target != null && target !== "wu") {
      const g = day.groups[target];
      if (g && isWU(g)) prepOpen[`${day.date}_wu${target}`] = true;
      else tappedNow[day.date] = target;
    }
    renderDay(day);
  },
  /* The ring's zero: the concatenated set number maps back to its member and local set. A sprint block's rows are
     unlike each other (a check row, bounds, the sprints), so there the member whose check started the rest is armed. */
  armSet: (day, gi, setNo) => {
    const g = day.groups[gi];
    const root = document.getElementById("container-" + day.date);
    if (isSprint(g)) {
      const m = String(SL.rest.chan().key || "").match(/_(\d+)_(\d+)$/);
      const ei = m && +m[1] === gi ? +m[2] : -1;
      const grid = ei >= 0 && root && root.querySelector(`.grp-ex[data-ek="${exKey(gi, ei)}"]`);
      const row = grid && [...grid.querySelectorAll(".sl-row")].find(r => !r.classList.contains("sl-done"));
      const inp = row && (row.querySelector(".sl-r") || row.querySelector(".sl-w"));
      if (inp) inp.focus();
      return;
    }
    let left = setNo;
    for (let ei = 0; ei < g.exercises.length; ei++) {
      const n = specOf(g.exercises[ei]).sets;
      if (left <= n) {
        const row = root && root.querySelectorAll(`.grp-ex[data-ek="${exKey(gi, ei)}"] .sl-row`)[left - 1];
        const inp = row && (row.querySelector(".sl-r") || row.querySelector(".sl-w"));
        if (inp) inp.focus();
        return;
      }
      left -= n;
    }
  },
  /* Every day with a record, groups in order, each set's check timestamp: the cockpit learns pace from these. */
  sessions: () => ALL.map(day => {
    if (day.type === "rest") return null;
    const ds = dayState(day.date, false);
    if (!ds) return null;
    return { start: ds.clockStart || null, rows: day.groups.map((g, gi) => ({ name: groupName(day, g, gi),
      t: g.exercises.flatMap((ex, ei) => normDistLog(ds.logs[exKey(gi, ei)], 0).sets.map(x => x.t).filter(Boolean)) })) };
  }).filter(Boolean),
  onModeChange: () => { if (!DATA) return; const open = currentOpenDay(); render(); openTab(open); }
});

/* ---------------------------------------------------------------------------
   NOTES PANE: how it works, the weekly shape, the blocks, sprint logging, sync, backup
   --------------------------------------------------------------------------- */
function buildNotes() {
  const card = document.getElementById("notes-card");
  card.innerHTML = `
    <h2>How this tracker works</h2>
    <p><strong>${escapeHtml(DATA.name)}</strong> is coach ${escapeHtml(DATA.coach || "")}'s hybrid strength and speed calendar in the ${escapeHtml(DATA.app || "Chalk")} app. Karl ingests each block from the Chalk portal as it is posted (Sunday and Wednesday evenings); pick the block with the top pills, the week with the W pills and the day with the tabs. The page opens on today, else the next day still to do.</p>
    <h3>The week</h3>
    <p><strong>${escapeHtml(scheduleLine(CYC))}.</strong> Thursday and Sunday rest. Wednesday's sprints are optional in most blocks; when Chalk posts the sprints and the lifts as two workouts on one date they show here as one day, sprint block first or last as Chalk ordered them.</p>
    <h3>Blocks</h3>
    <div class="notes-block">${DATA.cycles.slice().reverse().map(c => { const last = c.days[c.days.length - 1]; return `<h4>${monthLabel(c.startDate)} · ${escapeHtml(c.label)}</h4><p style="margin:2px 0 0;font-size:12.5px;color:var(--muted)">${c.weeks} weeks · ${shortDate(c.startDate)} to ${last ? shortDate(last.date) : "…"} · ${c.days.filter(d => d.type !== "rest").length} sessions${c.days.some(d => d.deload) ? " · deload at the end" : ""}</p>`; }).join("")}</div>
    <p>Chalk announces 4-week blocks; a new block here is one new start date in the ingest table, so a block that runs long (the summer's ten weeks) stays one block.</p>
    <h3>Logging sets and the coach</h3>
    <p>Each set takes reps and weight where Chalk asks for a weight; checking a set starts the rest shown on the row. The <strong>= 4 × 7</strong> button fills the targets; type over what differed. A hit is inferred: every set at or above the top of the range. The chip under a lift says what to do next: green adds weight after a hit (5 lb, 10 on lower-body lifts), grey holds the weight after a miss, amber cuts after three misses at one weight.</p>
    <p>The <strong>Last time</strong> block is the newest session where that exercise was logged, by name, across every block: it reads <em>last week</em> within seven days, else the week and block it came from. Nothing seeds from Chalk; the first session you log here is the first reference.</p>
    <p><strong>Warm-up supersets</strong> fold into a prep card (rounds in the head, a check per movement, a lb box only where Chalk tracks one). <strong>Power complexes and pump supersets</strong> are one card, moves stacked A1 / A2, each with its own grid and history, one rest after the last move; Done closes the group.</p>
    <h3>Sprints</h3>
    <p>A sprint block is one card. Sprints and bounds log <strong>yards per set</strong> (and reps when Chalk asks); the plan's distances sit in the boxes, <strong>= plan</strong> fills them. Jumps log reps; the dynamic warm-up is a check. The <strong>Work / Rest</strong> watch is a plain stopwatch: tap Work at the line, Rest as you cross it, Work again for the next rep. Each rep's time and rest are kept on the block and sync with the day. On the iPad a pure sprint day puts the watch in the rail.</p>
    <p>Deload days carry a <em>Deload</em> flag and the coach's reduced sets; optional sprint blocks say <em>Optional</em> and do not hold up the day.</p>
    ${SL.sync.notesHtml()}
    <h3>Backup</h3>
    <div class="notes-actions">
      <button class="btn" id="btn-export">Export backup</button>
      <button class="btn" id="btn-import">Import backup</button>
    </div>
    <div class="note-box" style="margin-top:12px">Source: ${escapeHtml(DATA.app || "Chalk Performance Training")}, coach ${escapeHtml(DATA.coach || "")}, plan ${escapeHtml(String(DATA.planId || ""))}. ${DATA.cycles.length} block${DATA.cycles.length === 1 ? "" : "s"} ingested by ${escapeHtml(DATA.generatedBy || "the ingest")}; the block on screen is ${escapeHtml(CYC.id)}.</div>`;
  document.getElementById("btn-export").onclick = doExport;
  document.getElementById("btn-import").onclick = doImport;
}
function doExport() {
  const payload = { app: "powerjacked", version: 1, exportedAt: new Date().toISOString(), state };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `powerjacked-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast("Backup downloaded");
}
function doImport() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const obj = JSON.parse(r.result);
        if (obj && obj.state && obj.state.days) {
          if (!confirm("Replace current data with this backup?")) return;
          state = normState(obj.state); saveState(); render(); toast("Import complete");
        } else alert("Doesn't look like a POWERJACKED backup.");
      } catch (e) { alert("Could not read file: " + e.message); }
    };
    r.readAsText(f);
  };
  inp.click();
}
let toastTimeout = null;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  if (toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => el.classList.remove("show"), 2200);
}

/* ---------------------------------------------------------------------------
   STATS + HERO
   --------------------------------------------------------------------------- */
function updateStats() {
  if (!CYC) return;
  const ref = currentWeekRef();
  document.getElementById("stat-week").textContent = "W" + ref.w;
  document.getElementById("stat-days").textContent = ALL.filter(d => d.type !== "rest" && isDayComplete(d)).length;
  const wk = weekDays(ref.w, ref.cyc).filter(isRequired);
  document.getElementById("stat-thisweek").textContent = `${wk.filter(isDayComplete).length} / ${wk.length}`;
  const req = CYC.days.filter(isRequired);
  document.getElementById("stat-overall").textContent = req.length ? Math.round(100 * req.filter(isDayComplete).length / req.length) + "%" : "0%";
  const nx = nextDay();
  document.querySelectorAll(".tab").forEach(tab => {
    const dot = tab.querySelector(".due-dot");
    if (dot) dot.hidden = !nx || tab.dataset.pane !== nx.date;
  });
}
function render() {
  renderCycleBar();
  renderWeekBar();
  buildWeek();
  updateStats();
  syncWatchIv();
}

/* ---------------------------------------------------------------------------
   HEALTH-SYSTEM SUMMARY (contract in ../shared/shell.js). Set-day program:
   every session has a calendar date; next.id is the day's date.
   --------------------------------------------------------------------------- */
function publishSummary() {
  try {
    if (!window.HS || typeof HS.summary !== "function" || !CYC) return;
    const td = todayISO();
    const nx = nextDay();
    const todayDay = ALL.find(d => d.date === td && d.type !== "rest") || null;
    const sessions = [];
    ALL.forEach(d => { if (dayHasActivity(d)) { const ds = dayState(d.date, false); sessions.push(ds.trained || d.date); } });
    sessions.sort();
    const ref = currentWeekRef();
    const planned = weekDays(ref.w, ref.cyc).filter(isRequired);
    HS.summary(PROGRAM.slug, {
      kind: "setdays", week: ref.w, weeks: ref.cyc.weeks, phase: ref.cyc.label,
      next: nx ? { id: nx.date, label: nx.title, sub: `Week ${dayWeek(nx)} · ${nx.dow}${nx.cycle !== ref.cyc ? " · next block" : ""}`, date: nx.date, minutes: dayMinutes(nx), listed: null } : null,
      today: todayDay ? { label: todayDay.title, minutes: dayMinutes(todayDay), done: isDayComplete(todayDay) } : null,
      thisWeek: { done: planned.filter(isDayComplete).length, planned: planned.length },
      days: liftDays(ref.cyc),
      sessions, lastDate: sessions.length ? sessions[sessions.length - 1] : null
    });
  } catch (e) {}
}
function sessionFromHash() {
  const m = (location.hash || "").match(/#s=([0-9-]+)/);
  return m ? dayById(m[1]) : null;
}

/* ---------------------------------------------------------------------------
   CATALOG (Phase 2 contract in ../shared/shell.js): every training day of every
   block, each row with its slot as the tag so Gaps can pattern-tag it.
   --------------------------------------------------------------------------- */
window.HS_CATALOG = function () {
  const sessions = [];
  ALL.forEach(day => {
    if (day.type === "rest") return;
    const exercises = [];
    day.groups.forEach((g, gi) => g.exercises.forEach((ex, ei) => {
      const spec = specOf(ex);
      const kind = isWU(g) ? "warmup" : ex.slot === "mobility" ? "mobility" : ex.slot === "abs" ? "core" : (isSprint(g) || ex.slot === "sprint" || ex.slot === "engine") ? "conditioning" : "strength";
      exercises.push({ name: ex.name, scheme: shortRx(ex, spec), sets: spec.sets, reps: spec.kind === "sets" ? (repsStr(ex) || null) : spec.kind === "time" ? `${spec.repTop || ""} s` : null,
                       restSec: isSprint(g) ? (spec.rest || null) : (isSuper(g) && ei < g.exercises.length - 1 ? null : (groupRest(g) || spec.rest || null)),
                       minutes: isWU(g) ? Math.round(WU_SECS / g.exercises.length / 6) / 10 : isSprint(g) ? Math.round(SPRINT_SECS / g.exercises.length / 6) / 10 : Math.round(exSecs(ex, g) / 6) / 10,
                       kind, tag: ex.slot || null });
    }));
    sessions.push({ id: day.date, week: dayWeek(day), day: day.dow, label: day.title, minutes: dayMinutes(day), optional: !!day.optional, exercises });
  });
  return { slug: PROGRAM.slug, kind: "setdays", sessions };
};

/* ---------------------------------------------------------------------------
   SESSION CLOCK (phone): elapsed against the planning model. The board wires its rail clock instead.
   --------------------------------------------------------------------------- */
const sessionClocks = {};
function wireClock(day, btn, stat) {
  if (!btn) return;
  const key = day.date;
  const txt = btn.querySelector(".hs-clock-t") || btn;
  const planned = daySecs(day);
  function paint() {
    const cur = dayState(day.date, false);
    if (!cur || !cur.clockStart) {
      txt.textContent = "Start"; btn.classList.remove("running", "stopped");
      btn.setAttribute("aria-label", "Start the session clock");
      if (stat) stat.textContent = "";
      return;
    }
    const elapsed = Math.round(((cur.clockStop || Date.now()) - cur.clockStart) / 1000);
    txt.textContent = fmtClock(elapsed);
    btn.classList.toggle("running", !cur.clockStop);
    btn.classList.toggle("stopped", !!cur.clockStop);
    btn.setAttribute("aria-label", cur.clockStop ? `Session clock stopped at ${fmtClock(elapsed)}, tap to reset` : `Session clock ${fmtClock(elapsed)}, tap to stop`);
    if (stat) stat.textContent = isDayComplete(day) ? `done in ${fmtClock(elapsed)}` : cur.clockStop ? "clock stopped" : planned != null ? `${Math.round(elapsed / 60)} of ${fmtMins(planned).replace("~", "")} in` : "";
  }
  function syncInterval() {
    if (sessionClocks[key]) { clearInterval(sessionClocks[key]); delete sessionClocks[key]; }
    const cur = dayState(day.date, false);
    if (cur && cur.clockStart && !cur.clockStop) sessionClocks[key] = setInterval(() => { if (!btn.isConnected) { clearInterval(sessionClocks[key]); delete sessionClocks[key]; return; } paint(); }, 1000);
  }
  btn.onclick = () => {
    const cur = dayState(day.date, true);
    if (!cur.clockStart) { cur.clockStart = Date.now(); cur.clockStop = null; stampDate(cur); }
    else if (!cur.clockStop) cur.clockStop = Date.now();
    else { cur.clockStart = null; cur.clockStop = null; }
    saveState(); syncInterval(); paint();
  };
  syncInterval(); paint();
}

/* ---------------------------------------------------------------------------
   TIMERS: the row's rest countdown button, and the beeps the watch shares.
   --------------------------------------------------------------------------- */
const activeTimers = {};
let audioCtx = null;
function ensureAudio() {
  if (audioCtx) return audioCtx;
  try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); } catch (e) {}
  return audioCtx;
}
function tone(offsets, freqs) {
  const ctx = ensureAudio();
  if (ctx) {
    const now = ctx.currentTime;
    offsets.forEach((off, i) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = "sine"; osc.frequency.value = freqs[i] || 880;
      gain.gain.setValueAtTime(0, now + off);
      gain.gain.linearRampToValueAtTime(0.25, now + off + 0.01);
      gain.gain.linearRampToValueAtTime(0, now + off + 0.14);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + off); osc.stop(now + off + 0.16);
    });
  }
}
function beepDone() { tone([0, 0.18, 0.36], [880, 880, 1100]); if (navigator.vibrate) { try { navigator.vibrate([120, 80, 120, 80, 200]); } catch (e) {} } }
function beepPhase() { tone([0], [990]); }
function paintRunning(btn, text) { if (!btn) return; btn.classList.add("running"); btn.classList.remove("done"); btn.textContent = text; }
function paintDone(btn) {
  if (!btn || !btn.isConnected) return;
  btn.classList.remove("running"); btn.classList.add("done");
  btn.textContent = "Done!";
  setTimeout(() => { if (btn && btn.isConnected) { btn.classList.remove("done"); btn.textContent = btn.dataset.default || "⏱"; } }, 1800);
}
function paintReset(btn) {
  if (!btn || !btn.isConnected) return;
  btn.classList.remove("running", "done");
  btn.textContent = btn.dataset.default || "⏱";
}
function startCountdown(key, btn, secs) {
  if (!secs) return;
  ensureAudio(); if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  const endsAt = Date.now() + secs * 1000;
  paintRunning(btn, fmtClock(secs));
  const iv = setInterval(() => {
    const t = activeTimers[key]; if (!t) return;
    const remaining = Math.round((t.endsAt - Date.now()) / 1000);
    if (remaining <= 0) { clearInterval(t.iv); const b = t.btn; delete activeTimers[key]; paintDone(b); beepDone(); }
    else paintRunning(t.btn, fmtClock(remaining));
  }, 250);
  activeTimers[key] = { endsAt, iv, btn };
}
function tapActiveTimer(key) {
  const t = activeTimers[key]; if (!t) return;
  clearInterval(t.iv); delete activeTimers[key]; paintReset(t.btn);
}
function reattachTimer(key, btn) {
  const t = activeTimers[key];
  if (!btn || !t) return;
  t.btn = btn;
  const remaining = Math.round((t.endsAt - Date.now()) / 1000);
  if (remaining > 0) paintRunning(btn, fmtClock(remaining));
}

/* ---------------------------------------------------------------------------
   BOOT: fetch data.json (no-store so a new ingest lands on the next open),
   fold the days, pick the day, wire sync.
   --------------------------------------------------------------------------- */
document.getElementById("reset-btn").onclick = () => {
  if (confirm("Reset ALL tracking for this program? Every check, set, sprint time and clock across every block will be cleared.")) {
    state = emptyState(); Object.keys(tappedNow).forEach(k => delete tappedNow[k]); saveState(); render();
  }
};

async function boot() {
  const notes = document.getElementById("notes-card");
  try {
    const r = await fetch("data.json", { cache: "no-store" });
    if (!r.ok) throw new Error(`data.json ${r.status}`);
    DATA = await r.json();
  } catch (e) {
    document.getElementById("hero-sub").textContent = "Could not load data.json.";
    notes.innerHTML = `<h2>Program data did not load</h2><p>${escapeHtml(e.message)}. Pull to refresh on wifi; if it persists, the program file is missing from the deploy.</p>`;
    document.querySelector('.tab[data-pane="notes"]').click();
    return;
  }
  if (!DATA || !Array.isArray(DATA.cycles) || !DATA.cycles.length) {
    notes.innerHTML = `<h2>No blocks in data.json</h2><p>The tracker expects schema 2 in "calendar-groups" mode with at least one block.</p>`;
    document.querySelector('.tab[data-pane="notes"]').click();
    return;
  }
  DATA.cycles.forEach(c => {
    const byDate = new Map();
    (c.days || []).forEach(raw => { if (!byDate.has(raw.date)) byDate.set(raw.date, []); byDate.get(raw.date).push(raw); });
    c.days = Array.from(byDate.values()).map(parts => makeDay(parts, c)).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  });
  ALL = DATA.cycles.flatMap(c => c.days).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  if (DATA.name) document.title = `${DATA.name.replace(/ - Chalk$/, "")} — Chalk`;

  // Open on the deep link, else today's program day, else the next day still to do, else the last block's first session.
  const td = todayISO();
  const lastCyc = DATA.cycles[DATA.cycles.length - 1];
  const start = sessionFromHash() || ALL.find(d => d.date === td) || nextDay() || lastCyc.days.find(d => d.type !== "rest") || lastCyc.days[0];
  uiCycle = Math.max(0, DATA.cycles.indexOf(start.cycle));
  CYC = DATA.cycles[uiCycle];
  uiWeek = dayWeek(start);

  SL.sync.init({
    slug: PROGRAM.slug,
    storageKey: PROGRAM.storageKey,
    payload: () => ({ state, entries: syncEntries() }),
    hasData: () => Object.keys(state.days).length > 0,
    apply: merged => { const open = currentOpenDay(); state = normState(merged); render(); openTab(open); }
  });

  buildShell();
  render();
  SL.sync.wireNotes();
  openTab(start);
  publishSummary();
}
function currentOpenDay() {
  const t = document.querySelector(".tab.active[data-day]");
  return t ? dayById(t.dataset.day) : dueDayInWeek(uiWeek);
}
boot();
</script>
