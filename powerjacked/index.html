<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="PowerJacked" />
<meta name="theme-color" content="#65a30d" />
<link rel="manifest" href="../manifest.webmanifest" />
<link rel="apple-touch-icon" href="../icon-180.png" />
<link rel="icon" type="image/png" href="../favicon.png" />
<title>POWERJACKED — Chalk</title>
<link rel="stylesheet" href="../shared/styles.css" />
<style>
  /* Accent lives here, like the two newest Chalk programs (shared/styles.css is not edited). Lime: speed + power. */
  body[data-program="powerjacked"] { --primary: #65a30d; --primary-soft: #f1f9e4; --primary-line: #c3e59a; }

  /* Page styles. Shared tokens, the appbar, cards, tabs, the SetLog grid, the in-session .hs-*
     contract and the .ck-* board come from ../shared/styles.css. */
  .hero { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .hero-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .coach-badge { display: inline-block; background: var(--primary-soft); color: var(--primary); border: 1px solid var(--primary-line); border-radius: 999px; padding: 3px 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
  .hero-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .stat { background: var(--card-2); border: 1px solid var(--border-soft); border-radius: var(--radius-sm); padding: 8px 6px; text-align: center; }
  .stat-num { font-size: 17px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
  .stat-label { font-size: 9.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
  .reset-link { background: none; border: none; color: var(--muted); font-size: 11px; cursor: pointer; padding: 4px 8px; text-decoration: underline; font-family: inherit; }
  .hero .prep { margin: 10px 0 0; }

  .cycle-bar, .week-bar { display: flex; gap: 5px; overflow-x: auto; margin-bottom: 10px; padding: 4px 2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .cycle-bar::-webkit-scrollbar, .week-bar::-webkit-scrollbar { display: none; }
  .week-pill { flex-shrink: 0; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 0; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; min-width: 46px; text-align: center; font-family: inherit; font-variant-numeric: tabular-nums; }
  .week-pill.active { background: var(--primary); border-color: var(--primary); color: white; }
  .week-pill.done { border-color: var(--success); background: var(--success-soft); color: var(--success); }
  .week-pill.done.active { background: var(--success); color: white; }
  .week-pill.empty { opacity: 0.55; border-style: dashed; }
  .cycle-bar .week-pill { min-width: 0; padding: 7px 12px; text-transform: none; letter-spacing: 0; }
  .cycle-bar .week-pill small { display: block; font-size: 10px; font-weight: 600; opacity: 0.8; }

  .rules { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 10px; font-size: 12.5px; color: var(--text-body); line-height: 1.55; }
  .rules b { color: var(--text); }
  .rules .rules-k { font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--primary); margin-right: 6px; }
  .rules-row { display: flex; flex-wrap: wrap; gap: 4px 14px; }

  .tab .due-dot[hidden] { display: none; }
  .tab .due-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); margin-left: 5px; vertical-align: 1px; }
  .tab.active .due-dot { background: white; }
  .tab .tab-sub { display: block; font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: 0; text-transform: none; line-height: 1; margin-top: 3px; }
  .tab.active .tab-sub { color: var(--text-body); }

  /* Flat chips: Deload on a day, Optional on a sprint block. Text only, no fill (Ryan reads pills as noise). */
  .pj-chip { display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--warning); vertical-align: middle; margin-left: 8px; }
  .pj-chip.deload { color: var(--primary); }
  .hs-sess-title .pj-chip { font-family: var(--font, inherit); font-stretch: normal; font-size: 11px; position: relative; top: -4px; }

  /* Warm-up prep group (collapsed by default): rounds, each movement with a check, a lb field where Chalk asks for one. */
  .prep { margin: 8px 0; border: 1px solid var(--border-soft); border-radius: var(--radius-sm); background: var(--card-2); overflow: hidden; }
  .prep-head { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; cursor: pointer; user-select: none; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); min-height: 40px; }
  .prep-head .caret { font-size: 10px; }
  .prep.collapsed .prep-body { display: none; }
  .prep.collapsed .caret { transform: rotate(-90deg); }
  .prep-body { padding: 2px 12px 10px; }
  .prep-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 12.5px; color: var(--text-body); cursor: pointer; }
  .prep-item .prep-t { flex: 1; min-width: 0; }
  .prep-item .prep-t small { display: block; font-size: 11px; color: var(--muted); }
  .prep-item input.prep-w { width: 64px; min-height: 36px; text-align: center; font: inherit; font-size: 14px; font-variant-numeric: tabular-nums; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); padding: 0 4px; }
  .prep-item input.prep-w:focus { outline: none; border-color: var(--primary); }
  .prep-check { width: 22px; height: 22px; flex-shrink: 0; border: 2px solid #c8cdd6; border-radius: 7px; background: white; display: flex; align-items: center; justify-content: center; }
  .prep-check svg { width: 12px; height: 12px; opacity: 0; }
  .prep-item.done .prep-check { background: var(--success); border-color: var(--success); }
  .prep-item.done .prep-check svg { opacity: 1; }
  .prep-item.done .prep-t { color: var(--muted); text-decoration: line-through; }
  .prep-note { white-space: pre-line; font-size: 12px; color: var(--muted); line-height: 1.5; padding: 2px 0 6px; }
  .prep-text { white-space: pre-line; font-size: 12.5px; color: var(--text-body); line-height: 1.55; padding: 2px 0 6px; }
  .prep-last { font-size: 11px; color: var(--muted); }
  .hs-row.hs-wu .prep { margin: 0 0 8px; }
  .hs-row.hs-wu.hs-open .prep { border-color: var(--primary-line); }

  .ex-instruction { margin: 6px 0 0; font-size: 13px; color: var(--text-body); line-height: 1.5; white-space: pre-line; }
  .ex-alt { margin-top: 5px; font-size: 12px; color: var(--muted); }
  .ex-side { color: var(--muted); font-weight: 500; }
  .rest-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .rest-card p { font-size: 14px; line-height: 1.6; color: var(--text-body); margin: 8px 0 0; white-space: pre-line; }
  .empty-card { background: var(--card); border: 1px dashed var(--border); border-radius: var(--radius); padding: 18px; text-align: center; color: var(--muted); font-size: 13.5px; }

  /* Grouped rows (Dumbbells Only pattern): a superset is one card, members stacked A1 / A2, one rest for the group.
     A sprint block is the same card with its own work / rest watch. */
  .grp-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin: 2px 0 4px; font-size: 12.5px; color: var(--muted); }
  .grp-type { font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--primary); }
  .grp-note { font-size: 12.5px; color: var(--text-body); line-height: 1.5; margin: 4px 0 2px; white-space: pre-line; }
  .grp-ex { margin-top: 6px; }
  .grp-ex + .grp-ex { border-top: 1px dashed var(--border); margin-top: 16px; padding-top: 12px; }
  .grp-tag { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--primary); margin-bottom: 2px; }
  .grp-ex-tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .grp-ex-tools .btn { min-height: 34px; padding: 0 10px; font-size: 12px; gap: 5px; }
  .grp-ex-tools .btn svg { width: 15px; height: 15px; flex-shrink: 0; }
  .hs-row-sum .grp-sum-tags { color: var(--primary); font-weight: 800; font-size: 10.5px; letter-spacing: 0.06em; margin-right: 4px; }
  .hs-row.hs-sprint.hs-now { border-color: var(--warning); }
  .hs-row.hs-sprint .hs-now-eyebrow, .hs-row.hs-sprint .grp-type, .hs-row.hs-sprint .grp-tag { color: var(--warning); }

  /* The distance grid (sprints, bounds, carries): yards per set, reps and lb when Chalk asks, same classes as SetLog's. */
  .sl-grid.sl-k.sl-c3 .sl-head, .sl-grid.sl-k.sl-c3 .sl-row { grid-template-columns: 34px 1fr 1fr 1fr 44px; }
  .pj-plan { font-size: 12px; color: var(--muted); margin: 2px 0 6px; }

  /* Work / rest watch: the plain sprint stopwatch. A button on the card; on a pure sprint day the same watch is the rail card. */
  .pj-watch { font-variant-numeric: tabular-nums; min-width: 110px; justify-content: center; }
  .pj-watch.work, .hs-tools .pj-watch.work { background: var(--primary); color: #fff; border-color: var(--primary); }
  .pj-watch.rest, .hs-tools .pj-watch.rest { background: var(--warning-soft); color: var(--warning); border-color: #edd9a6; }
  .hs-tools .pj-watch { border-color: var(--border); color: var(--text-body); }
  .pj-watch-x { color: var(--danger); min-width: 0; }
  .pj-laps { margin: 8px 0 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.6; }
  .pj-laps b { color: var(--text-body); font-weight: 700; }
  .cond-card { background: var(--card); border: 2px solid var(--warning); border-radius: 20px; padding: 14px; margin-bottom: 10px; }
  .cond-card.work { border-color: var(--primary); }
  .clock-wrap { text-align: center; padding: 10px 0 2px; }
  .clock-big { font-family: var(--disp); font-stretch: 80%; font-weight: 800; font-size: 58px; line-height: 1; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
  .clock-big.work { color: var(--primary); }
  .clock-big.rest { color: var(--warning); }
  .clock-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .clock-ctl { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .clock-ctl .btn-primary { background: var(--primary); color: white; border-color: var(--primary); min-width: 130px; }
  .clock-ctl .btn-rest { background: var(--warning); color: white; border-color: var(--warning); min-width: 130px; }

  /* Timer buttons (rest countdown) */
  .btn-timer { font-variant-numeric: tabular-nums; min-width: 78px; justify-content: center; }
  .btn-timer.running { background: var(--primary); color: white; border-color: var(--primary); }
  .btn-timer.done { background: var(--success); color: white; border-color: var(--success); animation: timer-flash 0.6s ease-out; }
  @keyframes timer-flash { 0% { transform: scale(1); } 30% { transform: scale(1.08); } 100% { transform: scale(1); } }

  /* In-session day pane: fill the gaps the shared .hs-* contract leaves. */
  .hs-sess-title.long { font-size: 27px; }
  .hs-sess-clock .hs-clock-t { font-variant-numeric: tabular-nums; }
  .hs-sess-clock:not(.running):not(.stopped) .hs-clock-t { color: var(--primary); font-size: 18px; }
  .hs-sess-clock.stopped .hs-clock-t { color: var(--muted); }
  .hs-sess-progress { flex-wrap: wrap; row-gap: 6px; }
  .hs-sess-progress .hs-bar { flex: 1 1 90px; }
  .hs-sess-progress span { white-space: normal; }
  .hs-sess-ctl { display: flex; align-items: center; gap: 6px; margin: 0 2px 10px; }
  .hs-sess-pace { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); }
  .hs-mini { min-height: 32px; padding: 0 10px; font-size: 12px; }
  .hs-row-sum .hs-sum-r { max-width: 50%; overflow: hidden; text-overflow: ellipsis; }
  .hs-row-sum .row-timer { min-height: 34px; padding: 0 10px; }
  .hs-row-sum .hs-sum-t small .ex-tag { margin-right: 6px; }
  .hs-row.hs-now .ex-prescription { margin-top: 2px; font-size: 13px; color: var(--muted); }
  .hs-row.hs-now .ex-log { margin-top: 12px; }
  .hs-tools .btn { padding: 0 8px; gap: 5px; }
  .hs-tools .btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .hs-tools .hs-done-btn { margin-left: auto; color: var(--primary); font-weight: 800; }
  .hs-tools .hs-done-btn.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn-danger { color: var(--danger); border-color: #f3c8c4; }

  .notes-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .notes-block h4 { margin: 12px 0 2px; font-size: 13.5px; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: var(--text); color: white; padding: 10px 16px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* iPad board: shared/cockpit.js + the .ck-* block in ../shared/styles.css. Page-only touches below. */
  .ck-rail-clock:not(.running):not(.stopped) .hs-clock-t { color: var(--primary-line); }
  .ck-rail .cond-card { margin: 0; flex: none; }
  .ck-rail .clock-big { font-size: 48px; }

  @media (max-width: 420px) {
    .hero-stats { gap: 6px; }
    .stat { padding: 6px 4px; }
    .stat-num { font-size: 15px; }
    .stat-label { font-size: 8.5px; }
    .clock-big { font-size: 50px; }
  }
</style>
</head>
<body data-program="powerjacked">

<header class="appbar">
  <div class="appbar-inner">
    <a class="appbar-back" href="../" aria-label="Back to Exercise Library">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="10 3 5 8 10 13"/></svg>
      Library
    </a>
    <div class="appbar-title">
      <div class="eyebrow">Program</div>
      <div class="name" id="appbar-name">POWERJACKED</div>
    </div>
  </div>
  <div class="appbar-accent"></div>
</header>

<div class="container">

  <!-- HERO -->
  <div class="hero">
    <div class="hero-top">
      <div>
        <span class="coach-badge" id="hero-badge">Chalk · Ryan Fischer</span>
        <h1 style="margin-top:6px" id="hero-title">POWERJACKED</h1>
        <div class="hero-sub" id="hero-sub">Loading the current block…</div>
      </div>
      <button class="reset-link" id="reset-btn" title="Reset all tracking">Reset</button>
    </div>
    <div class="hero-stats">
      <div class="stat"><div class="stat-num" id="stat-week">W1</div><div class="stat-label">Week</div></div>
      <div class="stat"><div class="stat-num" id="stat-days">0</div><div class="stat-label">Sessions</div></div>
      <div class="stat"><div class="stat-num" id="stat-thisweek">0 / 0</div><div class="stat-label">This Week</div></div>
      <div class="stat"><div class="stat-num" id="stat-overall">0%</div><div class="stat-label">Block</div></div>
    </div>
    <div id="hero-about"></div>
  </div>

  <!-- BLOCK + WEEK PILLS -->
  <div class="cycle-bar" id="cycle-bar" hidden></div>

  <!-- THE WEEK'S SHAPE -->

  <!-- TABS: day tabs are injected before the Notes tab -->

    <button class="tab" data-pane="notes">Notes</button>

  <!-- PANES: day panes are injected before the Notes pane -->

      <div class="card" id="notes-card"></div>

</div>

<script>
"use strict";
const SL = window.SetLog;
const CK = window.Cockpit;
const { normName, fmtWeight, fmtLoad } = SL;

/* ===========================================================================
   POWERJACKED (Chalk Performance Training, coach Ryan Fischer). Data-driven
   from ./data.json (schema 2, mode "calendar-groups"): block → week → dated
   day → groups → exercises. Day types:
     strength   groups in order (warm-up prep, straight rows, lettered supersets)
     mixed      a sprint block beside the lifts (Sprint & Pull); Chalk sometimes
                posts the two as separate workouts on one date, which this page
                folds into one day so a date is one tab
     sprint     only the sprint block; on the iPad the watch takes the rail
     rest       the coach's note
   Group types on the shared grid:
     warmup     a collapsed prep card: rounds, a check per movement, lb only
                where Chalk asks for it, no rest bar
     straight   the normal SetLog row with its own rest
     superset   one card, members A1 / A2 (letters count supersets in the day),
                one rest bar after the last member, the group note above
     sprint     one card per block: distance rows log yards (+ reps) per set,
                time rows seconds, reps-only rows reps, an empty prescription
                is a check row; a plain work / rest watch on the card
   No Chalk loads seed history (none were captured). Storage key pj_v1; sync
   slug powerjacked (shared/setlog.js).
   Design brief: KARL_DATA/outputs/personal/workout-trackers/powerjacked/DESIGN-BRIEF-2026-10-24.md
   =========================================================================== */
const PROGRAM = { slug: "powerjacked", storageKey: "pj_v1", appbarName: "POWERJACKED", shortName: "PJ" };
const STORAGE_KEY = PROGRAM.storageKey;
const VIDEO_BASE = "https://www.youtube.com/results?search_query=";
const v = q => VIDEO_BASE + encodeURIComponent(q + " exercise form");
const SET_OVERHEAD = 45;        // seconds a set takes beyond its rest, in the planning model
const WU_SECS = 6 * 60;         // a warm-up group's planned time
const SPRINT_SECS = 12 * 60;    // a sprint block's planned time

const DOW_FULL = { Sun: "Sunday", Mon: "Monday", Tue: "Tuesday", Wed: "Wednesday", Thu: "Thursday", Fri: "Friday", Sat: "Saturday" };
const DOW_ORDER = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const SLOT = { chest: "Chest", back: "Back", legs: "Legs", shoulders: "Shoulders", biceps: "Biceps", triceps: "Triceps", abs: "Abs", power: "Power", mobility: "Mobility", engine: "Engine", sprint: "Sprint" };
const SLOT_SHORT = { chest: "Chest", back: "Back", legs: "Legs", shoulders: "Shldr", biceps: "Bi", triceps: "Tri", abs: "Abs", power: "Power", mobility: "Mob", engine: "Engine", sprint: "Sprint" };
const BW_LOADED_RE = /chin.?ups?|pull.?ups?|\bdips?\b/i;
const BW_RE = /push.?ups?|hanging|leg raises?|knee raises?|plank|hollow|sit.?ups?|v.?ups?|burpee|dead hang|toes? to bar/i;
const LOWER_RE = /squat|deadlift|hip thrust|leg press|lunge|\brdl\b|romanian|good morning|hack|step.?up|calf raise|leg extension|leg curl|hamstring curl|nordic/i;

/* ---------------------------------------------------------------------------
   DATA + STATE
   --------------------------------------------------------------------------- */
let DATA = null;          // data.json
let CYC = null;           // the block on screen
let ALL = [];             // every day of every block, ascending by date, each with .cycle
let state = loadState();
let uiCycle = 0;
let uiWeek = 1;

function emptyState() { return { v: 1, days: {} }; }
function normState(p) {
  const s = emptyState();
  if (p && typeof p === "object" && p.days && typeof p.days === "object") s.days = p.days;
  return s;
}
function loadState() {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return normState(JSON.parse(raw)); } catch (e) {}
  return emptyState();
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  updateStats();
  SL.sync.schedule();
  publishSummary();
}
/* One record per calendar day, keyed by date. completed: "g<gi>" per group, "<gi>_<ei>" per warm-up movement;
   logs: "<gi>_<ei>" per exercise; sprint: "<gi>" the work / rest watch (phase, since, laps). */
function dayState(date, create) {
  if (!state.days[date] && create) state.days[date] = { trained: null, clockStart: null, clockStop: null, completed: {}, logs: {}, sprint: {} };
  const ds = state.days[date] || null;
  if (ds) { ds.completed = ds.completed || {}; ds.logs = ds.logs || {}; ds.sprint = ds.sprint || {}; }
  return ds;
}
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function shortDate(iso) { if (!iso) return "—"; const [, m, d] = iso.split("-"); return `${parseInt(m, 10)}/${parseInt(d, 10)}`; }
function monthLabel(iso) { return new Date(iso + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" }); }
function stampDate(ds) { if (!ds.trained) ds.trained = todayISO(); }
function escapeHtml(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function fmtClock(s) { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60), sec = s % 60; return `${m}:${String(sec).padStart(2, "0")}`; }
function fmtMins(secs) { return `~${Math.round(secs / 60)} min`; }
function fmtSecs1(s) { return `${(Math.round(s * 10) / 10).toFixed(1)} s`; }

/* ---------------------------------------------------------------------------
   DAY SHAPE. The ingest writes one entry per Chalk workout; October's Wednesday
   posts PULL and Sprints as two workouts on one date. One date = one day here.
   --------------------------------------------------------------------------- */
/* "PULL" → "Pull"; "Upper: DELOAD" → "Upper" (the flag carries it); "Sprints: OPTIONAL" → "Sprints". */
function cleanTitle(t) {
  let s = String(t || "").replace(/[:\s]*\(?\b(deload|optional)\b\)?/gi, "").replace(/\s+/g, " ").trim();
  if (s.length > 2 && s === s.toUpperCase()) s = s.charAt(0) + s.slice(1).toLowerCase();
  return s || "Session";
}
function makeDay(parts, cyc) {
  const live = parts.filter(p => p.type !== "rest");
  if (!live.length) { const r = parts[0]; return { date: r.date, dow: r.dow, week: r.week, type: "rest", title: "Rest", note: r.note || "", groups: [], cycle: cyc }; }
  const groups = [];
  live.forEach(p => (p.groups || []).forEach(g => {
    const gg = Object.assign({}, g);
    gg.exercises = (g.exercises || []).slice();
    if (g.type === "sprint" && (p.optional || /optional/i.test(g.name || "") || /optional/i.test(p.title || ""))) gg.optional = true;
    groups.push(gg);
  }));
  const hasSprint = groups.some(g => g.type === "sprint"), hasLift = groups.some(g => g.type !== "sprint" && g.type !== "warmup" && g.type !== "note");
  const type = hasSprint && !hasLift ? "sprint" : hasSprint && hasLift ? "mixed" : "strength";
  const titles = []; live.forEach(p => { const t = cleanTitle(p.title); if (!titles.includes(t)) titles.push(t); });
  return { date: live[0].date, dow: live[0].dow, week: live[0].week || parts[0].week, type, title: titles.join(" + "), rawTitle: live.map(p => p.title).join(" + "),
           deload: live.some(p => p.deload), optional: live.every(p => p.optional), note: live.map(p => p.note).filter(Boolean).join("\n\n"), groups, cycle: cyc };
}
function dayWeek(day) {
  if (day.week) return day.week;
  const c = day.cycle || CYC;
  const diff = Math.floor((Date.parse(day.date + "T12:00:00") - Date.parse(c.startDate + "T12:00:00")) / 864e5);
  return Math.max(1, Math.floor(diff / 7) + 1);
}
function weekDays(w, cyc) { return (cyc || CYC).days.filter(d => dayWeek(d) === w); }
function dayById(id) { return ALL.find(d => d.date === id) || null; }
function whereOf(day) { return `W${dayWeek(day)} ${day.dow}`; }
function isRequired(day) { return day.type !== "rest" && !day.optional; }
function scheduleLine(cyc) {
  const sch = cyc.schedule || {};
  return DOW_ORDER.filter(d => sch[d]).map(d => `${d} ${cleanTitle(sch[d])}`).join(" · ");
}
function liftDays(cyc) { const sch = cyc.schedule || {}; return DOW_ORDER.filter(d => sch[d]); }

/* ---------------------------------------------------------------------------
   ROWS. Four shapes on the grid, from Chalk's `fields`:
     sets      reps (+ lb when Chalk asks): SetLog's grid, coach and history
     time      seconds per set: SetLog's grid with unit "s"
     check     no prescription, no load (a dynamic warm-up): a check per set
     distance  yards per set (+ reps, + lb when Chalk asks): this page's grid
   Chalk stores a sprint distance in feet behind a "yards" label (15 yards
   arrives as 45): yardsOf() reads the coach's own yard figures to tell.
   --------------------------------------------------------------------------- */
function repsStr(ex) { const r = String(ex.reps == null ? "" : ex.reps).trim(); return r === "-1" || /^max/i.test(r) ? "max" : r; }
function fieldsOf(ex) { return Array.isArray(ex.fields) ? ex.fields : ["reps", "weight"]; }
function rowKind(ex) {
  const f = fieldsOf(ex);
  if (f.includes("distance")) return "distance";
  if (ex.kind === "time" || (f.includes("time") && !f.includes("reps"))) return "time";
  if (!repsStr(ex) && !f.includes("weight")) return "check";
  return "sets";
}
function timeSecs(ex) { const n = parseInt(String(ex.time || "").match(/\d+/) || "", 10); return isNaN(n) ? null : n; }
/* Yards per set. Chalk's figures are feet when the instruction's yard numbers match them ÷ 3 (every sprint row so far). */
function yardsOf(ex) {
  const raw = String(ex.distance == null ? "" : ex.distance).split(/[,\s]+/).map(Number).filter(n => isFinite(n) && n > 0);
  if (!raw.length) return [];
  const said = new Set(Array.from(String(ex.instruction || "").matchAll(/(\d+)\s*(?:-\s*\d+\s*)?(?:yards?|yds?)\b/gi), m => parseInt(m[1], 10)));
  const feet = raw.every(n => n % 3 === 0) && (said.size ? raw.some(n => said.has(n / 3)) : raw.every(n => n >= 30));
  const yds = raw.map(n => feet ? n / 3 : n);
  const sets = ex.sets || yds.length;
  while (yds.length < sets) yds.push(yds[yds.length - 1]);
  return yds.slice(0, sets);
}
/* "3 × 15 yd, 3 × 20 yd, 2 × 30 yd" */
function distPlanText(yds) {
  if (!yds.length) return "";
  const runs = [];
  yds.forEach(y => { const l = runs[runs.length - 1]; if (l && l.y === y) l.n++; else runs.push({ y, n: 1 }); });
  return runs.map(r => `${r.n} × ${r.y} yd`).join(", ");
}
/* The spec SetLog reads (and this page's extra fields: kind, yards, hasReps). */
function specOf(ex) {
  const kind = rowKind(ex);
  const f = fieldsOf(ex);
  const bwMove = BW_LOADED_RE.test(ex.name) || BW_RE.test(ex.name);
  const sets = ex.sets || 1;
  const rest = ex.restSec != null && ex.restSec > 0 ? ex.restSec : null;   // null = no rest bar
  const base = { name: ex.name, sets, minSets: sets, repTop: null, repRange: null, isMax: false, unit: "reps", loaded: f.includes("weight"), bw: false,
                 lower: ex.slot === "legs" || LOWER_RE.test(ex.name), rest, kind };
  if (kind === "sets") {
    const p = SL.parseReps(repsStr(ex));
    Object.assign(base, { repTop: p.repTop, repRange: p.repRange, isMax: p.isMax, unit: p.unit });
  } else if (kind === "time") {
    const p = SL.parseReps(repsStr(ex));
    Object.assign(base, { unit: "s", repTop: p.unit === "s" ? p.repTop : (timeSecs(ex) || p.repTop) });
  } else if (kind === "check") {
    Object.assign(base, { unit: "none", loaded: false });
  } else {
    const yds = yardsOf(ex);
    const p = SL.parseReps(repsStr(ex));
    Object.assign(base, { unit: "yd", yards: yds, hasReps: f.includes("reps"), repTop: f.includes("reps") ? (p.repTop || 1) : null, isMax: false });
  }
  base.bw = base.loaded && bwMove;
  return base;
}
const isDist = spec => spec.kind === "distance";
/* The coach's text, without the "Intensity: 7/10" line the ingest already lifted into ex.intensity. */
function instructionText(ex) {
  let t = String(ex.instruction || "");
  if (ex.intensity) t = t.replace(/\n?\s*Intensity:\s*\d+\s*\/\s*10\.?\s*/gi, "\n");
  return t.replace(/\n{3,}/g, "\n\n").trim();
}
function restText(secs) { return secs >= 120 || secs % 60 === 0 ? fmtClock(secs) : `${secs}s`; }
function rxCore(ex, spec) {
  if (isDist(spec)) return `${distPlanText(spec.yards) || `${spec.sets} × distance`}${spec.hasReps && spec.repTop > 1 ? ` · ${spec.repTop} reps each` : ""}`;
  if (spec.kind === "time") return `${spec.sets} × ${spec.repTop != null ? spec.repTop + " s" : "hold"}`;
  if (spec.kind === "check") return `${spec.sets} × through`;
  return `${spec.sets} × ${spec.isMax ? "max" : repsStr(ex)}`;
}
/* "4 × 3 (per side) · rest 3:00 · intensity 7/10"; a group member leaves the rest to the group line. */
function rxText(ex, spec, withRest, restSecs) {
  const side = ex.perSide ? ` <span class="ex-side">(per side)</span>` : "";
  const rest = withRest && restSecs ? ` · rest ${fmtClock(restSecs)}` : "";
  const inten = ex.intensity ? ` · intensity ${escapeHtml(ex.intensity)}` : "";
  const tm = spec.kind === "sets" && timeSecs(ex) && fieldsOf(ex).includes("time") ? ` · ${timeSecs(ex)} s each` : "";
  return `${rxCore(ex, spec)}${side}${tm}${rest}${inten}`;
}
function shortRx(ex, spec) { return `${rxCore(ex, spec)}${ex.perSide ? " (per side)" : ""}`; }

/* ---------------------------------------------------------------------------
   LOGS. SetLog's shape for sets / time / check rows; the distance log adds y
   (yards) per set, which SL.normLog would drop, so it has its own normalizer.
   --------------------------------------------------------------------------- */
function normDistLog(raw, nSets) {
  const out = { sets: [], notes: "" };
  if (raw && typeof raw === "object") {
    out.notes = typeof raw.notes === "string" ? raw.notes : "";
    if (Array.isArray(raw.sets)) out.sets = raw.sets.map(x => {
      x = x || {};
      const o = { y: x.y == null || x.y === "" ? null : SL.parseWeight(x.y), r: x.r == null || x.r === "" ? null : SL.parseInt(x.r), w: x.w == null || x.w === "" ? null : SL.parseWeight(x.w) };
      if (x.d) o.d = true;
      if (typeof x.t === "number" && x.t > 0) o.t = x.t;
      return o;
    });
  }
  while (out.sets.length < (nSets || 0)) out.sets.push({ y: null, r: null, w: null });
  return out;
}
function logOf(raw, spec) { return isDist(spec) ? normDistLog(raw, spec.sets) : SL.normLog(raw, spec.sets); }

function hasData(log, spec) { return hasSets(log, spec) || !!(log.notes && log.notes.trim()); }
function anyData(raw) { const l = normDistLog(raw, 0); return l.sets.some(x => x.y != null || x.r != null || x.w != null) || !!(l.notes && l.notes.trim()); }
/* A history entry. Distance rows carry their yards; everything else is SetLog's. */
function entryOf(log, spec, meta) {

}
/* "15, 15, 15, 20 yd" (reps listed only when some set had more than one), "+ @ 95 lb" on loaded carries. */
function distText(e) {
  const sets = e.sets.filter(x => x.y != null || x.r != null || x.w != null);
  if (!sets.length) return "";
  const yds = sets.map(x => x.y);
  const runs = [];
  yds.forEach(y => { const l = runs[runs.length - 1]; if (l && l.y === y) l.n++; else runs.push({ y, n: 1 }); });
  const d = yds.every(y => y != null) ? runs.map(r => `${r.n} × ${r.y} yd`).join(", ") : sets.map(x => x.y == null ? "–" : x.y).join(", ") + " yd";
  const reps = sets.some(x => x.r != null && x.r !== 1) ? ` · ${sets.map(x => x.r == null ? "–" : x.r).join(", ")} reps` : "";
  const load = e.weight != null ? ` @ ${fmtWeight(e.weight)} lb` : "";

}

/* What was logged, compact: "3 × 12 @ 104 lb" when every set matches, else the entry text. */
function loggedRx(ex, spec, log) {
  if (!hasSets(log, spec)) return null;
  if (isDist(spec)) return distText(entryOf(log, spec));
  const sets = log.sets.filter(x => x.r != null || x.w != null);
  const same = sets.length > 1 && sets.every(x => x.r === sets[0].r && x.w === sets[0].w);
  if (same && sets[0].r != null) return `${sets.length} × ${sets[0].r}${spec.unit === "s" ? " s" : ""}${sets[0].w != null ? " @ " + fmtLoad(sets[0].w, spec.bw) : ""}`;
  return SL.lastText(SL.entry(log, spec), spec);
}

/* ---------------------------------------------------------------------------
   GROUPS
   --------------------------------------------------------------------------- */
const exKey = (gi, ei) => `${gi}_${ei}`;
const isWU = g => g.type === "warmup";
const isSprint = g => g.type === "sprint";
const isSuper = g => g.type === "superset" || (g.type === "straight" && g.exercises.length > 1);
/* Letters count supersets in the day: the first superset is A, the next B, whatever sits between them. */
function letter(day, gi) { let k = 0; for (let i = 0; i < gi; i++) if (isSuper(day.groups[i])) k++; return String.fromCharCode(65 + k); }
function tagOf(day, g, gi, ei) { return isSuper(g) ? `${letter(day, gi)}${ei + 1}` : ""; }
function groupRest(g) {
  if (g.restSec != null && g.restSec > 0) return g.restSec;
  const last = g.exercises[g.exercises.length - 1];
  return last && last.restSec > 0 ? last.restSec : null;
}
function groupName(day, g, gi) {
  if (isWU(g)) return g.name ? cleanTitle(g.name) : "Warm-up";
  if (isSprint(g)) return cleanTitle(g.name || "Sprints");
  return g.exercises.map(ex => ex.name).join(" + ");
}
function groupLabel(day, g, gi) {
  if (isWU(g)) return "WU";
  if (isSprint(g)) return "Sprints";
  if (isSuper(g)) return g.exercises.map((_, ei) => `${letter(day, gi)}${ei + 1}`).join("+");
  const ex = g.exercises[0];
  return SLOT_SHORT[ex.slot] || ex.slot || "";
}
function groupSlotWords(g) { return g.exercises.map(ex => SLOT[ex.slot] || ex.slot || "").filter(Boolean).join(" + "); }
function groupSlotName(day, g, gi) {
  if (isWU(g)) return `Warm-up · ${g.rounds ? g.rounds + " rounds" : groupSlotWords(g)}`;
  if (isSprint(g)) return `Sprint block${g.optional ? " · optional" : ""}`;
  if (isSuper(g)) return `${g.name ? cleanTitle(g.name) : "Superset"} · ${groupSlotWords(g)}`;
  return groupSlotWords(g);
}
/* Planning model: Σ sets × (rest + 45 s) per member; a warm-up 6 min; a sprint block 12 min. */
function exSecs(ex, g) {
  const spec = specOf(ex);
  const rest = spec.rest || groupRest(g) || 60;
  return spec.sets * (rest + SET_OVERHEAD);
}
function groupSecs(g) {
  if (isWU(g)) return WU_SECS;
  if (isSprint(g)) return SPRINT_SECS;
  return g.exercises.reduce((a, ex) => a + exSecs(ex, g), 0);
}
function daySecs(day) { return day.type === "rest" ? null : day.groups.reduce((a, g) => a + groupSecs(g), 0); }
function dayMinutes(day) { const s = daySecs(day); return s == null ? null : Math.round(s / 60); }

/* ---------------------------------------------------------------------------
   COMPLETION
   --------------------------------------------------------------------------- */
function isGroupDone(ds, g, gi) {
  if (!ds) return false;
  if (isWU(g)) return g.exercises.length > 0 && g.exercises.every((_, ei) => ds.completed[exKey(gi, ei)]);
  return !!ds.completed["g" + gi];
}
function isDayComplete(day) {
  const ds = dayState(day.date, false);
  if (!ds || day.type === "rest" || !day.groups.length) return false;
  const req = day.groups.filter(g => !g.optional && !isWU(g));
  const must = req.length ? req : day.groups.filter(g => !isWU(g));
  return must.length > 0 && must.every(g => isGroupDone(ds, g, day.groups.indexOf(g)));
}
function isWeekComplete(w, cyc) {
  const req = weekDays(w, cyc).filter(isRequired);
  return req.length > 0 && req.every(isDayComplete);
}
function dayHasActivity(day) {
  const ds = dayState(day.date, false);
  if (!ds) return false;
  if (ds.clockStart || ds.trained) return true;
  if (Object.keys(ds.completed).some(k => ds.completed[k])) return true;
  if (Object.keys(ds.sprint).some(k => ds.sprint[k] && ds.sprint[k].laps && ds.sprint[k].laps.length)) return true;
  return Object.keys(ds.logs).some(k => anyData(ds.logs[k]));
}
function currentCycleIndex() {
  const td = todayISO();
  let idx = DATA.cycles.findIndex(c => c.days.some(d => d.date === td));
  if (idx < 0) for (let i = DATA.cycles.length - 1; i >= 0; i--) if (DATA.cycles[i].startDate <= td) { idx = i; break; }
  return idx < 0 ? 0 : idx;
}
/* Next = the first required day from today on, in the current block, not yet complete; then the following block's
   first open day. Earlier blocks were logged in Chalk, not here, so they never count as "next". */
function nextDay() {
  const td = todayISO();
  const ci = currentCycleIndex();
  for (let i = ci; i < DATA.cycles.length; i++) {
    const d = DATA.cycles[i].days.find(x => isRequired(x) && !isDayComplete(x) && (i > ci || x.date >= td));
    if (d) return d;
  }
  return null;
}
function currentWeekRef() {
  const td = todayISO();
  const cyc = DATA.cycles[currentCycleIndex()];
  const today = cyc.days.find(d => d.date === td);
  if (today) return { cyc, w: dayWeek(today) };
  const nx = nextDay();
  if (nx) return { cyc: nx.cycle, w: dayWeek(nx) };
  return { cyc, w: cyc.weeks };
}
function dueDayInWeek(w) {
  const days = weekDays(w);
  const nx = nextDay();
  if (nx && days.includes(nx)) return nx;
  return days.find(d => isRequired(d) && !isDayComplete(d)) || days.find(d => d.type !== "rest" && !isDayComplete(d)) || days[0] || null;
}

/* ---------------------------------------------------------------------------
   HISTORY + PROGRESSION COACH. Exercises recur by name across days and blocks
   (SL.normName). Newest first. No Chalk seed: nothing was captured there.
   --------------------------------------------------------------------------- */
function priorEntries(name, beforeDate) {
  const key = normName(name);
  const out = [];
  ALL.forEach(day => {
    if (day.type === "rest" || day.date >= beforeDate) return;
    const ds = dayState(day.date, false);
    if (!ds) return;
    day.groups.forEach((g, gi) => g.exercises.forEach((x, ei) => {
      if (normName(x.name) !== key) return;
      const spec = specOf(x);
      const log = logOf(ds.logs[exKey(gi, ei)], spec);
      if (!hasSets(log, spec)) return;
      out.push(entryOf(log, spec, { date: ds.trained || day.date, where: whereOf(day), day }));
    }));
  });
  return out.reverse();
}
function suggestNext(ex, day, spec, hist) {
  if (isDist(spec) || spec.kind === "check") return null;
  return SL.suggest(hist || priorEntries(ex.name, day.date), spec);
}
/* The most recent logged session of an exercise before this day: "last week" within 7 days, else "W3 · Jul 27 block". */
function lastTimeOf(ex, day, hist) {
  hist = hist || priorEntries(ex.name, day.date);
  if (!hist.length) return null;
  const L = hist[0];
  const diff = Math.round((Date.parse(day.date + "T12:00:00") - Date.parse(L.date + "T12:00:00")) / 864e5);
  const lastWeek = diff >= 0 && diff <= 7;
  return { entry: L, date: L.date, lastWeek, ctx: lastWeek ? "last week" : `W${dayWeek(L.day)} · ${monthLabel(L.day.cycle.startDate)} block` };
}
/* One line for the tracker row and the Up next summary: "last wk · 7, 7, 7 @ 185 lb". */
function lastTimeText(ex, day, spec) {
  const lt = lastTimeOf(ex, day);
  if (!lt) return "";
  return `${lt.lastWeek ? "last wk" : lt.ctx.replace(" block", "")} · ${entryText(lt.entry, spec)}`;
}
/* The prominent block in the Now card. A newer stack set still wins, through SL.lastHtml, as everywhere in the library. */
function lastTimeHtml(ex, day, spec, hist) {
  const lt = lastTimeOf(ex, day, hist);
  if (!lt) return "";
  if (!isDist(spec) && SL.stackNewer(ex.name, lt.date)) return SL.lastHtml(lt.entry, spec, "");
  const e = lt.entry;
  const flag = spec.isMax || e.dist ? "" : e.hit === true ? ` <span class="ex-hit-flag yes">hit</span>` : e.hit === false ? ` <span class="ex-hit-flag no">short</span>` : "";
  return CK.lastBlock(`${lt.ctx} · ${monthLabel(e.date)}`, entryText(e, spec), flag);
}
/* Week over week on a rep-target row: this week's target beside last time's at its own target. */
function weekOverHtml(L, spec) {
  if (!L || L.dist || spec.repTop == null || L.target == null || L.target === spec.repTop) return "";
  const top = L.weight != null ? ` @ ${fmtLoad(L.weight, spec.bw)}` : "";
  return `<div class="ex-last">This week: <strong>${spec.sets} × ${spec.repTop}</strong> · last time <strong>${L.target} reps${top}</strong> (${L.where})</div>`;
}

/* ---------------------------------------------------------------------------
   SYNC. Transport and the device token live in ../shared/setlog.js. The flat
   `entries` list is what Karl reads: one row per logged exercise; sprint laps
   ride on the block's first row.
   --------------------------------------------------------------------------- */
function syncEntries() {
  const out = [];
  ALL.forEach(day => {
    const ds = dayState(day.date, false);
    if (!ds || day.type === "rest") return;
    const base = { date: ds.trained || day.date, planned: day.date, where: whereOf(day), week: dayWeek(day), day: day.dow, cycle: day.cycle.id, session: day.title };
    day.groups.forEach((g, gi) => g.exercises.forEach((ex, ei) => {
      const spec = specOf(ex);
      const log = logOf(ds.logs[exKey(gi, ei)], spec);
      const checked = isWU(g) && !!ds.completed[exKey(gi, ei)];
      const watch = isSprint(g) && ei === 0 ? watchOf(ds, gi) : null;
      if (!hasData(log, spec) && !checked && !(watch && watch.laps.length)) return;
      const row = Object.assign({}, base, { exercise: ex.name, slot: ex.slot, group: tagOf(day, g, gi, ei) || null, groupType: g.type, kind: spec.kind,
        rx: shortRx(ex, spec), unit: spec.unit, target: spec.repTop, loaded: spec.loaded, bw: spec.bw, sets: hasSets(log, spec) ? log.sets : [],
        hit: isDist(spec) || spec.kind === "check" ? null : SL.hit(log, spec), notes: log.notes || "" });
      if (isDist(spec)) row.distanceUnit = "yd";
      if (checked) row.checked = true;
      if (watch && watch.laps.length) row.laps = watch.laps;
      out.push(row);
    }));
  });
  return out;
}

/* ---------------------------------------------------------------------------
   SHELL: hero, block + week pills, the week's shape, tabs
   --------------------------------------------------------------------------- */
function buildShell() {
  document.getElementById("appbar-name").textContent = PROGRAM.appbarName;
  document.getElementById("hero-badge").textContent = `${DATA.app || "Chalk"} · ${DATA.coach || ""}`.replace(/ · $/, "");
  document.getElementById("hero-title").textContent = DATA.name || PROGRAM.appbarName;
  const about = document.getElementById("hero-about");
  about.innerHTML = "";
  if (DATA.programDetails) about.appendChild(collapsible("About POWERJACKED", DATA.programDetails, "about"));
  renderCycleBar();
  buildNotes();
  wireTabs();
}
function wireTabs() {
  document.querySelectorAll(".tab").forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".pane").forEach(p => p.classList.remove("active"));
      tab.classList.add("active");
      const pane = document.getElementById("pane-" + tab.dataset.pane);
      if (pane) pane.classList.add("active");
      if (boardMode() && tab.dataset.day && tab.dataset.day !== "empty") CK.scrollIntoView("container-" + tab.dataset.day);
    };
  });
}
function renderCycleBar() {
  document.getElementById("hero-sub").textContent = `${CYC.label} · from ${shortDate(CYC.startDate)} · ${scheduleLine(CYC)}`;
  const bar = document.getElementById("cycle-bar");
  if (DATA.cycles.length < 2) { bar.hidden = true; return; }
  bar.hidden = false;
  // Newest first; the pill carries the start date, the small line the length, the title the full label.
  const order = DATA.cycles.map((c, i) => i).reverse();
  bar.innerHTML = order.map(i => { const c = DATA.cycles[i]; const n = c.days.filter(d => d.type !== "rest").length; return `<button class="week-pill${i === uiCycle ? " active" : ""}" data-c="${i}" title="${escapeHtml(c.label)}">${monthLabel(c.startDate)}<small>${c.weeks} wk · ${n} session${n === 1 ? "" : "s"}</small></button>`; }).join("");
  bar.querySelectorAll(".week-pill").forEach(b => b.onclick = () => {
    uiCycle = +b.dataset.c; CYC = DATA.cycles[uiCycle];
    const nx = nextDay();
    let w = nx && nx.cycle === CYC ? dayWeek(nx) : 1;
    while (w < CYC.weeks && !weekDays(w, CYC).some(d => d.type !== "rest")) w++;   // a tail-only block opens on its first ingested training week
    uiWeek = w;
    buildNotes(); render(); openTab(dueDayInWeek(uiWeek));
  });
}
function renderWeekBar() {
  const bar = document.getElementById("week-bar");
  bar.innerHTML = "";
  for (let w = 1; w <= CYC.weeks; w++) {
    const b = document.createElement("button");
    const has = weekDays(w).length > 0;
    b.className = "week-pill" + (w === uiWeek ? " active" : "") + (isWeekComplete(w) ? " done" : "") + (has ? "" : " empty");
    b.textContent = "W" + w;
    b.title = has ? `Week ${w}` : `Week ${w}: not ingested yet`;
    b.onclick = () => { uiWeek = w; render(); openTab(dueDayInWeek(uiWeek)); };
    bar.appendChild(b);
  }
  const days = weekDays(uiWeek);
  const deload = days.some(d => d.deload);
  const sprint = days.some(d => d.groups.some(isSprint));
  const rules = document.getElementById("rules");
  rules.innerHTML = `
    <div class="rules-row">
      <span><span class="rules-k">Week ${uiWeek} of ${CYC.weeks}</span><b>${escapeHtml(CYC.label)}</b>${deload ? ` · <b>deload</b>` : ""}</span>
      <span>${escapeHtml(scheduleLine(CYC))}</span>
      ${sprint ? `<span>Sprints: ${days.some(d => d.groups.some(g => isSprint(g) && g.optional)) ? "optional" : "programmed"}, yards and reps per set</span>` : ""}
    </div>`;
}
/* Day tabs and panes for the week on screen. The Notes tab stays. */
function buildWeek() {
  const tabsEl = document.getElementById("tabs");
  const panesEl = document.getElementById("panes");
  tabsEl.querySelectorAll(".tab[data-day]").forEach(t => t.remove());
  panesEl.querySelectorAll(".pane[data-day]").forEach(p => p.remove());
  const days = weekDays(uiWeek);
  const notesTab = tabsEl.querySelector('.tab[data-pane="notes"]');
  const notesPane = document.getElementById("pane-notes");
  if (!days.length) {
    const pane = document.createElement("div");
    pane.className = "pane"; pane.id = "pane-empty"; pane.dataset.day = "empty";
    pane.innerHTML = `<div class="empty-card">Week ${uiWeek} of this block is not in the tracker yet. Karl ingests it from the Chalk portal as it is posted.</div>`;
    panesEl.insertBefore(pane, notesPane);
    const tab = document.createElement("button");
    tab.className = "tab"; tab.dataset.pane = "empty"; tab.dataset.day = "empty"; tab.textContent = `Week ${uiWeek}`;
    tabsEl.insertBefore(tab, notesTab);
  }
  days.forEach(day => {
    const tab = document.createElement("button");
    tab.className = "tab"; tab.dataset.pane = day.date; tab.dataset.day = day.date;
    const sub = day.type === "rest" ? "Rest" : day.title.split(" + ")[0].split(" & ")[0].slice(0, 8) + (day.groups.some(isSprint) ? " ·S" : "");
    tab.innerHTML = `${day.dow}<span class="due-dot" hidden></span><span class="tab-sub">${escapeHtml(sub)}</span>`;
    tabsEl.insertBefore(tab, notesTab);
    const pane = document.createElement("div");
    pane.className = "pane"; pane.id = "pane-" + day.date; pane.dataset.day = day.date;
    pane.innerHTML = `<div id="container-${day.date}"></div>`;
    panesEl.insertBefore(pane, notesPane);
    renderDay(day);
  });
  wireTabs();
}
function openTab(day) {
  const id = day ? day.date : "empty";
  const tab = document.querySelector(`.tab[data-pane="${id}"]`) || document.querySelector(".tab[data-day]");
  if (tab) tab.click();
}

/* ---------------------------------------------------------------------------
   DAY RENDERING
   --------------------------------------------------------------------------- */
const tappedNow = {};   // date → group idx the user tapped
const prepOpen = {};    // collapsible keys the user opened
const ICON = {
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 12.5l4.2 4.2L18.5 8"/></svg>`,
  clock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.5 1.5"/><path d="M9.5 2.5h5"/></svg>`,
  video: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="6" width="12" height="12" rx="2.5"/><path d="M15.5 10.5l5-3v9l-5-3z"/></svg>`,

};
function boardMode() { return CK.active(); }

function renderDay(day) {
  const container = document.getElementById("container-" + day.date);
  if (!container) return;
  if (boardMode() && day.type !== "rest") return CK.render(day, container);   // iPad: lane + rail (shared/cockpit.js)

  container.className = "";
  if (day.type === "rest") return renderRest(day, container);
  renderDayInto(day, container);
}
function chipsHtml(day) {
  return `${day.deload ? `<span class="pj-chip deload">Deload</span>` : ""}${day.optional ? `<span class="pj-chip">Optional</span>` : ""}`;
}
function sessHead(day, title, done, total) {
  const ds = dayState(day.date, false);
  const w = dayWeek(day);
  const complete = isDayComplete(day);
  const trained = ds && ds.trained && ds.trained !== day.date ? ` · trained ${shortDate(ds.trained)}` : "";
  const planned = daySecs(day);
  const progress = complete ? `Day complete · ${done} of ${total}${trained}` : `${done} of ${total} done${planned != null ? ` · planned ${fmtMins(planned)}` : ""}${trained}`;
  const head = document.createElement("div");
  head.className = "hs-sess-head";
  head.innerHTML = `
    <div class="hs-sess-eyebrow">${PROGRAM.shortName} · Week ${w} · ${DOW_FULL[day.dow] || day.dow} · ${shortDate(day.date)}${day.type === "mixed" ? " · Sprint & lift" : day.type === "sprint" ? " · Sprint day" : ""}</div>
    <div class="hs-sess-top">
      <h2 class="hs-sess-title${title.length > 16 ? " long" : ""}">${escapeHtml(title)}${chipsHtml(day)}</h2>

function sessCtl(day) {
  const ctl = document.createElement("div");

  ctl.querySelector("[data-action=clear]").onclick = () => {

}
function renderRest(day, container) {
  container.innerHTML = `
    <div class="hs-sess-head">
      <div class="hs-sess-eyebrow">${PROGRAM.shortName} · Week ${dayWeek(day)} · ${DOW_FULL[day.dow] || day.dow} · ${shortDate(day.date)}</div>
      <div class="hs-sess-top"><h2 class="hs-sess-title">Rest</h2></div>
