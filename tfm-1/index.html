<html lang="en">
<head>
<meta charset="utf-8" />

<title>The Functional Method 1.0 — JTM Fit</title>
<link rel="stylesheet" href="../shared/styles.css" />
<style>
  /* TFM-specific styles. Shared design tokens come from ../shared/styles.css. */

  .hero {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .hero-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .coach-badge {
    display: inline-block;
    background: var(--primary-soft);
    color: var(--primary);
    border: 1px solid var(--primary-line);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .hero-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 12px;
  }
  .stat {
    background: var(--card-2);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    padding: 8px 6px;
    text-align: center;
  }
  .stat-num { font-size: 17px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
  .stat-label { font-size: 9.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }

  /* Week pill bar */
  .week-bar {
    display: flex; gap: 5px;
    overflow-x: auto;
    margin-bottom: 10px;
    padding: 4px 2px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .week-bar::-webkit-scrollbar { display: none; }
  .week-pill {
    flex-shrink: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 7px 0;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    min-width: 46px;
    text-align: center;
    font-family: inherit;
    font-variant-numeric: tabular-nums;
  }
  .week-pill.active { background: var(--primary); border-color: var(--primary); color: white; }
  .week-pill.done { border-color: var(--success); background: var(--success-soft); color: var(--success); }
  .week-pill.done.active { background: var(--success); color: white; }

  .tab .due-dot[hidden] { display: none; }
  .tab .due-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--primary);
    margin-left: 5px;
    vertical-align: 1px;
  }
  .tab.active .due-dot { background: white; }

  /* Exercise tag color variants (extends .ex-tag from shared) */
  .ex-tag.str    { background: #ffe9e0; color: #c2410c; }
  .ex-tag.upper  { background: #e7f0fb; color: #1f63b8; }
  .ex-tag.legs   { background: var(--success-soft); color: var(--success); }
  .ex-tag.cplx   { background: #f1eafd; color: #6b3ed0; }
  .ex-tag.fin    { background: #fdeaea; color: #b3261e; }
  .ex-tag.core   { background: #f0f1f3; color: #6b7588; }
  .ex-tag.mob    { background: var(--accent-soft); color: var(--accent); }

  /* "Last:" line, coach chip and set grid styles live in ../shared/styles.css (SetLog). */

  /* Complex / finisher movement lists */
  .ex-detail {
    margin: 6px 0 0;
    padding: 8px 10px;
    background: var(--card-2);
    border: 1px solid var(--border-soft);
    border-radius: 6px;
    font-size: 12px;
    color: var(--text-body);
    line-height: 1.6;
  }
  .ex-detail .dt-line { display: block; }

  /* Timer buttons */
  .btn-timer {
    font-variant-numeric: tabular-nums;
    min-width: 78px;
    justify-content: center;
  }
  .btn-timer.running {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }
  .btn-timer.paused {
    background: var(--warning-soft);
    color: var(--warning);
    border-color: #edd9a6;
  }
  .btn-timer.done {
    background: var(--success);
    color: white;
    border-color: var(--success);
    animation: timer-flash 0.6s ease-out;
  }
  @keyframes timer-flash {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  .btn-timer-x { color: var(--danger); min-width: 0; }

  /* Warm-up / cool-down compact checklists */
  .prep {
    margin: 8px 0;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    background: var(--card-2);
    overflow: hidden;
  }
  .prep-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 12px;
    cursor: pointer; user-select: none;
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted);
  }
  .prep-head .caret { font-size: 10px; }
  .prep.collapsed .prep-body { display: none; }
  .prep.collapsed .caret { transform: rotate(-90deg); }
  .prep-body { padding: 2px 12px 10px; }
  .prep-item {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 5px 0;
    font-size: 12.5px; color: var(--text-body);
    cursor: pointer;
  }
  .prep-check {
    width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px;
    border: 2px solid #c8cdd6; border-radius: 5px;
    background: white;
    display: flex; align-items: center; justify-content: center;
  }
  .prep-check svg { width: 10px; height: 10px; opacity: 0; }
  .prep-item.done .prep-check { background: var(--success); border-color: var(--success); }
  .prep-item.done .prep-check svg { opacity: 1; }
  .prep-item.done { color: var(--muted); text-decoration: line-through; }

  .block-note {
    font-size: 12px; color: var(--muted); line-height: 1.55;
    margin: 4px 0 2px;
  }
  .block-label {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--primary); margin: 12px 0 0;
  }
  .day-optional {
    display: inline-block;
    background: var(--warning-soft); color: var(--warning);
    border-radius: 4px; padding: 1px 7px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
    margin-left: 6px; vertical-align: 1px;
  }

  .day-toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
    font-size: 12px; color: var(--muted);
  }
  .btn-danger { color: var(--danger); border-color: #f3c8c4; }

  .reset-link {
    background: none; border: none; color: var(--muted);
    font-size: 11px; cursor: pointer; padding: 4px 8px; text-decoration: underline;
    font-family: inherit;
  }

  @media (max-width: 420px) {
    .hero-stats { gap: 6px; }
    .stat { padding: 6px 4px; }
    .stat-num { font-size: 15px; }
    .stat-label { font-size: 8.5px; }
  }
</style>
</head>

<script src="../shared/setlog.js"></script>
<script>
/* Set logging, the coach and sync come from ../shared/setlog.js. */
const SL = window.SetLog;
const { normName, parseWeight, fmtWeight, fmtLoad } = SL;

/* ===========================================================================
   SHARED HELPERS — line parsing + row builders used by the PROGRAM data below.
   Prescriptions are authored as near-verbatim PDF lines and parsed here, so
   the data section stays a faithful transcription of the program.
   =========================================================================== */
const VIDEO_BASE = "https://www.youtube.com/results?search_query=";
function v(q) { return VIDEO_BASE + encodeURIComponent(q + " exercise form"); }

/* Names that log a weight get suggestions; the rest stay quiet until loaded. */
const BW_RE = /pull.?up|chin.?up|push.?up|\bdip\b|dips\b|hanging|toe to bar|leg raise|jump through|l.?\s?sit|ring |parallette|bodyweight|body weight|burpee pull/i;
const LOADED_RE = /^(kb|db|barbell|weighted|medicine ball|plate|kettlebell|dumbbell)|\b(kb|db|barbell)\b/i;
/* Lower-body lifts progress in 10 lb jumps, everything else in 5. Judgment
   call — cable/KB gear often moves in other increments; override in the log. */
const LOWER_RE = /squat|deadlift|\brdl\b|lunge|step up|pistol|glute bridge|hip thrust|sumo|cossack|leg press/i;
/* Rows with no weight column: jumps, burpees, plank variations. Everything else logs
   a weight (added weight on bodyweight rows: blank = untracked, 0 = strict BW). */
const NOLOAD_RE = /jump|body clean|burpee|elevator|star lift|sprint/i;

/* Strip parentheticals BEFORE number-hunting — "(4:2:1 tempo)" and
   "(6 each side)" would otherwise poison the rep parse. */
function parseLine(line) {
  let per = false;
  const notes = [];
  let core = line;
  core = core.replace(/\(([^)]*)\)/g, (_, inner) => {
    if (/each (side|leg|arm)|alternating|on each/i.test(inner)) per = true;
    else notes.push(inner.trim());
    return " ";
  }).replace(/\s+/g, " ").trim();

  const m = core.match(/^(.+?)\s+(\d+(?:-\d+)?)\s*x\s*(.+)$/i);
  if (!m) return { name: core, rx: "", per, notes, repTop: null, repRange: null, isMax: false };

  const name = m[1].trim();
  const sets = m[2];
  let reps = m[3].trim();
  const isMax = /max/i.test(reps);
  let repTop = null, repRange = null;
  const rr = reps.match(/^(\d+)\s*-\s*(\d+)$/);
  const rf = reps.match(/^(\d+)$/);
  if (rr) { repRange = `${rr[1]}-${rr[2]}`; repTop = parseInt(rr[2], 10); }
  else if (rf) { repTop = parseInt(rf[1], 10); }

  let rx = `${sets} × ${reps}`;
  if (per) rx += " · each side";
  if (notes.length) rx += " · " + notes.join(" · ");
  return { name, rx, sets, per, notes, repTop, repRange, isMax };
}

/* r("DB Bench Press 3 x 8", 90) → a full trackable row. opts override anything. */
function r(line, rest, tag, opts = {}) {
  const p = parseLine(line);
  const bw = !LOADED_RE.test(p.name) && BW_RE.test(p.name);
  const ss = SL.parseSets(p.sets, 3);
  // Timed rows ("3-4 x 40 yards or 45 seconds") log seconds per set.
  const timed = p.repTop == null && !p.isMax ? SL.parseReps(p.rx.split("×").slice(1).join("×")) : null;
  return Object.assign({
    name: p.name,
    rx: p.rx,
    tag: tag || "str",
    rest: rest || 90,
    track: true,
    bw,
    loaded: !NOLOAD_RE.test(p.name),
    lower: LOWER_RE.test(p.name),
    repTop: timed && timed.unit === "s" ? timed.repTop : p.repTop,
    repRange: timed && timed.unit === "s" ? timed.repRange : p.repRange,
    isMax: p.isMax,
    unit: timed && timed.unit === "s" ? "s" : "reps",
    sets: ss.sets, minSets: ss.minSets,
    detail: null,
    timer: null
  }, opts);
}

/* A complex logs the weight per round (the bell/bar you ran the circuit with). */
function complexRow(title, scheme, moves, rest, opts = {}) {
  const ss = SL.parseSets(scheme, 5);
  return Object.assign({
    name: title, rx: scheme, tag: "cplx", rest: rest || 120,
    track: true, bw: false, loaded: true, lower: false,
    repTop: null, repRange: null, isMax: false, unit: "none",
    sets: ss.sets, minSets: ss.minSets,
    detail: moves, timer: null
  }, opts);
}

/* Untracked effort piece (ladders, AMRAPs, interval finishers). */
function effortRow(title, scheme, moves, tag, timer, opts = {}) {
  return Object.assign({
    name: title, rx: scheme, tag: tag || "fin", rest: 60,
    track: false, bw: false, lower: false,
    repTop: null, repRange: null, isMax: false,
    detail: moves || null, timer: timer || null
  }, opts);
}

/* Timer specs */
function tDown(secs, label)          { return { kind: "down",  secs, label }; }
function tAccum(target, label)       { return { kind: "accum", target, label }; }
function tInterval(segs, rounds, label) { return { kind: "interval", segs, rounds, label }; }
function tWatch(label)               { return { kind: "watch", label }; }

/* Mobility circuit day — one checkable row carrying the item list. */
function mobilityDay(items, opts = {}) {
  return Object.assign({
    title: "Cardio / Core / Mobility",
    duration: "30-45 mins",
    optional: false,
    warmup: null,
    cooldown: null,
    blocks: [{
      label: "Circuit",
      note: "3 sets · 60 seconds rest between sets · no rest between exercises. Slow, steady pace — breathe, open up.",
      rows: [effortRow("Mobility Circuit", "3 rounds of the list below", items, "mob", tDown(60, "⏱ 60s rest"))]
    }]
  }, opts);
}
/* ===========================================================================
   PROGRAM DATA — The Functional Method 1.0 (JTM Fit / John Madsen)
   8 weeks · Mon Full Body · Tue Upper Push/Pull · Wed Mobility ·
   Thu Full Body Complex · Fri Legs · Sat Mobility (optional) · Sun rest
   Transcribed from TheFunctionalMethod-1.0.pdf.
   =========================================================================== */

const HL_NOTE = "60-90s rest between sets and exercises. Horizontal loading — all sets of one exercise before the next. Go as heavy as possible with good technique; warm-up sets to build to your working weight.";
const HL_NOTE_LEGS = "Rest 2 minutes between sets and exercises. Horizontal loading — all sets of one exercise before the next. Go as heavy as possible with good technique.";
const CPLX_NOTE = "Go as heavy as possible with perfect form. No rest between exercises inside a set.";

const WU1 = {
  mon: ["2 Minute Row or Jump Rope", "Lateral Band Walk x 15 (each side)", "Lunge with Scaption x 10 (each side)", "Inch Worm Push Ups x 10", "Band Pass Throughs x 15", "Spider Lunge to T Frame x 10 (each side)"],
  tue: ["2 Minute Row or Jump Rope", "Band Pass Throughs x 15", "Walk Out Push Ups x 10", "Y T A's x 10", "Dead Hang x 30-60 seconds", "High Plank Shoulder Taps x 60 seconds"],
  fri: ["2 Minute Row or Jump Rope", "Lateral Band Walk x 15 (each side)", "Lunge with Scaption x 10 (each leg)", "Banded Good Mornings x 15", "Spider Lunge with T Frame x 10 (each side)", "Tuck Jumps x 8"]
};
const CD1 = {
  mon: ["Kneeling Hip Flexor Stretch x 60s (each side)", "Banded Lat Stretch x 60s (each side)", "Pigeon Stretch x 60s (each side)", "Banded Tricep Stretch x 60s (each side)"],
  tue: ["Single Arm Pec Stretch x 60s (each side)", "Banded Lat Stretch x 60s (each side)", "Banded Tricep Stretch x 60s (each side)"],
  thu: ["Kneeling Hip Flexor Stretch x 60s (each side)", "Banded Lat Stretch x 60s (each side)", "Pigeon Stretch x 60s (each side)", "Banded Hamstring Stretch x 60s (each side)"],
  fri: ["Banded Hamstring Stretch x 60s (each side)", "Kneeling Hip Flexor Stretch x 60s (each side)", "Pigeon Stretch x 60s (each side)", "Groin Stretch x 60s"]
};
const MOB1_A = ["2 Minutes of Jump Rope", "60s Down Dog to Arch", "60s Pigeon (each leg)", "60s Quadruped Hip Circles (30s each side)", "60s Spider Lunge with T Frame", "60s Scorpions", "60s Forearm Plank"];
const MOB1_B = ["2 Minutes of Jump Rope", "60s Band Pass Throughs", "60s Down Dog Spider Lunge T Frame", "60s Pike Fold to Squat Hold", "60s Table Pose with Reaches", "60s Pigeon with Reaches", "60s Forearm Plank"];

/* Accumulate-style core pieces share a scheme string. */
function acc(name) {
  return effortRow(name, "Accumulate 2:00 total — pause when you break, resume when you're back on", null, "core", tAccum(120, "⏱ Σ 2:00"));
}

function day1(title, duration, wu, note, rows, coreRow, cd) {
  return {
    title, duration, optional: false, warmup: wu, cooldown: cd,
    blocks: [
      { label: "Workout", note, rows },
      { label: "Core — rest 3 minutes first", note: null, rows: [coreRow] }
    ]
  };
}

const W1 = []; // 8 entries of {mon,tue,wed,thu,fri,sat}

/* ------------------------------- WEEK 1 -------------------------------- */
W1.push({
  mon: day1("Full Body", "60-75 mins", WU1.mon, HL_NOTE, [
    r("KB Front Squats 3 x 12", 90),
    r("Chin Ups 3 x 8-12", 90),
    r("DB Suitcase Deadlift 3 x 8 (each side)", 90),
    r("Clap Push Ups 3 x 10-15", 90),
    r("DB Step Ups 3 x 8 (each side)", 90),
    r("Weighted V Ups 3 x 20", 90, "core")
  ], effortRow("Plank Punches", "2:00 on the clock — as many seconds of plank punches as you can", null, "core", tDown(120, "⏱ 2:00")), CD1.mon),
  tue: day1("Upper Body Push / Pull", "60-75 mins", WU1.tue, HL_NOTE, [
    r("DB Bench Press 3 x 8", 90, "upper"),
    r("DB Bent Over Row 3 x 8", 90, "upper"),
    r("Alternating Single Arm Floor Press 3 x 8 (each side)", 90, "upper"),
    r("DB Single Arm Row 3 x 8 (each side)", 90, "upper"),
    r("Pull Ups 3 x Max Reps", 90, "upper"),
    r("Push Ups 3 x Max Reps", 90, "upper")
  ], acc("Hollow Body Hold"), CD1.tue),
  wed: mobilityDay(MOB1_A, { duration: "30 mins" }),
  thu: day1("Full Body — Kettlebell Complex", "45-60 mins", WU1.mon, CPLX_NOTE, [
    complexRow("Kettlebell Complex", "5 sets · rest 2 min between sets", [
      "American Swings x 5", "Thruster x 5", "Burpee High Pull x 5", "Goblet Jump Squats x 5", "American Swings x 5"
    ], 120)
  ], acc("Tuck Hold"), CD1.thu),
  fri: day1("Legs", "60-75 mins", WU1.fri, HL_NOTE_LEGS + " Box jumps: challenging height, not impossible.", [
    r("Box Jump 3 x 5", 120, "legs"),
    r("Barbell Back Squat 3 x 8", 120, "legs"),
    r("Barbell Deadlift 3 x 8", 120, "legs"),
    r("Barbell Reverse Lunge 3 x 8 (each side)", 120, "legs"),
    r("DB RDL 3 x 8", 120, "legs"),
    r("Bodyweight Jump Squats 1 x 50", 120, "legs", { track: false })
  ], acc("Hollow Rocks"), CD1.fri),
  sat: mobilityDay(MOB1_A, { optional: true, duration: "30 mins" })
});

/* ------------------------------- WEEK 2 -------------------------------- */
W1.push({
  mon: day1("Full Body", "60-75 mins", WU1.mon, HL_NOTE, [
    r("DB Reverse Lunge + Curl + Press 3 x 12 (6 each side / alternating)", 90),
    r("Pull Ups 3 x 8-12", 90),
    r("Ring Push Ups 3 x 10-15", 90),
    r("Kick Stand RDL 3 x 8 (each side)", 90),
    r("Hanging Knee Raises 3 x 15-20", 90, "core"),
    r("DB Goblet Squat with 2 second pause 3 x 10", 90)
  ], r("Weighted V Ups 3 x 20", 60, "core"), CD1.mon),
  tue: day1("Upper Body Push / Pull", "60-75 mins", WU1.tue, HL_NOTE, [
    r("DB Bench Press 3 x 8", 90, "upper"),
    r("DB Bent Over Row 3 x 8", 90, "upper"),
    r("DB Single Arm Floor Press 3 x 8 (each side)", 90, "upper"),
    r("DB Single Arm Bent Over Row 3 x 8 (each side)", 90, "upper"),
    r("Close Grip Push Ups 3 x Max Reps", 90, "upper"),
    r("ISO Chin Up Hold 3 x Max Seconds", 90, "upper")
  ], acc("Hollow Body Hold"), CD1.tue),
  wed: mobilityDay(MOB1_A, { duration: "30 mins" }),
  thu: day1("Full Body — Dumbbell Complex", "45-60 mins", WU1.mon, CPLX_NOTE, [
    complexRow("Dumbbell Complex", "5 sets · rest 2 min between sets", [
      "Squat Clean x 5", "Reverse Lunge x 5", "Burpee Deadlift x 5"
    ], 120)
  ], acc("Tuck Hold"), CD1.thu),
  fri: day1("Legs", "60-75 mins", WU1.fri, HL_NOTE_LEGS, [
    r("Seated Box Jump 3 x 5", 120, "legs"),
    r("Barbell Front Squat 3 x 8", 120, "legs"),
    r("Barbell Deadlift 3 x 8", 120, "legs"),
    r("DB Bulgarian Split Squat 3 x 8 (each side)", 120, "legs"),
    r("DB Toes Elevated RDL 3 x 8", 120, "legs"),
    r("Jump Squat with Band 1 x 50", 120, "legs", { track: false })
  ], acc("Hollow Rocks"), CD1.fri),
  sat: mobilityDay(MOB1_A, { optional: true, duration: "30 mins" })
});

/* ------------------------------- WEEK 3 -------------------------------- */
W1.push({
  mon: day1("Full Body", "60-75 mins", WU1.mon, HL_NOTE, [
    r("KB Reverse Lunge + Clean + Press 3 x 8 (each side)", 90),
    r("Chin Ups 3 x 10-12", 90),
    r("DB Single Leg RDL 3 x 10 (each side)", 90),
    r("Blast Off Push Ups 3 x 10-15", 90),
    r("Barbell Roll Out 3 x 8-12", 90, "core"),
    r("KB Goblet Squat to Curl 3 x 10", 90)
  ], r("Parallette Jump Throughs 3 x 10", 60, "core"), CD1.mon),

const PROGRAM = {
  slug: "tfm-1",
  storageKey: "tfm1_v1",
  appbarName: "The Functional Method 1.0",
  heroTitle: "The Functional Method 1.0",
  badge: "JTM Fit · John Madsen",
  sub: "8-week functional strength · full body, upper, complexes, legs · Sunday rest",
  dayOrder: ["mon", "tue", "wed", "thu", "fri", "sat"],
  dayLabels: { mon: "Mon", tue: "Tue", wed: "Wed", thu: "Thu", fri: "Fri", sat: "Sat" },
  requiredDays: ["mon", "tue", "wed", "thu", "fri"],
  weeks: W1,
  sourceNote: "Source: The Functional Method (1.0), JTM Fit / John Madsen. Prescriptions transcribed as written; Sunday is a rest day."
};
/* ===========================================================================
   ENGINE — shared between TFM 1.0 and 2.0 trackers. State, time budget +
   60-minute mode, progression coach, history, timers, rendering.
   =========================================================================== */

/* ---------------------------------------------------------------------------
   STATE
   --------------------------------------------------------------------------- */
const STORAGE_KEY = PROGRAM.storageKey;
const NWEEKS = PROGRAM.weeks.length;
let state = loadState();
let uiWeek = null;   // week being viewed (defaults to current training week)

function dayKey(w, d) { return `w${w}_${d}`; }

function emptyState() {
  return { sixty: false, days: {} };
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      return { sixty: !!p.sixty, days: p.days && typeof p.days === "object" ? p.days : {} };
    }
  } catch (e) {}
  return emptyState();
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  updateStats();
  SL.sync.schedule();
}
function dayState(w, d, create) {
  const k = dayKey(w, d);
  if (!state.days[k] && create) {
    state.days[k] = { date: null, clockStart: null, clockStop: null, completed: {}, logs: {} };
  }
  return state.days[k] || null;
}

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function shortDate(iso) {
  if (!iso) return "—";
  const [, m, d] = iso.split("-");
  return `${parseInt(m, 10)}/${parseInt(d, 10)}`;
}
function stampDate(ds) { if (!ds.date) ds.date = todayISO(); }

/* Flat list of the trackable/checkable "main" rows of a day. */
function mainRows(w, d) {
  const day = PROGRAM.weeks[w][d];
  const out = [];
  day.blocks.forEach((b, bi) => b.rows.forEach((row, ri) => out.push({ row, bi, ri, idx: out.length })));
  return out;
}
function isDayComplete(w, d) {
  const ds = dayState(w, d, false);
  if (!ds) return false;
  const rows = mainRows(w, d);
  return rows.length > 0 && rows.every(r => ds.completed["m" + r.idx]);
}
function isWeekComplete(w) {
  return PROGRAM.requiredDays.every(d => isDayComplete(w, d));
}
function currentWeek() {
  for (let w = 0; w < NWEEKS; w++) if (!isWeekComplete(w)) return w;
  return NWEEKS - 1;
}
function dueDay(w) {
  for (const d of PROGRAM.requiredDays) if (!isDayComplete(w, d)) return d;
  return PROGRAM.dayOrder[0];
}

/* ---------------------------------------------------------------------------
   TIME BUDGET + 60-MINUTE MODE
   The estimate is a planning model, not a promise: set work is inferred from
   reps, rests from the program's own guidance.
   --------------------------------------------------------------------------- */
function setsFromRx(rx, sixty) {
  const m = String(rx).match(/^(\d+)(?:-(\d+))?\s*×/);
  if (!m) return 3;
  const lo = parseInt(m[1], 10), hi = m[2] ? parseInt(m[2], 10) : lo;
  return sixty ? lo : hi;   // 60-min mode runs ranged sets at the low end
}
function effRest(rest, sixty) {
  if (!sixty) return rest;
  if (rest >= 180) return 120;
  if (rest >= 120) return 90;
  if (rest >= 90) return 60;
  return rest;
}
function rowWorkSecs(row) {
  if (row.timer) {
    const t = row.timer;
    if (t.kind === "down") return t.secs + 20;
    if (t.kind === "interval") return t.rounds * t.segs.reduce((n, s) => n + s[1], 0) + 20;
    if (t.kind === "accum") return t.target * 2 + 20;
    if (t.kind === "watch") return 300;
  }
  if (row.detail) return 90;                                 // complex set
  const secMatch = String(row.rx).match(/(\d+)\s*seconds/i);
  if (secMatch) return parseInt(secMatch[1], 10) + 15;
  let work = row.isMax ? 40 : row.repTop ? Math.min(90, Math.max(25, row.repTop * 4)) : 40;
  if (/each (side|leg|arm)/i.test(row.rx)) work = Math.round(work * 1.8);
  return work;
}
/* rowSecs includes the rests (rest applies between sets AND exercises). */
function rowSecs(row, sixty, setsOverride) {
  const sets = setsOverride != null ? setsOverride : setsFromRx(row.rx, sixty);
  if (row.timer) return rowWorkSecs(row) + effRest(60, sixty);
  return sets * (rowWorkSecs(row) + effRest(row.rest, sixty));
}
function prepSecs(items, perItemBase, sixty, factor) {
  if (!items) return 0;
  let total = 0;
  items.forEach(it => {
    let s = perItemBase;
    if (/2 minute/i.test(it)) s = 130;
    if (/each (side|leg|arm)/i.test(it)) s = Math.round(s * 1.8);
    total += s;
  });
  return Math.round(total * (sixty ? factor : 1));
}

/* Full plan for a day: total secs, per-main-row start offsets, sets overrides,
   and a human list of what 60-min mode changed. */
function dayPlan(w, d) {
  const sixty = state.sixty;
  const day = PROGRAM.weeks[w][d];
  const rows = mainRows(w, d);
  const trims = {};          // idx → sets to run
  const adjustments = [];

  function totalWith(trimMap) {
    let t = 60;  // setup buffer
    t += prepSecs(day.warmup, 50, sixty, 0.8);
    const offsets = [];
    day.blocks.forEach((b, bi) => {
      if (bi > 0) t += sixty ? 120 : 150;   // between-block rest
      b.rows.forEach(row => {
        const idx = offsets.length;
        offsets.push(t);
        t += rowSecs(row, sixty, trimMap[idx]);
      });
    });
    t += prepSecs(day.cooldown, 75, sixty, 0.5);
    return { total: t, offsets };
  }

  let plan = totalWith(trims);

  if (sixty) {
    adjustments.push("Rests tightened one step (3:00→2:00, 2:00→1:30, 1:30→1:00)");
    if (rows.some(x => /^\d+-\d+\s*×/.test(x.row.rx))) adjustments.push("Ranged sets run at the low end");
    if (day.cooldown) adjustments.push("Cool-down holds halved — keep every stretch, shorter holds");
    // Still over an hour? Trim a set off trailing accessories (never the first two lifts).
    let guard = 10;
    while (plan.total > 3600 && guard-- > 0) {
      let trimmed = false;
      for (let i = rows.length - 1; i >= 2; i--) {
        const row = rows[i].row;
        if (row.timer || row.detail) continue;
        const cur = trims[i] != null ? trims[i] : setsFromRx(row.rx, true);
        if (cur > 2) {
          trims[i] = cur - 1;
          adjustments.push(`${row.name}: ${cur - 1} sets`);
          trimmed = true;
          break;
        }
      }
      if (!trimmed) break;
      plan = totalWith(trims);
    }
    if (plan.total > 3600) {
      adjustments.push("Still over — superset the last two accessories or trim the finisher");
    }
  }
  return { total: plan.total, offsets: plan.offsets, trims, adjustments, sixty };
}

function fmtMins(secs) { return `~${Math.round(secs / 60)} min`; }

/* ---------------------------------------------------------------------------
   HISTORY + PROGRESSION COACH
   Exercises recur across weeks under the same name, so history is looked up
   by normalized name across every prior day of the program. Each set logs
   reps (or seconds) and weight; a hit is inferred (every set at the target).
   The rules live in SetLog.suggest:
     · hit → +5 lb (upper) / +10 lb (lower)
     · missed → hold the weight, beat the reps
     · 3 logged outings at the same weight, none hit → −10%, add 2 reps
     · bodyweight rows add a rep after a hit; max rows show "beat last"
   Older logs ({ weight, hit }) fold in at read time and keep their hit.
   --------------------------------------------------------------------------- */
/* The spec SetLog reads. plan (optional) applies 60-min mode's set count. */
function specOf(row, plan, idx) {
  let sets = row.sets || 3, minSets = row.minSets || sets;
  if (plan) {
    if (plan.trims && plan.trims[idx] != null) sets = plan.trims[idx];
    else if (plan.sixty) sets = minSets;
    minSets = Math.min(minSets, sets);
  }
  return { name: row.name, sets, minSets, repTop: row.repTop, repRange: row.repRange, isMax: row.isMax,
           unit: row.unit || "reps", loaded: !!row.loaded, bw: !!row.bw, lower: !!row.lower };
}

/* All prior logged entries for this exercise name, newest first. */
function priorEntries(name, beforeW, beforeD) {
  const key = normName(name);
  const beforeDayIdx = PROGRAM.dayOrder.indexOf(beforeD);
  const out = [];
  for (let w = 0; w < NWEEKS; w++) {
    for (const d of PROGRAM.dayOrder) {
      const afterCurrent = w > beforeW || (w === beforeW && PROGRAM.dayOrder.indexOf(d) >= beforeDayIdx);
      if (afterCurrent) continue;
      const ds = dayState(w, d, false);
      if (!ds) continue;
      mainRows(w, d).forEach(({ row, idx }) => {
        if (!row.track || normName(row.name) !== key) return;
        const spec = specOf(row);
        const log = SL.normLog(ds.logs[idx], spec.sets);
        if (!SL.hasSets(log)) return;
        out.push(SL.entry(log, spec, { date: ds.date, week: w, day: d }));
      });
    }
  }
  return out.reverse();
}

function suggestNext(row, w, d, spec) {
  if (!row.track) return null;
  return SL.suggest(priorEntries(row.name, w, d), spec || specOf(row));
}

/* ---------------------------------------------------------------------------
   SYNC. Transport and device token live in ../shared/setlog.js. The payload is
   the raw state plus the flat `entries` list every program shares.
   --------------------------------------------------------------------------- */
function syncEntries() {
  const out = [];
  for (let w = 0; w < NWEEKS; w++) PROGRAM.dayOrder.forEach(d => {
    const ds = dayState(w, d, false); if (!ds) return;
    mainRows(w, d).forEach(({ row, idx }) => {
      const raw = ds.logs[idx];
      if (!raw) return;
      const spec = specOf(row);
      const log = SL.normLog(raw, row.track ? spec.sets : 0);
      if (!SL.hasData(log)) return;
      out.push({ date: ds.date, where: `W${w + 1} ${PROGRAM.dayLabels[d]}`, week: w + 1, day: d, exercise: row.name, rx: row.rx,
                 unit: spec.unit, target: spec.repTop, loaded: spec.loaded, bw: spec.bw,
                 sets: SL.hasSets(log) ? log.sets : [], hit: row.track ? SL.hit(log, spec) : null, notes: log.notes || "" });
    });
  });
  return out;
}
SL.sync.init({
  slug: PROGRAM.slug,
  storageKey: PROGRAM.storageKey,
  payload: () => ({ state, entries: syncEntries() }),
  hasData: () => Object.keys(state.days).length > 0
});

function renderDay(d) {
  const w = uiWeek;
  const day = PROGRAM.weeks[w][d];
  const container = document.getElementById("container-" + d);
  container.innerHTML = "";
  const ds = dayState(w, d, false);
  const rows = mainRows(w, d);
  const done = rows.filter(x => ds && ds.completed["m" + x.idx]).length;
  const plan = dayPlan(w, d);

  // Toolbar: session clock + clear-day
  const clockKey = dayKey(w, d);
  const toolbar = document.createElement("div");
  toolbar.className = "day-toolbar";
  toolbar.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px">
      <button class="btn btn-timer" id="clock-${d}" data-clockkey="${clockKey}">▶ Session clock</button>
      <span id="clockstat-${d}"></span>
    </div>
    <button class="btn btn-danger" data-action="clear">Clear day</button>`;
  toolbar.querySelector("[data-action=clear]").onclick = () => {
    if (!ds) return;
    if (confirm(`Clear Week ${w + 1} ${PROGRAM.dayLabels[d]}? Checks and logs for this day will be gone.`)) {
      delete state.days[clockKey];
      saveState(); render();
    }
  };
  container.appendChild(toolbar);
  wireClock(d, w, plan);

  // Day card
  const el = document.createElement("div");
  el.className = "day";
  const optHtml = day.optional ? `<span class="day-optional">Optional</span>` : "";
  const est = fmtMins(plan.total);
  const target = plan.sixty ? " · 60-min mode" : ` · listed ${day.duration}`;
  el.innerHTML = `
    <div class="day-header">
      <div class="day-title">
        <div class="day-name">Week ${w + 1} · ${PROGRAM.dayLabels[d]} · ${day.title}${optHtml}</div>
        <div class="day-focus">Planned ${est}${target}${ds && ds.date ? ` · trained ${shortDate(ds.date)}` : ""}</div>
      </div>
      <div class="day-meta"><span class="day-chip ${done === rows.length && rows.length ? "complete" : ""}">${done} / ${rows.length}</span></div>
    </div>
    <div class="day-body"></div>`;
  const body = el.querySelector(".day-body");

  if (plan.sixty && plan.adjustments.length) {
    const box = document.createElement("div");
    box.className = "block-note";
    box.innerHTML = `<strong style="color:var(--warning)">60-min plan:</strong> ` + plan.adjustments.join(" · ");
    body.appendChild(box);
  }

  if (day.warmup) body.appendChild(renderPrep(w, d, "Warm-up", "wu", day.warmup));

  let flatIdx = 0;
  day.blocks.forEach((b, bi) => {
    if (b.label) {
      const lab = document.createElement("div");
      lab.className = "block-label";
      lab.textContent = b.label;
      body.appendChild(lab);
    }
    if (b.note) {
      const note = document.createElement("div");
      note.className = "block-note";
      note.textContent = b.note;
      body.appendChild(note);
    }
    b.rows.forEach(row => {
      body.appendChild(renderRow(w, d, row, flatIdx, plan));
      flatIdx++;
    });
  });

  if (day.cooldown) body.appendChild(renderPrep(w, d, plan.sixty ? "Cool-down — half holds" : "Cool-down", "cd", day.cooldown));
  container.appendChild(el);
}

function renderPrep(w, d, title, prefix, items) {
  const ds = dayState(w, d, false);
  const doneCount = items.filter((_, i) => ds && ds.completed[prefix + i]).length;
  const el = document.createElement("div");
  el.className = "prep" + (doneCount === items.length && doneCount > 0 ? " collapsed" : "");
  el.innerHTML = `
    <div class="prep-head"><span>${title} · ${doneCount}/${items.length}</span><span class="caret">▼</span></div>
    <div class="prep-body"></div>`;
  el.querySelector(".prep-head").onclick = () => el.classList.toggle("collapsed");
  const bodyEl = el.querySelector(".prep-body");
  items.forEach((it, i) => {
    const k = prefix + i;
    const isDone = !!(ds && ds.completed[k]);
    const item = document.createElement("div");
    item.className = "prep-item" + (isDone ? " done" : "");
    item.innerHTML = `<span class="prep-check"><svg viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 8 7 12 13 4"/></svg></span><span>${it}</span>`;
    item.onclick = () => {
      const dstate = dayState(w, d, true);
      dstate.completed[k] = !isDone;
      saveState(); renderDay(d);
    };
    bodyEl.appendChild(item);
  });
  return el;
}

function tagLabel(t) {
  return ({ str: "Strength", upper: "Upper", legs: "Legs", cplx: "Complex", fin: "Finisher", core: "Core", mob: "Mobility" }[t]) || t;
}
function escapeHtml(s) { return String(s || "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

function renderRow(w, d, row, idx, plan) {
  const ds = dayState(w, d, false);
  const ck = "m" + idx;
  const isDone = !!(ds && ds.completed[ck]);
  const sixty = plan.sixty;
  const rest = effRest(row.rest, sixty);
  const trimmedSets = plan.trims[idx];
  const spec = specOf(row, plan, idx);
  const log = SL.normLog(ds && ds.logs[idx], row.track ? spec.sets : 0);

  // "Last:" reference across the whole program by exercise name, and the coach
  let lastHtml = "";
  let sugg = null;
  if (row.track) {
    const hist = priorEntries(row.name, w, d);
    if (hist.length) {
      const Lst = hist[0];
      lastHtml = SL.lastHtml(Lst, spec, `W${Lst.week + 1} ${PROGRAM.dayLabels[Lst.day]}${Lst.date ? " · " + shortDate(Lst.date) : ""}`);
    }
    sugg = suggestNext(row, w, d, spec);
  }
  const suggHtml = SL.suggestHtml(sugg);

  const detailHtml = row.detail
    ? `<div class="ex-detail">${row.detail.map(m => `<span class="dt-line">• ${m}</span>`).join("")}</div>` : "";

  let rx = row.rx;
  if (trimmedSets != null) rx += ` · <span style="color:var(--warning);font-weight:700">60-min: ${trimmedSets} sets</span>`;
  const startAt = plan.offsets[idx] != null ? Math.round(plan.offsets[idx] / 60) : null;
  const paceHtml = startAt !== null ? `<span style="color:var(--muted);font-weight:400"> · start ~${startAt} min in</span>` : "";

  // Timer button
  let timerLabel, timerMode;
  if (row.timer) { timerLabel = row.timer.label || "⏱"; timerMode = "special"; }
  else { timerLabel = rest >= 120 ? `⏱ ${Math.round(rest / 60)}m` : `⏱ ${rest}s`; timerMode = "rest"; }


  const el = document.createElement("div");
  el.className = "exercise";
  el.innerHTML = `
    <div class="ex-row">
      <div class="ex-check ${isDone ? "done" : ""}">
        <svg viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 8 7 12 13 4"/></svg>
      </div>
      <div class="ex-info">
        <div><span class="ex-tag ${row.tag}">${tagLabel(row.tag)}</span><span class="ex-name">${row.name}</span></div>
        <div class="ex-prescription"><strong>${rx}</strong>${paceHtml}</div>
        ${detailHtml}
        ${lastHtml}
        ${suggHtml}
        <div class="ex-actions">
          <a class="btn" href="${v(row.name)}" target="_blank" rel="noopener">▶ Video</a>
          ${row.track ? `<button class="btn log-toggle">✎ Log sets</button>` : ""}
          <button class="btn btn-timer row-timer" data-default="${timerLabel}">${timerLabel}</button>
        </div>
        ${row.track ? `
        <div class="ex-log">
          ${SL.gridHtml(log, spec, sugg)}
          <textarea class="log-notes" placeholder="Notes: form, tempo, RPE, how it felt...">${escapeHtml(log.notes)}</textarea>
        </div>` : ""}
      </div>
    </div>`;

  el.querySelector(".ex-check").onclick = () => {
    const dstate = dayState(w, d, true);
    dstate.completed[ck] = !isDone;
    if (!isDone) stampDate(dstate);
    saveState(); renderDay(d); renderWeekBar();
  };

  function ensureLog() {
    const dstate = dayState(w, d, true);
    dstate.logs[idx] = SL.normLog(dstate.logs[idx], spec.sets);
    stampDate(dstate);
    return dstate.logs[idx];
  }

  if (row.track) {
    el.querySelector(".log-toggle").onclick = () => el.querySelector(".ex-log").classList.toggle("open");
    if (SL.hasSets(log) || log.notes) el.querySelector(".ex-log").classList.add("open");
    SL.wireGrid(el, {
      spec, sugg,
      getLog: ensureLog,
      save: saveState,
      rerender: () => renderDay(d)
    });
    el.querySelector(".log-notes").addEventListener("input", e => { ensureLog().notes = e.target.value; saveState(); });
  }

  const tKey = `${dayKey(w, d)}_${idx}`;
  const tBtn = el.querySelector(".row-timer");
  reattachTimer(tKey, tBtn);
  tBtn.onclick = () => {
    if (activeTimers[tKey]) tapActiveTimer(tKey);
    else if (timerMode === "special") startSpecialTimer(tKey, tBtn, row.timer);
    else startCountdown(tKey, tBtn, rest, "rest");
  };
  return el;
}

/* ---------------------------------------------------------------------------
   SESSION CLOCK — elapsed vs the day plan, so mornings stay on schedule.
   --------------------------------------------------------------------------- */
const sessionClocks = {};   // dayKey → interval id (paint only; truth in state)

function wireClock(d, w, plan) {
  const btn = document.getElementById("clock-" + d);
  const stat = document.getElementById("clockstat-" + d);
  const key = dayKey(w, d);
  const ds = dayState(w, d, false);

  function paint() {
    const cur = dayState(w, d, false);
    if (!cur || !cur.clockStart) {
      btn.textContent = "▶ Session clock";
      btn.classList.remove("running");
      stat.textContent = "";
      return;
    }
    const elapsed = Math.round(((cur.clockStop || Date.now()) - cur.clockStart) / 1000);
    btn.textContent = (cur.clockStop ? "■ " : "") + fmtClock(elapsed);
    btn.classList.toggle("running", !cur.clockStop);
    // Pace vs plan: planned offset of the first unchecked main row
    const rows = mainRows(w, d);
    let nextIdx = rows.findIndex(x => !(cur.completed["m" + x.idx]));
    let msg = `target ${fmtMins(plan.total)}`;
    if (nextIdx > 0) {
      const planned = plan.offsets[nextIdx] != null ? plan.offsets[nextIdx] : plan.total;
      const delta = Math.round((planned - elapsed) / 60);
      msg = delta >= 1 ? `${delta} min ahead` : delta <= -1 ? `${-delta} min behind` : "on pace";
      msg += ` · target ${fmtMins(plan.total)}`;
    } else if (nextIdx === -1 && rows.length) {
      msg = `done in ${fmtClock(elapsed)}`;
    }
    stat.textContent = msg;
  }

  function syncInterval() {
    if (sessionClocks[key]) { clearInterval(sessionClocks[key]); delete sessionClocks[key]; }
    const cur = dayState(w, d, false);
    if (cur && cur.clockStart && !cur.clockStop) sessionClocks[key] = setInterval(paint, 1000);
  }

  btn.onclick = () => {
    const cur = dayState(w, d, true);
    if (!cur.clockStart) { cur.clockStart = Date.now(); cur.clockStop = null; stampDate(cur); }
    else if (!cur.clockStop) { cur.clockStop = Date.now(); }
    else { cur.clockStart = null; cur.clockStop = null; }
    saveState(); syncInterval(); paint();
  };

  syncInterval();
  paint();
}
function fmtClock(s) {
  const m = Math.floor(s / 60), sec = s % 60;
  return `${m}:${String(sec).padStart(2, "0")}`;
}

/* ---------------------------------------------------------------------------
   TIMERS — countdown, interval, accumulate, stopwatch. One engine, one map.
   --------------------------------------------------------------------------- */
const activeTimers = {};
let audioCtx = null;
function ensureAudio() {
  if (audioCtx) return audioCtx;
  try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); } catch (e) {}
  return audioCtx;
}
function tone(offsets, freqs) {
  const ctx = ensureAudio();
  if (ctx) {
    const now = ctx.currentTime;
    offsets.forEach((off, i) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = "sine"; osc.frequency.value = freqs[i] || 880;
      gain.gain.setValueAtTime(0, now + off);
      gain.gain.linearRampToValueAtTime(0.25, now + off + 0.01);
      gain.gain.linearRampToValueAtTime(0, now + off + 0.14);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + off); osc.stop(now + off + 0.16);
    });
  }
  if (navigator.vibrate) { try { navigator.vibrate(120); } catch (e) {} }
}
function beepDone() { tone([0, 0.18, 0.36], [880, 880, 1100]); if (navigator.vibrate) { try { navigator.vibrate([120, 80, 120, 80, 200]); } catch (e) {} } }
function beepPhase() { tone([0], [990]); }

/* No isConnected guard on the running paint — on re-render, reattachTimer hands
   over the fresh button before it's appended, and we still want the countdown
   text painted so it never flashes back to the default label. */
function paintRunning(btn, text) {
  if (!btn) return;
  btn.classList.add("running"); btn.classList.remove("done", "paused");
  btn.textContent = text;
}
function paintPaused(btn, text) {
  if (!btn) return;
  btn.classList.remove("running", "done"); btn.classList.add("paused");
  btn.textContent = text;
}
function paintDone(btn) {
  if (!btn || !btn.isConnected) return;
  btn.classList.remove("running", "paused"); btn.classList.add("done");
  btn.textContent = "Done!";
  setTimeout(() => {
    if (btn && btn.isConnected) { btn.classList.remove("done"); btn.textContent = btn.dataset.default || "⏱"; }
  }, 1800);
}
function paintReset(btn) {
  if (!btn || !btn.isConnected) return;
  btn.classList.remove("running", "done", "paused");
  btn.textContent = btn.dataset.default || "⏱";
  removeResetX(btn);
}
function removeResetX(btn) {
  const x = btn && btn.parentElement && btn.parentElement.querySelector(".btn-timer-x");
  if (x) x.remove();
}
function addResetX(key, btn) {
  if (!btn || !btn.isConnected || btn.parentElement.querySelector(".btn-timer-x")) return;
  const x = document.createElement("button");
  x.className = "btn btn-timer-x";
  x.textContent = "✕";
  x.onclick = () => { const t = activeTimers[key]; if (t) { clearInterval(t.iv); delete activeTimers[key]; } paintReset(btn); };
  btn.insertAdjacentElement("afterend", x);
}

function startCountdown(key, btn, secs, sub) {
  ensureAudio(); if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  const endsAt = Date.now() + secs * 1000;
  paintRunning(btn, fmtClock(secs));
  const iv = setInterval(() => {
    const t = activeTimers[key]; if (!t) return;
    const remaining = Math.round((t.endsAt - Date.now()) / 1000);
    if (remaining <= 0) { clearInterval(t.iv); const b = t.btn; delete activeTimers[key]; paintDone(b); beepDone(); }
    else paintRunning(t.btn, fmtClock(remaining));
  }, 250);
  activeTimers[key] = { mode: "down", endsAt, iv, btn };
}

function startSpecialTimer(key, btn, spec) {
  ensureAudio(); if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  if (spec.kind === "down") return startCountdown(key, btn, spec.secs);

  if (spec.kind === "interval") {
    const sched = [];
    for (let r = 0; r < spec.rounds; r++) spec.segs.forEach(([label, secs]) => sched.push({ label, secs, round: r + 1 }));
    const t = { mode: "interval", btn, sched, si: 0, phaseEnds: Date.now() + sched[0].secs * 1000, rounds: spec.rounds };
    paintRunning(btn, phaseText(t, sched[0].secs));
    t.iv = setInterval(() => {
      const cur = activeTimers[key]; if (!cur) return;
      let remaining = Math.round((cur.phaseEnds - Date.now()) / 1000);
      if (remaining <= 0) {
        cur.si++;
        if (cur.si >= cur.sched.length) {
          clearInterval(cur.iv); const b = cur.btn; delete activeTimers[key]; paintDone(b); beepDone(); return;
        }
        beepPhase();
        cur.phaseEnds = Date.now() + cur.sched[cur.si].secs * 1000;
        remaining = cur.sched[cur.si].secs;
      }
      paintRunning(cur.btn, phaseText(cur, remaining));
    }, 250);
    activeTimers[key] = t;
    return;
  }

  if (spec.kind === "accum") {
    const t = { mode: "accum", btn, target: spec.target, accum: 0, running: true, last: Date.now() };
    paintRunning(btn, "Σ " + fmtClock(spec.target));
    t.iv = setInterval(() => {
      const cur = activeTimers[key]; if (!cur) return;
      if (cur.running) {
        const now = Date.now();
        cur.accum = (cur.accum || 0) + (now - cur.last);
        cur.last = now;
        const remaining = Math.max(0, cur.target - Math.round(cur.accum / 1000));
        if (remaining <= 0) { clearInterval(cur.iv); const b = cur.btn; delete activeTimers[key]; removeResetX(b); paintDone(b); beepDone(); }
        else paintRunning(cur.btn, "Σ " + fmtClock(remaining));
      }
    }, 250);
    activeTimers[key] = t;
    return;
  }

  if (spec.kind === "watch") {
    const t = { mode: "watch", btn, startedAt: Date.now(), stopped: null };
    paintRunning(btn, "0:00");
    t.iv = setInterval(() => {
      const cur = activeTimers[key]; if (!cur || cur.stopped != null) return;
      paintRunning(cur.btn, fmtClock(Math.round((Date.now() - cur.startedAt) / 1000)));
    }, 250);
    activeTimers[key] = t;
  }
}

function phaseText(t, remaining) {
  const seg = t.sched[t.si];
  return `${seg.label.slice(0, 4)} ${fmtClock(remaining)} · ${seg.round}/${t.rounds}`;
}

/* A tap on a live timer: countdown/interval cancel; accumulate pauses/resumes;
   stopwatch stops, then resets. */
function tapActiveTimer(key) {
  const t = activeTimers[key];
  if (!t) return;
  if (t.mode === "accum") {
    if (t.running) {
      t.accum = (t.accum || 0) + (Date.now() - t.last);
      t.running = false;
      paintPaused(t.btn, "▶ Σ " + fmtClock(Math.max(0, t.target - Math.round(t.accum / 1000))));
      addResetX(key, t.btn);
    } else {
      t.running = true; t.last = Date.now();
      removeResetX(t.btn);
      paintRunning(t.btn, "Σ " + fmtClock(Math.max(0, t.target - Math.round(t.accum / 1000))));
    }
    return;
  }
  if (t.mode === "watch") {
    if (t.stopped == null) {
      t.stopped = Date.now();
      paintPaused(t.btn, "■ " + fmtClock(Math.round((t.stopped - t.startedAt) / 1000)));
    } else {
      clearInterval(t.iv); delete activeTimers[key]; paintReset(t.btn);
    }
    return;
  }
  clearInterval(t.iv);
  const btn = t.btn;
  delete activeTimers[key];
  paintReset(btn);
}

function reattachTimer(key, btn) {
  const t = activeTimers[key];
  if (!btn) return;
  if (!t) return;
  t.btn = btn;
  if (t.mode === "down") {
    const remaining = Math.round((t.endsAt - Date.now()) / 1000);
    if (remaining > 0) paintRunning(btn, fmtClock(remaining));
  } else if (t.mode === "interval") {
    paintRunning(btn, phaseText(t, Math.max(0, Math.round((t.phaseEnds - Date.now()) / 1000))));
  } else if (t.mode === "accum") {
    const remaining = Math.max(0, t.target - Math.round(((t.accum || 0) + (t.running ? Date.now() - t.last : 0)) / 1000));
    if (t.running) paintRunning(btn, "Σ " + fmtClock(remaining));
    else { paintPaused(btn, "▶ Σ " + fmtClock(remaining)); addResetX(key, btn); }
  } else if (t.mode === "watch") {
    if (t.stopped == null) paintRunning(btn, fmtClock(Math.round((Date.now() - t.startedAt) / 1000)));
    else paintPaused(btn, "■ " + fmtClock(Math.round((t.stopped - t.startedAt) / 1000)));
  }
}

/* ---------------------------------------------------------------------------
   WIRING
   --------------------------------------------------------------------------- */
document.getElementById("reset-btn").onclick = () => {
  if (confirm("Reset ALL tracking for this program? Every check, log, and clock across all weeks will be cleared.")) {
    state = emptyState(); saveState(); render();
  }
};

/* 60-min toggle lives next to the hero stats. */
(function addSixtyToggle() {
  const hero = document.querySelector(".hero");
  const btn = document.createElement("button");
  btn.className = "btn";
  btn.id = "sixty-btn";
  btn.style.marginTop = "10px";
  function paint() {
    btn.textContent = state.sixty ? "⏱ 60-min mode: ON" : "⏱ 60-min mode: off";
    btn.style.background = state.sixty ? "var(--warning-soft)" : "";
    btn.style.color = state.sixty ? "var(--warning)" : "";
    btn.style.borderColor = state.sixty ? "#edd9a6" : "";
  }
  btn.onclick = () => { state.sixty = !state.sixty; saveState(); paint(); render(); };
  paint();
  hero.appendChild(btn);
})();

buildShell();
uiWeek = currentWeek();
render();
SL.sync.wireNotes();

/* Land on the day that's due in the current week. */
(function openDueTab() {
  const tab = document.querySelector(`.tab[data-pane="${dueDay(uiWeek)}"]`);
  if (tab) tab.click();
})();
</script>
